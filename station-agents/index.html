<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1238">
<title>La Station</title>
<style>
:root{
  --nuit:#050a1f; --verre:rgba(7,12,36,.86); --trait:rgba(111,177,255,.22);
  --or:#f2b83a; --or2:#ffd87a; --bleu:#6fb1ff; --cyan:#5fe0e6; --texte:#e9eefc; --doux:#9db0e8; --sourd:#6877b4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nuit);color:var(--texte);overflow:hidden;
  font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{position:fixed;left:0;top:0;display:block}
#scene{image-rendering:pixelated;cursor:grab}
#scene.prise{cursor:grabbing}
#scene.cible{cursor:pointer}
#calque{pointer-events:none}

#tete{position:fixed;left:18px;top:14px;display:flex;align-items:center;gap:14px;pointer-events:none}
#blason{width:38px;height:38px;flex:none}
#titre{font-size:20px;font-weight:700;letter-spacing:.22em;color:var(--or);line-height:1}
#sous{font-size:10.5px;letter-spacing:.3em;color:var(--bleu);margin-top:6px;text-transform:uppercase}
#compteurs{position:fixed;left:18px;top:66px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pastille{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--verre);
  border:1px solid var(--trait);font-size:12px;color:var(--doux);font-variant-numeric:tabular-nums}
.pastille b{color:var(--texte);font-weight:600}
.point{width:8px;height:8px;border-radius:50%;flex:none}
.pastille.alerte{border-color:rgba(242,184,58,.6);color:var(--or2)}
.pastille.alerte b{color:var(--or2)}

#liste{position:fixed;right:14px;top:14px;bottom:14px;width:286px;background:var(--verre);border:1px solid var(--trait);
  border-radius:12px;display:flex;flex-direction:column;backdrop-filter:blur(6px);transition:transform .25s ease}
#liste.ferme{transform:translateX(calc(100% + 20px))}
#liste header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--trait)}
#liste header span{font-size:11px;letter-spacing:.26em;color:var(--doux);text-transform:uppercase}
#corps{overflow:auto;padding:6px 8px 10px;flex:1;scrollbar-width:thin;scrollbar-color:#2a3878 transparent}
.groupe{font-size:10.5px;letter-spacing:.24em;color:var(--or);padding:12px 8px 6px;text-transform:uppercase;display:flex;justify-content:space-between}
.groupe i{font-style:normal;color:var(--sourd);letter-spacing:.05em}
.ligne{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;
  padding:7px 8px;color:inherit;font:inherit;cursor:pointer}
.ligne:hover{background:rgba(111,177,255,.08)}
.ligne.choisi{background:rgba(242,184,58,.10);border-color:rgba(242,184,58,.45)}
.ligne .point{margin-top:5px}
.ligne .nom{font-size:13px;line-height:1.25;color:var(--texte);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:222px}
.ligne .etat{font-size:11.5px;color:var(--doux);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:222px}
.ligne.attend .etat{color:var(--or2)}
.ligne.repos .nom{color:var(--doux)}
.ligne.repos .etat{color:var(--sourd)}
.bouton{background:var(--verre);border:1px solid var(--trait);color:var(--doux);border-radius:8px;height:30px;min-width:30px;
  padding:0 9px;font:inherit;font-size:12px;cursor:pointer}
.bouton:hover{color:var(--texte);border-color:rgba(111,177,255,.5)}
#qgBloc{padding:10px 14px 10px;border-bottom:1px solid var(--trait);font-size:11.5px;color:var(--doux)}
#qgBloc:empty{display:none}
#qgBloc .tete{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
#qgBloc .tete span{font-size:11px;letter-spacing:.26em;color:var(--or);text-transform:uppercase;display:flex;align-items:center;gap:7px}
#qgBloc .tete .bouton{height:24px;font-size:11.5px}
#qgBloc .univ{display:flex;align-items:center;gap:8px;margin:3px 0}
#qgBloc .univ b{width:46px;font-size:10.5px;letter-spacing:.12em;flex:none}
#qgBloc .blocs{display:flex;gap:2px;flex-wrap:wrap}
#qgBloc .blocs i{width:7px;height:9px;border-radius:2px;display:block}
#qgBloc .obj{margin-top:8px;color:var(--texte)}
#qgBloc ul{margin:4px 0 0;padding-left:16px;color:var(--doux);line-height:1.4}
#qgBloc .agenda{margin-top:6px;color:var(--or2)}
#fiche .role{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:11.5px;border:1px solid}
#ouvrir{position:fixed;right:14px;top:14px;display:none}
#liste.ferme + #ouvrir{display:block}

#fiche{position:fixed;left:18px;bottom:16px;width:340px;max-width:calc(100vw - 36px);background:var(--verre);border:1px solid var(--trait);
  border-radius:12px;padding:14px 16px 14px;backdrop-filter:blur(6px);display:none}
#fiche.vu{display:block}
#fiche h2{margin:0 26px 2px 0;font-size:15px;font-weight:600;line-height:1.3}
#fiche .projet{font-size:10.5px;letter-spacing:.24em;color:var(--or);text-transform:uppercase}
#fiche .rang{font-size:12.5px;color:var(--doux);margin-top:9px;line-height:1.45}
#fiche .rang b{color:var(--texte);font-weight:600}
#fiche .demande{margin-top:10px;padding:9px 11px;border-radius:8px;border:1px solid rgba(242,184,58,.5);background:rgba(242,184,58,.08);
  color:var(--or2);font-size:12.5px;line-height:1.45}
#fiche .recap{margin-top:9px;font-size:12px;color:var(--sourd);line-height:1.5}
#fiche .barre{height:4px;border-radius:2px;background:#1a2454;margin-top:7px;overflow:hidden}
#fiche .barre i{display:block;height:100%;background:var(--or)}
#fermer{position:absolute;right:10px;top:10px;height:24px;min-width:24px;padding:0}

#bas{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center}
#aide{font-size:11px;color:var(--doux);letter-spacing:.04em;margin-right:6px;white-space:nowrap;background:var(--verre);
  border:1px solid var(--trait);border-radius:8px;height:30px;line-height:28px;padding:0 11px}
#alerte{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:8px 14px;border-radius:8px;background:rgba(60,14,26,.92);
  border:1px solid rgba(255,138,154,.6);color:#ffc2cb;font-size:12.5px;display:none}
#alerte.vu{display:block}
@media (max-width:900px){ #aide{display:none} }

/* Mode compact (?mini) : la petite fenêtre flottante */
#outilsMini{display:none}
body.mini #tete, body.mini #bas, body.mini #liste, body.mini #ouvrir{display:none !important}
body.mini #compteurs{left:6px;top:6px;gap:4px}
body.mini .pastille{padding:2px 7px 2px 6px;font-size:11px;gap:5px}
body.mini .point{width:7px;height:7px}
body.mini #fiche{left:6px;right:22px;bottom:6px;width:auto;padding:9px 11px;border-radius:9px}
body.mini #fiche h2{font-size:13px}
body.mini #fiche .rang{font-size:11.5px;margin-top:5px}
body.mini #fiche .demande{font-size:11.5px;padding:6px 8px;margin-top:7px}
body.mini #fiche .recap{display:none}
body.mini #alerte{top:auto;bottom:8px;font-size:11px;padding:6px 10px;width:max-content;max-width:calc(100vw - 16px)}
body.mini #outilsMini{display:flex;position:fixed;right:6px;top:6px;gap:4px;z-index:3}
body.mini #outilsMini .bouton{height:24px;min-width:24px;padding:0 6px;font-size:12px;border-radius:6px;opacity:0;transition:opacity .2s}
body.mini:hover #outilsMini .bouton{opacity:1}
body.mini #outilsMini #mMasquer{opacity:.6;font-size:14px}
body.mini #outilsMini #mMasquer:hover{opacity:1;color:var(--or2);border-color:rgba(242,184,58,.6)}
/* Poignée (haut) et coin (bas-droit) : Station.exe s'en sert pour déplacer et redimensionner */
#poignee, #coin{display:none}
body.mini #poignee{display:block;position:fixed;left:0;top:0;right:150px;height:26px;cursor:grab;z-index:1}
body.mini #poignee::after{content:"";position:absolute;left:calc(50vw - 18px);top:3px;width:36px;height:3px;border-radius:2px;
  background:rgba(157,176,232,.18);transition:background .2s}
body.mini:hover #poignee::after{background:rgba(242,184,58,.75)}
body.mini #coin{display:block;position:fixed;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:3;opacity:.35;transition:opacity .2s;
  background:linear-gradient(135deg,transparent 52%,#9db0e8 52% 58%,transparent 58% 68%,#9db0e8 68% 74%,transparent 74%)}
body.mini:hover #coin{opacity:.9}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="calque"></canvas>

<div id="tete">
  <svg id="blason" viewBox="0 0 38 38" aria-hidden="true">
    <circle cx="19" cy="19" r="8" fill="#1f4fc4"/><circle cx="16.5" cy="16.5" r="3" fill="#6fb1ff" opacity=".55"/>
    <ellipse cx="19" cy="19" rx="17" ry="6" fill="none" stroke="#f2b83a" stroke-width="2" transform="rotate(-22 19 19)"/>
    <circle cx="33.5" cy="12.6" r="2.4" fill="#ffd87a"/>
  </svg>
  <div><div id="titre">LA STATION</div><div id="sous">Agents en orbite</div></div>
</div>
<div id="compteurs"></div>

<aside id="liste">
  <header><span>Équipage</span><button class="bouton" id="replier" title="Replier la liste">›</button></header>
  <div id="qgBloc"></div>
  <div id="corps"></div>
</aside>
<button class="bouton" id="ouvrir" title="Afficher l'équipage">‹ Équipage</button>

<section id="fiche"><button class="bouton" id="fermer" title="Fermer">×</button><div id="ficheCorps"></div></section>

<div id="bas">
  <span id="aide">Salles des univers : au travail · QG : t'attend · Quartiers : au repos · Écran PROJETS : ouvre le QG</span>
  <button class="bouton" id="moins" title="Dézoomer">−</button>
  <button class="bouton" id="plus" title="Zoomer">+</button>
  <button class="bouton" id="recadrer" title="Recadrer la station">Recadrer</button>
</div>
<div id="outilsMini">
  <button class="bouton" id="mMoins" title="Dézoomer">−</button>
  <button class="bouton" id="mPlus" title="Zoomer">+</button>
  <button class="bouton" id="mCadre" title="Recadrer la station">⟲</button>
  <button class="bouton" id="mGrand" title="Ouvrir en grand dans le navigateur">⤢</button>
  <button class="bouton" id="mMasquer" title="Masquer (Ctrl+Alt+S ou l'icône près de l'horloge)">×</button>
</div>
<div id="poignee" title="Attraper ici pour déplacer"></div>
<div id="coin" title="Tirer pour redimensionner"></div>
<div id="alerte">Liaison perdue avec le serveur — lance <b>lancer.bat</b> (ou <b>node serveur.mjs</b>).</div>

<script>
"use strict";
// ============================================================================
//  LA STATION — les sessions Claude de ce PC, vues comme l'équipage d'une station
//  Tout est dessiné par code (aucune image). Données : /api/etat (serveur.mjs).
//  Essai sans serveur de données : ajouter ?demo à l'adresse.
// ============================================================================
const DEMO = new URLSearchParams(location.search).has("demo");
const MINI = new URLSearchParams(location.search).has("mini"); // petite fenêtre flottante (Station.exe)
if (MINI) document.body.classList.add("mini");
const ECHELLES = [.5, .75, 1, 1.25, 1.5, 1.75, 2, 3, 4, 5, 6];
const HW = 16, HH = 8;                         // demi-tuile isométrique (32 × 16)
const proj = (x, y, z = 0) => [(x - y) * HW, (x + y) * HH - z];
const $ = (id) => document.getElementById(id);

const OR = "#f2b83a", OR2 = "#ffd87a", ORS = "#c8922a", ORN = "#8a651c", CYAN = "#5fe0e6", BLEU = "#6fb1ff";
const COULEURS = ["#f2b83a", "#5fe0e6", "#ff8a9a", "#b79cff", "#7fe08a", "#ff9f43", "#6fb1ff", "#ff7fd0"];
const TEINTES = [
  { sol: ["#1d3c96", "#2144a6"], joint: "#16307c", trait: "#6fb1ff" },
  { sol: ["#5b4a1c", "#655220"], joint: "#473a14", trait: "#f2b83a" },
  { sol: ["#16506a", "#1a5a76"], joint: "#0f4058", trait: "#5fe0e6" },
  { sol: ["#3b2b80", "#43318e"], joint: "#2c2064", trait: "#b79cff" },
  { sol: ["#6a2c40", "#763248"], joint: "#532030", trait: "#ff9aa8" },
];
const GENRES = { code: "#6fb1ff", lit: "#5fe0e6", cherche: "#5fe0e6", commande: "#f2b83a", web: "#b79cff",
  reflechit: "#e9eefc", redige: "#7fe08a", plan: "#f2b83a", drone: "#ff9f43", question: "#f2b83a" };
const POINTS = { travaille: "#6fb1ff", question: "#f2b83a", attend: "#f2b83a", fini: "#5fe0e6", repos: "#4a5690" };

// Les univers ORBIT (le serveur envoie ceux de config.json ; ceux-ci servent au mode ?demo).
// salle : une salle à son nom dans la station, même vide ; planete : une planète autour de la station.
const UNIVERS_DEFAUT = [
  { cle: "ark", nom: "ORBIT ARK", court: "ARK", couleur: "#ff9f43", salle: true, planete: true },
  { cle: "mc", nom: "ORBIT MC", court: "MC", couleur: "#7fe08a", salle: true, planete: true },
  { cle: "pz", nom: "ORBIT PZ", court: "PZ", couleur: "#ff6b6b", salle: true, planete: true },
  { cle: "11d", nom: "11D LABS", court: "11D", couleur: "#b79cff", salle: true, planete: true },
  { cle: "gmod", nom: "ORBIT GMOD", court: "GMOD", couleur: "#5fe0e6", salle: false, planete: true },
  { cle: "roblox", nom: "ORBIT ROBLOX", court: "ROBLOX", couleur: "#ff7fd0", salle: false, planete: true },
  { cle: "qg", nom: "QG ORBIT", court: "QG", couleur: "#f2b83a", salle: false, planete: false },
];
let UNIVERS = UNIVERS_DEFAUT, sigUnivers = "", QG = null;
// Les outils posés au fond de chaque salle (dessinés dans fabriquer, animés dans dessinerObjet).
const OUTILS = { ark: ["incubateur", "crane", "tek"], mc: ["etabli", "four", "herbe"], pz: ["radio", "barricade", "trousse"],
  "11d": ["eprouvettes", "cube", "reacteur"], gmod: ["physgun", "caisse", "caisse"], roblox: ["brique", "plante", "brique"] };
// Les rôles : couleur de la combinaison + accessoire (voir accessoire()).
const ROLES = {
  ingenierie: { nom: "Ingénierie", couleur: "#f2b83a", dit: "casque de chantier et clé" },
  recherche: { nom: "Recherche", couleur: "#5fe0e6", dit: "loupe" },
  operations: { nom: "Opérations", couleur: "#6fb1ff", dit: "lampe frontale et antenne" },
  web: { nom: "Liaison web", couleur: "#b79cff", dit: "grande antenne" },
  design: { nom: "Design", couleur: "#ff7fd0", dit: "béret et pinceau" },
  commandement: { nom: "Commandement", couleur: "#dfe6ff", dit: "étoile et galons, mène les drones" },
  sav: { nom: "SAV ARK", couleur: "#ff9f43", dit: "casque-micro" },
  prod: { nom: "Mise en prod", couleur: "#ff5a6e", dit: "réacteur dorsal" },
  annonce: { nom: "Annonces Discord", couleur: "#8f8cff", dit: "mégaphone" },
  boutique: { nom: "Boutique", couleur: "#7fe08a", dit: "œuf de dino" },
  plugin: { nom: "Plugins MC", couleur: "#4cc27a", dit: "pioche" },
};
const roleDe = (d) => ROLES[d.role?.cle] || ROLES.ingenierie;
const DRONES = { "orbit-enqueteur-ark": "#ff5a6e", "orbit-verif-mc": "#7fe08a", Explore: "#5fe0e6", Plan: "#f2b83a", "web-fetch": "#b79cff" };
const STATUTS = { en_cours: ["#6fb1ff", "en cours"], test: ["#f2b83a", "en test"], pret: ["#5fe0e6", "prêts"], en_prod: ["#7fe08a", "en prod"] };
function melange(a, b, k) { const p = hex(a), q = hex(b); return "#" + p.map((v, i) => Math.round(v + (q[i] - v) * k).toString(16).padStart(2, "0")).join(""); }
function teinteDe(col) { return { sol: [melange("#121c4c", col, .2), melange("#142054", col, .25)], joint: melange("#0e1640", col, .14), trait: col }; }

// ---------------------------------------------------------------- outils
// Toiles de travail en mémoire normale (willReadFrequently) : la carte graphique ne peut pas les vider
// (sinon, après une mise en veille ou un masquage, la station disparaissait et ne restaient que les étiquettes).
function toile(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d", { willReadFrequently: true }); return c; }
function alea(g) { return () => { g |= 0; g = g + 0x6D2B79F5 | 0; let t = Math.imul(g ^ g >>> 15, 1 | g); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function sombre(h, k) { const [r, g, b] = hex(h); return "rgb(" + Math.round(r * k) + "," + Math.round(g * k) + "," + Math.round(b * k) + ")"; }
function hache(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const court = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s);
function duree(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60); return h + " h" + (m % 60 ? " " + String(m % 60).padStart(2, "0") : "");
}

// Dessin au pixel près : pas de lissage, tout passe par des rectangles d'un pixel.
function G(ctx, ox, oy) {
  const g = {
    rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(ox + x), Math.round(oy + y), w, h); },
    px(x, y, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(ox + x), Math.round(oy + y), 1, 1); },
    poly(pts, col) {
      ctx.fillStyle = col;
      let y0 = Infinity, y1 = -Infinity;
      for (const p of pts) { if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
      for (let y = Math.ceil(y0 - 0.5); y <= Math.floor(y1 - 0.5); y++) {
        const yc = y + 0.5; let xa = Infinity, xb = -Infinity;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) {
            const x = a[0] + (yc - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
            if (x < xa) xa = x; if (x > xb) xb = x;
          }
        }
        const l = Math.round(xa), r = Math.round(xb);
        if (r > l) ctx.fillRect(ox + l, oy + y, r - l, 1);
      }
    },
    ligne(x0, y0, x1, y1, col) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      ctx.fillStyle = col;
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
      for (;;) { ctx.fillRect(ox + x0, oy + y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
    },
    l3(a, b, col) { const p = proj(...a), q = proj(...b); g.ligne(p[0], p[1], q[0], q[1], col); },
    tuile(i, j, base, joint) {
      const [x, y] = proj(i, j);
      g.poly([[x, y], [x + 16, y + 8], [x, y + 16], [x - 16, y + 8]], joint);
      g.poly([[x, y + 1], [x + 14, y + 8], [x, y + 15], [x - 14, y + 8]], base);
    },
    boite(x0, y0, x1, y1, z0, z1, c) {
      if (c.g) g.poly([proj(x0, y1, z1), proj(x1, y1, z1), proj(x1, y1, z0), proj(x0, y1, z0)], c.g);
      if (c.d) g.poly([proj(x1, y0, z1), proj(x1, y1, z1), proj(x1, y1, z0), proj(x1, y0, z0)], c.d);
      if (c.h) g.poly([proj(x0, y0, z1), proj(x1, y0, z1), proj(x1, y1, z1), proj(x0, y1, z1)], c.h);
    },
    faceY(xa, xb, y, z0, z1, col) { g.poly([proj(xa, y, z1), proj(xb, y, z1), proj(xb, y, z0), proj(xa, y, z0)], col); },
    faceX(ya, yb, x, z0, z1, col) { g.poly([proj(x, ya, z1), proj(x, yb, z1), proj(x, yb, z0), proj(x, ya, z0)], col); },
    sol(x0, y0, x1, y1, z, col) { g.poly([proj(x0, y0, z), proj(x1, y0, z), proj(x1, y1, z), proj(x0, y1, z)], col); },
  };

}
function sprite(w, h, ox, oy, fn) { const c = toile(w, h); fn(G(c.getContext("2d"), ox, oy)); return { c, ox, oy }; }
function poser(ctx, s, x, y) { ctx.drawImage(s.c, Math.round(x) - s.ox, Math.round(y) - s.oy); }

// Petite image depuis des lignes de caractères ; contour sombre facultatif.
function carte(lignes, pal, contour) {
  const h = lignes.length, w = lignes[0].length, c = toile(w + 2, h + 2), x = c.getContext("2d");
  if (contour) { x.fillStyle = contour; for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) if (lignes[r][q] !== ".") { x.fillRect(q, r + 1, 3, 1); x.fillRect(q + 1, r, 1, 3); } }
  for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) { const k = lignes[r][q]; if (k === "." || !pal[k]) continue; x.fillStyle = pal[k]; x.fillRect(q + 1, r + 1, 1, 1); }
  return c;
}
function miroir(c) { const m = toile(c.width, c.height), x = m.getContext("2d"); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return m; }

const FACE = [
  "...WWWWWW...", "..WWWWWWWW..", ".WVVVVVVWWW.", ".VVhhVVVVWw.", ".VVhVVVVVWw.", ".VVVVVVVVWw.", ".WVVVVVVWww.",
  "..WWWWWWww..", "..AAAAAAAa..", ".WWWGGWWWWw.", ".WWWWWWWWWw.", ".WwWWWWWWdw.", "..WWWWWWWw..", "..aAAAAAAa..",
];
const DOS = [
  "...WWWWWW...", "..WWWWWWWW..", ".WWWWWWWWWW.", ".WWWWWWWWWw.", ".WWWWWWWWww.", ".WWWWWWWwww.", ".WWWWWWwwww.",
  "..WWwwwwww..", "..AAAAAAAa..", ".WKKKKKKKKw.", ".WKKAAAAKKw.", ".WKKKKKKKKw.", "..KKKGGKKK..", "..aAAAAAAa..",
];
const JAMBES = [
  ["..WWW..WWw..", "..WWW..Www..", "..BBB..BBB.."],   // debout
  ["..WWW..WWw..", "..WWW..BBB..", "..BBB......."],   // pas 1
  ["..WWW..WWw..", "..BBB..Www..", ".......BBB.."],   // pas 2
];
const spritesAgent = new Map();
function spriteAgent(A, vue, pose, mir) { // A : couleur du rôle
  const cle = A + vue + pose + (mir ? "m" : "");
  let s = spritesAgent.get(cle);
  if (s) return s;
  let corps = (vue === "face" ? FACE : DOS).map((l) => l.split(""));
  if (pose === 3) { // bras levé pour faire signe
    corps[6][11] = "W"; corps[7][10] = "W"; corps[7][11] = "W"; corps[8][10] = "W"; corps[10][10] = "."; corps[11][10] = "."; corps[11][9] = "w";
  }
  const lignes = corps.map((l) => l.join("")).concat(JAMBES[pose === 3 ? 0 : pose]);
  s = carte(lignes, { W: "#eef2ff", w: "#c2cbee", d: "#8f9bcb", V: "#101b52", h: "#a8d4ff", A, a: sombre(A, .68), G: OR, B: "#2b3567", K: "#7481b8" }, "#060b22");
  if (mir) s = miroir(s);
  spritesAgent.set(cle, s);
  return s;
}

// Disque de l'hologramme (rayon 6) ; le bas-droit est dans l'ombre.
const DISQUE = [];

let plan = null, signature = null, station = null;

// Enveloppe convexe (chaîne monotone) des points du contour.

      else { a.x += dx / dist * reste; a.y += dy / dist * reste; reste = 0; }
    }

}

// ---------------------------------------------------------------- dessin de chaque image
function dessinerObjet(c, o, t) {
  const [X, Y] = proj(o.i, o.j), px = X + cam.x, py = Y + cam.y;
  if (o.t === "bureau") {
    poser(c, S.bureau, px, py);
    const a = o.poste.pris && agents.get(o.poste.pris);
    if (a && !a.route.length && a.cat === "poste") {
      const s = S.holo[a.d.activite.genre] || S.holo.code;
      c.globalAlpha = .72 + .18 * Math.sin(t / 140 + a.g); poser(c, s, px, py);
      c.fillStyle = GENRES[a.d.activite.genre] || BLEU; // particules de données qui montent de l'écran
      for (let k = 0; k < 3; k++) {
        const f = (t / 1500 + k / 3 + a.g / 13) % 1; c.globalAlpha = (1 - f) * .8;
        c.fillRect(Math.round(px - 6 + ((a.g * 7 + k * 5) % 12)), Math.round(py - 14 - f * 16), 1, 1);
      }
      c.globalAlpha = 1;
    } else poser(c, S.veille, px, py);
  } else if (o.t === "capsule") {
    poser(c, S.capsule, px, py);
    const a = o.cap.pris && agents.get(o.cap.pris);
    if (a && a.cache) {
      c.drawImage(S.casque, px - 4, py - 9);
      c.fillStyle = a.col; c.fillRect(px - 13, py + 10, 3, 1);
      for (let k = 0; k < 2; k++) { const f = (t / 2600 + k / 2 + a.g / 13) % 1; c.globalAlpha = Math.sin(f * Math.PI); c.drawImage(S.z, Math.round(px + 3 + f * 7), Math.round(py - 12 - f * 11)); }
      c.globalAlpha = 1;
    } else { c.fillStyle = "#34427f"; c.fillRect(px - 13, py + 10, 3, 1); }
  } else if (o.t === "baie") {
    poser(c, S.baie, px, py);
    const pas = Math.floor(t / 420);
    for (let r = 0; r < 5; r++) for (let q = 0; q < 3; q++) {
      const v = hache(o.g + ":" + r + ":" + q + ":" + (pas + (r * 3 + q) % 4 >> 2));
      if (v % 5 === 0) continue;
      const p = proj(.3 + q * .2, .8, 7 + r * 4.4);
      c.fillStyle = v % 7 === 0 ? OR : v % 3 === 0 ? CYAN : "#3f7df0"; c.fillRect(Math.round(px + p[0]), Math.round(py + p[1]), 2, 1);
    }
  } else if (o.t === "balise") {
    poser(c, S.balise, px, py);
    const n = [...agents.values()].some((a) => a.cat === "pont" && a.d.phase === "attend" && !a.route.length);
    // Hologramme : planète ORBIT qui tourne, cyan au calme, dorée et plus vive quand un agent t'attend.
    const col = n ? "#ffe9a8" : "#9ff4ff", col2 = n ? OR : "#3cc7e0", pouls = .5 + .5 * Math.sin(t / (n ? 240 : 800));
    const sol = py + 8, hy = Math.round(sol - 35 + Math.sin(t / 650) * 1.5), rot = t / (n ? 260 : 420);
    c.fillStyle = col;
    for (let r = 0; r < sol - 16 - hy; r++) { const lw = Math.round(2 + r * .36); c.globalAlpha = .1 + pouls * .08; c.fillRect(px - lw, sol - 12 - r, lw * 2, 1); }
    c.globalAlpha = .12 + pouls * .1; c.fillRect(px - 9, hy - 9, 18, 18); // halo
    const anneau = (devant) => {
      c.fillStyle = OR2; c.globalAlpha = devant ? 1 : .5;
      for (let k = 0; k < 60; k++) {
        const an = k / 60 * 6.2832 + rot * .4; if ((Math.sin(an) > 0) !== devant) continue;
        c.fillRect(Math.round(px + Math.cos(an) * 12), Math.round(hy + Math.sin(an) * 3.5), 1, 1);
      }
    };
    anneau(false);
    const balayage = Math.floor(t / 90);
    for (const [dx, dy, ombre, bord] of DISQUE) {
      const v = Math.sin(dx * .5 + rot * 2.2 + Math.sin(dy * .5) * .6);
      if (v < -.6 && !bord) continue; // bandes vides : effet hologramme

    const f = S.feuilles[(o.i + o.j) & 1], bouge = Math.sin(t / 1400 + o.i * 2) > .8 ? 1 : 0;
    c.drawImage(f, px - (f.width >> 1) + bouge, py + 3 - f.height);
  } else if (o.t === "cafe") {
    poser(c, S.cafe, px, py);

    c.globalAlpha = 1;

  else if (o.t === "casier") poser(c, S.casier, px, py);
  else if (o.t === "distributeur") {
    poser(c, S.distributeur, px, py);
    if ((t + o.i * 370) % 2600 < 1300) { const p = proj(.8, .62, 20); c.fillStyle = "#7fe08a"; c.fillRect(px + p[0], py + p[1], 1, 1); }
  } else if (o.t === "ecran") { poser(c, S.ecran, px, py); dessinerEcranQg(c, t, px, py); }
  else if (S.outil[o.t]) { poser(c, S.outil[o.t], px, py); animerOutil(c, o, px, py, t); }
  else if (o.t === "poteau") poser(c, S.poteau, px, py);
  else poser(c, S.sep, px, py);
}

// Les outils des salles qui bougent un peu (feu du four, bulles, cube à 4 dimensions…).
function animerOutil(c, o, px, py, t) {
  const g = G(c, px, py), ph = (o.g || 0) * 97;
  if (o.t === "crane") c.drawImage(S.crane, px - 7, py - 9);
  else if (o.t === "incubateur") { if ((t + ph) % 1800 < 900) { const p = proj(.5, .82, 3); c.fillStyle = "#7fe08a"; c.fillRect(px + p[0], py + p[1], 1, 1); } c.globalAlpha = .1 + .07 * Math.sin(t / 700); g.faceY(.28, .72, .72, 5, 18, "#bff6ff"); c.globalAlpha = 1; }
  else if (o.t === "tek") for (let k = 0; k < 3; k++) { c.globalAlpha = .35 + .65 * Math.max(0, Math.sin(t / 380 - k * .9)); g.l3([.32, .7, 7 + k * 3], [.68, .7, 7 + k * 3], CYAN); c.globalAlpha = 1; }
  else if (o.t === "four") { const f = Math.abs(Math.sin(t / 90 + ph)) * 3; g.faceY(.36, .64, .85, 2, 3 + f, "#ff7a1a"); g.faceY(.42, .58, .85, 2, 2.5 + f * .6, "#ffd87a"); }
  else if (o.t === "radio") {

    const [ax, ay] = proj(.68, .4, 31), f = (t / 1200) % 1; c.fillStyle = "#7fe08a"; c.globalAlpha = 1 - f;
    for (let a = -1; a <= 1; a += .25) c.fillRect(Math.round(px + ax + Math.cos(a - 1.57) * 2 * (1 + f * 3)), Math.round(py + ay - 1 + Math.sin(a - 1.57) * 2 * (1 + f * 3)), 1, 1);
    c.globalAlpha = 1;
  } else if (o.t === "eprouvettes") {
    c.fillStyle = "#ffffff";
    [[.2, 8], [.36, 5], [.52, 9], [.68, 6]].forEach(([u, n], k) => { const f = (t / 900 + k * .27) % 1; c.globalAlpha = 1 - f; const p = proj(u + .05, .56, 4.5 + f * n); c.fillRect(Math.round(px + p[0]), Math.round(py + p[1]), 1, 1); });

    const aretes = [[0, 1], [0, 2], [1, 3], [2, 3], [4, 5], [4, 6], [5, 7], [6, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
    c.globalAlpha = .55; for (let k = 0; k < 8; k++) L.ligne(ext[k][0], ext[k][1], int[k][0], int[k][1], "#5a3ea8");
    c.globalAlpha = 1; for (const [p, q] of aretes) { L.ligne(ext[p][0], ext[p][1], ext[q][0], ext[q][1], "#b79cff"); L.ligne(int[p][0], int[p][1], int[q][0], int[q][1], CYAN); }
    c.globalAlpha = .12 + .06 * Math.sin(t / 300); c.fillStyle = "#b79cff"; c.fillRect(cx - 9, cy - 9, 18, 18); c.globalAlpha = 1;
  } else if (o.t === "reacteur") {
    c.globalAlpha = .1 + .08 * Math.sin(t / 260); c.fillStyle = "#b79cff"; c.fillRect(px - 7, py - 22, 14, 22); c.globalAlpha = 1;
    const z = 4 + (t / 60) % 20; g.faceY(.36, .64, .64, z, z + 1, "#ffffff");
  } else if (o.t === "physgun") { c.globalAlpha = .3 + .3 * Math.sin(t / 200); const p = proj(.74, .5, 12); c.fillStyle = CYAN; c.fillRect(px + p[0] - 1, py + p[1] - 2, 3, 4); c.globalAlpha = 1; }
}

function dessinerAgent(c, a, t) {
  const [X, Y] = proj(a.x, a.y), px = Math.round(X + cam.x), py = Math.round(Y + cam.y);
  a.sx = px; a.sy = py;

  if (a.id === choisi) { c.fillStyle = OR; for (let k = 0; k < 40; k++) { const an = k / 40 * 6.2832 + t / 900; c.fillRect(Math.round(px + Math.cos(an) * 10), Math.round(py + 1 + Math.sin(an) * 5), 1, 1); } }
  c.drawImage(S.ombre, px - 6, py - 1);
  let pose = 0, saut = 0;
  if (marche) { pose = 1 + (Math.floor(a.pas) & 1); saut = Math.floor(a.pas) & 1; }
  else if (a.cat === "poste" && ph === "travaille" && (genre === "code" || genre === "commande" || genre === "redige")) saut = Math.floor(t / 230 + a.g) & 1;
  else if (a.cat === "pont" && ph === "attend" && Math.floor(t / 420 + a.g) % 4 < 2) pose = 3;

    else c.drawImage(S.bulleOk, px - 4, hy);
  } else if (a.cat === "poste") {
    if (ph === "question") c.drawImage(S.bulleQuestion, px - 4, hy - Math.round(Math.abs(Math.sin(t / 300)) * 3));
    else if (genre === "reflechit") { const n = 1 + Math.floor(t / 320) % 3; for (let k = 0; k < n; k++) { c.fillStyle = "#060b22"; c.fillRect(px - 6 + k * 4, py - 22, 4, 4); c.fillStyle = "#eef2ff"; c.fillRect(px - 5 + k * 4, py - 21, 2, 2); } }

}

// L'accessoire du rôle, posé sur l'astronaute (coordonnées en pixels du dessin, retournées si l'agent regarde de l'autre côté).

  const f = (q, r, w, h, col) => { c.fillStyle = col; c.fillRect(ox + (mir ? 11 - q - w + 1 : q), oy + r, w, h); };

      if (face) { f(5, 1, 2, 1, "#fff6b0"); c.globalAlpha = .25; f(4, 0, 4, 3, "#fff6b0"); c.globalAlpha = 1; } break;
    case "web":

    case "design": f(3, -1, 6, 2, "#ff7fd0"); f(8, -2, 1, 1, "#ff7fd0"); f(11, 8, 1, 4, ORN); f(11, 7, 1, 1, COULEURS[Math.floor(t / 600) % COULEURS.length]); break;
    case "commandement": f(5, -3, 1, 3, OR2); f(4, -2, 3, 1, OR2); f(0, 8, 2, 1, OR); f(10, 8, 2, 1, OR); break;
    case "sav": f(1, -1, 10, 1, "#2b3567"); f(0, 3, 2, 3, "#3a4990"); f(10, 3, 2, 3, "#3a4990"); if (face) { f(2, 6, 3, 1, "#2b3567"); f(4, 7, 1, 1, au && t % 600 < 300 ? "#ff9f43" : "#8a651c"); } break;
    case "prod": {
      f(3, 0, 6, 1, "#ff5a6e"); f(-1, 8, 2, 5, "#8f9bcb"); f(-1, 8, 2, 1, "#dfe6ff");
      if (marche || au) { const fl = 1 + (Math.floor(t / 70) & 1); f(-1, 13, 2, fl, "#ff9f43"); f(-1, 13, 2, 1, "#ffd87a"); } break;

      if (au && t % 800 < 400) { f(15, 7, 1, 1, "#cfd0ff"); f(15, 12, 1, 1, "#cfd0ff"); f(16, 9, 1, 2, "#cfd0ff"); } break;
    case "boutique": f(11, 8, 3, 4, "#f3ead0"); f(12, 7, 1, 1, "#f3ead0"); f(11, 9, 1, 1, "#4cc27a"); f(13, 10, 1, 1, "#4cc27a"); break;
    case "plugin": f(12, 7, 1, 6, ORN); f(10, 6, 5, 1, "#9fe7ff"); f(10, 7, 1, 1, "#9fe7ff"); f(14, 7, 1, 1, "#9fe7ff"); break;

function dessinerDrone(c, a, dr, t) {
  const [X, Y] = proj(a.x + Math.cos(dr.ang) * .95, a.y + Math.sin(dr.ang) * .95, 24 + Math.sin(t / 300 + dr.ang) * 2);
  const px = Math.round(X + cam.x), py = Math.round(Y + cam.y), col = DRONES[dr.d.type] || "#ff9f43";
  c.globalAlpha = dr.alpha * .35; c.drawImage(S.ombre, px - 6, py + 22);
  if (dr.d.type === "Explore" || dr.d.type === "orbit-enqueteur-ark") { // faisceau de balayage
    c.fillStyle = col; const k = Math.sin(t / 260 + dr.ang);
    for (let r = 2; r < 20; r++) { c.globalAlpha = dr.alpha * .12 * (1 - r / 20); c.fillRect(Math.round(px - r * .35 + k * r * .2), py + r, Math.max(1, Math.round(r * .7)), 1); }
  }

  c.fillStyle = col; c.fillRect(px - 4, py, 9, 1);
  if (Math.floor(t / 300) & 1) c.fillRect(px, py - 5, 1, 1);
  c.globalAlpha = 1;

// Le ciel : une étoile filante de temps en temps, un satellite autour de la planète.
function dessinerCiel(c, t) {
  if (!ciel) return;
  const cycle = 13000, n = Math.floor(t / cycle), f = (t % cycle) / cycle;
  if (f < .07) {
    const R = alea(n * 7 + 3), sx = sc.width * (.3 + R() * .7), sy = sc.height * R() * .35, q = f / .07, lg = Math.min(sc.width, 420) * .4;
    for (let k = 0; k < 22; k++) {
      const u = q - k * .012; if (u < 0) break;
      c.globalAlpha = (1 - k / 22) * (1 - q * .5); c.fillStyle = k < 2 ? "#ffffff" : "#bcd4ff";
      c.fillRect(Math.round(sx - u * lg), Math.round(sy + u * lg * .42), k < 2 ? 2 : 1, 1);
    }
  }
  const a = t / 11000, x = Math.round(ciel.cx + Math.cos(a) * ciel.r * 1.55), y = Math.round(ciel.cy - ciel.r * .1 + Math.sin(a) * ciel.r * .38);
  if (!(Math.sin(a) < 0 && Math.hypot(x - ciel.cx, y - ciel.cy) < ciel.r)) { // caché quand il passe derrière
    c.globalAlpha = 1; c.fillStyle = "#3f7df0"; c.fillRect(x - 4, y, 3, 1); c.fillRect(x + 2, y, 3, 1);
    c.fillStyle = "#dfe6ff"; c.fillRect(x - 1, y - 1, 3, 2);
    if (t % 1400 < 200) { c.fillStyle = "#ff5a6e"; c.fillRect(x, y - 2, 1, 1); }
  }
  c.globalAlpha = 1;
}

// Les univers où l'on travaille : la planète s'allume et une navette fait la liaison avec la station.
function actifsParUnivers() {
  const n = {};
  for (const a of agents.values()) if (!a.part && a.d.univers && a.d.phase === "travaille") n[a.d.univers] = (n[a.d.univers] || 0) + 1;
  return n;
}
function dessinerLiaisons(c, t) {
  if (!planetes.length || !plan) return;

  for (const p of planetes) {
    const nb = n[p.u.cle] || 0; if (!nb) continue;
    const pouls = .5 + .5 * Math.sin(t / 420 + p.cx);
    c.fillStyle = p.u.couleur; // halo
    for (let k = 0; k < 2; k++) { const rr = p.r + 2 + k * 2 + pouls; c.globalAlpha = (k ? .25 : .5) * (.6 + pouls * .4);
      for (let a = 0, m = Math.round(rr * 6); a < m; a++) { const an = a / m * 6.2832; c.fillRect(Math.round(p.cx + Math.cos(an) * rr), Math.round(p.cy + Math.sin(an) * rr), 1, 1); } }
    const dx = p.cx - sx, dy = p.cy - sy, lg = Math.hypot(dx, dy); if (lg < p.r + 10) continue;
    const ux = dx / lg, uy = dy / lg, bout = lg - p.r - 3;
    const defile = (t / 90) % 5; // le trajet en pointillés qui défilent vers la planète
    for (let d = defile; d < bout; d += 5) { c.globalAlpha = .18 + .3 * Math.min(1, d / 40); c.fillRect(Math.round(sx + ux * d), Math.round(sy + uy * d), 1, 1); }
    for (let k = 0; k < Math.min(nb, 3); k++) { // une navette par agent (trois au plus)
      const u = (t / 5200 + (hache(p.u.cle) % 100) / 100 + k / 3) % 1, f = u < .5 ? u * 2 : 2 - u * 2, d = 20 + f * (bout - 20);
      const x = Math.round(sx + ux * d), y = Math.round(sy + uy * d), sens = u < .5 ? 1 : -1;

    }
  }
  c.globalAlpha = 1;
}

// L'écran des projets du QG ORBIT, sur le mur de gauche (une ligne par univers, un bloc par projet).
let survolEcran = false;
function sousEcran(mx, my) { // point de la scène → sur l'écran ? (face avant, plan y = j + .78)
  const o = plan && plan.objets.find((q) => q.t === "ecran"); if (!o) return false;
  const yp = o.j + .78, x = (mx - cam.x) / 16 + yp, z = (x + yp) * 8 - (my - cam.y);

}
function dessinerEcranQg(c, t, px, py) {

// L'extérieur vivant : coursive lumineuse, réacteurs, navette, feux de position, parabole.

    m.chemin.forEach(([i, j], k) => { const d = Math.abs(k - pos); if (d > 2) return; const [x, y] = P(i + .5, j + .5, 0); c.globalAlpha = (1 - d / 2) * .8; c.fillRect(x - 2, y, 4, 1); });

}

function dessiner(t) {

}

  { const n = actifsParUnivers();
    for (const p of planetes) {

      const fp = MINI ? 8.5 : 10; c.font = police(fp, 700); c.letterSpacing = "1.5px";

let empreinte = "", structure = null;

  if (d.phase === "attend") return "attend ta décision · " + duree(horloge - d.depuis);

}
function el(tag, classe, texte) { const e = document.createElement(tag); if (classe) e.className = classe; if (texte != null) e.textContent = texte; return e; }

function majInterface() {
  const tous = [...agents.values()].filter((a) => !a.part).map((a) => a.d);
  const n = (f) => tous.filter(f).length;
  const mission = n((d) => d.phase === "travaille"), attente = n((d) => d.phase === "attend" || d.phase === "question"), finis = n((d) => d.phase === "fini"), repos = n((d) => d.phase === "repos");
  document.title = (attente ? "(" + attente + ") " : "") + "La Station";
  majQg();
  const sig = JSON.stringify([choisi, tous.map((d) => [d.id, d.nom, d.projet, d.phase, texteEtat(d), d.plan, d.demande, d.recap, d.outils, d.drones.length, d.role])]);
  if (sig === empreinte) return;
  empreinte = sig;

  const cpt = $("compteurs"); cpt.replaceChildren();
  const pastille = (col, nb, txt, alerte) => { const p = el("div", "pastille" + (alerte ? " alerte" : "")); const pt = el("span", "point"); pt.style.background = col; p.append(pt, el("b", null, String(nb)), document.createTextNode(txt)); cpt.append(p); };
  pastille(POINTS.travaille, mission, mission > 1 ? "en mission" : "en mission");
  pastille(POINTS.attend, attente, attente > 1 ? "t'attendent" : "t'attend", attente > 0);
  if (finis) pastille(POINTS.fini, finis, finis > 1 ? "ont terminé" : "a terminé");
  pastille(POINTS.repos, repos, "au repos");

  // La liste : on garde les mêmes boutons d'une seconde à l'autre (sinon un clic peut se perdre).

  const sansSalle = [...new Set(tous.map((d) => d.projet))].filter((n) => !plan.modules.some((m) => m.nom === n)).map((nom) => ({ nom, teinte: { trait: "#9db0e8" } }));
  const groupes = plan.modules.concat(sansSalle).map((m) => [m, tous.filter((d) => d.projet === m.nom).sort((a, b) => ordre[a.phase] - ordre[b.phase] || b.depuis - a.depuis)]).filter((g) => g[1].length);
  const forme = groupes.map(([m, mb]) => m.nom + ":" + mb.map((d) => d.id).join(",")).join("|");

      for (const d of membres) {

    f.append(pastilleRole);
    const rang = (gras, reste) => { const r = el("div", "rang"); r.append(el("b", null, gras), document.createTextNode(reste)); f.append(r); };
    rang({ travaille: "Au travail", question: "Te pose une question", attend: "Attend ta décision", fini: "A terminé", repos: "Au repos" }[d.phase], d.phase === "travaille" ? (d.activite.texte ? " · " + d.activite.texte : "") : " · depuis " + duree(horloge - d.depuis));
    if (d.plan && d.plan.total) {

      const barre = el("div", "barre"), i = el("i"); i.style.width = Math.round(d.plan.fait / d.plan.total * 100) + "%"; barre.append(i); f.append(barre);
    }

  b.append(el("div", "obj", o.ouverts + " objectif" + (o.ouverts > 1 ? "s" : "") + " ouvert" + (o.ouverts > 1 ? "s" : "") + (o.haute ? " · " + o.haute + " prioritaire" + (o.haute > 1 ? "s" : "") : "")));
  if (o.prochains.length) { const ul = el("ul"); for (const p of o.prochains) ul.append(el("li", null, (p.cat ? p.cat + " : " : "") + p.txt)); b.append(ul); }
  if (QG.agenda) { const [a, m, j] = QG.agenda.date.split("-"); b.append(el("div", "agenda", "Prochain : " + j + "/" + m + (QG.agenda.heure && QG.agenda.heure !== "00:00" ? " " + QG.agenda.heure : "") + " · " + QG.agenda.titre)); }
}

// ---------------------------------------------------------------- souris
function agentSous(mx, my) {
  let mieux = null, md = -Infinity;
  for (const a of agents.values()) {
    let x, y, d;
    if (a.cache) { const [X, Y] = proj(a.place.ref.x + .5, a.place.ref.y + .5); x = X + cam.x; y = Y + cam.y + 4; d = a.place.ref.x + a.place.ref.y; }
    else { x = a.sx; y = a.sy; d = a.x + a.y; }
    if (mx >= x - 9 && mx <= x + 9 && my >= y - 20 && my <= y + 5 && d > md) { mieux = a; md = d; }
  }
  return mieux;
}
let prise = null;
sc.addEventListener("pointerdown", (e) => { prise = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, bouge: false }; sc.setPointerCapture(e.pointerId); });
sc.addEventListener("pointermove", (e) => {
  const mx = e.clientX * dpr / cam.s, my = e.clientY * dpr / cam.s;
  if (prise) {
    const dx = (e.clientX - prise.x) * dpr / cam.s, dy = (e.clientY - prise.y) * dpr / cam.s;
    if (Math.abs(dx) + Math.abs(dy) > 3) { prise.bouge = true; zoomManuel = true; sc.classList.add("prise"); }
    if (prise.bouge) { cam.x = Math.round(prise.cx + dx); cam.y = Math.round(prise.cy + dy); }
    return;
  }
  const a = agentSous(mx, my); survol = a ? a.id : null;
  survolEcran = !a && sousEcran(mx, my);
  sc.classList.toggle("cible", !!a || survolEcran);
});
sc.addEventListener("pointerup", (e) => {
  const p = prise; prise = null; sc.classList.remove("prise");
  if (p && !p.bouge) {
    const mx = e.clientX * dpr / cam.s, my = e.clientY * dpr / cam.s, a = agentSous(mx, my);
    if (!a && sousEcran(mx, my)) { ouvrirQg(); return; }
    choisi = a ? (choisi === a.id ? null : a.id) : null; empreinte = ""; majInterface();
  }
});
sc.addEventListener("pointerleave", () => { survol = null; survolEcran = false; });
function ouvrirQg() { if (!DEMO && QG) window.open("/qg", "_blank"); }
sc.addEventListener("wheel", (e) => { e.preventDefault(); zoomer(e.deltaY < 0 ? 1 : -1, e.clientX * dpr, e.clientY * dpr); }, { passive: false });
$("plus").onclick = () => zoomer(1, innerWidth * dpr / 2, innerHeight * dpr / 2);
$("moins").onclick = () => zoomer(-1, innerWidth * dpr / 2, innerHeight * dpr / 2);
$("recadrer").onclick = () => { zoomManuel = false; cadrer(); };
$("replier").onclick = () => { $("liste").classList.add("ferme"); if (!zoomManuel) cadrer(); };
$("ouvrir").onclick = () => { $("liste").classList.remove("ferme"); if (!zoomManuel) cadrer(); };
$("fermer").onclick = () => { choisi = null; empreinte = ""; majInterface(); };
$("mPlus").onclick = $("plus").onclick;
$("mMoins").onclick = $("moins").onclick;
$("mCadre").onclick = $("recadrer").onclick;
$("mGrand").onclick = () => window.open("/" + (DEMO ? "?demo" : ""), "_blank");
$("mMasquer").onclick = () => window.close(); // avec Station.exe, c'est lui qui masque (le clic n'arrive pas ici)
sc.addEventListener("dblclick", () => { zoomManuel = false; cadrer(); });
addEventListener("resize", () => { if (zoomManuel) taille(); else cadrer(); });

// Si la carte graphique a quand même perdu quelque chose : on refait tous les dessins.
function reconstruire() {
  spritesAgent.clear(); fabriquer();
  if (plan) rendreStation();
  rendreFond(); empreinte = "";
}
sc.addEventListener("contextrestored", reconstruire);
cc.addEventListener("contextrestored", reconstruire);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && station && station.getContext("2d").isContextLost?.()) reconstruire();
});

// ---------------------------------------------------------------- données
let demo = null;
function etatDemo() {
  const t = Date.now();
  const ACTES = [["code", "écrit OrbitalDesign.java"], ["lit", "lit config.yml"], ["commande", "Compile le plugin"], ["cherche", "cherche « spawnPortal »"], ["reflechit", "réfléchit"], ["web", "navigue dans le navigateur"], ["redige", "rédige sa réponse"], ["commande", "Relance le serveur survie"]];
  if (!demo) demo = [["mc", "Port orbital de la survie", "travaille", "ingenierie"], ["mc", "Compiler OrbitPractice", "travaille", "plugin"], ["mc", "Caisses de butin", "attend", "design"],
    ["ark", "SAV : dino perdu", "travaille", "sav"], ["ark", "Mise en prod du site", "travaille", "prod"], ["ark", "Annonce de Noël", "fini", "annonce"], ["ark", "Couple de Rex en boutique", "repos", "boutique"],
    ["pz", "Manager Zomboid", "travaille", "operations"], ["11d", "Site 11D Labs", "travaille", "web"], ["11d", "Audit des sources", "attend", "recherche"],
    ["gmod", "Casino : roulette", "travaille", "commandement"], ["roblox", "Extraction Roblox", "repos", "ingenierie"]]
    .map(([u, nom, phase, role], i) => ({ id: "demo" + i, univers: u, projet: UNIVERS_DEFAUT.find((x) => x.cle === u).nom, role: { cle: role, via: "démo" }, nom, phase,
      fin: t + 5000 + Math.random() * 14000, depuis: t - Math.random() * 600000, acte: i % ACTES.length, outils: 3 + i, debut: i, tour: t - 240000 }));
  for (const a of demo) {
    if (t > a.fin) {
      a.phase = { travaille: Math.random() < .5 ? "attend" : "fini", attend: "travaille", fini: Math.random() < .6 ? "repos" : "travaille", repos: "travaille" }[a.phase];
      a.depuis = t; a.fin = t + 7000 + Math.random() * 15000; if (a.phase === "travaille") { a.outils = 0; a.tour = t; }
    }
    if (a.phase === "travaille" && Math.random() < .35) { a.acte = Math.floor(Math.random() * ACTES.length); a.outils++; }
  }
  return { maintenant: t, univers: UNIVERS_DEFAUT,
    qg: { enLigne: true, projets: { ark: { en_cours: 2, test: 3, pret: 4, en_prod: 1 }, mc: { en_cours: 1, test: 4, pret: 1 }, autre: { en_cours: 1, idee: 1 } },
      objectifs: { ouverts: 7, haute: 1, prochains: [{ txt: "Ajouter un lore et quelques missions", cat: "Extraction", prio: "haute" }, { txt: "Nouveaux sorts de zone", cat: "MMO", prio: "normale" }] },
      agenda: { date: "2026-12-01", heure: "00:00", titre: "Ouverture du calendrier de l'avent" } },
    agents: demo.map((a, i) => ({ id: a.id, nom: a.nom, projet: a.projet, univers: a.univers, role: a.role, dossier: a.projet, phase: a.phase, depuis: a.depuis, debut: a.debut,
    activite: a.phase === "travaille" ? { genre: ACTES[a.acte][0], texte: ACTES[a.acte][1] } : { genre: "veille", texte: "" }, tourDebut: a.tour, outils: a.outils,
    plan: { fait: a.phase === "travaille" ? 2 : 4, total: 4, etape: a.phase === "travaille" ? "Dessiner le quai d'amarrage" : null },
    demande: a.phase === "attend" ? "Je régénère le port orbital ? (/ile ecarts d'abord)" : null, recap: a.phase === "travaille" ? null : "Le port orbital compile et se charge. Pas encore vu en jeu.",
    drones: a.phase !== "travaille" ? [] : i === 3 ? [{ id: "d" + i, texte: "Enquête dans les journaux", type: "orbit-enqueteur-ark" }] : i === 1 ? [{ id: "d" + i, texte: "Vérifie les jars installés", type: "orbit-verif-mc" }]
      : i === 10 ? [{ id: "d10", texte: "Explore les addons", type: "Explore" }, { id: "d10b", texte: "Prépare le plan", type: "Plan" }] : [] })) };
}
async function rafraichir() {
  try {
    const r = DEMO ? etatDemo() : await (await fetch("/api/etat", { cache: "no-store" })).json();
    horloge = r.maintenant; majDonnees(r.agents, r.univers || [], r.qg); $("alerte").classList.remove("vu");
  } catch (err) { $("alerte").classList.add("vu"); console.error(err); }
  setTimeout(rafraichir, 1000);
}

// ---------------------------------------------------------------- départ
if (innerWidth <= 900) $("liste").classList.add("ferme"); // petite fenêtre : la station d'abord
fabriquer();
majDonnees([]);
premier = true;
let avant = performance.now();
function image(t) {
  const dt = Math.min(.1, (t - avant) / 1000); avant = t;
  avancer(dt); dessiner(t);
  requestAnimationFrame(image);
}
requestAnimationFrame(image);
rafraichir();
