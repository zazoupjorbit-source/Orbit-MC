      - "The largest nest in the Sylva"
      - "is hidden far to the west."
    offre:
      - "ombline: Toutes les araignées du sud venaient d'un nid plus grand, loin à l'ouest. La mère est là-bas."
    offre-en:
      - "ombline: All the southern spiders came from a bigger nest, far to the west. The mother is out there."
    etapes:
      - type: TUER
        texte: "Détruire le grand nid de l'ouest"
        texte-en: "Destroy the great western nest"
        monstres: [araignee, araignee_geante]
        nombre: 14
        point: nid_ouest_sylve
      - type: PARLER
        texte: "Revenir voir Mère Ombline"
        texte-en: "Return to Mother Ombline"
        pnj: ombline
        dialogue:
          - "ombline: La Sylve respire. Moi aussi."
        dialogue-en:
          - "ombline: The Sylva can breathe. So can I."
