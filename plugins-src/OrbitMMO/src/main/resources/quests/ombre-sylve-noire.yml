  o_s_le_cimetiere_de_l_est:
    nom: "Le cimetière de l'est"
    nom-en: "The Eastern Graveyard"
    faction: ombre
    niveau: 14
    requiert: [o_la_route_de_la_sylve]
    donneur: sylas
    resume:
      - "Un cimetière oublié s'est réveillé"
      - "loin à l'est de la Sylve."
    resume-en:
      - "A forgotten graveyard has awoken"
      - "far east of the Sylva."
    offre:
      - "sylas: Loin à l'est, près de la côte, un cimetière se vide. Le gibier fuit vers nous. Les morts le suivent."
    offre-en:
      - "sylas: Far to the east, near the coast, a graveyard is emptying. The game flees toward us. The dead follow it."
    etapes:
      - type: TUER
        texte: "Rendre les morts à la terre"
        texte-en: "Return the dead to the earth"
        monstres: [squelette, revenant]
        nombre: 10
        point: cimetiere_est_sylve
      - type: INTERAGIR
        texte: "Refermer la fosse commune"
        texte-en: "Close the mass grave"
        point: cimetiere_est_sylve
        rayon: 6
        apres:
          - "Au fond de la fosse, un Éclat minuscule. Les morts dormaient dessus depuis mille ans. Ils l'ont entendu se réveiller."
        apres-en:
          - "At the bottom of the pit, a tiny Shard. The dead had slept on it for a thousand years. They heard it wake up."
      - type: PARLER
        texte: "Revenir voir Sylas"
        texte-en: "Return to Sylas"
        pnj: sylas
        dialogue:
          - "sylas: Le gibier reviendra. Les morts, j'espère que non."
        dialogue-en:
          - "sylas: The game will come back. The dead, I hope not."
    recompenses:
      xp: 1800
      or: 180

  o_s_le_bivouac_de_l_ouest:
    nom: "Le bivouac de l'ouest"
    nom-en: "The Western Bivouac"
    faction: ombre
    niveau: 15
    requiert: [o_les_fioles]
    donneur: varka
    resume:
      - "Un bivouac de Purificateurs, loin à l'ouest,"
      - "prépare un convoi de fioles."
    resume-en:
      - "A Purifier bivouac, far to the west,"
      - "is preparing a convoy of vials."
    offre:
      - "varka: Mes éclaireurs ont trouvé un autre bivouac de Purificateurs, loin à l'ouest, sur les hauteurs. Avec des caisses."
      - "varka: Brise-le. Et compte les fioles."
    offre-en:
      - "varka: My scouts found another Purifier bivouac, far to the west, on the heights. With crates."
      - "varka: Break it. And count the vials."
    etapes:
      - type: TUER
        texte: "Briser le bivouac de l'ouest"
        texte-en: "Break the western bivouac"
        monstres: [purificateur, limier_aube]
        nombre: 12
        point: bivouac_ouest_sylve
      - type: INTERAGIR
        texte: "Compter les fioles"
        texte-en: "Count the vials"
        point: bivouac_ouest_sylve
        rayon: 6
        apres:
          - "Quarante fioles. Quarante Marqués vidés. Toutes adressées « Pour V. »."
        apres-en:
          - "Forty vials. Forty Marked emptied. All addressed « For V. »."
      - type: PARLER
        texte: "Revenir voir Varka"
        texte-en: "Return to Varka"
        pnj: varka
        dialogue:
          - "varka: Quarante… Et ce n'est qu'un convoi. Ce commerce dure depuis longtemps."
        dialogue-en:
          - "varka: Forty… And that's only one convoy. This trade has been going on for a long time."
    recompenses:
      xp: 2200
      or: 220

  o_s_la_tour_du_nord:
    nom: "La tour du nord"
    nom-en: "The Northern Tower"
    faction: ombre
    niveau: 15
    requiert: [o_la_route_de_la_sylve]
    donneur: sylas
    resume:
      - "Une tour en ruine, loin au nord-est,"
      - "sert de repaire aux morts."
    resume-en:
      - "A ruined tower, far to the north-east,"
      - "serves as a lair for the dead."
    offre:
      - "sylas: Au nord-est, une vieille tour. Les morts s'y entassent comme dans un grenier. Va vider le grenier."
    offre-en:
      - "sylas: To the north-east, an old tower. The dead pile up there like in an attic. Go empty the attic."
    etapes:
      - type: TUER
        texte: "Abattre les morts de la tour"
        texte-en: "Destroy the dead of the tower"
        monstres: [squelette, revenant]
        nombre: 8
        point: tour_nord_sylve
      - type: INTERAGIR
        texte: "Fouiller le sommet de la tour"
        texte-en: "Search the top of the tower"
        point: tour_nord_sylve
        rayon: 6
        apres:
          - "Une lunette d'astromancien, brisée, tournée vers le ciel. Gravé dessus : « O. »"
        apres-en:
          - "An astromancer's spyglass, broken, turned toward the sky. Engraved on it: « O. »"
      - type: PARLER
        texte: "Revenir voir Sylas"
        texte-en: "Return to Sylas"
        pnj: sylas
        dialogue:
          - "sylas: Un astromancien de l'Aube, ici ? Il regardait quoi, de si loin ?"
        dialogue-en:
          - "sylas: A Dawn astromancer, here? What was he looking at, from so far away?"
    recompenses:
      xp: 2100
      or: 210

  o_s_le_nid_de_l_ouest:
    nom: "Le nid de l'ouest"
    nom-en: "The Western Nest"
    faction: ombre
    niveau: 16
    requiert: [o_s_les_toiles_du_sud]
    donneur: ombline
    resume:
      - "Le plus grand nid de la Sylve"
      - "se cache loin à l'ouest."
