    requiert: [o_la_route_de_la_sylve]
    donneur: ombline
    resume:
      - "Un nid d'araignées grandit au sud-ouest de Sombrebois."
    resume-en:
      - "A spider nest is growing south-west of Sombrebois."
    offre:
      - "ombline: Le nid du sud-ouest grossit. Bientôt, ses toiles toucheront nos murs."
    offre-en:
      - "ombline: The south-western nest is growing. Soon its webs will touch our walls."
    etapes:
      - type: TUER
        texte: "Détruire le nid du sud-ouest"
        texte-en: "Destroy the south-western nest"
        monstres: [araignee, araignee_geante]
        nombre: 12
        point: toiles_sud_sylve
      - type: PARLER
        texte: "Revenir voir Mère Ombline"
        texte-en: "Return to Mother Ombline"
        pnj: ombline
        dialogue:
          - "ombline: Les toiles brûlent bien. Merci."
        dialogue-en:
          - "ombline: Webs burn well. Thank you."
