        duree: 45
        mode: resserre
        rayon-fin: 5
        degats: 10
        monstres: [a8_gele]
        nombre: 2
        intervalle: 15
        niveau: 86
        apres:
          - "La Brèche se ferme. Il reste, sur la glace, un éclat de froid que vous ramassez."
        apres-en:
          - "The Breach shuts. On the ice remains a shard of cold, which you pick up."
    recompenses:
      xp: 9000
      or: 900

  a8_rep_breche_cendres:
    nom: "Contrat : Brèche des Cendres"
    nom-en: "Contract: Breach of the Ashes"
    repetable: 20
    niveau: 85
    donneur: a8_ravel
    resume:
      - "La Brèche des Cendres menace le Camp."
      - "Tenir trois vagues."
    resume-en:
      - "The Breach of the Ashes threatens the Camp."
      - "Hold three waves."
    offre:
      - "a8_ravel: Le Camp des Cendres paie bien quand la Brèche du sud s'agite. Elle s'agite. Trois vagues."
    offre-en:
      - "a8_ravel: The Camp of Ashes pays well when the southern Breach stirs. It is stirring. Three waves."
    etapes:
      - type: DEFENSE
        texte: "Tenir la Brèche des Cendres"
        texte-en: "Hold the Breach of the Ashes"
        point: a8_breche_cendres
