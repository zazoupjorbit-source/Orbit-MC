      - "a8_ravel: Fort Blanc wants someone in the Breach when it closes, to bring back what it leaves. Do not get swallowed."
    etapes:
      - type: SURVIE
        texte: "Tenir dans la Brèche qui se referme"
        texte-en: "Hold on in the closing Breach"
        point: a8_breche_cimes
