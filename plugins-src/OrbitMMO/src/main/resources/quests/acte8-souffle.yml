    offre-en:
      - "a8_ravel: Once a week, the Breach of the Furnace spits out a great fragment. Naïa gives it back to the sky. Ride, and bring it back without taking a single blow."
    etapes:
      - type: TUER
        texte: "Dégager la Brèche de la Fournaise"
        texte-en: "Clear the Breach of the Furnace"
        monstres: [a8_affame]
        nombre: 8
        point: a8_breche_fournaise
      - type: TRANSPORT
        texte: "Rapporter le fragment au Seuil, à dos de monture"
        texte-en: "Bring the fragment to the Threshold, on a mount"
        point: a8_seuil
        depart: a8_breche_fournaise
        materiau: PACKED_ICE
        rayon: 6
        objet: "Grand fragment du souffle"
        objet-en: "Great fragment of the breath"
        apres:
          - "a8_naia: Je le rendrai ce soir. Il remontera comme une étoile filante, mais à l'envers."
        apres-en:
          - "a8_naia: I will give it back tonight. It will rise like a shooting star, but backwards."
    recompenses:
