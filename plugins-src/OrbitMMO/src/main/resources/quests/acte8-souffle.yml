      - "The Breach of the Peaks closes, drawing everything in."
      - "Hold on to the end."
    offre:
      - "a8_ravel: Fort Blanc veut quelqu'un dans la Brèche quand elle se referme, pour rapporter ce qu'elle laisse. Ne vous faites pas avaler."
