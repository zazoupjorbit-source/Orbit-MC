        apparition: a8_breche_cendres_b
        pv: 450
        degats: 9
        niveau: 87
        cible: "Le sceau de la Brèche"
        cible-en: "The Breach seal"
        apres:
          - "La dernière vague se brise sur le sceau."
        apres-en:
          - "The last wave breaks on the seal."
    recompenses:
      xp: 9100
      or: 910

  a8_rep_ombre_du_souffle:
    nom: "Prime : l'Ombre du Souffle"
    nom-en: "Bounty: the Shadow of the Breath"
    repetable: 20
    niveau: 89
    donneur: a8_ravel
    resume:
      - "PRIME DU JOUR : une Ombre du Souffle à l'est du Guet."
    resume-en:
      - "BOUNTY OF THE DAY: a Shadow of the Breath east of the Watch."
    offre:
      - "a8_ravel: Une Ombre s'est reformée près de la Brèche de la Fournaise. Elles reviennent toujours. Moi, je paie toujours."
    offre-en:
      - "a8_ravel: A Shadow has formed again near the Breach of the Furnace. They always come back. I always pay."
    etapes:
      - type: TUER
        texte: "Abattre l'Ombre du Souffle"
        texte-en: "Slay the Shadow of the Breath"
        monstres: [a8_ombre_souffle]
        point: a8_breche_fournaise_b
    recompenses:
      xp: 11200
      or: 1120

  a8_rep_souffle_fige:
    nom: "Contrat : souffle figé"
    nom-en: "Contract: frozen breath"
    repetable: 20
    niveau: 87
    donneur: a8_ravel
    resume:
      - "Ilvar veut du souffle figé de la Brèche de la Fournaise."
    resume-en:
      - "Ilvar wants frozen breath from the Breach of the Furnace."
    offre:
      - "a8_ravel: Ilvar en use chaque jour pour ses astrolabes. Six fragments, pris sur les Affamés de la Fournaise."
    offre-en:
      - "a8_ravel: Ilvar uses some every day for his astrolabes. Six fragments, taken from the Starved of the Furnace."
    etapes:
      - type: RAMASSER
        texte: "Ramasser du souffle figé"
        texte-en: "Gather frozen breath"
        monstres: [a8_affame]
        nombre: 6
        chance: 0.5
        point: a8_breche_fournaise
        objet: "Souffle figé"
        objet-en: "Frozen breath"
      - type: PARLER
        texte: "Livrer le souffle figé à Ilvar"
        texte-en: "Deliver the frozen breath to Ilvar"
        pnj: a8_ilvar
        dialogue:
          - "a8_ilvar: Parfait. Ils sont encore tièdes. Le ciel s'est vraiment refermé, alors."
        dialogue-en:
          - "a8_ilvar: Perfect. They are still warm. The sky really has closed, then."
    recompenses:
      xp: 9200
      or: 920

  a8_rep_les_fragments:
