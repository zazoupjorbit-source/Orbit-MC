# ------------------------------------------------------------------
#  Acte VIII — Le Dernier Souffle (niv. 80 à 90). Hubs : le Guet de la Fournaise, puis le Seuil, au bord du cratère.
#  Principales Lumière (a8_l_*) et Ombre (a8_o_*), annexes neutres (a8_n_*), contrats des Brèches (a8_rep_*, répétables).
#  Grand choix « morvain » (a8_*_le_choix_de_morvain) : laisser Morvain porter le souffle, ou le porter soi-même.
#  Raid niveau 90 : le Souffle froid, au-dessus du cratère (a8_*_la_dechirure). Pas de mécanique de raid dédiée : boss partagé en groupe.
#  FICHIER GÉNÉRÉ par tools\quetes\gen-quetes.js depuis tools\quetes\zones\acte8-souffle.js : modifier la source, pas ce fichier.
# ------------------------------------------------------------------

pnj:
  a8_aldren:
    nom: "Chevalier Aldren"
    nom-en: "Sir Aldren"
    titre: "Ce qui reste de l'Aube"
    titre-en: "What remains of the Dawn"
    couleur: "#F7E7A1"
    type: MANNEQUIN
    visage: steve
    point: a8_aldren
    main: GOLDEN_SWORD
    repliques:
      - "Le Bastion se tait. Pour la première fois de ma vie, personne ne me dit quoi faire."
    repliques-en:
      - "The Bastion is silent. For the first time in my life, nobody tells me what to do."
  a8_vesper:
    nom: "Dame Vesper"
    nom-en: "Lady Vesper"
    titre: "Ce qui reste de la Citadelle"
    titre-en: "What remains of the Citadel"
    couleur: "#B48CFF"
    type: MANNEQUIN
    visage: noor
    point: a8_vesper
    main: NETHERITE_SWORD
    repliques:
      - "La Citadelle avait un maître. Elle a maintenant une question."
    repliques-en:
      - "The Citadel had a master. Now it has a question."
  a8_mareuil:
    nom: "Capitaine Mareuil"
    nom-en: "Captain Mareuil"
    titre: "Garde du Guet"
    titre-en: "Captain of the Watch"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: makena
    point: a8_mareuil
    main: IRON_SWORD
    repliques:
      - "Mes hommes ont vu le ciel se fendre trois fois cette semaine. Ils ne dorment plus."
    repliques-en:
      - "My men have seen the sky split three times this week. They no longer sleep."
  a8_morvain:
    nom: "Morvain"
    titre: "Le Premier Marqué"
    titre-en: "The First Marked"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: zuri
    point: a8_morvain
    main: NETHERITE_SWORD
    repliques:
      - "Mille ans à porter ce que j'ai forgé. Je commence à en sentir le poids."
    repliques-en:
      - "A thousand years carrying what I forged. I am beginning to feel its weight."
  a8_ilvar:
    nom: "Maître Ilvar"
    nom-en: "Master Ilvar"
    titre: "Astromancien"
    titre-en: "Astromancer"
    couleur: "#9FD8FF"
    type: MANNEQUIN
    visage: ari
    point: a8_ilvar
    main: SPYGLASS
    repliques:
      - "Je lis les deux côtés du ciel. Cette nuit, ils écrivent la même chose."
    repliques-en:
      - "I read both sides of the sky. Tonight they write the same thing."
  a8_hulde:
    nom: "Hulde"
    titre: "Intendante du Seuil"
    titre-en: "Quartermaster of the Threshold"
    couleur: "#E8C9A0"
    type: MANNEQUIN
    visage: sunny
    point: a8_hulde
    main: BARREL
    repliques:
      - "Ici, on mange debout et on dort dans ses bottes. Le cratère ne prévient pas."
    repliques-en:
      - "Here you eat standing and sleep in your boots. The crater gives no warning."
  a8_naia:
    nom: "Naïa"
    titre: "Veilleuse astréenne"
    titre-en: "Astrean Watcher"
    couleur: "#FFB86B"
    type: MANNEQUIN
    visage: kai
    point: a8_naia
    repliques:
      - "Mes ancêtres accueillaient l'Astre. Ils ne lui ont jamais demandé de rester."
    repliques-en:
      - "My ancestors welcomed the Star. They never asked it to stay."
  a8_ravel:
    nom: "Ravel"
    titre: "Contrats des Brèches"
    titre-en: "Breach contracts"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: efe
    point: a8_ravel
    main: PAPER
    repliques:
      - "Les Brèches se rouvrent chaque jour. Mon tableau ne sera jamais vide."
    repliques-en:
      - "The Breaches open again every day. My board will never be empty."
  a8_nell:
    nom: "Nell"
    titre: "Cartographe"
    titre-en: "Cartographer"
    couleur: "#A8E6A1"
    type: MANNEQUIN
    visage: ari
    point: a8_nell
    main: MAP
    repliques:
      - "La Marche change chaque nuit. Maintenant, elle saigne."
    repliques-en:
      - "The March changes every night. Now it bleeds."
  a8_refugie:
    nom: "Tomas"
    titre: "Réfugié de la Marche"
    titre-en: "Refugee of the March"
    couleur: "#C9D6A3"
    type: MANNEQUIN
    visage: alex
    point: a8_refugie
    repliques:
      - "La terre s'est ouverte sous ma grange. Il en est sorti quelque chose de froid."
    repliques-en:
      - "The earth opened under my barn. Something cold came out of it."
  a8_kesra:
    nom: "Kesra"
    titre: "Caravanière astréenne"
    titre-en: "Astrean Caravaneer"
    couleur: "#FFB86B"
    type: MANNEQUIN
    visage: makena
    point: a8_kesra
    repliques:
      - "Le sable gèle, la nuit, autour de la Brèche. Le désert n'a jamais connu le froid."
    repliques-en:
      - "The sand freezes at night around the Breach. The desert has never known cold."
  a8_caravanier:
    nom: "Oumar"
    titre: "Caravanier"
    titre-en: "Caravaneer"
    couleur: "#E8D7A0"
    type: MANNEQUIN
    visage: efe
    point: a8_caravanier
    repliques:
      - "Mes bêtes refusent d'avancer. Elles sentent ce qui respire sous le sable."
    repliques-en:
      - "My beasts refuse to move. They smell what breathes under the sand."
  a8_ivo:
    nom: "Ivo"
    titre: "Garde-neige de Fort Blanc"
    titre-en: "Snow-warden of Fort Blanc"
    couleur: "#D7E6F5"
    type: MANNEQUIN
    visage: steve
    point: a8_ivo
    main: BOW
    repliques:
      - "Les gelés de la Chute s'étaient réveillés. Maintenant, ils regardent la Brèche."
    repliques-en:
      - "The frozen ones of the Fall had woken. Now they stare at the Breach."
  a8_dagna:
    nom: "Dagna"
    titre: "Contremaîtresse des mineurs"
    titre-en: "Mine forewoman"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: noor
    point: a8_dagna
    main: IRON_PICKAXE
    repliques:
      - "Une galerie sur trois s'ouvre sur le vide. On creuse quand même. Il faut bien manger."
    repliques-en:
      - "One gallery in three opens onto the void. We dig anyway. We have to eat."
  a8_seraphine:
    nom: "Séraphine"
    titre: "Haute-Prélate déchue"
    titre-en: "Fallen High Prelate"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: noor
    point: a8_seraphine
    repliques:
      - "Vous avez libéré l'Astre. Regardez ce que votre liberté a ouvert."
    repliques-en:
      - "You freed the Star. Look at what your freedom has opened."
  a8_vharos:
    nom: "Vharos"
    titre: "Nécromancien déchu"
    titre-en: "Fallen Necromancer"
    couleur: "#9B7BFF"
    type: MANNEQUIN
    visage: steve
    point: a8_vharos
    repliques:
      - "Le Néant a faim. Je serai la bouche qui le nourrit, ou la main qui le tient."
    repliques-en:
      - "The Void is hungry. I will be the mouth that feeds it, or the hand that holds it."
  a8_lise:
    nom: "Lise"
    titre: "Marquée sauvée"
    titre-en: "Rescued Marked"
    couleur: "#C9B6E8"
    type: MANNEQUIN
    visage: sunny
    point: a8_lise
    repliques:
      - "Ils chantaient. Je sentais ma lumière monter dans ma gorge."
    repliques-en:
      - "They were singing. I felt my light rising in my throat."

