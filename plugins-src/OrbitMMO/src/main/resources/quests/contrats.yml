              - "A light cart, loaded. It was going east."
          - point: ct_indice_q2
            texte: "Un clou de fer à cheval"
            texte-en: "A horseshoe nail"
            apres:
              - "Un clou de fer forgé à la mode des pillards : tête carrée."
            apres-en:
              - "An iron nail forged in the raiders' fashion: square head."
          - point: ct_indice_q3
            texte: "Un sceau de cire brisé"
            texte-en: "A broken wax seal"
            apres:
              - "Le sceau du comptoir, brisé. Et une empreinte de pouce, en sable rouge."
            apres-en:
              - "The counter's seal, broken. And a thumbprint, in red sand."
        dialogue:
          - "joueur: Des pillards. Du sable rouge : ils viennent du sud."
          - "ct_quatre_vents: Rouge-Sable. Encore lui. Un jour, quelqu'un touchera sa prime."
        dialogue-en:
          - "joueur: Raiders. Red sand: they come from the south."
          - "ct_quatre_vents: Red-Sand. Him again. One day, someone will collect his bounty."
    recompenses:
      xp: 4000
      or: 415

