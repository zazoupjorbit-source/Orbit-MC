# ------------------------------------------------------------------

pnj:
  ct_veillemont:
    nom: "Sergente Brisse"
    nom-en: "Sergeant Brisse"
    titre: "Contrats de Veillemont"
    titre-en: "Veillemont contracts"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: makena
    point: ct_veillemont
    main: PAPER
    repliques:
      - "Petit hameau, petits contrats. Mais ils paient."
    repliques-en:
      - "Small hamlet, small contracts. But they pay."
  ct_bourg:
    nom: "Maître Anselin"
    nom-en: "Master Anselin"
    titre: "Contrats du Bourg"
    titre-en: "Bourg contracts"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: alex
    point: ct_bourg
    main: PAPER
    repliques:
      - "Les bergers paient en laine, les marchands en or. Moi, je préfère l'or."
    repliques-en:
      - "Shepherds pay in wool, merchants in gold. I prefer gold."
  ct_aureval:
    nom: "Héraut Corentin"
    nom-en: "Herald Corentin"
    titre: "Contrats de l'Aube"
    titre-en: "Dawn contracts"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: steve
    point: ct_aureval
    main: PAPER
    repliques:
      - "Au nom du Bastion : il y a toujours du travail pour un Marqué."
    repliques-en:
      - "In the name of the Bastion: there is always work for a Marked."
  ct_sylvestre:
    nom: "Garde-forêt Ysa"
    nom-en: "Forest-warden Ysa"
    titre: "Contrats du Village Sylvestre"
    titre-en: "Sylvan Village contracts"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: kai
    point: ct_sylvestre
    main: BOW
    repliques:
      - "Le bois donne, le bois prend. Moi, je tiens les comptes."
    repliques-en:
      - "The wood gives, the wood takes. I keep the accounts."
  ct_ponant:
    nom: "Lieutenant Bertrand"
    titre: "Contrats du Guet du Ponant"
    titre-en: "Ponant Watch contracts"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: efe
    point: ct_ponant
    main: IRON_SWORD
    repliques:
      - "Les collines ne se gardent pas toutes seules. Il paraît."
    repliques-en:
      - "The hills do not guard themselves. Apparently."
  ct_nidnoir:
    nom: "Corbelle"
    titre: "Contrats de Nidnoir"
    titre-en: "Nidnoir contracts"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: zuri
    point: ct_nidnoir
    main: PAPER
    repliques:
      - "Grisolde paie ce qui doit être fait. Je dis ce qui doit être fait."
    repliques-en:
      - "Grisolde pays for what must be done. I say what must be done."
  ct_gris:
    nom: "Fossoyeuse Maëve"
    nom-en: "Gravedigger Maëve"
    titre: "Contrats de Gris-Hameau"
    titre-en: "Gris-Hameau contracts"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: noor
    point: ct_gris
    main: IRON_SHOVEL
    repliques:
      - "Tout passe par Gris-Hameau. Les contrats aussi."
    repliques-en:
      - "Everything goes through Gris-Hameau. Contracts too."
  ct_morneval:
    nom: "Greffier Sorn"
    nom-en: "Clerk Sorn"
    titre: "Contrats de la Citadelle"
    titre-en: "Citadel contracts"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: ari
    point: ct_morneval
    main: PAPER
    repliques:
      - "La Citadelle ne demande pas. Elle inscrit, et elle paie."
    repliques-en:
      - "The Citadel does not ask. It records, and it pays."
  ct_sombrebois:
    nom: "Veneuse Ilke"
    nom-en: "Huntress Ilke"
    titre: "Contrats de Sombrebois"
    titre-en: "Sombrebois contracts"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: sunny
    point: ct_sombrebois
    main: BOW
    repliques:
      - "Dans la Sylve, on chasse ou on est chassé. Choisissez."
    repliques-en:
      - "In the Sylve, you hunt or you are hunted. Choose."
  ct_pilotis:
    nom: "Batelier Hob"
    nom-en: "Boatman Hob"
    titre: "Contrats des Pilotis"
    titre-en: "Pilotis contracts"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: alex
    point: ct_pilotis
    main: OAK_BOAT
    repliques:
      - "Le marais rend ses morts, et quelqu'un doit les recoucher."
    repliques-en:
      - "The marsh gives back its dead, and someone has to lay them down again."
  ct_quatre_vents:
    nom: "Dame Albe"
    nom-en: "Lady Albe"
    titre: "Contrats des Quatre-Vents"
    titre-en: "Four Winds contracts"
    couleur: "#D7DCE2"
    type: MANNEQUIN
    visage: makena
    point: ct_quatre_vents
    main: PAPER
    repliques:
      - "Ici, l'or n'a pas de couleur. Les contrats non plus."
    repliques-en:
      - "Here, gold has no colour. Neither do contracts."
  ct_colin:
    nom: "Colin"
    titre: "Berger"
    titre-en: "Shepherd"
    couleur: "#C9D6A3"
    type: MANNEQUIN
    visage: sunny
    point: ct_colin
    repliques:
      - "Mes bêtes ont peur des loups. Moi aussi, un peu."
    repliques-en:
      - "My flock is afraid of wolves. So am I, a little."
  ct_prospecteur:
    nom: "Odon"
    titre: "Prospecteur"
    titre-en: "Prospector"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: efe
    point: ct_prospecteur
    main: IRON_PICKAXE
    repliques:
      - "Il y a de l'argent dans ces collines. Et des brigands dessus."
    repliques-en:
      - "There is silver in those hills. And bandits on top of it."
  ct_porteur:
    nom: "Vieux Gaut"
    nom-en: "Old Gaut"
    titre: "Porteur de morts"
    titre-en: "Corpse-bearer"
    couleur: "#B8B0A0"
    type: MANNEQUIN
    visage: steve
    point: ct_porteur
    repliques:
      - "Je porte les morts jusqu'au cimetière. Ils ne se plaignent jamais."
    repliques-en:
      - "I carry the dead to the cemetery. They never complain."
  ct_marchand:
    nom: "Ezio"
    titre: "Marchand ambulant"
    titre-en: "Travelling merchant"
    couleur: "#E8D7A0"
    type: MANNEQUIN
    visage: ari
    point: ct_marchand
    main: CHEST
    repliques:
      - "Je vends aux deux camps. Les pillards, eux, ne font pas la différence."
    repliques-en:
      - "I sell to both sides. The raiders do not tell the difference either."

