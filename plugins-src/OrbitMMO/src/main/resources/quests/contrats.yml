    resume:
      - "Une caisse a disparu du comptoir des Quatre-Vents."
      - "Trouver trois indices."
    resume-en:
      - "A crate has vanished from the Four Winds counter."
      - "Find three clues."
    offre:
      - "ct_quatre_vents: Une caisse a disparu cette nuit. Personne n'a rien vu, comme toujours. Il y a des traces dehors, à l'est. Trouvez qui."
    offre-en:
      - "ct_quatre_vents: A crate vanished last night. Nobody saw anything, as always. There are traces outside, to the east. Find out who."
    etapes:
      - type: ENQUETE
        texte: "Examiner les traces"
        texte-en: "Examine the traces"
        pnj: ct_quatre_vents
        indices:
          - point: ct_indice_q1
            texte: "Des traces de roues"
            texte-en: "Wheel tracks"
            apres:
              - "Une charrette légère, chargée. Elle allait vers l'est."
