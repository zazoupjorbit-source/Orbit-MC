quetes:

  # ================================================================ CONTRATS — LUMIÈRE (ANNEXES)

  ct_v_sangliers:
    nom: "Contrat : sangliers des prés"
    nom-en: "Contract: meadow boars"
    faction: lumiere
    repetable: 20
    niveau: 2
    donneur: ct_veillemont
    resume:
      - "Les sangliers retournent les champs de Veillemont."
    resume-en:
      - "Boars are tearing up the fields of Veillemont."
    offre:
      - "ct_veillemont: Six sangliers, dans les prés à l'est. Ils retournent nos semis toutes les nuits."
    offre-en:
      - "ct_veillemont: Six boars, in the meadows to the east. They dig up our seedlings every night."
    etapes:
      - type: TUER
        texte: "Chasser les sangliers des prés"
        texte-en: "Hunt the meadow boars"
        monstres: [sanglier]
        nombre: 6
        point: ct_pres_veillemont
      - type: PARLER
        texte: "Revenir auprès de Brisse"
        texte-en: "Return to Brisse"
        pnj: ct_veillemont
        dialogue:
          - "ct_veillemont: Les semis respireront cette nuit. Revenez demain : ils reviennent toujours."
        dialogue-en:
          - "ct_veillemont: The seedlings will breathe tonight. Come back tomorrow: they always come back."
    recompenses:
      xp: 250
      or: 25

  ct_v_pain_du_bourg:
    nom: "Contrat : le pain du Bourg"
    nom-en: "Contract: bread for the Bourg"
    faction: lumiere
    repetable: 20
    niveau: 3
    donneur: ct_veillemont
    resume:
      - "Porter une miche de pain au Bourg des Pâtres."
    resume-en:
      - "Carry a loaf of bread to the Bourg des Pâtres."
    offre:
      - "ct_veillemont: Notre four a cuit pour deux villages. Portez cette miche à Maître Anselin, au Bourg, au sud."
    offre-en:
      - "ct_veillemont: Our oven baked for two villages. Take this loaf to Master Anselin, at the Bourg, to the south."
    etapes:
      - type: LIVRER
        texte: "Porter le pain à Maître Anselin"
        texte-en: "Bring the bread to Master Anselin"
        pnj: ct_bourg
        materiau: BREAD
        objet: "Miche de Veillemont"
        objet-en: "Veillemont loaf"
        dialogue:
          - "ct_bourg: Encore chaud, presque. Brisse tient parole. Dites-lui merci de ma part."
        dialogue-en:
          - "ct_bourg: Still almost warm. Brisse keeps her word. Thank her for me."
    recompenses:
      xp: 380
      or: 40

  ct_v_la_cloture:
    nom: "Contrat : la clôture des champs"
    nom-en: "Contract: the field fence"
    faction: lumiere
    repetable: 20
    niveau: 4
    donneur: ct_veillemont
    resume:
      - "Des loups rôdent autour de la clôture des champs."
      - "La tenir trois vagues."
    resume-en:
      - "Wolves are prowling around the field fence."
      - "Hold it for three waves."
    offre:
      - "ct_veillemont: Les loups viennent à la tombée du jour, toujours par le même trou dans la clôture. Tenez-la."
    offre-en:
      - "ct_veillemont: The wolves come at nightfall, always through the same hole in the fence. Hold it."
    etapes:
      - type: DEFENSE
        texte: "Défendre la clôture des champs"
        texte-en: "Defend the field fence"
        point: ct_champs_veillemont
        monstres: [loup]
        nombre: 3
        vagues: 3
        apparition: ct_champs_veillemont_b
        pv: 120
        degats: 3
        cible: "La clôture"
        cible-en: "The fence"
        apres:
          - "Le dernier loup détale. La clôture tient."
        apres-en:
          - "The last wolf bolts. The fence holds."
    recompenses:
      xp: 500
      or: 50

  ct_b_gardes_kobolds:
    nom: "Prime : les gardes kobolds"
    nom-en: "Bounty: the kobold guards"
    faction: lumiere
    repetable: 20
    niveau: 5
    donneur: ct_bourg
    resume:
      - "Les gardes kobolds du sud volent nos brebis."
    resume-en:
      - "The kobold guards to the south are stealing our ewes."
    offre:
      - "ct_bourg: Le camp kobold, au sud-ouest. Ce sont leurs gardes qui viennent voler. Trois têtes, et je paie."
    offre-en:
      - "ct_bourg: The kobold camp, to the south-west. Their guards are the ones who come stealing. Three heads, and I pay."
    etapes:
      - type: TUER
        texte: "Abattre les gardes kobolds"
        texte-en: "Slay the kobold guards"
        monstres: [kobold_garde]
        nombre: 3
        point: ct_camp_a7
      - type: PARLER
        texte: "Toucher la prime"
        texte-en: "Collect the bounty"
        pnj: ct_bourg
        dialogue:
          - "ct_bourg: Les brebis dormiront. Votre prime."
        dialogue-en:
          - "ct_bourg: The ewes will sleep. Your bounty."
    recompenses:
      xp: 630
      or: 65

  ct_b_laine_volee:
    nom: "Contrat : la laine volée"
    nom-en: "Contract: the stolen wool"
    faction: lumiere
    repetable: 20
    niveau: 6
    donneur: ct_bourg
    resume:
      - "Des brigands ont volé la laine du Bourg."
    resume-en:
      - "Brigands stole the Bourg's wool."
    offre:
      - "ct_bourg: Les brigands du sud ont pris nos ballots de laine. Reprenez-en quatre : c'est ce qu'il faut pour l'hiver."
    offre-en:
      - "ct_bourg: The southern brigands took our wool bales. Take back four: that is what we need for the winter."
    etapes:
      - type: RAMASSER
        texte: "Reprendre la laine aux brigands"
        texte-en: "Take the wool back from the brigands"
        monstres: [bandit, braconnier]
        nombre: 4
        chance: 0.5
        point: ct_camp_a2
        objet: "Ballot de laine"
        objet-en: "Bale of wool"
      - type: PARLER
        texte: "Rapporter la laine"
        texte-en: "Bring back the wool"
        pnj: ct_bourg
        dialogue:
          - "ct_bourg: Quatre ballots. L'hiver sera moins froid."
        dialogue-en:
          - "ct_bourg: Four bales. The winter will be less cold."
    recompenses:
      xp: 750
      or: 80

  ct_b_le_berger:
    nom: "Contrat : le berger"
    nom-en: "Contract: the shepherd"
    faction: lumiere
    repetable: 20
    niveau: 7
    donneur: ct_bourg
    resume:
      - "Colin doit mener son troupeau aux pâtures."
      - "L'escorter."
    resume-en:
      - "Colin must lead his flock to the pastures."
      - "Escort him."
    offre:
      - "ct_bourg: Colin mène ses bêtes aux pâtures du sud. Les loups le suivent depuis trois jours. Accompagnez-le."
    offre-en:
      - "ct_bourg: Colin is taking his flock to the southern pastures. Wolves have been following him for three days. Go with him."
    etapes:
      - type: ESCORTE
        texte: "Escorter Colin aux pâtures"
        texte-en: "Escort Colin to the pastures"
        pnj: ct_colin
        chemin: [ct_paturage_1, ct_paturage_2]
        monstres: [loup]
        nombre: 2
        vagues: 2
        pv: 120
        degats: 3
        apres:
          - "ct_colin: Les pâtures ! Les bêtes vont manger. Et moi, je vais respirer."
        apres-en:
          - "ct_colin: The pastures! The flock will eat. And I will breathe."
    recompenses:
      xp: 880
      or: 90

  ct_a_glaneurs:
    nom: "Prime : les guetteurs glaneurs"
    nom-en: "Bounty: the gleaner lookouts"
    faction: lumiere
    repetable: 20
    niveau: 8
    donneur: ct_aureval
    resume:
      - "Des guetteurs glaneurs épient les routes au nord."
    resume-en:
      - "Gleaner lookouts are spying on the roads to the north."
    offre:
      - "ct_aureval: Le Bastion veut les yeux des Glaneurs fermés. Leur camp, au nord des Prés. Trois guetteurs."
    offre-en:
      - "ct_aureval: The Bastion wants the Gleaners' eyes closed. Their camp, north of the Meadows. Three lookouts."
    etapes:
      - type: TUER
        texte: "Abattre les guetteurs glaneurs"
        texte-en: "Slay the gleaner lookouts"
        monstres: [glaneur_guetteur]
        nombre: 3
        point: ct_camp_a3
      - type: PARLER
        texte: "Rendre compte au héraut"
        texte-en: "Report to the herald"
        pnj: ct_aureval
        dialogue:
          - "ct_aureval: Le Bastion vous remercie. Il le fait par ma bouche, et en or."
        dialogue-en:
          - "ct_aureval: The Bastion thanks you. It does so through my mouth, and in gold."
    recompenses:
      xp: 1000
      or: 105

  ct_a_loups:
    nom: "Contrat : les loups de la route"
    nom-en: "Contract: the road wolves"
    faction: lumiere
    repetable: 20
    niveau: 6
    donneur: ct_aureval
    resume:
      - "Des loups attaquent les voyageurs près d'Auréval."
    resume-en:
      - "Wolves are attacking travellers near Auréval."
    offre:
      - "ct_aureval: Huit loups, au nord des murs. Les pèlerins n'osent plus venir prier."
    offre-en:
      - "ct_aureval: Eight wolves, north of the walls. Pilgrims no longer dare come to pray."
    etapes:
      - type: TUER
        texte: "Chasser les loups au nord d'Auréval"
        texte-en: "Hunt the wolves north of Auréval"
        monstres: [loup]
        nombre: 8
        point: ct_bois_aureval
      - type: PARLER
        texte: "Revenir auprès du héraut"
        texte-en: "Return to the herald"
        pnj: ct_aureval
        dialogue:
          - "ct_aureval: Les pèlerins reviendront demain. Les loups aussi, sans doute."
        dialogue-en:
          - "ct_aureval: The pilgrims will come back tomorrow. So will the wolves, no doubt."
    recompenses:
      xp: 750
      or: 80

  ct_a_ordres_du_bastion:
    nom: "Contrat : les ordres du Bastion"
    nom-en: "Contract: orders from the Bastion"
    faction: lumiere
    repetable: 20
    niveau: 7
    donneur: ct_aureval
    resume:
      - "Porter les ordres du jour à Veillemont."
    resume-en:
      - "Carry the orders of the day to Veillemont."
    offre:
      - "ct_aureval: Les ordres du jour pour la sergente Brisse, à Veillemont. Scellés. Ne les ouvrez pas."
    offre-en:
      - "ct_aureval: The orders of the day for Sergeant Brisse, at Veillemont. Sealed. Do not open them."
    etapes:
      - type: LIVRER
        texte: "Porter les ordres à Brisse"
        texte-en: "Bring the orders to Brisse"
        pnj: ct_veillemont
        materiau: PAPER
        objet: "Ordres scellés du Bastion"
        objet-en: "Sealed orders from the Bastion"
        dialogue:
          - "ct_veillemont: « Rien à signaler. » Comme hier. Le Bastion aime qu'on le lui dise tous les jours."
        dialogue-en:
          - "ct_veillemont: « Nothing to report. » Like yesterday. The Bastion likes to be told every day."
    recompenses:
      xp: 880
      or: 90

  ct_a_convoi_de_grain:
    nom: "Contrat : le convoi de grain"
    nom-en: "Contract: the grain convoy"
    faction: lumiere
    repetable: 20
    niveau: 9
    donneur: ct_aureval
    resume:
      - "Un convoi de grain est arrêté sur la Route du Sud."
      - "Le défendre."
    resume-en:
      - "A grain convoy is stopped on the South Road."
      - "Defend it."
    offre:
      - "ct_aureval: Le convoi de grain du Bourg s'est arrêté sur la Route du Sud : une roue cassée, et des brigands qui l'ont vu. Tenez jusqu'à la réparation."
    offre-en:
      - "ct_aureval: The Bourg grain convoy has stopped on the South Road: a broken wheel, and brigands who saw it. Hold until it is repaired."
    etapes:
      - type: DEFENSE
        texte: "Défendre le convoi de grain"
        texte-en: "Defend the grain convoy"
        point: ct_route_sud
        monstres: [bandit, braconnier]
        nombre: 3
        vagues: 3
        apparition: ct_route_sud_b
        pv: 160
        degats: 4
        cible: "Le convoi"
        cible-en: "The convoy"
        apres:
          - "La roue est changée. Le convoi repart vers Auréval."
        apres-en:
          - "The wheel is changed. The convoy sets off for Auréval."
    recompenses:
      xp: 1130
      or: 115

  ct_a_courrier:
    nom: "Contrat : courrier pressé"
    nom-en: "Contract: urgent courier"
    faction: lumiere
    repetable: 20
    niveau: 8
    donneur: ct_aureval
    resume:
      - "Un pli urgent pour le Bourg des Pâtres."
      - "Trois minutes."
    resume-en:
      - "An urgent letter for the Bourg des Pâtres."
      - "Three minutes."
    offre:
      - "ct_aureval: Un pli urgent pour le Bourg des Pâtres. Trois minutes. Courez, ou montez."
    offre-en:
      - "ct_aureval: An urgent letter for the Bourg des Pâtres. Three minutes. Run, or ride."
    etapes:
      - type: ATTEINDRE
        texte: "Porter le pli au Bourg en trois minutes"
