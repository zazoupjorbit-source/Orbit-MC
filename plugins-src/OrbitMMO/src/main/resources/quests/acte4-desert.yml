          - "a4_saadi: Garde son astrolabe. Tu lis le ciel mieux que la plupart d'entre nous, maintenant."
        dialogue-en:
          - "a4_saadi: « It has left again. It was good. » He wrote that on the day of the Fall, not knowing that this time the Star was not leaving: it was breaking."
          - "a4_saadi: Keep his astrolabe. You read the sky better than most of us now."
    recompenses:
      xp: 14210
      or: 1420
      objets:
        - materiau: CLOCK
          nom: "Astrolabe du dernier lecteur"
          nom-en: "The last reader's astrolabe"
          description:
            - "« Il est reparti. C'était bien. »"
          description-en:
            - "« It has left again. It was good. »"

