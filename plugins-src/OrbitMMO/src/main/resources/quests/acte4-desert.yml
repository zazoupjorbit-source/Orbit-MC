          - "a4_saadi: Peut-être que vous, les Marqués, vous êtes ces petites lumières tombées."
        dialogue-en:
          - "a4_saadi: Small lights linked to the Star. The elders said each star in the sky was one of its memories."
          - "a4_saadi: Perhaps you, the Marked, are those small fallen lights."
    recompenses:
