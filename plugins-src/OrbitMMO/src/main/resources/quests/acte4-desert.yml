    recompenses:
      xp: 9680
      or: 970

  a4_l_l_oasis_d_ambre:
    nom: "L'Oasis d'Ambre"
    nom-en: "The Amber Oasis"
    faction: lumiere
    niveau: 36
    requiert: [a4_l_le_sable_de_deux_couleurs]
    donneur: a4_naim
    resume:
      - "La Gardienne de l'Oasis veut voir le Marqué venu du nord."
    resume-en:
      - "The Keeper of the Oasis wants to see the Marked who came from the north."
    offre:
      - "a4_naim: Elle s'appelle Ishara. Elle te posera une question. Réfléchis avant de répondre : ici, on se souvient des réponses."
    offre-en:
      - "a4_naim: Her name is Ishara. She will ask you a question. Think before you answer: here, answers are remembered."
    etapes:
      - type: ANCRAGE
        texte: "Toucher l'Éclat d'ancrage de l'Oasis"
