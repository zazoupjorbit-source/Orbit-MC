quetes:

  # ================================================================ PRINCIPALES — LUMIÈRE (a4_l_*) ET OMBRE (a4_o_*)

  a4_l_le_cratere_vide:
    nom: "Le cratère vide"
    nom-en: "The Empty Crater"
    faction: lumiere
    niveau: 34
    requiert: [l_le_pacte_des_deux_ciels]
    donneur: aldren
    resume:
      - "L'Éclat-Cœur a disparu dans la nuit."
    resume-en:
      - "The Heart-Shard vanished in the night."
    offre:
      - "aldren: Réveillez-vous. L'Éclat-Cœur n'est plus dans les Ruines. Personne ne l'a pris : il est parti."
    offre-en:
      - "aldren: Wake up. The Heart-Shard is no longer in the Ruins. Nobody took it: it left."
    etapes:
      - type: ATTEINDRE
        texte: "Rejoindre le cratère de l'Éclat-Cœur"
        texte-en: "Reach the Heart-Shard's crater"
        point: marche_portail
        rayon: 8
        apres:
          - "Un cratère vide, encore tiède. Au fond, le sable a fondu en verre. Une traînée part vers le sud : dorée d'un côté, noire comme l'encre de l'autre."
        apres-en:
          - "An empty crater, still warm. At the bottom, the sand has melted into glass. A trail leads south: golden on one side, black as ink on the other."
      - type: INTERAGIR
        texte: "Toucher le verre du cratère"
        texte-en: "Touch the glass of the crater"
        point: marche_portail
        rayon: 6
        apres:
          - "Sous tes doigts, le verre bat encore. Une seule voix, cette fois, très loin : « Là où l'on m'accueillait. »"
        apres-en:
          - "Under your fingers, the glass still beats. A single voice this time, very far away: « Where I was welcomed. »"
      - type: PARLER
        texte: "Revenir voir Aldren"
        texte-en: "Return to Aldren"
        pnj: aldren
        dialogue:
          - "aldren: « Là où on l'accueillait » ? Qui a jamais accueilli l'Astre ?"
          - "aldren: Le Bastion a déjà envoyé deux compagnies vers le sud, sous la capitaine Hélis. Je pars aussi, et vous venez avec moi."
          - "aldren: Vesper prend la même route. Pour une fois, nous ne ferons pas semblant de ne pas le savoir."
        dialogue-en:
          - "aldren: « Where it was welcomed »? Who ever welcomed the Star?"
          - "aldren: The Bastion has already sent two companies south, under Captain Hélis. I am going too, and you are coming with me."
          - "aldren: Vesper is taking the same road. For once, we will not pretend not to know it."
    recompenses:
      xp: 9130
      or: 915

  a4_o_le_cratere_vide:
    nom: "Le cratère vide"
    nom-en: "The Empty Crater"
    faction: ombre
    niveau: 34
    requiert: [o_le_pacte_des_deux_ciels]
    donneur: vesper
    resume:
      - "L'Éclat-Cœur a disparu dans la nuit."
    resume-en:
      - "The Heart-Shard vanished in the night."
    offre:
      - "vesper: Debout. L'Éclat-Cœur a quitté les Ruines cette nuit. Personne ne l'a porté. Il est parti seul."
    offre-en:
      - "vesper: Get up. The Heart-Shard left the Ruins tonight. Nobody carried it. It went alone."
    etapes:
      - type: ATTEINDRE
        texte: "Rejoindre le cratère de l'Éclat-Cœur"
        texte-en: "Reach the Heart-Shard's crater"
        point: marche_portail
        rayon: 8
        apres:
          - "Un cratère vide, encore tiède. Au fond, le sable a fondu en verre. Une traînée part vers le sud : dorée d'un côté, noire comme l'encre de l'autre."
        apres-en:
          - "An empty crater, still warm. At the bottom, the sand has melted into glass. A trail leads south: golden on one side, black as ink on the other."
      - type: INTERAGIR
        texte: "Toucher le verre du cratère"
        texte-en: "Touch the glass of the crater"
        point: marche_portail
        rayon: 6
        apres:
          - "Sous tes doigts, le verre bat encore. Une seule voix, cette fois, très loin : « Là où l'on m'accueillait. »"
        apres-en:
          - "Under your fingers, the glass still beats. A single voice this time, very far away: « Where I was welcomed. »"
      - type: PARLER
        texte: "Revenir voir Vesper"
        texte-en: "Return to Vesper"
        pnj: vesper
        dialogue:
          - "vesper: « Là où on l'accueillait. » Les vieux de la Citadelle parlaient d'un peuple du désert qui chantait pour le ciel. Je les croyais fous."
          - "vesper: Vharos a déjà lancé ses Lames vers le sud, sous les ordres de Sarn. Je n'aime pas Sarn. Toi, tu viens avec moi."
          - "vesper: Aldren part aussi. Nous ferons la route à une distance polie."
        dialogue-en:
          - "vesper: « Where it was welcomed. » The old ones at the Citadel spoke of a desert people who sang to the sky. I thought they were mad."
          - "vesper: Vharos has already sent his Blades south, under Sarn. I do not like Sarn. You are coming with me."
          - "vesper: Aldren is leaving too. We will travel at a polite distance."
    recompenses:
      xp: 9130
      or: 915

  a4_l_le_sable_de_deux_couleurs:
    nom: "Le sable de deux couleurs"
    nom-en: "Sand of Two Colours"
    faction: lumiere
    niveau: 35
    requiert: [a4_l_le_cratere_vide]
    donneur: aldren
    resume:
      - "La traînée de l'Éclat-Cœur file vers le Désert d'Ocre."
    resume-en:
      - "The Heart-Shard's trail runs toward the Ochre Desert."
    offre:
      - "aldren: La traînée descend plein sud, vers le Désert d'Ocre. Prenez la route du Sud jusqu'aux premières dunes et retrouvez-la. Je vous rejoins à l'Oasis d'Ambre."
    offre-en:
      - "aldren: The trail runs due south, toward the Ochre Desert. Take the southern road to the first dunes and find it again. I will meet you at the Amber Oasis."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre la lisière du Désert d'Ocre"
        texte-en: "Reach the edge of the Ochre Desert"
        point: a4_lisiere
        rayon: 12
        apres:
          - "Le vent sent la pierre chaude. Plus loin, le sable brille, comme si quelqu'un y avait marché avec une torche."
        apres-en:
          - "The wind smells of hot stone. Further on, the sand shines, as if someone had walked across it with a torch."
      - type: PISTER
        texte: "Suivre la traînée d'or et de nuit"
        texte-en: "Follow the trail of gold and night"
        traces: [a4_trace_1, a4_trace_2, a4_trace_3, a4_trace_fin]
        apres:
          - "La traînée s'arrête net. Autour, des sabots, et des sillons de lances plantées dans le sable. Quelqu'un est venu la chercher avant toi."
          - "Un cavalier en voile ocre t'observe du haut d'une dune. Il lève la main, paume ouverte, puis montre le sud : l'Oasis d'Ambre."
        apres-en:
          - "The trail stops dead. Around it, hoofprints, and furrows of spears driven into the sand. Someone came for it before you."
          - "A rider in an ochre veil watches you from the top of a dune. He raises his hand, palm open, then points south: the Amber Oasis."
      - type: PARLER
        texte: "Rejoindre le cavalier à l'Oasis d'Ambre"
        texte-en: "Join the rider at the Amber Oasis"
        pnj: a4_naim
        dialogue:
          - "a4_naim: Tu as suivi la traînée jusqu'au bout. Les autres ont fait demi-tour au premier scorpion."
          - "a4_naim: Je m'appelle Naïm. Ici, c'est chez les Astréens. Tu peux entrer, si tu laisses ta colère à la porte. La Gardienne veut te voir."
        dialogue-en:
          - "a4_naim: You followed the trail to the end. The others turned back at the first scorpion."
          - "a4_naim: My name is Naïm. This is the home of the Astreans. You may come in, if you leave your anger at the door. The Keeper wants to see you."
    recompenses:
      xp: 9680
      or: 970

  a4_o_le_sable_de_deux_couleurs:
    nom: "Le sable de deux couleurs"
    nom-en: "Sand of Two Colours"
