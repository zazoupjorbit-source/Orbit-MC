            texte-en: "The tomb of the sands"
            apres:
              - "Sept noms martelés. Sous chacun, le même signe, plus récent : un soleil."
            apres-en:
              - "Seven names hammered away. Beneath each, the same sign, more recent: a sun."
          - point: a4_ruine_h1
            texte: "La tour du guet des Hôtes"
            texte-en: "The Hosts' watchtower"
            apres:
              - "Une liste de veilleurs. La moitié des noms sont effacés. À la place, quelqu'un a gravé : « partis vers le nord avec lui »."
            apres-en:
              - "A list of watchmen. Half the names are erased. In their place, someone carved: « gone north with him »."
          - point: a4_camp_h4
            texte: "Le cimetière de l'est"
            texte-en: "The eastern graveyard"
            apres:
              - "Une tombe vide, ouverte de l'intérieur il y a longtemps. Le nom est effacé, mais pas le titre : « écuyer »."
            apres-en:
              - "An empty grave, opened from the inside long ago. The name is erased, but not the title: « squire »."
        dialogue:
          - "joueur: Des noms sous un soleil. Des veilleurs partis vers le nord « avec lui ». Et la tombe vide d'un écuyer."
          - "a4_saadi: Ceux qui ont suivi le traître. Les premiers de l'Aube étaient des nôtres. Nous les avons effacés par honte."
          - "a4_saadi: Une tombe ouverte de l'intérieur… Je préfère ne pas y penser."
        dialogue-en:
          - "joueur: Names under a sun. Watchmen gone north « with him ». And the empty grave of a squire."
          - "a4_saadi: Those who followed the traitor. The first of the Dawn were of our people. We erased them out of shame."
          - "a4_saadi: A grave opened from the inside… I would rather not think about it."
    recompenses:
      xp: 12420
      or: 1240

  a4_n_le_dernier_lecteur:
