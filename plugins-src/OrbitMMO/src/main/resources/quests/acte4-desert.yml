  a4_l_ce_que_le_sable_a_vu:
    nom: "Ce que le sable a vu"
    nom-en: "What the Sand Saw"
    faction: lumiere
    niveau: 48
    requiert: [a4_l_la_fresque_du_premier_hote]
    donneur: a4_aldren
    resume:
      - "Il faut décider ce que saura votre camp."
    resume-en:
      - "You must decide what your side will know."
    offre:
      - "a4_aldren: Hélis attend votre rapport. La Haute-Prélate aussi. Ce que vous direz maintenant, le Bastion le croira."
    offre-en:
      - "a4_aldren: Hélis is waiting for your report. So is the High Prelate. Whatever you say now, the Bastion will believe."
    etapes:
      - type: CHOIX
        texte: "Décider ce que vous direz à votre camp"
        texte-en: "Decide what you will tell your side"
        pnj: a4_aldren
        choix: a4-secret
        question: "Que direz-vous au Bastion ?"
        question-en: "What will you tell the Bastion?"
        reponses:
          - id: taire
            texte: "Que l'Éclat-Cœur a disparu. Rien de plus."
            texte-en: "That the Heart-Shard is gone. Nothing more."
            reponse:
              - "a4_aldren: Alors je dirai la même chose. Les Astréens l'ont mérité."
            reponse-en:
              - "a4_aldren: Then I will say the same. The Astreans have earned it."
            xp: 5460
          - id: reveler
            texte: "Toute la vérité : il est au Tombeau."
            texte-en: "The whole truth: it is in the Tomb."
            reponse:
              - "a4_aldren: Le Bastion viendra le chercher. Avec des chaînes, comme la première fois. J'espère que vous savez ce que vous faites."
            reponse-en:
              - "a4_aldren: The Bastion will come for it. With chains, like the first time. I hope you know what you are doing."
            or: 545
        dialogue:
          - "a4_aldren: J'ai vu la fresque, moi aussi. Je suis allé voir, cette nuit."
          - "a4_aldren: Notre Ordre est né d'une trahison. Et l'Éclat-Cœur dort chez ceux qu'il a trahis."
        dialogue-en:
          - "a4_aldren: I saw the fresco too. I went to look, last night."
          - "a4_aldren: Our Order was born of a betrayal. And the Heart-Shard sleeps among those it betrayed."
      - type: PARLER
        texte: "Faire vos adieux à Ishara"
        texte-en: "Say farewell to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Tu as gardé notre secret. Tant que l'Oasis existera, tu seras un Hôte ici."
        dialogue-en:
          - "a4_ishara: You kept our secret. As long as the Oasis stands, you will be a Host here."
        si: "a4-secret=taire"
      - type: PARLER
        texte: "Faire vos adieux à Ishara"
        texte-en: "Say farewell to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Tu as dit la vérité à ton camp. Je ne peux pas te le reprocher. Mais cette nuit, nous déplacerons l'Éclat, et toi, tu ne sauras pas où."
        dialogue-en:
          - "a4_ishara: You told your side the truth. I cannot blame you for it. But tonight we will move the Shard, and you will not know where."
        si: "a4-secret=reveler"
      - type: PARLER
        texte: "Écouter les nouvelles du nord avec Aldren"
        texte-en: "Hear the news from the north with Aldren"
        pnj: a4_aldren
        dialogue:
          - "a4_aldren: Un corbeau du nord. Au Bastion, on dit que la Citadelle a volé l'Éclat-Cœur. À la Citadelle, on dit que c'est nous."
          - "a4_aldren: Le Pacte des Deux Ciels se brise. Ce sera la guerre, et elle commencera dans les Cimes de Givre. À suivre."
        dialogue-en:
          - "a4_aldren: A raven from the north. At the Bastion, they say the Citadel stole the Heart-Shard. At the Citadel, they say it was us."
          - "a4_aldren: The Pact of the Two Skies is breaking. It will be war, and it will begin in the Frost Peaks. To be continued."
    recompenses:
      xp: 18200
      or: 1820
      objets:
        - materiau: LEATHER_HELMET
          nom: "Voile d'Hôte"
          nom-en: "Host's veil"
          description:
            - "Les gardiens du Tombeau s'écartent devant celui qui le porte."
          description-en:
            - "The Tomb's guardians step aside before whoever wears it."

  a4_o_ce_que_le_sable_a_vu:
    nom: "Ce que le sable a vu"
    nom-en: "What the Sand Saw"
    faction: ombre
    niveau: 48
    requiert: [a4_o_la_fresque_du_premier_hote]
    donneur: a4_vesper
    resume:
      - "Il faut décider ce que saura votre camp."
    resume-en:
      - "You must decide what your side will know."
    offre:
      - "a4_vesper: Sarn attend ton rapport, et Vharos derrière lui. Ce que tu diras maintenant deviendra la vérité de la Citadelle."
    offre-en:
      - "a4_vesper: Sarn is waiting for your report, and Vharos behind him. Whatever you say now will become the Citadel's truth."
    etapes:
      - type: CHOIX
        texte: "Décider ce que vous direz à votre camp"
        texte-en: "Decide what you will tell your side"
        pnj: a4_vesper
        choix: a4-secret
        question: "Que direz-vous à la Citadelle ?"
        question-en: "What will you tell the Citadel?"
        reponses:
          - id: taire
            texte: "Que l'Éclat-Cœur a disparu. Rien de plus."
            texte-en: "That the Heart-Shard is gone. Nothing more."
            reponse:
              - "a4_vesper: Alors je mentirai avec toi. Ça me changera de mentir pour quelqu'un."
            reponse-en:
              - "a4_vesper: Then I will lie with you. It will make a change to lie for someone."
            xp: 5460
          - id: reveler
            texte: "Toute la vérité : il est au Tombeau."
            texte-en: "The whole truth: it is in the Tomb."
            reponse:
              - "a4_vesper: Vharos enverra ses Lames au Tombeau. J'espère que tu sais ce que tu fais."
            reponse-en:
              - "a4_vesper: Vharos will send his Blades to the Tomb. I hope you know what you are doing."
            or: 545
        dialogue:
          - "a4_vesper: J'ai fouillé les lettres de Sarn. Vharos savait. Depuis toujours. Il sait qui était Aurélien, et il n'a jamais rien dit."
          - "a4_vesper: Un secret pareil, on le garde pour le jour où il fera le plus de mal. Ce que tu diras à la Citadelle, il s'en servira."
        dialogue-en:
          - "a4_vesper: I went through Sarn's letters. Vharos knew. He always knew. He knows who Aurélien was, and he never said a word."
          - "a4_vesper: A secret like that, you keep it for the day it will do the most harm. Whatever you tell the Citadel, he will use."
      - type: PARLER
        texte: "Faire vos adieux à Ishara"
        texte-en: "Say farewell to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Tu as gardé notre secret. Tant que l'Oasis existera, tu seras un Hôte ici."
        dialogue-en:
          - "a4_ishara: You kept our secret. As long as the Oasis stands, you will be a Host here."
        si: "a4-secret=taire"
      - type: PARLER
        texte: "Faire vos adieux à Ishara"
        texte-en: "Say farewell to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Tu as dit la vérité à ton camp. Je ne peux pas te le reprocher. Mais cette nuit, nous déplacerons l'Éclat, et toi, tu ne sauras pas où."
        dialogue-en:
          - "a4_ishara: You told your side the truth. I cannot blame you for it. But tonight we will move the Shard, and you will not know where."
        si: "a4-secret=reveler"
      - type: PARLER
        texte: "Écouter les nouvelles du nord avec Vesper"
        texte-en: "Hear the news from the north with Vesper"
        pnj: a4_vesper
        dialogue:
          - "a4_vesper: Un corbeau du nord. La Citadelle accuse l'Aube d'avoir volé l'Éclat-Cœur. L'Aube nous accuse. Chacun croit l'autre."
          - "a4_vesper: Le Pacte des Deux Ciels se brise. Ce sera la guerre, et elle commencera dans les Cimes de Givre. À suivre."
        dialogue-en:
          - "a4_vesper: A raven from the north. The Citadel accuses the Dawn of stealing the Heart-Shard. The Dawn accuses us. Each believes the other."
          - "a4_vesper: The Pact of the Two Skies is breaking. It will be war, and it will begin in the Frost Peaks. To be continued."
    recompenses:
      xp: 18200
      or: 1820
      objets:
        - materiau: LEATHER_HELMET
          nom: "Voile d'Hôte"
          nom-en: "Host's veil"
          description:
            - "Les gardiens du Tombeau s'écartent devant celui qui le porte."
          description-en:
            - "The Tomb's guardians step aside before whoever wears it."

