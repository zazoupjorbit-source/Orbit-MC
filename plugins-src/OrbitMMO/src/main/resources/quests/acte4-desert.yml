        pv: 200
        degats: 5
        cible: "Le Puits des Hôtes"
        cible-en: "The Hosts' Well"
        apres:
          - "Les derniers soldats du Bastion reculent dans les dunes. L'un d'eux a laissé tomber un ordre : « Prendre le puits de l'ouest. La Citadelle prendra celui de l'est. — S. »"
        apres-en:
          - "The last Bastion soldiers fall back into the dunes. One of them dropped an order: « Take the western well. The Citadel will take the eastern one. — S. »"
      - type: PARLER
        texte: "Revenir voir Ishara"
        texte-en: "Return to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Ils assiègent ensemble, chacun de son côté. Et demain, ils diront qu'ils se battaient l'un contre l'autre."
          - "a4_ishara: Il est temps que tu voies le Tombeau. Pas pour le prendre. Pour comprendre."
        dialogue-en:
          - "a4_ishara: They besiege us together, each from his own side. And tomorrow, they will say they were fighting each other."
          - "a4_ishara: It is time you saw the Tomb. Not to take it. To understand."
    recompenses:
      xp: 15290
      or: 1530

  a4_l_le_voile_de_l_hote:
    nom: "Le voile de l'Hôte"
    nom-en: "The Host's Veil"
    faction: lumiere
    niveau: 45
    requiert: [a4_l_le_siege_du_puits]
    donneur: a4_ishara
    resume:
      - "Ishara confie au Marqué le voile des Hôtes."
    resume-en:
      - "Ishara entrusts the Marked with the veil of the Hosts."
    offre:
      - "a4_ishara: Les gardiens du Tombeau frappent tout ce qui vient prendre. Ils laissent passer les Hôtes."
      - "a4_ishara: Porte ce voile, et marche jusqu'au seuil. Ne frappe aucun d'eux, ou ils sauront que tu n'es pas des nôtres."
    offre-en:
      - "a4_ishara: The Tomb's guardians strike everything that comes to take. They let the Hosts pass."
      - "a4_ishara: Wear this veil, and walk to the threshold. Strike none of them, or they will know you are not one of us."
    etapes:
      - type: DEGUISEMENT
        texte: "Atteindre le seuil du Tombeau sous le voile"
        texte-en: "Reach the Tomb's threshold under the veil"
        point: a4_tombeau_seuil
        monstres: [a4_gardien_tombe]
        materiau: LEATHER_HELMET
        couleur: "#C8873A"
        objet: "Voile d'Hôte"
        objet-en: "Host's veil"
        apres:
          - "Les gardiens tournent la tête vers toi, puis s'écartent. Ils ne s'inclinent pas. Ils te laissent passer, comme on laisse passer quelqu'un de la maison."
        apres-en:
          - "The guardians turn their heads toward you, then step aside. They do not bow. They let you pass, the way one lets someone of the house pass."
      - type: INTERAGIR
        texte: "Examiner la porte du Tombeau"
        texte-en: "Examine the Tomb's door"
        point: a4_fresque
        rayon: 5
        apres:
          - "Sur la porte, gravés en spirale, des centaines de noms d'Hôtes. Au centre, un nom martelé, comme sur la stèle de Saadi."
          - "Du sable noir suinte des joints de la pierre. Derrière, quelque chose respire."
        apres-en:
          - "On the door, carved in a spiral, hundreds of Hosts' names. In the centre, one name hammered away, as on Saadi's stele."
          - "Black sand seeps from the joints of the stone. Behind it, something breathes."
      - type: PARLER
        texte: "Revenir voir Ishara"
        texte-en: "Return to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Ils t'ont laissé passer. Alors ils t'ont reconnu."
          - "a4_ishara: L'Éclat-Cœur est au fond du Tombeau, là où l'Astre se posait. La Reine en garde la porte. Il faut la libérer avant que l'Aube ou l'Ombre ne s'en chargent à leur façon."
        dialogue-en:
          - "a4_ishara: They let you pass. So they recognised you."
          - "a4_ishara: The Heart-Shard lies at the bottom of the Tomb, where the Star used to rest. The Queen guards its door. She must be freed before the Dawn or the Shadow deal with it in their own way."
    recompenses:
      xp: 16000
      or: 1600

