          - "Un ciel peint, écaillé. Au centre, l'Astre, entier. Autour, des centaines de petites lumières reliées à lui par des fils d'or."
        apres-en:
          - "A painted sky, flaking. In the centre, the Star, whole. Around it, hundreds of small lights linked to it by golden threads."
      - type: PARLER
        texte: "Décrire le plafond à Saadi"
        texte-en: "Describe the ceiling to Saadi"
        pnj: a4_saadi
        dialogue:
