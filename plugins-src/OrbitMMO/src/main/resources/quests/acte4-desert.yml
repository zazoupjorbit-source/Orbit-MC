  a4_l_la_reine_des_sables_noirs:
    nom: "La Reine des Sables Noirs"
    nom-en: "The Queen of the Black Sands"
    faction: lumiere
    niveau: 46
    requiert: [a4_l_le_voile_de_l_hote]
    donneur: a4_ishara
    resume:
      - "La Reine des Sables Noirs garde le Tombeau du Premier Hôte."
    resume-en:
      - "The Queen of the Black Sands guards the Tomb of the First Host."
    offre:
      - "a4_ishara: Elle s'appelait Nahra. La nuit de la Chute, elle veillait au Tombeau. Quand le ciel s'est déchiré, elle a été la première à être vidée."
      - "a4_ishara: Elle n'est plus là depuis mille ans. Ne la laisse pas souffrir un jour de plus."
    offre-en:
      - "a4_ishara: Her name was Nahra. On the night of the Fall, she was keeping watch at the Tomb. When the sky tore, she was the first to be emptied."
      - "a4_ishara: She has not been there for a thousand years. Do not let her suffer one more day."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre le parvis du Tombeau"
        texte-en: "Reach the Tomb's forecourt"
        point: a4_tombeau_parvis
        rayon: 10
      - type: TUER
        texte: "Abattre les Creux des sables noirs"
        texte-en: "Destroy the Hollow of the black sands"
        monstres: [a4_creux_sable]
        nombre: 8
        point: a4_tombeau_parvis
      - type: TUER
        texte: "Vaincre la Reine des Sables Noirs"
        texte-en: "Defeat the Queen of the Black Sands"
        monstres: [a4_reine]
        point: a4_tombeau_parvis
        apres:
          - "La Reine tombe à genoux. Le sable noir quitte son corps comme une eau qui s'écoule. Une seconde, son visage redevient celui d'une femme."
          - "Elle murmure : « Il a froid. Rendez-le-lui. » Puis il ne reste que du sable, doré, ordinaire."
        apres-en:
          - "The Queen falls to her knees. The black sand leaves her body like flowing water. For a second, her face becomes a woman's again."
          - "She whispers: « It is cold. Give it back to it. » Then only sand remains, golden, ordinary."
      - type: PARLER
        texte: "Revenir voir Ishara"
        texte-en: "Return to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Nahra est libre. Mille ans à garder une porte, pour un ciel qui avait froid."
          - "a4_ishara: Il reste une chose que tu dois voir. Une seule. Après, tu choisiras."
        dialogue-en:
          - "a4_ishara: Nahra is free. A thousand years guarding a door, for a sky that was cold."
          - "a4_ishara: There is one thing left you must see. Only one. Afterwards, you will choose."
    recompenses:
      xp: 16720
      or: 1670
      objets:
        - materiau: BLACK_DYE
          nom: "Sable de la Reine"
          nom-en: "The Queen's sand"
          description:
            - "Noir quand on le serre, doré quand on le lâche."
          description-en:
            - "Black when you clench it, golden when you let go."

