      - "Saadi wants a reading taken at the exact hour the evening star sets."
    offre:
      - "a4_saadi: L'étoile du soir se couche derrière la vigie de l'ouest. Il faut y être avant elle, avec mon astrolabe. Tu as quatre minutes. Cours, ou monte."
    offre-en:
      - "a4_saadi: The evening star sets behind the western lookout. You must be there before it, with my astrolabe. You have four minutes. Run, or ride."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre la vigie de l'ouest avant le coucher de l'étoile"
        texte-en: "Reach the western lookout before the star sets"
        point: a4_ouest_vigie
        rayon: 6
        apres:
          - "L'étoile touche l'horizon. L'astrolabe s'aligne tout seul, comme s'il reconnaissait la place."
        apres-en:
          - "The star touches the horizon. The astrolabe aligns by itself, as if it recognised the spot."
        chrono: 240
        echec:
          - "a4_saadi: Trop tard. L'étoile est couchée. Reviens, on recommence demain soir. Enfin, tout de suite."
        echec-en:
