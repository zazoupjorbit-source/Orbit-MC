      - "a4_tamel: Lilah conduit la caravane de l'eau jusqu'au Puits de Sel, au sud. Les Fils du Sable l'attendent, j'en suis sûr. Marche avec elle."
      - "a4_tamel: Elle part de la porte du sud, en bas de l'Oasis."
    offre-en:
      - "a4_tamel: Lilah is leading the water caravan to the Salt Well, to the south. The Sons of the Sand are waiting for her, I am sure of it. Walk with her."
      - "a4_tamel: She leaves from the south gate, below the Oasis."
    etapes:
      - type: ESCORTE
        texte: "Escorter Lilah jusqu'au Puits de Sel"
        texte-en: "Escort Lilah to the Salt Well"
        pnj: a4_porteuse
        chemin: [a4_caravane_1, a4_caravane_2, a4_puits_sel]
        monstres: [a4_fils_sable]
        nombre: 3
        vagues: 3
        pv: 140
        degats: 5
        apres:
          - "a4_porteuse: Le Puits de Sel. Tamel dira que tu as de bonnes jambes. Chez nous, c'est un grand compliment."
        apres-en:
          - "a4_porteuse: The Salt Well. Tamel will say you have good legs. Among us, that is high praise."
      - type: PARLER
        texte: "Revenir voir Tamel"
        texte-en: "Return to Tamel"
        pnj: a4_tamel
