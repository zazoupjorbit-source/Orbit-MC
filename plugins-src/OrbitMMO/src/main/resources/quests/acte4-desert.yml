    offre-en:
      - "a4_tamel: To the north-west, at the entrance of the desert, raiders hold to ransom everything arriving from the Meadows of Auréval. My caravans pass there too."
    etapes:
      - type: TUER
        texte: "Briser le camp du nord-ouest"
        texte-en: "Break the north-western camp"
        monstres: [pillard, pillard_archer]
        nombre: 12
        point: a4_camp_h5
      - type: PARLER
        texte: "Revenir voir Tamel"
        texte-en: "Return to Tamel"
        pnj: a4_tamel
        dialogue:
          - "a4_tamel: La piste est libre. Pour une lune, peut-être deux."
        dialogue-en:
          - "a4_tamel: The track is clear. For a moon, maybe two."
    recompenses:
      xp: 9190
      or: 920

  a4_n_le_cimetiere_de_l_ouest:
    nom: "Le cimetière de l'ouest"
    nom-en: "The Western Graveyard"
    niveau: 38
    donneur: a4_hadi
