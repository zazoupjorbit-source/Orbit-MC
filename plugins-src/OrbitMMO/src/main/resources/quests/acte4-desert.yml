          - "a4_hadi: Merci. Je vais finir par te donner un surnom. Celui qui couche les morts. Ça sonne mal. J'en chercherai un autre."
        dialogue-en:
          - "a4_hadi: Thank you. I'll end up giving you a nickname. The one who puts the dead to bed. Sounds bad. I'll find another."
    recompenses:
      xp: 9700
      or: 970

  a4_n_les_pillards_des_hauts:
    nom: "Les pillards des hauts"
    nom-en: "The Highland Raiders"
