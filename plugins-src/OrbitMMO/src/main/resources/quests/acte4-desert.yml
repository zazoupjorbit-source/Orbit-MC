      - type: TUER
        texte: "Abattre les Creux du sable noir"
        texte-en: "Destroy the Hollow of the black sand"
        monstres: [a4_creux_sable]
        nombre: 8
        point: a4_reliquat
      - type: INTERAGIR
        texte: "Chercher ce qui nourrit le sable noir"
        texte-en: "Look for what feeds the black sand"
        point: a4_reliquat
        rayon: 6
        apres:
          - "Un Éclat, à moitié enterré, noirci jusqu'au cœur. Il ne brille plus : il aspire. Autour de lui, le sable gèle."
          - "Une voix minuscule, glacée : « Rendez-moi. » Tu l'arraches du sable. Il se tait."
        apres-en:
          - "A Shard, half buried, blackened to the core. It no longer shines: it draws in. Around it, the sand freezes."
          - "A tiny, freezing voice: « Give me back. » You pull it out of the sand. It falls silent."
      - type: PARLER
        texte: "Revenir voir Hadi"
        texte-en: "Return to Hadi"
        pnj: a4_hadi
        dialogue:
          - "a4_hadi: Un Éclat qui a froid. Les Marqués de l'Ombre entendent ça tout le temps, paraît-il. Je ne les envie pas."
        dialogue-en:
          - "a4_hadi: A Shard that is cold. The Marked of the Shadow hear that all the time, they say. I don't envy them."
    recompenses:
      xp: 14210
      or: 1420

