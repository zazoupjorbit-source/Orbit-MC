  a4_l_la_lettre_scellee:
    nom: "La lettre scellée"
    nom-en: "The Sealed Letter"
    faction: lumiere
    niveau: 41
    requiert: [a4_l_la_langue_des_etoiles]
    donneur: a4_aldren
    resume:
      - "Aldren veut faire passer une lettre à Vesper."
    resume-en:
      - "Aldren wants to get a letter to Vesper."
    offre:
      - "a4_aldren: J'ai écrit à Vesper. Si l'Aube et la Citadelle se battent pour le Tombeau, les Astréens mourront les premiers. Portez-lui ceci. Sans que la capitaine le voie."
    offre-en:
      - "a4_aldren: I have written to Vesper. If the Dawn and the Citadel fight over the Tomb, the Astreans will die first. Take this to her. Without the captain seeing."
    etapes:
      - type: LIVRER
        texte: "Porter la lettre à Dame Vesper"
        texte-en: "Carry the letter to Lady Vesper"
        pnj: a4_vesper
        materiau: PAPER
        objet: "Lettre d'Aldren"
        objet-en: "Aldren's letter"
        dialogue:
          - "a4_vesper: Aldren m'écrit des lettres, maintenant. Il devrait se méfier : on va finir par nous croire amis."
          - "a4_vesper: Il a raison. Dis-lui que Sarn ne bougera pas tant que je suis là. Je ne sais pas combien de temps je serai là."
        dialogue-en:
          - "a4_vesper: Aldren writes me letters now. He should be careful: people will end up thinking we are friends."
          - "a4_vesper: He is right. Tell him Sarn will not move while I am here. I do not know how long I will be here."
      - type: CHOIX
        texte: "Répondre à la capitaine Hélis"
        texte-en: "Answer Captain Hélis"
        pnj: a4_helis
        choix: a4-loyaute
        question: "Que dites-vous à Hélis ?"
        question-en: "What do you tell Hélis?"
        reponses:
          - id: capitaine
            texte: "La vérité : Aldren écrit à l'ennemi."
            texte-en: "The truth: Aldren writes to the enemy."
            reponse:
              - "a4_helis: Je le savais. Le Bastion saura récompenser votre loyauté. Aldren, lui, rentrera sous escorte."
            reponse-en:
              - "a4_helis: I knew it. The Bastion will know how to reward your loyalty. Aldren will go home under escort."
            or: 400
          - id: envoye
            texte: "Rien : j'achetais des dattes."
            texte-en: "Nothing: I was buying dates."
            reponse:
              - "a4_helis: Des dattes. Bien sûr. Je vous ai à l'œil, Marqué."
            reponse-en:
              - "a4_helis: Dates. Of course. I have my eye on you, Marked."
            xp: 3980
        dialogue:
          - "a4_helis: On vous a vu entrer chez l'envoyée de la Citadelle avec un papier. Ne me mentez pas : que trame le chevalier Aldren ?"
        dialogue-en:
          - "a4_helis: You were seen going into the Citadel envoy's tent with a paper. Do not lie to me: what is Sir Aldren plotting?"
      - type: PARLER
        texte: "Revenir voir Aldren"
        texte-en: "Return to Aldren"
        pnj: a4_aldren
        dialogue:
          - "a4_aldren: Hélis m'a fait savoir que je rentrerai au Bastion à la fin de la lune. Sous escorte."
          - "a4_aldren: Vous avez fait votre devoir. Je ne vous en veux pas. Pas beaucoup."
        dialogue-en:
          - "a4_aldren: Hélis has let me know I will return to the Bastion at the end of the moon. Under escort."
          - "a4_aldren: You did your duty. I do not hold it against you. Not much."
        si: "a4-loyaute=capitaine"
      - type: PARLER
        texte: "Revenir voir Aldren"
        texte-en: "Return to Aldren"
        pnj: a4_aldren
        dialogue:
          - "a4_aldren: Hélis vous a interrogé, et vous n'avez rien dit."
          - "a4_aldren: Merci. Il y a des loyautés qui ne portent pas de bannière."
        dialogue-en:
          - "a4_aldren: Hélis questioned you, and you said nothing."
          - "a4_aldren: Thank you. Some loyalties carry no banner."
        si: "a4-loyaute=envoye"
    recompenses:
      xp: 13280
      or: 1330

  a4_o_la_lettre_scellee:
    nom: "La lettre scellée"
    nom-en: "The Sealed Letter"
    faction: ombre
    niveau: 41
    requiert: [a4_o_la_langue_des_etoiles]
    donneur: a4_vesper
    resume:
      - "Vesper veut faire passer une lettre à Aldren."
    resume-en:
      - "Vesper wants to get a letter to Aldren."
    offre:
      - "a4_vesper: J'ai écrit à Aldren. Si nos deux armées se battent pour le Tombeau, les nomades seront écrasés entre les deux. Porte-lui ça. Et que Sarn ne le voie pas."
    offre-en:
      - "a4_vesper: I have written to Aldren. If our two armies fight over the Tomb, the nomads will be crushed between them. Take this to him. And do not let Sarn see it."
    etapes:
      - type: LIVRER
        texte: "Porter la lettre au chevalier Aldren"
        texte-en: "Carry the letter to Sir Aldren"
        pnj: a4_aldren
        materiau: PAPER
        objet: "Lettre de Vesper"
        objet-en: "Vesper's letter"
        dialogue:
          - "a4_aldren: Une lettre de Vesper. Elle écrit comme elle se bat : sans un mot de trop."
          - "a4_aldren: Dites-lui qu'Hélis ne bougera pas tant que je serai là. Et que je ne sais pas combien de temps on me laissera ici."
        dialogue-en:
          - "a4_aldren: A letter from Vesper. She writes the way she fights: not a word too many."
          - "a4_aldren: Tell her Hélis will not move while I am here. And that I do not know how long they will leave me here."
      - type: CHOIX
        texte: "Répondre à Sarn"
        texte-en: "Answer Sarn"
        pnj: a4_sarn
        choix: a4-loyaute
        question: "Que dites-vous à Sarn ?"
        question-en: "What do you tell Sarn?"
        reponses:
          - id: capitaine
            texte: "La vérité : Vesper écrit à l'ennemi."
            texte-en: "The truth: Vesper writes to the enemy."
            reponse:
              - "a4_sarn: Bien. Vharos aime les chiens qui mordent la bonne main. Vesper rentrera à la Citadelle, et elle n'en ressortira pas de sitôt."
            reponse-en:
              - "a4_sarn: Good. Vharos likes hounds that bite the right hand. Vesper will go back to the Citadel, and she will not come out again soon."
            or: 400
          - id: envoye
            texte: "Rien : j'achetais des dattes."
            texte-en: "Nothing: I was buying dates."
            reponse:
              - "a4_sarn: Des dattes. Tu mens mal. Un jour, ça te coûtera cher."
            reponse-en:
              - "a4_sarn: Dates. You lie badly. One day, it will cost you dearly."
            xp: 3980
        dialogue:
          - "a4_sarn: On t'a vu entrer chez le chevalier de l'Aube avec une lettre. Vesper trahit, ou tu trahis ? Choisis bien."
        dialogue-en:
          - "a4_sarn: You were seen going into the Dawn knight's tent with a letter. Is Vesper betraying us, or are you? Choose well."
      - type: PARLER
        texte: "Revenir voir Vesper"
        texte-en: "Return to Vesper"
        pnj: a4_vesper
        dialogue:
          - "a4_vesper: Sarn m'a fait porter un message : je rentre à la Citadelle à la fin de la lune."
          - "a4_vesper: Tu as choisi ton camp. C'est ce qu'on t'a appris. Je ne t'en veux pas. Pas beaucoup."
        dialogue-en:
          - "a4_vesper: Sarn sent me a message: I go back to the Citadel at the end of the moon."
          - "a4_vesper: You chose your side. That is what you were taught. I do not hold it against you. Not much."
        si: "a4-loyaute=capitaine"
      - type: PARLER
        texte: "Revenir voir Vesper"
        texte-en: "Return to Vesper"
        pnj: a4_vesper
        dialogue:
          - "a4_vesper: Sarn t'a cuisiné, et tu lui as parlé de dattes."
          - "a4_vesper: Je n'oublierai pas. À la Citadelle, c'est une promesse qui vaut cher."
        dialogue-en:
          - "a4_vesper: Sarn grilled you, and you talked to him about dates."
          - "a4_vesper: I will not forget. At the Citadel, that is a costly promise."
        si: "a4-loyaute=envoye"
    recompenses:
      xp: 13280
      or: 1330

  a4_l_le_chant_de_naim:
    nom: "Le chant de Naïm"
    nom-en: "Naïm's Song"
    faction: lumiere
    niveau: 42
    requiert: [a4_l_la_lettre_scellee]
    donneur: a4_ishara
    resume:
      - "Naïm est parti seul vers le Tombeau du Premier Hôte."
    resume-en:
      - "Naïm has gone alone toward the Tomb of the First Host."
    offre:
      - "a4_ishara: Naïm est parti cette nuit. Il veut voir le Tombeau de ses propres yeux, et le sable noir qui en sort. Il a seize ans."
      - "a4_ishara: Ses traces partent au sud-est de l'Oasis. Ramène-le."
    offre-en:
      - "a4_ishara: Naïm left last night. He wants to see the Tomb with his own eyes, and the black sand coming out of it. He is sixteen."
      - "a4_ishara: His tracks lead south-east of the Oasis. Bring him back."
    etapes:
      - type: PISTER
        texte: "Suivre les traces de Naïm"
        texte-en: "Follow Naïm's tracks"
        traces: [a4_naim_1, a4_naim_2, a4_naim_3, a4_cuvette]
        apres:
          - "Les traces finissent au fond d'une cuvette. Le sable y est noir et froid. Il bouge."
        apres-en:
          - "The tracks end at the bottom of a hollow. The sand there is black and cold. It moves."
      - type: SURVIE
        texte: "Tenir dans la tempête de sable noir"
        texte-en: "Hold out in the black sandstorm"
        point: a4_cuvette
        rayon: 14
        duree: 45
        mode: resserre
        rayon-fin: 5
        degats: 5
        monstres: [a4_creux_sable]
        nombre: 2
        intervalle: 15
        apres:
          - "La tempête retombe d'un coup. Sous le sable, à tes pieds, un voile ocre : Naïm, sonné, vivant. Il se relève et file vers l'Oasis sans un mot."
        apres-en:
          - "The storm drops all at once. Under the sand, at your feet, an ochre veil: Naïm, dazed, alive. He gets up and runs off toward the Oasis without a word."
      - type: PARLER
        texte: "Retrouver Naïm à l'Oasis"
        texte-en: "Find Naïm at the Oasis"
        pnj: a4_naim
        dialogue:
          - "a4_naim: Je l'ai vue. Une femme, au bord du Tombeau. Une Astréenne. Mais vide. Le sable noir lui coulait des mains."
          - "a4_naim: Les vieux disent que c'est la Reine. La première d'entre nous à avoir été vidée, la nuit de la Chute. Elle garde le Tombeau depuis. Pour qui, personne ne sait."
          - "a4_naim: Merci. Ne le dis pas à Ishara. Elle le sait déjà, de toute façon."
        dialogue-en:
          - "a4_naim: I saw her. A woman, at the edge of the Tomb. An Astrean. But empty. Black sand was pouring from her hands."
          - "a4_naim: The elders say it is the Queen. The first of us to be emptied, on the night of the Fall. She has guarded the Tomb ever since. For whom, nobody knows."
          - "a4_naim: Thank you. Do not tell Ishara. She knows already, anyway."
    recompenses:
      xp: 13940
      or: 1395

