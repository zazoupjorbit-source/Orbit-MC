  a4_l_le_siege_du_puits:
    nom: "Le siège du puits"
    nom-en: "The Siege of the Well"
    faction: lumiere
    niveau: 44
    requiert: [a4_l_le_chant_de_naim]
    donneur: a4_ishara
    resume:
      - "Des Lames de la Citadelle marchent sur le Puits des Hôtes."
    resume-en:
      - "Blades of the Citadel are marching on the Hosts' Well."
    offre:
      - "a4_ishara: Des soldats de la Citadelle marchent sur le Puits des Hôtes, à l'ouest. Ils prendront l'eau tant que nous ne rendrons pas l'Éclat."
      - "a4_ishara: Ce n'est pas ton camp. Tu peux te battre contre eux sans te renier. Tiens le puits."
    offre-en:
      - "a4_ishara: Citadel soldiers are marching on the Hosts' Well, to the west. They will take the water until we give back the Shard."
      - "a4_ishara: It is not your side. You can fight them without betraying yourself. Hold the well."
    etapes:
      - type: DEFENSE
        texte: "Défendre le Puits des Hôtes"
        texte-en: "Defend the Hosts' Well"
        point: a4_puits_hotes
        monstres: [a4_lame_ombre]
        nombre: 3
        vagues: 4
        apparition: a4_puits_assaut
        pv: 200
        degats: 5
        cible: "Le Puits des Hôtes"
        cible-en: "The Hosts' Well"
        apres:
          - "Les derniers soldats de la Citadelle reculent dans les dunes. L'un d'eux a laissé tomber un ordre : « Prendre le puits de l'ouest. Le Bastion prendra celui de l'est. — V. »"
        apres-en:
          - "The last Citadel soldiers fall back into the dunes. One of them dropped an order: « Take the western well. The Bastion will take the eastern one. — V. »"
      - type: PARLER
        texte: "Revenir voir Ishara"
        texte-en: "Return to Ishara"
        pnj: a4_ishara
        dialogue:
          - "a4_ishara: Ils assiègent ensemble, chacun de son côté. Et demain, ils diront qu'ils se battaient l'un contre l'autre."
          - "a4_ishara: Il est temps que tu voies le Tombeau. Pas pour le prendre. Pour comprendre."
        dialogue-en:
          - "a4_ishara: They besiege us together, each from his own side. And tomorrow, they will say they were fighting each other."
          - "a4_ishara: It is time you saw the Tomb. Not to take it. To understand."
    recompenses:
      xp: 15290
      or: 1530

