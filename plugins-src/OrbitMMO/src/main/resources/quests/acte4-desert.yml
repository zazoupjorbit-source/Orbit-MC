      - "A tower to the south held the last Host reader's astrolabe."
    offre:
      - "a4_saadi: Le dernier lecteur des Hôtes vivait dans une tour, tout au sud. Ses morts la gardent encore. S'il reste son astrolabe, il te revient."
    offre-en:
      - "a4_saadi: The last reader of the Hosts lived in a tower, far to the south. His dead still guard it. If his astrolabe remains, it is yours."
    etapes:
      - type: TUER
