          - "a4_yared: Dis à Oumaya que je marcherai avec des bottes. Des bottes de l'Aube, s'il le faut. Elles sont plus solides que leurs promesses."
        dialogue-en:
          - "a4_yared: It burns. It burns a lot. … It burns less."
