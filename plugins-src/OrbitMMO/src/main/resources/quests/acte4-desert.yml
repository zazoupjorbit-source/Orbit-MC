  a4_n_le_pillard_repenti:
    nom: "Le pillard repenti"
    nom-en: "The Repentant Raider"
    niveau: 39
    donneur: a4_kesh
    resume:
      - "Un ancien Fils du Sable demande qu'on l'écoute."
    resume-en:
      - "A former Son of the Sand asks to be heard."
    offre:
      - "a4_kesh: Tu as une tête à écouter. Je n'en vois pas beaucoup, ici."
    offre-en:
      - "a4_kesh: You have a face that listens. I do not see many here."
    etapes:
      - type: CHOIX
        texte: "Écouter Kesh"
        texte-en: "Listen to Kesh"
        pnj: a4_kesh
        choix: a4-kesh
        question: "Que faites-vous de Kesh ?"
        question-en: "What do you do with Kesh?"
        reponses:
          - id: croire
            texte: "Je te crois. Où est ton frère ?"
            texte-en: "I believe you. Where is your brother?"
            reponse:
              - "a4_kesh: Au repaire de l'ouest, derrière les dunes rouges. Ils sont nombreux. Il faudra passer sans être vu."
            reponse-en:
              - "a4_kesh: At the western hideout, beyond the red dunes. There are many of them. You will have to get through unseen."
            xp: 2400
          - id: livrer
            texte: "Tamel doit savoir qui tu es."
            texte-en: "Tamel must know who you are."
            reponse:
              - "a4_kesh: … Oui. C'est juste. Dis-lui que le repaire est à l'ouest, derrière les dunes rouges. Qu'il en fasse ce qu'il veut. De moi aussi."
            reponse-en:
              - "a4_kesh: … Yes. That is fair. Tell him the hideout is to the west, beyond the red dunes. Let him do what he wants with it. With me too."
            or: 240
        dialogue:
          - "a4_kesh: J'étais un Fils du Sable. J'ai vendu des caravanes astréennes aux deux camps. Je savais par où passait l'eau."
          - "a4_kesh: Je suis parti. Mon frère Rami, lui, est resté. Ils le gardent en cage, pour que je me taise."
        dialogue-en:
          - "a4_kesh: I was a Son of the Sand. I sold Astrean caravans to both sides. I knew which way the water went."
          - "a4_kesh: I left. My brother Rami stayed. They keep him in a cage, so that I will keep quiet."
      - type: PARLER
        texte: "Rassurer Kesh"
        texte-en: "Reassure Kesh"
        pnj: a4_kesh
        dialogue:
          - "a4_kesh: Si tu ramènes Rami, je te devrai plus que ma vie. Elle ne vaut pas grand-chose, mais c'est tout ce que j'ai."
        dialogue-en:
          - "a4_kesh: If you bring Rami back, I'll owe you more than my life. It isn't worth much, but it's all I have."
        si: "a4-kesh=croire"
      - type: PARLER
        texte: "Tout raconter à Tamel"
        texte-en: "Tell Tamel everything"
        pnj: a4_tamel
        dialogue:
          - "a4_tamel: Kesh. Je l'ai nourri trois hivers. Et il vendait mes caravanes."
          - "a4_tamel: Chez nous, on ne tue pas un homme qui avoue. On le chasse. Mais d'abord, on brûle son ancien repaire."
        dialogue-en:
          - "a4_tamel: Kesh. I fed him for three winters. And he was selling my caravans."
          - "a4_tamel: Among us, you do not kill a man who confesses. You drive him out. But first, you burn his old hideout."
        si: "a4-kesh=livrer"
    recompenses:
      xp: 10210
      or: 1020

