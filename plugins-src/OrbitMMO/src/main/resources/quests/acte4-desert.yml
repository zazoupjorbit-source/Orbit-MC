      or: 1240
      objets:
        - materiau: WRITABLE_BOOK
          nom: "Registre des Fils du Sable"
          nom-en: "Ledger of the Sons of the Sand"
          description:
            - "Deux colonnes, deux camps, les mêmes dates."
          description-en:
            - "Two columns, two sides, the same dates."

