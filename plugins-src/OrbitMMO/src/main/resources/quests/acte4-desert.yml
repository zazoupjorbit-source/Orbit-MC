# ------------------------------------------------------------------
#  Acte IV — Le Désert d'Ocre : « Le sable noir » (niv. 34 à 48). Hub neutre : l'Oasis d'Ambre.
#  Principales Lumière (a4_l_*) et Ombre (a4_o_*), annexes neutres (a4_n_*), contrats répétables du tableau (a4_c_*).
#  FICHIER GÉNÉRÉ par tools\quetes\gen-quetes.js depuis tools\quetes\zones\acte4-desert.js : modifier la source, pas ce fichier.
# ------------------------------------------------------------------

pnj:
  a4_ishara:
    nom: "Ishara"
    titre: "Gardienne de l'Oasis"
    titre-en: "Keeper of the Oasis"
    couleur: "#E8B45A"
    type: MANNEQUIN
    visage: sunny
    point: a4_ishara
    repliques:
      - "L'Astre se posait ici. Nous l'accueillions. Nous ne l'avons jamais retenu."
    repliques-en:
      - "The Star used to come down here. We welcomed it. We never held it back."
  a4_tamel:
    nom: "Tamel"
    titre: "Maître caravanier"
    titre-en: "Caravan master"
    couleur: "#D9A066"
    type: MANNEQUIN
    visage: kai
    point: a4_tamel
    main: LEAD
    repliques:
      - "Une caravane, c'est de l'eau qui marche. Si elle s'arrête, tout le monde a soif."
    repliques-en:
      - "A caravan is water that walks. If it stops, everyone goes thirsty."
  a4_saadi:
    nom: "Saadi"
    titre: "Lecteur des étoiles"
    titre-en: "Star reader"
    couleur: "#9FC8FF"
    type: MANNEQUIN
    visage: efe
    point: a4_saadi
    main: SPYGLASS
    repliques:
      - "Nos ancêtres n'écrivaient pas. Ils regardaient. Le ciel était leur livre."
    repliques-en:
      - "Our ancestors did not write. They watched. The sky was their book."
  a4_naim:
    nom: "Naïm"
    titre: "Éclaireur astréen"
    titre-en: "Astrean scout"
    couleur: "#F2D08A"
    type: MANNEQUIN
    visage: ari
    point: a4_naim
    main: BOW
    repliques:
      - "Je cours plus vite que le vent des dunes. Presque."
    repliques-en:
      - "I run faster than the dune wind. Almost."
  a4_oumaya:
    nom: "Oumaya"
    titre: "Herboriste"
    titre-en: "Herbalist"
    couleur: "#B7D98B"
    type: MANNEQUIN
    visage: makena
    point: a4_oumaya
    repliques:
      - "Dans le désert, tout pique, tout mord, et tout soigne. Il suffit de savoir quoi."
    repliques-en:
      - "In the desert, everything stings, everything bites, and everything heals. You only need to know which."
  a4_kesh:
    nom: "Kesh"
    titre: "Ancien pillard"
    titre-en: "Former raider"
    couleur: "#A0826D"
    type: MANNEQUIN
    visage: steve
    point: a4_kesh
    main: IRON_SWORD
    repliques:
      - "Ne me regarde pas comme ça. Je regarde déjà assez mal mon reflet."
    repliques-en:
      - "Don't look at me like that. I already look badly enough at my reflection."
  a4_djanel:
    nom: "Djanel"
    titre: "Tableau des contrats"
    titre-en: "Contract board"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: alex
    point: a4_djanel
    main: PAPER
    repliques:
      - "Chaque jour, le désert a besoin de bras. Revenez demain : il en aura encore besoin."
    repliques-en:
      - "Every day, the desert needs hands. Come back tomorrow: it will still need them."
  a4_aldren:
    nom: "Chevalier Aldren"
    nom-en: "Sir Aldren"
    titre: "Envoyé de l'Aube"
    titre-en: "Envoy of the Dawn"
    couleur: "#F7E7A1"
    type: MANNEQUIN
    visage: steve
    point: a4_aldren
    main: GOLDEN_SWORD
    repliques:
      - "On m'a offert de l'eau et rien d'autre. Ici, c'est presque une déclaration de guerre."
    repliques-en:
      - "I was offered water and nothing else. Here, that's almost a declaration of war."
  a4_vesper:
    nom: "Dame Vesper"
    nom-en: "Lady Vesper"
    titre: "Envoyée de la Citadelle"
    titre-en: "Envoy of the Citadel"
    couleur: "#B48CFF"
    type: MANNEQUIN
    visage: noor
    point: a4_vesper
    main: NETHERITE_SWORD
    repliques:
      - "Le sable entre partout. Même dans les secrets."
    repliques-en:
      - "Sand gets in everywhere. Even into secrets."
  a4_helis:
    nom: "Capitaine Hélis"
    nom-en: "Captain Hélis"
    titre: "Lames du Bastion"
    titre-en: "Blades of the Bastion"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: makena
    point: a4_helis
    main: GOLDEN_SWORD
    repliques:
      - "La Haute-Prélate veut l'Éclat. Les sentiments, je les laisse au chevalier Aldren."
    repliques-en:
      - "The High Prelate wants the Shard. I leave feelings to Sir Aldren."
  a4_sarn:
    nom: "Sarn"
    titre: "Lame de la Citadelle"
    titre-en: "Blade of the Citadel"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: efe
    point: a4_sarn
    main: NETHERITE_AXE
    repliques:
      - "Vharos ne demande pas deux fois. Moi non plus."
    repliques-en:
      - "Vharos does not ask twice. Neither do I."
  a4_morvain:
    nom: "Morvain"
    titre: "Chevalier noir"
    titre-en: "Black Knight"
    couleur: "#9A8CB8"
    type: MANNEQUIN
    visage: zuri
    point: a4_morvain
    main: NETHERITE_SWORD
    repliques:
      - "Le sable oublie vite. Les pierres, non."
    repliques-en:
      - "Sand forgets quickly. Stones do not."
  a4_porteuse:
    nom: "Lilah"
    titre: "Porteuse d'eau"
    titre-en: "Water bearer"
    couleur: "#E3C48C"
    type: MANNEQUIN
    visage: noor
    point: a4_caravane_depart
    repliques:
      - "Les jarres sont pleines. Il ne manque que quelqu'un pour marcher à côté."
    repliques-en:
      - "The jars are full. All that is missing is someone to walk beside them."
  a4_yared:
    nom: "Yared"
    titre: "Caravanier blessé"
    titre-en: "Wounded caravaneer"
    couleur: "#C9A27A"
    type: MANNEQUIN
    visage: kai
    point: a4_bivouac
    repliques:
      - "Un scorpion. Un seul. Et me voilà couché depuis trois jours."
    repliques-en:
      - "A scorpion. Just one. And here I've been lying for three days."
  a4_hadi:
    nom: "Hadi"
    titre: "Vigie astréenne"
    titre-en: "Astrean lookout"
    couleur: "#E0B870"
    type: MANNEQUIN
    visage: ari
    point: a4_vigie
    main: SPYGLASS
    repliques:
      - "D'ici, je vois tout ce qui vient de l'est. Ces temps-ci, il en vient beaucoup."
    repliques-en:
      - "From here, I see everything that comes from the east. These days, a lot comes."

