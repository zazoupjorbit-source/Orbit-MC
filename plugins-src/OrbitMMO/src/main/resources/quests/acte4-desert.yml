      - "Un cimetière s'agite au nord-ouest de l'Oasis."
    resume-en:
      - "A graveyard is stirring north-west of the Oasis."
    offre:
      - "a4_hadi: Au nord-ouest, encore un cimetière. Je ne sais pas ce que le ciel a fait aux morts du désert, mais ils n'arrivent plus à dormir."
    offre-en:
      - "a4_hadi: To the north-west, another graveyard. I do not know what the sky did to the desert's dead, but they can no longer sleep."
    etapes:
      - type: TUER
