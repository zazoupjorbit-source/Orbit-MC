      - "Des pillards tiennent un plateau au sud-ouest."
    resume-en:
      - "Raiders hold a plateau to the south-west."
    offre:
      - "a4_tamel: Sur le plateau du sud-ouest, un camp de pillards guette les deux routes à la fois. Ce sont eux qui ont pris la caravane de Yared."
