  a4_l_la_fresque_du_premier_hote:
    nom: "La fresque du Premier Hôte"
    nom-en: "The Fresco of the First Host"
    faction: lumiere
    niveau: 47
    requiert: [a4_l_la_reine_des_sables_noirs]
    donneur: a4_ishara
    resume:
      - "Au cœur du Tombeau, une fresque attend depuis mille ans."
    resume-en:
      - "At the heart of the Tomb, a fresco has waited a thousand years."
    offre:
      - "a4_ishara: Il y a une fresque, au seuil du Tombeau, sous le sable que gardait Nahra. Je ne l'ai jamais montrée à personne de l'Aube ou de l'Ombre."
    offre-en:
      - "a4_ishara: There is a fresco at the threshold of the Tomb, under the sand Nahra guarded. I have never shown it to anyone of the Dawn or the Shadow."
    etapes:
      - type: INTERAGIR
        texte: "Regarder la fresque du Premier Hôte"
        texte-en: "Look at the fresco of the First Host"
        point: a4_fresque
        rayon: 5
        apres:
          - "Le sable noir parti, la pierre montre un homme en habit d'Hôte, ocre et or, les mains tendues vers l'Astre. Autour de ses poignets, déjà, des anneaux de lumière."
          - "Sous ses pieds, son nom, que personne n'a pu marteler ici : Aurélien."
          - "Aurélien le Premier. Le fondateur de l'Aube. Un Hôte, qui a trahi son peuple parce qu'il ne supportait pas de voir l'Astre repartir. Ton Ordre est né ici, d'une trahison."
        apres-en:
          - "With the black sand gone, the stone shows a man in Host's garb, ochre and gold, hands held out toward the Star. Around his wrists, already, rings of light."
          - "Beneath his feet, his name, which nobody could hammer away here: Aurélien."
          - "Aurélien the First. The founder of the Dawn. A Host, who betrayed his people because he could not bear to see the Star leave. Your Order was born here, of a betrayal."
      - type: PARLER
        texte: "Parler au chevalier qui attend au bord des dunes"
        texte-en: "Talk to the knight waiting at the edge of the dunes"
        pnj: a4_morvain
        dialogue:
          - "a4_morvain: Vous l'avez vue. Je connais cette fresque. Je connais ce visage, mieux que je ne voudrais."
          - "a4_morvain: Il disait qu'aimer quelque chose, c'est l'empêcher de partir. Il avait tort. Il m'a fallu longtemps pour en être sûr."
          - "a4_morvain: Le Tombeau garde l'Éclat-Cœur. Les Astréens le garderont mieux que vos chefs. Réfléchissez à ce que vous allez dire chez vous."
        dialogue-en:
          - "a4_morvain: You saw it. I know that fresco. I know that face, better than I would like."
          - "a4_morvain: He used to say that to love something is to stop it from leaving. He was wrong. It took me a long time to be sure."
          - "a4_morvain: The Tomb keeps the Heart-Shard. The Astreans will keep it better than your leaders. Think about what you will say back home."
    recompenses:
      xp: 17450
      or: 1745

