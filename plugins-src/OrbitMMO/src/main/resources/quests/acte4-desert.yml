  a4_l_l_or_des_deux_camps:
    nom: "L'or des deux camps"
    nom-en: "Gold from Both Sides"
    faction: lumiere
    niveau: 38
    requiert: [a4_l_les_ordres]
    donneur: a4_tamel
    resume:
      - "Des pillards attaquent les caravanes astréennes."
    resume-en:
      - "Raiders are attacking the Astrean caravans."
    offre:
      - "a4_tamel: Trois caravanes perdues en dix jours. Les pillards savent où nous passons. Quelqu'un les renseigne, et quelqu'un les paie."
      - "a4_tamel: Leur camp est au nord, sur la route des dunes. Va voir qui signe leurs gages."
    offre-en:
      - "a4_tamel: Three caravans lost in ten days. The raiders know where we pass. Someone is informing them, and someone is paying them."
      - "a4_tamel: Their camp is to the north, on the dune road. Go and see who signs their wages."
    etapes:
      - type: TUER
        texte: "Briser le camp des pillards au nord"
        texte-en: "Break the raiders' camp to the north"
        monstres: [pillard, pillard_archer]
        nombre: 12
        point: a4_pillards_h3
      - type: INTERAGIR
        texte: "Fouiller le coffre des pillards"
        texte-en: "Search the raiders' chest"
        point: a4_pillards_h3
        rayon: 6
        apres:
          - "Deux bourses. L'une pleine de pièces d'or frappées du soleil du Bastion. L'autre pleine d'éclats noirs taillés, la monnaie de la Citadelle."
          - "Et un ordre, sans signature : « Faire peur aux nomades. Qu'ils rendent ce qu'ils cachent. »"
        apres-en:
          - "Two purses. One full of gold coins struck with the Bastion's sun. The other full of cut black shards, the Citadel's currency."
          - "And an order, unsigned: « Frighten the nomads. Make them give back what they are hiding. »"
      - type: PARLER
        texte: "Montrer les bourses à Tamel"
        texte-en: "Show the purses to Tamel"
        pnj: a4_tamel
        dialogue:
          - "a4_tamel: L'or du soleil et les pierres de la nuit. Les deux camps paient les mêmes chiens."
          - "a4_tamel: Ton Ordre veut nous faire peur. Il nous connaît mal : nous avons survécu à la Chute."
        dialogue-en:
          - "a4_tamel: The sun's gold and the night's stones. Both sides pay the same dogs."
          - "a4_tamel: Your Order wants to frighten us. It knows us poorly: we survived the Fall."
    recompenses:
      xp: 11410
      or: 1140

