        apres:
          - "Des jarres, des tapis, et un petit coffret au nom de Yared. Dedans, une seule chose : un dessin d'enfant."
        apres-en:
          - "Jars, rugs, and a small box with Yared's name on it. Inside, a single thing: a child's drawing."
      - type: PARLER
        texte: "Revenir voir Tamel"
        texte-en: "Return to Tamel"
        pnj: a4_tamel
        dialogue:
          - "a4_tamel: Le dessin de sa fille. Il serait reparti le chercher avec une jambe en moins. Merci pour lui."
        dialogue-en:
          - "a4_tamel: His daughter's drawing. He'd have gone back for it with one leg less. Thank you for him."
    recompenses:
      xp: 11850
      or: 1185

  a4_n_les_pillards_du_grand_sud:
    nom: "Les pillards du grand sud"
    nom-en: "The Deep South Raiders"
    niveau: 45
    requiert: [a4_n_les_pillards_des_hauts]
    donneur: a4_tamel
    resume:
      - "Le dernier grand camp de pillards se cache tout au sud."
    resume-en:
      - "The last great raider camp hides in the far south."
    offre:
      - "a4_tamel: Tout au sud, le dernier grand camp. Celui-là, c'est le bras droit de leur chef qui le tient. Après lui, les Fils du Sable ne seront plus qu'une histoire qu'on raconte aux enfants."
    offre-en:
      - "a4_tamel: Far to the south, the last great camp. That one is held by their chief's right hand. After him, the Sons of the Sand will be nothing but a story told to children."
    etapes:
      - type: TUER
        texte: "Détruire le camp du grand sud"
        texte-en: "Destroy the deep south camp"
        monstres: [pillard, pillard_archer]
        nombre: 14
        point: a4_camp_h7
      - type: PARLER
        texte: "Revenir voir Tamel"
        texte-en: "Return to Tamel"
        pnj: a4_tamel
        dialogue:
          - "a4_tamel: C'est fini. Pour la première fois depuis dix ans, une caravane peut traverser le désert sans gardes."
          - "a4_tamel: Tu as une place dans toutes mes caravanes. À vie."
        dialogue-en:
          - "a4_tamel: It is over. For the first time in ten years, a caravan can cross the desert without guards."
          - "a4_tamel: You have a place in all my caravans. For life."
    recompenses:
      xp: 13600
      or: 1360
      objets:
        - materiau: GOLD_INGOT
          nom: "Or d'ocre"
          nom-en: "Ochre gold"
          description:
            - "Le tribut des caravanes de Tamel."
          description-en:
            - "The tribute of Tamel's caravans."

  a4_n_l_epave:
    nom: "L'épave de la caravane"
    nom-en: "The Caravan Wreck"
    niveau: 40
    donneur: a4_djanel
    resume:
      - "Une caravane a disparu au nord-est du désert."
    resume-en:
      - "A caravan has disappeared in the north-east of the desert."
    offre:
      - "a4_djanel: Une caravane partie vers les Quatre-Vents n'est jamais arrivée. Elle a dû s'arrêter au nord-est. Trouve-la, et dis-moi ce qui l'a arrêtée."
    offre-en:
      - "a4_djanel: A caravan bound for the Four Winds never arrived. It must have stopped in the north-east. Find it, and tell me what stopped it."
    etapes:
      - type: ENQUETE
        texte: "Comprendre ce qui est arrivé à la caravane"
        texte-en: "Understand what happened to the caravan"
        pnj: a4_djanel
        indices:
          - point: a4_epave
            texte: "Le chariot renversé"
            texte-en: "The overturned cart"
            apres:
              - "Le chariot est intact. Rien n'a été volé. Les jarres sont pleines."
            apres-en:
              - "The cart is intact. Nothing was stolen. The jars are full."
          - point: a4_ruine_h3
            texte: "Les traces vers la chapelle"
            texte-en: "The tracks toward the chapel"
            apres:
              - "Des pas de caravaniers, réguliers, sans hâte, jusqu'à la chapelle. Ils sont venus ici de leur plein gré."
            apres-en:
              - "Caravaneers' footsteps, steady, unhurried, up to the chapel. They came here of their own free will."
          - point: a4_camp_h4
            texte: "Le cimetière voisin"
            texte-en: "The nearby graveyard"
            apres:
              - "Des tombes fraîches, creusées avec soin, par les caravaniers eux-mêmes, pour leurs propres morts. Puis ils sont repartis vers l'est."
            apres-en:
              - "Fresh graves, carefully dug, by the caravaneers themselves, for their own dead. Then they set off east."
        dialogue:
          - "joueur: Personne ne les a attaqués. Ils ont enterré leurs morts, laissé l'eau, et sont partis vers l'est."
          - "a4_djanel: Vers l'est… Vers les camps de l'Aube et de l'Ombre. Ils sont allés s'engager. Le désert perd ses enfants à cette guerre."
        dialogue-en:
          - "joueur: Nobody attacked them. They buried their dead, left the water, and went east."
          - "a4_djanel: East… Toward the camps of the Dawn and the Shadow. They went to enlist. The desert is losing its children to this war."
    recompenses:
      xp: 10740
      or: 1075

