  a4_l_la_langue_des_etoiles:
    nom: "La langue des étoiles"
    nom-en: "The Language of the Stars"
    faction: lumiere
    niveau: 40
    requiert: [a4_l_la_caravane_de_l_eau]
    donneur: a4_saadi
    resume:
      - "Saadi veut apprendre au Marqué la langue des étoiles."
    resume-en:
      - "Saadi wants to teach the Marked the language of the stars."
    offre:
      - "a4_saadi: Les Hôtes n'écrivaient pas avec des lettres. Ils gravaient le ciel. Trois stèles t'attendent au nord, dans le cercle de pierres. Lis-les."
      - "a4_saadi: Après, tu sauras ce que tu demandes quand tu demandes l'Éclat."
    offre-en:
      - "a4_saadi: The Hosts did not write with letters. They carved the sky. Three steles await you to the north, in the stone circle. Read them."
      - "a4_saadi: Afterwards, you will know what you are asking for when you ask for the Shard."
    etapes:
      - type: ENQUETE
        texte: "Lire les trois stèles"
        texte-en: "Read the three steles"
        pnj: a4_saadi
        indices:
          - point: a4_stele_1
            texte: "La stèle de l'Astre qui descend"
            texte-en: "The stele of the descending Star"
            apres:
              - "Un astre, et sous lui des silhouettes aux bras ouverts. Le signe sous l'astre se lit « invité »."
            apres-en:
              - "A star, and beneath it figures with open arms. The sign beneath the star reads « guest »."
          - point: a4_stele_2
            texte: "La stèle du départ"
            texte-en: "The stele of the departure"
            apres:
              - "L'astre remonte. Les silhouettes saluent. Le signe se lit « il repart, et c'est bien »."
            apres-en:
              - "The star rises again. The figures wave. The sign reads « it leaves, and that is good »."
          - point: a4_stele_3
            texte: "La stèle martelée"
            texte-en: "The hammered stele"
            apres:
              - "Une seule silhouette tend une chaîne vers l'astre. Le reste de la pierre a été martelé, il y a très longtemps."
            apres-en:
              - "A single figure holds out a chain toward the star. The rest of the stone was hammered away, a very long time ago."
        dialogue:
          - "a4_saadi: Invité. Il repart, et c'est bien. Et la troisième, martelée par nos propres ancêtres."
          - "a4_saadi: Nous étions les Hôtes. L'Astre descendait se poser chez nous, puis il repartait. Nous ne l'avons jamais retenu."
          - "a4_saadi: Un seul l'a voulu pour lui. Nous ne disons pas son nom. Nous l'avons effacé de la pierre."
        dialogue-en:
          - "a4_saadi: Guest. It leaves, and that is good. And the third, hammered by our own ancestors."
          - "a4_saadi: We were the Hosts. The Star came down to rest among us, then it left again. We never held it back."
          - "a4_saadi: Only one wanted it for himself. We do not say his name. We erased it from the stone."
    recompenses:
      xp: 12640
      or: 1265
      objets:
        - materiau: MAP
          nom: "Ciel des Hôtes"
          nom-en: "Sky of the Hosts"
          description:
            - "Les trois signes des stèles : invité, départ, chaîne."
          description-en:
            - "The three signs of the steles: guest, departure, chain."

