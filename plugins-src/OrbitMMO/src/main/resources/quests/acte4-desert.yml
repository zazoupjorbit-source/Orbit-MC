  a4_l_les_ordres:
    nom: "Les ordres du Bastion"
    nom-en: "The Bastion's Orders"
    faction: lumiere
    niveau: 37
    requiert: [a4_l_l_oasis_d_ambre]
    donneur: a4_aldren
    resume:
      - "La capitaine Hélis campe au nord-est de l'Oasis."
    resume-en:
      - "Captain Hélis is camped north-east of the Oasis."
    offre:
      - "a4_aldren: La capitaine Hélis campe au nord-est, avec deux compagnies. Elle n'a pas le droit d'entrer à l'Oasis. Elle veut vous voir quand même."
    offre-en:
      - "a4_aldren: Captain Hélis is camped to the north-east, with two companies. She may not enter the Oasis. She wants to see you all the same."
    etapes:
      - type: PARLER
        texte: "Parler à la capitaine Hélis"
        texte-en: "Talk to Captain Hélis"
        pnj: a4_helis
        dialogue:
          - "a4_helis: Le Marqué d'Aldren. Bien. Moi, je n'ai pas de patience pour les Gardiennes."
          - "a4_helis: La Haute-Prélate veut l'Éclat-Cœur au Bastion avant la nouvelle lune. Les nomades l'ont caché. Trouvez où."
        dialogue-en:
          - "a4_helis: Aldren's Marked. Good. I have no patience for Keepers."
          - "a4_helis: The High Prelate wants the Heart-Shard at the Bastion before the new moon. The nomads have hidden it. Find out where."
      - type: ENQUETE
        texte: "Chercher où les Astréens ont caché l'Éclat-Cœur"
        texte-en: "Find where the Astreans hid the Heart-Shard"
        pnj: a4_aldren
        indices:
          - point: a4_indice_chariot
            texte: "Des traces de chariot lourd"
            texte-en: "Tracks of a heavy cart"
            apres:
              - "Un chariot chargé, tiré à bras. Les roues s'enfoncent profond. Il allait vers le sud-est."
            apres-en:
              - "A laden cart, pulled by hand. The wheels sink deep. It was heading south-east."
          - point: a4_indice_sable
            texte: "Du sable de verre, tamisé"
            texte-en: "Sifted glass sand"
            apres:
              - "Quelqu'un a tamisé le sable vitrifié et l'a emporté dans des sacs. Ils effacent la traînée derrière eux."
            apres-en:
              - "Someone sifted the vitrified sand and carried it off in sacks. They are erasing the trail behind them."
          - point: a4_indice_chant
            texte: "Une pierre gravée de signes"
            texte-en: "A stone carved with signs"
            apres:
              - "Des signes en forme d'étoiles. Le même revient trois fois, avec une flèche vers le sud : vers le grand tombeau."
            apres-en:
              - "Star-shaped signs. The same one comes back three times, with an arrow pointing south: toward the great tomb."
        dialogue:
          - "joueur: Un chariot vers le sud-est, une traînée qu'on efface, et un signe qui montre le grand tombeau."
          - "a4_aldren: Le Tombeau. Ils l'ont ramené là où ils le gardaient autrefois."
          - "a4_aldren: N'en dites rien à Hélis. Pas encore. Si elle l'apprend, elle mettra le feu au désert pour l'ouvrir."
        dialogue-en:
          - "joueur: A cart heading south-east, a trail being erased, and a sign pointing to the great tomb."
          - "a4_aldren: The Tomb. They took it back to where they kept it long ago."
          - "a4_aldren: Say nothing to Hélis. Not yet. If she learns of it, she will set the desert on fire to open it."
    recompenses:
      xp: 10820
      or: 1080

