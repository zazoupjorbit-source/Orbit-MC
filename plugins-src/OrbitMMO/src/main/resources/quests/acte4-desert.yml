        rayon: 6
        apres:
          - "Sous une dalle, un astrolabe de cuivre, et un mot : « Il est reparti. C'était bien. Ne pleurez pas. »"
        apres-en:
          - "Under a slab, a copper astrolabe, and a note: « It has left again. It was good. Do not weep. »"
      - type: PARLER
