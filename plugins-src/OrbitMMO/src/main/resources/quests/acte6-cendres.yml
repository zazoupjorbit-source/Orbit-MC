#  Acte VI — Les Terres de Cendre : « La forge éteinte » (niv. 60 à 72). Hub neutre : le Camp des Cendres.
#  Lumière fidèle (a6_l_*), Ombre fidèle (a6_o_*), Sans-Bannière (a6_s_*), annexes (a6_n_*) et contrats répétables (a6_c_*).
#  FICHIER GÉNÉRÉ par tools\quetes\gen-quetes.js depuis tools\quetes\zones\acte6-cendres.js : modifier la source, pas ce fichier.
# ------------------------------------------------------------------

pnj:
  a6_helis:
    nom: "Capitaine Hélis"
    nom-en: "Captain Hélis"
    titre: "Expédition de l'Aube"
    titre-en: "Dawn Expedition"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: garde_lumiere_1
    point: a6_helis
    main: GOLDEN_SWORD
    repliques:
      - "La Haute-Prélate veut que la forge brûle. Elle brûlera."
    repliques-en:
      - "The High Prelate wants the forge to burn. It will burn."
  a6_sarn:
    nom: "Sarn"
    titre: "Lame de la Citadelle"
    titre-en: "Blade of the Citadel"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: garde_ombre_1
    point: a6_sarn
    main: NETHERITE_SWORD
    repliques:
      - "Vharos ne demande pas. Il attend."
    repliques-en:
      - "Vharos does not ask. He waits."
  a6_morvain:
    nom: "Morvain"
    titre: "Le premier Marqué"
    titre-en: "The first Marked"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: morvain
    point: a6_morvain
    main: NETHERITE_SWORD
    repliques:
      - "J'ai frappé l'enclou de cette forge pendant sept ans. Je reconnais encore son odeur."
    repliques-en:
      - "I struck the anvil of that forge for seven years. I still know its smell."
  a6_hulda:
    nom: "Hulda"
    titre: "Maîtresse des mineurs"
    titre-en: "Mine-mistress"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: villageois_neutre_2
    point: a6_hulda
    main: IRON_PICKAXE
    repliques:
      - "Ici, on creuse pour vivre. Pas pour l'Aube, pas pour l'Ombre."
    repliques-en:
      - "Here we dig to live. Not for the Dawn, not for the Shadow."
  a6_ottilie:
    nom: "Ottilie"
    titre: "Arpenteuse des failles"
    titre-en: "Rift-surveyor"
    couleur: "#A8E6A1"
    type: MANNEQUIN
    visage: voyageur_2
    point: a6_ottilie
    main: SPYGLASS
    repliques:
      - "Les failles s'ouvrent toutes dans le même sens. Ça ne me plaît pas."
    repliques-en:
      - "The rifts all open in the same direction. I do not like it."
  a6_tobbe:
    nom: "Tobbe"
    titre: "Cuisinier du camp"
    titre-en: "Camp cook"
    couleur: "#E0B27A"
    type: MANNEQUIN
    visage: villageois_neutre_1
    point: a6_tobbe
    repliques:
      - "Le ragoût de cendre, ça se mange chaud. Froid, ça se mange quand même."
    repliques-en:
      - "Ash stew is eaten hot. Cold, it gets eaten anyway."
  a6_mirza:
    nom: "Mirza"
    titre: "Tableau des contrats"
    titre-en: "Contract board"
    couleur: "#9FD8FF"
    type: MANNEQUIN
    visage: villageois_neutre_4
    point: a6_mirza
    repliques:
      - "Un contrat par jour, payé le soir. Le camp tient comme ça."
    repliques-en:
      - "One contract a day, paid at dusk. That is how the camp holds."
  a6_prisca:
    nom: "Sœur Prisca"
    titre: "Chanteuse du Cloître"
    titre-en: "Singer of the Cloister"
    couleur: "#F7E7A1"
    type: MANNEQUIN
    visage: zuri
    point: a6_prisca
    repliques:
      - "Je chantais la lumière hors des Marqués. Maintenant je l'écoute."
    repliques-en:
      - "I used to sing the light out of the Marked. Now I listen to it."
  a6_prisca_refuge:
    nom: "Sœur Prisca"
    titre: "Sans-Bannière"
    titre-en: "Bannerless"
    couleur: "#D7DCE2"
    type: MANNEQUIN
    visage: zuri
    point: a6_prisca_refuge
    repliques:
      - "Ici, personne ne porte de couleur. On porte un nom."
    repliques-en:
      - "Here no one wears a colour. We wear a name."
  a6_kael:
    nom: "Kael"
    titre: "Forgeron des Sans-Bannière"
    titre-en: "Smith of the Bannerless"
    couleur: "#8C96A3"
    type: MANNEQUIN
    visage: efe
    point: a6_kael
    main: IRON_AXE
    repliques:
      - "Mes mains se souviennent mieux que ma tête. Elles se souviennent de la forge."
    repliques-en:
      - "My hands remember better than my head. They remember the forge."
  a6_ezren:
    nom: "Ezren"
    titre: "Gardien des cages"
    titre-en: "Keeper of the cages"
    couleur: "#9B7BFF"
    type: MANNEQUIN
    visage: garde_ombre_2
    point: a6_ezren
    repliques:
      - "Chaque cage a un nom gravé. Je ne les lis plus."
    repliques-en:
      - "Every cage has a name carved on it. I no longer read them."
  a6_anseau:
    nom: "Frère Anseau"
    titre: "Déserteur de l'Aube"
    titre-en: "Deserter of the Dawn"
    couleur: "#F2E6C0"
    type: MANNEQUIN
    visage: villageois_lumiere_3
    point: a6_anseau
    repliques:
      - "Je n'ai plus de prière. Il me reste mes jambes."
    repliques-en:
      - "I have no prayer left. I still have my legs."
  a6_ysra:
    nom: "Ysra"
    titre: "Déserteuse de la Citadelle"
    titre-en: "Deserter of the Citadel"
    couleur: "#B48CFF"
    type: MANNEQUIN
    visage: villageois_ombre_3
    point: a6_ysra
    repliques:
      - "Vharos m'a appris à tenir une cage. Pas à la refermer sur un enfant."
    repliques-en:
      - "Vharos taught me to hold a cage. Not to close it on a child."
  a6_convoyeur_aube:
    nom: "Convoyeur de l'Aube"
    titre: "Maillons pour la forge"
    titre-en: "Links for the forge"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: garde_lumiere_2
    point: a6_convoyeur_aube
    repliques:
      - "Ces caisses pèsent plus lourd qu'elles ne devraient."
    repliques-en:
      - "These crates weigh more than they should."
  a6_joran:
    nom: "Joran"
    titre: "Purifié"
    titre-en: "Purified"
    couleur: "#C9D6A3"
    type: MANNEQUIN
    visage: villageois_lumiere_5
    point: a6_joran
    repliques:
      - "…"
    repliques-en:
      - "…"
  a6_colporteur:
    nom: "Ambroise"
    titre: "Colporteur"
    titre-en: "Peddler"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: voyageur_1
    point: a6_colporteur
    repliques:
      - "Du sel, des clous, des nouvelles. Tout se vend aux Cendres."
    repliques-en:
      - "Salt, nails, news. Everything sells in the Ashlands."
  a6_mineur:
    nom: "Gaudry"
    titre: "Mineur du poste"
    titre-en: "Outpost miner"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: fermier_neutre_1
    point: a6_mineur
    main: IRON_PICKAXE
    repliques:
      - "La galerie est à l'ouest. Si personne ne m'accompagne, j'y vais quand même."
    repliques-en:
      - "The tunnel is to the west. If no one comes with me, I go anyway."

