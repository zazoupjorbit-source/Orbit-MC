quetes:

  # ================================================================ PRINCIPALES — LUMIÈRE : LA FORGE ÉTEINTE

  a6_l_le_camp_des_cendres:
    nom: "Le Camp des Cendres"
    nom-en: "The Ash Camp"
    faction: lumiere
    niveau: 60
    requiert: [a5_l_la_derniere_chaine]
    donneur: a6_helis
    resume:
      - "Le Capitaine Hélis vous attend"
      - "au Camp des Cendres."
    resume-en:
      - "Captain Hélis is waiting for you"
      - "at the Ash Camp."
    offre:
      - "a6_helis: Vous avez vu la Chute dans la glace. Moi, j'ai vu les ordres de la Haute-Prélate. Les deux mènent ici."
    offre-en:
      - "a6_helis: You saw the Fall in the ice. I saw the High Prelate's orders. Both lead here."
    etapes:
      - type: ANCRAGE
        texte: "Toucher l'Éclat d'ancrage du Camp des Cendres"
        texte-en: "Touch the Ash Camp's anchoring Shard"
        point: a6_ancre_cendres
        rayon: 4
      - type: PARLER
        texte: "Écouter le Capitaine Hélis"
        texte-en: "Listen to Captain Hélis"
        pnj: a6_helis
        dialogue:
          - "a6_helis: La Forge éteinte est à l'est. C'est là que les chaînes de lumière ont été forgées. La Haute-Prélate veut qu'elle brûle de nouveau."
          - "a6_helis: L'Ombre veut la même chose. Leur Lame, Sarn, boit à dix pas d'ici. Le camp est neutre : pas d'épée tirée sous la palissade."
        dialogue-en:
          - "a6_helis: The Extinguished Forge lies to the east. That is where the chains of light were forged. The High Prelate wants it to burn again."
          - "a6_helis: The Shadow wants the same thing. Their Blade, Sarn, drinks ten paces from here. The camp is neutral: no sword drawn inside the palisade."
      - type: PARLER
        texte: "Retrouver Morvain"
        texte-en: "Find Morvain"
        pnj: a6_morvain
        dialogue:
          - "a6_morvain: Vous m'avez pardonné, là-haut, dans la glace. Ne le faites pas trop vite. La forge vous dira ce que j'ai fait."
        dialogue-en:
          - "a6_morvain: You forgave me, up there, in the ice. Do not do it too quickly. The forge will tell you what I did."
        si: "a5-morvain=pardonner"
      - type: PARLER
        texte: "Retrouver Morvain"
        texte-en: "Find Morvain"
        pnj: a6_morvain
        dialogue:
          - "a6_morvain: Vous m'avez jugé, là-haut, dans la glace. Vous aviez raison. Venez voir la forge, et jugez encore."
        dialogue-en:
          - "a6_morvain: You judged me, up there, in the ice. You were right. Come and see the forge, and judge again."
        si: "!a5-morvain=pardonner"
    recompenses:
      xp: 17500
      or: 1750

  a6_l_les_failles:
    nom: "Les failles"
    nom-en: "The Rifts"
    faction: lumiere
    niveau: 61
    requiert: [a6_l_le_camp_des_cendres]
    donneur: a6_helis
    resume:
      - "Des failles s'ouvrent autour du camp."
      - "Hélis veut savoir d'où sortent les Affamés."
    resume-en:
      - "Rifts are opening around the camp."
      - "Hélis wants to know where the Starved come from."
    offre:
      - "a6_helis: Les Affamés sortent de la cendre comme l'eau d'une source. Trois failles autour du camp. Examinez-les, puis voyez l'arpenteuse, Ottilie."
    offre-en:
      - "a6_helis: The Starved rise out of the ash like water from a spring. Three rifts around the camp. Examine them, then see the surveyor, Ottilie."
    etapes:
      - type: ENQUETE
        texte: "Examiner les trois failles"
        texte-en: "Examine the three rifts"
        pnj: a6_ottilie
        indices:
          - point: a6_faille_1
            texte: "Une faille qui fume froid"
            texte-en: "A rift that smokes cold"
            apres:
              - "La cendre gèle sur les bords. Au fond, rien. Un rien qui respire."
            apres-en:
              - "The ash freezes at the edges. At the bottom, nothing. A nothing that breathes."
          - point: a6_faille_2
            texte: "Des griffures autour de la faille"
            texte-en: "Claw marks around the rift"
            apres:
              - "Des traces d'Affamés, par dizaines, en rangs serrés. Ils ne rôdent plus : ils marchent."
            apres-en:
              - "Tracks of the Starved, by the dozen, in tight rows. They no longer prowl: they march."
          - point: a6_faille_3
            texte: "Un piquet planté dans la faille"
            texte-en: "A stake driven into the rift"
            apres:
              - "Un piquet au sceau du soleil. Un fil d'or en part, tendu vers l'est, vers la forge. Quelqu'un mesure."
            apres-en:
              - "A stake with the sun seal. A golden thread runs from it, stretched east, towards the forge. Someone is measuring."
        dialogue:
          - "a6_ottilie: Toutes les failles s'ouvrent vers la forge. Comme si quelque chose là-bas tirait le Néant à lui."
          - "a6_ottilie: Et ces piquets d'or sont là depuis des semaines. Votre Ordre savait."
        dialogue-en:
          - "a6_ottilie: Every rift opens towards the forge. As if something over there were drawing the Void to it."
          - "a6_ottilie: And those golden stakes have been there for weeks. Your Order knew."
      - type: PARLER
        texte: "Revenir voir Hélis"
        texte-en: "Return to Hélis"
        pnj: a6_helis
        dialogue:
          - "a6_helis: Bien sûr que nous savions. Mesurer, c'est préparer. La forge rallumée refermera les failles."
          - "joueur: Ou les ouvrira toutes."
        dialogue-en:
          - "a6_helis: Of course we knew. To measure is to prepare. The rekindled forge will close the rifts."
          - "joueur: Or open them all."
    recompenses:
      xp: 18000
      or: 1800

  a6_l_le_convoi_des_maillons:
    nom: "Le convoi des maillons"
    nom-en: "The Convoy of Links"
    faction: lumiere
    niveau: 62
    requiert: [a6_l_les_failles]
    donneur: a6_helis
    resume:
      - "Un convoi de l'Aube doit rejoindre la forge."
    resume-en:
      - "A Dawn convoy must reach the forge."
    offre:
      - "a6_helis: Mon convoyeur attend à l'est du camp. Ses caisses doivent arriver à la forge. Les Affamés les sentent : escortez-le."
    offre-en:
      - "a6_helis: My convoy-driver waits east of the camp. His crates must reach the forge. The Starved can smell them: escort him."
    etapes:
      - type: ESCORTE
        texte: "Escorter le convoyeur jusqu'à la forge"
        texte-en: "Escort the convoy-driver to the forge"
        pnj: a6_convoyeur_aube
        chemin: [a6_convoi_1, a6_convoi_2, a6_convoi_fin]
        monstres: [a6_affame]
        nombre: 3
        vagues: 3
        pv: 140
        degats: 6
        apres:
          - "a6_convoyeur_aube: Arrivés. Vous voulez savoir ce qu'il y a dedans ? Des maillons d'or. Tièdes. Ils sont tièdes depuis Auréval."
        apres-en:
          - "a6_convoyeur_aube: Here. You want to know what is inside? Golden links. Warm. They have been warm since Auréval."
      - type: PARLER
        texte: "Rendre compte à Hélis"
        texte-en: "Report to Hélis"
        pnj: a6_helis
        dialogue:
          - "a6_helis: Les maillons sont arrivés. La moitié d'une chaîne, déjà."
          - "joueur: La moitié de quoi ?"
          - "a6_helis: Vous le saurez quand la forge brûlera."
        dialogue-en:
          - "a6_helis: The links have arrived. Half a chain, already."
          - "joueur: Half of what?"
          - "a6_helis: You will know when the forge burns."
    recompenses:
      xp: 18500
      or: 1850

  a6_l_les_braises_du_bivouac:
    nom: "Les braises du bivouac"
    nom-en: "The Embers of the Bivouac"
    faction: lumiere
    niveau: 63
    requiert: [a6_l_le_convoi_des_maillons]
    donneur: a6_helis
    resume:
      - "Une fiole scellée de la Haute-Prélate"
      - "doit rejoindre le bivouac de l'Aube."
    resume-en:
      - "A sealed vial from the High Prelate"
      - "must reach the Dawn bivouac."
    offre:
      - "a6_helis: Ceci vient du Bastion. Portez-le à Sœur Prisca, au bivouac près de la forge. Ne l'ouvrez pas."
    offre-en:
      - "a6_helis: This comes from the Bastion. Take it to Sister Prisca, at the bivouac near the forge. Do not open it."
    etapes:
      - type: LIVRER
        texte: "Porter la fiole à Sœur Prisca"
        texte-en: "Carry the vial to Sister Prisca"
        pnj: a6_prisca
        materiau: HONEY_BOTTLE
        objet: "Fiole scellée du Bastion"
        objet-en: "Sealed vial from the Bastion"
        dialogue:
          - "a6_prisca: Une fiole pour le foyer. Vous savez ce qu'il y a dedans ? Quelqu'un. Écoutez."
          - "Contre la paroi de verre, une voix minuscule : « Laissez-moi partir. »"
        dialogue-en:
          - "a6_prisca: A vial for the hearth. Do you know what is inside? Someone. Listen."
          - "Against the glass, a tiny voice: « Let me go. »"
      - type: INTERAGIR
        texte: "Regarder derrière le bivouac"
        texte-en: "Look behind the bivouac"
        point: a6_enclos_aube
        rayon: 5
        apres:
          - "Un enclos. Des Purifiés enchaînés à des soufflets de forge, le regard vide. Ils pompent sans fin, et chaque coup de soufflet fait luire les maillons."
        apres-en:
          - "A pen. Purified chained to forge bellows, their eyes empty. They pump without end, and every stroke of the bellows makes the links glow."
      - type: PARLER
        texte: "Revenir voir Sœur Prisca"
        texte-en: "Return to Sister Prisca"
        pnj: a6_prisca
        dialogue:
          - "a6_prisca: La forge ne brûle pas au charbon. Elle brûle à la lumière des Marqués. C'est pour ça qu'on les amène."
        dialogue-en:
          - "a6_prisca: The forge does not burn on coal. It burns on the light of the Marked. That is why they are brought here."
    recompenses:
      xp: 18900
      or: 1890

  a6_l_le_registre_du_bivouac:
    nom: "Le registre du bivouac"
    nom-en: "The Bivouac Ledger"
    faction: lumiere
    niveau: 64
    requiert: [a6_l_les_braises_du_bivouac]
    donneur: a6_prisca
    resume:
      - "Sœur Prisca veut que vous lisiez"
      - "ce que le bivouac cache."
    resume-en:
      - "Sister Prisca wants you to read"
      - "what the bivouac hides."
    offre:
      - "a6_prisca: La nuit, les gardes dorment. Le registre est dans le coffre du chef, les ordres sous sa tente. Lisez. Puis allez dire à Morvain ce que vous avez lu."
    offre-en:
      - "a6_prisca: At night the guards sleep. The ledger is in the chief's chest, the orders under his tent. Read. Then go and tell Morvain what you read."
    etapes:
      - type: ENQUETE
        texte: "Fouiller le bivouac"
        texte-en: "Search the bivouac"
        pnj: a6_morvain
        indices:
          - point: a6_coffre_aube
            texte: "Le registre du combustible"
            texte-en: "The fuel ledger"
            apres:
              - "« Combustible reçu : quarante Marqués instables. Restants : douze. » Les noms sont rayés un par un."
            apres-en:
              - "« Fuel received: forty unstable Marked. Remaining: twelve. » The names are struck out one by one."
          - point: a6_bivouac_aube
            texte: "Les ordres de la Haute-Prélate"
            texte-en: "The High Prelate's orders"
            apres:
              - "« La forge rallumée forgera la cage. L'Astre rassemblé n'en sortira plus. — S. »"
            apres-en:
              - "« The rekindled forge shall forge the cage. The Star, once gathered, shall never leave it. — S. »"
          - point: a6_enclos_aube
            texte: "Une étiquette sur une caisse"
            texte-en: "A label on a crate"
            apres:
              - "Une caisse de maillons, au soleil de l'Aube. L'étiquette : « Pour V. — la moitié des chaînes. »"
            apres-en:
              - "A crate of links, bearing the Dawn sun. The label: « For V. — half of the chains. »"
        dialogue:
          - "joueur: « Pour V. ». Encore. Le Pacte est mort, pourtant."
          - "a6_morvain: Un pacte ne meurt pas parce que deux armées se battent. Il meurt quand ceux qui l'ont signé n'ont plus besoin l'un de l'autre."
          - "a6_morvain: Et une cage, ça se ferme mieux à deux."
        dialogue-en:
          - "joueur: « For V. ». Again. The Pact is dead, though."
          - "a6_morvain: A pact does not die because two armies fight. It dies when those who signed it no longer need each other."
          - "a6_morvain: And a cage closes better with two."
    recompenses:
      xp: 19400
      or: 1940

  a6_l_la_forge_se_souvient:
    nom: "La forge se souvient"
    nom-en: "The Forge Remembers"
    faction: lumiere
    niveau: 64
    requiert: [a6_l_le_registre_du_bivouac]
    donneur: a6_morvain
    resume:
      - "Morvain vous emmène devant la Forge éteinte."
    resume-en:
      - "Morvain takes you before the Extinguished Forge."
    offre:
      - "a6_morvain: Venez au parvis de la forge. Elle est éteinte, mais pas froide. Elle se souvient de moi, et elle n'aime pas ça."
    offre-en:
      - "a6_morvain: Come to the forecourt of the forge. It is extinguished, but not cold. It remembers me, and it does not like it."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre le parvis de la Forge éteinte"
        texte-en: "Reach the forecourt of the Extinguished Forge"
        point: a6_forge_parvis
        rayon: 8
      - type: SURVIE
        texte: "Tenir pendant que la forge se réveille"
        texte-en: "Hold on while the forge awakens"
        point: a6_forge_parvis
        rayon: 12
        duree: 45
        mode: brule
        degats: 5
        monstres: [a6_braise]
        nombre: 1
        intervalle: 15
        apres:
          - "Les foyers retombent. Dans la fumée, une forge d'il y a mille ans : un garçon frappe le métal, et le métal chante."
          - "a6_morvain: C'était moi. Chaque maillon prenait la lumière d'un Marqué. On me disait que c'était pour protéger l'Astre."
        apres-en:
          - "The fires die down. In the smoke, a forge from a thousand years ago: a boy strikes the metal, and the metal sings."
          - "a6_morvain: That was me. Every link took the light of a Marked. They told me it was to protect the Star."
      - type: PARLER
        texte: "Parler à Morvain"
        texte-en: "Talk to Morvain"
        pnj: a6_morvain
        dialogue:
          - "a6_morvain: Votre Haute-Prélate veut refaire ce que j'ai fait. Avec les mêmes mains : celles des Marqués."
          - "a6_morvain: Je ne vous dirai pas quoi faire. On me l'a trop dit, à moi."
        dialogue-en:
          - "a6_morvain: Your High Prelate wants to do again what I did. With the same hands: those of the Marked."
          - "a6_morvain: I will not tell you what to do. I was told too often myself."
    recompenses:
      xp: 19400
      or: 1940

  a6_l_le_chant_de_prisca:
    nom: "Le chant de Prisca"
    nom-en: "Prisca's Song"
    faction: lumiere
    niveau: 65
    requiert: [a6_l_la_forge_se_souvient]
    donneur: a6_prisca
    resume:
      - "Sœur Prisca a une question pour vous."
      - "Votre réponse changera la suite."
    resume-en:
      - "Sister Prisca has a question for you."
      - "Your answer will change what follows."
    offre:
      - "a6_prisca: Venez. Ce que j'ai à dire ne se dit qu'une fois."
    offre-en:
      - "a6_prisca: Come. What I have to say can only be said once."
    etapes:
      - type: CHOIX
        texte: "Répondre à Sœur Prisca"
        texte-en: "Answer Sister Prisca"
        pnj: a6_prisca
        choix: a6-allegeance
        question: "Que répondez-vous à Prisca ?"
        question-en: "What do you answer Prisca?"
        reponses:
          - id: sans_banniere
            texte: "Je viens. En secret."
            texte-en: "I am coming. In secret."
            reponse:
              - "a6_prisca: Alors garde ton soleil sur la poitrine, et ton nom en dessous. Rejoins Kael au refuge."
            reponse-en:
              - "a6_prisca: Then keep your sun on your chest, and your name beneath it. Join Kael at the refuge."
            xp: 2000
          - id: fidele
            texte: "Je reste fidèle à l'Aube."
            texte-en: "I remain loyal to the Dawn."
            reponse:
              - "a6_prisca: Je comprends. Je t'ai connu sous la Marque, pas sous la bannière. Adieu."
            reponse-en:
              - "a6_prisca: I understand. I knew you under the Mark, not under the banner. Farewell."
            or: 300
        dialogue:
          - "a6_prisca: Je pars cette nuit. Il y a des Marqués qui ne servent ni l'Aube ni la Citadelle. On les appelle les Sans-Bannière."
          - "a6_prisca: Ils ont un refuge au nord-ouest, au bord de la mer, et un forgeron, Kael. Un ancien Creux. Il dit que les Creux ont un nom."
          - "a6_prisca: Vous pouvez venir, et garder votre bannière en façade. Personne ne le saura. Ou rester fidèle, et me dénoncer. Les deux sont honnêtes."
        dialogue-en:
          - "a6_prisca: I leave tonight. There are Marked who serve neither the Dawn nor the Citadel. They are called the Bannerless."
          - "a6_prisca: They have a refuge to the north-west, by the sea, and a smith, Kael. A former Hollow. He says the Hollow have names."
          - "a6_prisca: You can come, and keep your banner on the outside. No one will know. Or stay loyal, and report me. Both are honest."
      - type: PARLER
        texte: "Annoncer la désertion de Prisca à Hélis"
        texte-en: "Report Prisca's desertion to Hélis"
        pnj: a6_helis
        dialogue:
          - "a6_helis: Prisca ? Elle chantait mieux que toutes les autres. Le Cloître la retrouvera. Vous avez bien fait."
        dialogue-en:
          - "a6_helis: Prisca? She sang better than all the others. The Cloister will find her. You did well."
        si: "a6-allegeance=fidele"
      - type: PARLER
        texte: "Revenir voir Hélis comme si de rien n'était"
        texte-en: "Return to Hélis as if nothing happened"
        pnj: a6_helis
        dialogue:
          - "a6_helis: Prisca a disparu cette nuit. Vous l'avez vue ?"
          - "joueur: Non, capitaine."
          - "a6_helis: Dommage. Elle chantait mieux que toutes les autres."
        dialogue-en:
          - "a6_helis: Prisca vanished tonight. Did you see her?"
          - "joueur: No, captain."
          - "a6_helis: A pity. She sang better than all the others."
        si: "a6-allegeance=sans_banniere"
    recompenses:
      xp: 19900
      or: 1990

  a6_l_les_deserteurs:
    nom: "Les déserteurs"
    nom-en: "The Deserters"
    faction: lumiere
    niveau: 66
    requiert: [a6_l_le_chant_de_prisca, "choix:a6-allegeance=fidele"]
    donneur: a6_helis
    resume:
      - "Des frères de l'Aube ont fui le bivouac."
      - "Hélis veut qu'on les retrouve."
    resume-en:
      - "Brothers of the Dawn have fled the bivouac."
      - "Hélis wants them found."
    offre:
      - "a6_helis: Après Prisca, d'autres. Trois frères du bivouac. Leurs traces partent vers le nord-ouest. Retrouvez-les."
    offre-en:
      - "a6_helis: After Prisca, others. Three brothers from the bivouac. Their tracks lead north-west. Find them."
    etapes:
      - type: PISTER
        texte: "Suivre les traces des déserteurs"
        texte-en: "Follow the deserters' tracks"
        traces: [a6_trace_d1, a6_trace_d2, a6_trace_d3, a6_cache_deserteurs]
        apres:
          - "Un abri de fortune sous un surplomb de basalte. Un homme en robe de l'Aube s'y tient, seul. Les deux autres sont partis plus loin."
        apres-en:
          - "A makeshift shelter under a basalt overhang. A man in Dawn robes stands there, alone. The other two went further on."
      - type: CHOIX
        texte: "Parler au déserteur"
        texte-en: "Talk to the deserter"
        pnj: a6_anseau
        choix: a6-l-deserteurs
        question: "Que faites-vous d'Anseau ?"
        question-en: "What do you do with Anseau?"
        reponses:
          - id: livrer
            texte: "Je te ramène au bivouac."
            texte-en: "I am taking you back to the bivouac."
            reponse:
              - "a6_anseau: Alors je reprendrai le soufflet. C'est peut-être ce que je mérite."
            reponse-en:
              - "a6_anseau: Then I will take up the bellows again. Perhaps that is what I deserve."
            or: 400
          - id: laisser
            texte: "Va. Je n'ai rien vu."
            texte-en: "Go. I saw nothing."
            reponse:
              - "a6_anseau: Que l'Astre te le rende. Je dirai à ceux du refuge qu'un fidèle m'a laissé passer."
            reponse-en:
              - "a6_anseau: May the Star repay you. I will tell those at the refuge that a loyal one let me pass."
            xp: 2000
        dialogue:
          - "a6_anseau: Je suis Frère Anseau. Je chantais avec Prisca. J'ai vu ce qu'on fait aux Purifiés, au soufflet."
          - "a6_anseau: Ramène-moi si tu veux. Je ne me battrai pas contre un Marqué."
        dialogue-en:
          - "a6_anseau: I am Brother Anseau. I sang with Prisca. I saw what is done to the Purified, at the bellows."
          - "a6_anseau: Take me back if you want. I will not fight a Marked."
      - type: PARLER
        texte: "Rendre compte à Hélis"
        texte-en: "Report to Hélis"
        pnj: a6_helis
        dialogue:
          - "a6_helis: Un de repris. Le soufflet a besoin de bras."
        dialogue-en:
          - "a6_helis: One taken back. The bellows need arms."
        si: "a6-l-deserteurs=livrer"
      - type: PARLER
        texte: "Rendre compte à Hélis"
        texte-en: "Report to Hélis"
        pnj: a6_helis
        dialogue:
          - "joueur: Les traces se perdaient dans le basalte."
          - "a6_helis: Tant pis. La cendre les mangera."
        dialogue-en:
          - "joueur: The tracks were lost in the basalt."
          - "a6_helis: Too bad. The ash will eat them."
        si: "a6-l-deserteurs=laisser"
    recompenses:
      xp: 20400
      or: 2040

