              - "a8_naia: Celui de la porte bleue. Tu ne t'en souviens pas encore, mais tu le retrouveras en suivant la cloche. Il est à toi."
            reponse-en:
              - "a8_naia: The one from the blue door. You do not remember it yet, but you will find it by following the bell. It is yours."
            xp: 5000
          - id: marque
            texte: "Marqué. Ça me suffit."
            texte-en: "Marked. That is enough for me."
            reponse:
              - "a8_naia: Marqué. Comme des centaines d'autres, et comme personne d'autre. C'est un beau nom, quand on l'a choisi."
            reponse-en:
              - "a8_naia: Marked. Like hundreds of others, and like nobody else. It is a fine name, when you have chosen it."
            xp: 5000
          - id: astre
            texte: "Celui que l'Astre m'aurait donné"
            texte-en: "The one the Star would have given me"
            reponse:
              - "a8_naia: Alors lève les yeux, ce soir. Il brille entier. S'il t'appelle, tu l'entendras sans souvenir pour te le souffler."
            reponse-en:
              - "a8_naia: Then look up tonight. It shines whole. If it calls you, you will hear it without any memory to whisper it to you."
            xp: 5000
        dialogue:
          - "a8_naia: Chez nous, quand un invité reste, on lui demande son nom. Pas celui qu'il avait en arrivant : celui qu'il veut garder."
          - "a8_naia: Tu es resté. Alors, comment t'appelles-tu ?"
        dialogue-en:
          - "a8_naia: Among us, when a guest stays, we ask their name. Not the one they had on arrival: the one they want to keep."
          - "a8_naia: You stayed. So, what is your name?"
    recompenses:
      xp: 28400
      or: 2840
      objets:
        - materiau: NAME_TAG
          nom: "Votre nom"
          nom-en: "Your name"
          description:
            - "Choisi au bord du ciel, au Seuil."
          description-en:
            - "Chosen at the edge of the sky, at the Threshold."
