  a_les_kobolds_du_nord:
    nom: "Les kobolds du nord"
    nom-en: "The Northern Kobolds"
    faction: lumiere
    niveau: 7
    requiert: [sous_les_murs_blancs]
    donneur: hardouin
    resume:
      - "Un camp de kobolds coupe la route du nord-ouest."
    resume-en:
      - "A kobold camp is cutting off the north-western road."
    offre:
      - "hardouin: Un camp de kobolds s'est installé au nord-ouest, loin derrière celui des Glaneurs."
      - "hardouin: Mes patrouilles n'en reviennent qu'à moitié. Toi, t'es Marqué : tu reviens toujours."
    offre-en:
      - "hardouin: A kobold camp has settled to the north-west, well beyond the Gleaners' one."
      - "hardouin: Only half my patrols come back. You're Marked: you always come back."
    etapes:
      - type: TUER
        texte: "Détruire le camp de kobolds du nord"
        texte-en: "Destroy the northern kobold camp"
        monstres: [kobold, kobold_garde]
        point: camp_kobolds_nord
        nombre: 12
      - type: PARLER
        texte: "Faire votre rapport au sergent Hardouin"
        texte-en: "Report to Sergeant Hardouin"
        pnj: hardouin
        dialogue:
          - "hardouin: Douze ! Je vais l'écrire au capitaine. Il croira jamais qu'un Marqué fait mieux qu'une patrouille."
        dialogue-en:
          - "hardouin: Twelve! I'll write it to the captain. He'll never believe a Marked did better than a patrol."
    recompenses:
      xp: 650
      or: 90

  a_le_cercle_de_pierres:
    nom: "Le cercle de pierres"
    nom-en: "The Stone Circle"
    faction: lumiere
    niveau: 7
    requiert: [sous_les_murs_blancs]
    donneur: lise
    resume:
      - "Lise veut savoir pourquoi un vieux cercle de pierres"
      - "s'est mis à briller."
    resume-en:
      - "Lise wants to know why an old stone circle"
      - "has started to shine."
    offre:
      - "lise: À l'ouest du Bourg des Pâtres, il y a un cercle de pierres plus vieux que la Chute. Il brille, depuis la nuit des étoiles."
      - "lise: Maître Orsan ne répond plus à mes lettres. Alors j'ai besoin de vous. Et faites attention : des morts y rôdent."
    offre-en:
      - "lise: West of Shepherds' Hamlet there is a stone circle older than the Fall. It has been shining since the night of the stars."
      - "lise: Master Orsan no longer answers my letters. So I need you. And be careful: the dead roam there."
    etapes:
      - type: TUER
        texte: "Chasser les morts du cercle"
        texte-en: "Drive the dead from the circle"
        monstres: [squelette]
        point: cercle_pierres
        nombre: 6
      - type: INTERAGIR
        texte: "Lire les pierres du cercle"
        texte-en: "Read the stones of the circle"
        point: cercle_pierres
        rayon: 6
        apres:
          - "Les pierres sont gravées d'étoiles. Ensemble, elles dessinent le ciel d'avant la Chute : un seul astre, immense, au centre."
          - "Une pierre est neuve. Quelqu'un y a gravé, récemment, le sceau du Cloître Blanc."
        apres-en:
          - "The stones are carved with stars. Together, they draw the sky before the Fall: a single star, immense, at the centre."
          - "One stone is new. Someone has recently carved the seal of the White Cloister on it."
      - type: PARLER
        texte: "Raconter à Lise ce que disent les pierres"
        texte-en: "Tell Lise what the stones say"
        pnj: lise
        dialogue:
          - "lise: Le ciel d'avant… et le sceau du Cloître ? Ici ? Ça n'a pas de sens."
          - "lise: Sauf si le Cloître étudie les Éclats autant que Maître Orsan. Ou avec lui."
        dialogue-en:
          - "lise: The sky from before… and the Cloister's seal? Here? That makes no sense."
          - "lise: Unless the Cloister studies the Shards as much as Master Orsan does. Or with him."
    recompenses:
      xp: 650
      or: 85

  a_une_lettre_pour_orsan:
    nom: "Une lettre pour Orsan"
    nom-en: "A Letter for Orsan"
    faction: lumiere
    niveau: 7
    requiert: [a_le_cercle_de_pierres]
    donneur: lise
    resume:
      - "Lise veut une réponse de son maître."
    resume-en:
      - "Lise wants an answer from her master."
    offre:
      - "lise: Portez-lui ça, à Veillemont. Et regardez son visage quand il la lira. Je veux savoir."
    offre-en:
      - "lise: Take this to him, in Veillemont. And watch his face when he reads it. I want to know."
    etapes:
      - type: PARLER
        texte: "Remettre la lettre de Lise à Maître Orsan"
        texte-en: "Give Lise's letter to Master Orsan"
        pnj: orsan
        dialogue:
          - "orsan: Lise… Elle a toujours été trop curieuse. C'est pour ça que je l'ai choisie."
          - "orsan: Oui, j'écris au Cloître. Ils m'envoient des mesures, je leur envoie des théories. C'est de la science, rien de plus."
          - "orsan: … Dites-lui que je vais bien. Et qu'elle ne s'approche pas du Cloître. Dites-le-lui exactement comme ça."
        dialogue-en:
          - "orsan: Lise… She was always too curious. That's why I chose her."
          - "orsan: Yes, I write to the Cloister. They send me measurements, I send them theories. It's science, nothing more."
          - "orsan: … Tell her I am well. And that she must not go near the Cloister. Tell her exactly that."
      - type: PARLER
        texte: "Rapporter la réponse à Lise"
        texte-en: "Bring the answer back to Lise"
        pnj: lise
        dialogue:
          - "lise: « Qu'elle ne s'approche pas du Cloître. » Il a peur. Mon maître n'a jamais peur."
          - "lise: Merci. Je n'oublierai pas."
        dialogue-en:
          - "lise: « She must not go near the Cloister. » He's afraid. My master is never afraid."
          - "lise: Thank you. I won't forget."
    recompenses:
      xp: 500
      or: 60
