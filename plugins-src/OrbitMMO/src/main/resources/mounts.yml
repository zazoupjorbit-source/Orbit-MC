# Montures d'OrbitMMO.
# Ce fichier vient du jar. Pour le retoucher sans recompiler : copie-le dans plugins/OrbitMMO/mounts.yml
# (il remplace alors celui du jar), puis /monture recharger.
#
# Une monture = des pièces (modèles 3D du pack, namespace orbitmmo:mount/<modele>) posées autour d'un point
# au sol. x = vers la gauche de la bête, y = hauteur au-dessus du sol, z = vers l'avant, en blocs.
# « selle » = hauteur où s'assoit le joueur. Animations : patte, aile_g, aile_d, corps (aucune = fixe).
# Toutes les montures sont ouvertes aux deux factions (choix de Zazou) ; la clé « faction: » reste possible pour une monture réservée.
# Types : sol, vol, eau (nage, plonge, lente à terre). Animation « queue » = balancement.
# Sources (butin sur le continent) : monstre (id de sites.yml / monstres), region (A à L), boss (true),
# chance = probabilité par monstre tué (0.01 = 1 %). Toutes les conditions d'une ligne doivent être vraies.

reglages:
  combat-secondes: 6          # pas d'appel en combat
  descendre-si-touche: true   # un coup reçu ou porté fait descendre
  vol-zones-sures: true       # false = vol interdit dans les zones sûres (capitales, villages)
  hauteur-max: 300
  recharge-secondes: 3

