# ------------------------------------------------------------------
#  Druide — gardien de la nature qui prend la forme des bêtes.
#  Ressource : Mana (Sylvestre), Rage en forme d'ours (Gardien), Énergie en forme de loup (Croc).
#  Les sorts communs ne coûtent rien (ils ont une recharge), car chaque forme a sa propre ressource.
#  Format des sorts et des talents : voir guerrier.yml.
#  La transformation n'est pas (encore) visible : la forme se lit dans les sorts de la spécialisation.
# ------------------------------------------------------------------

nom: Druide
couleur: "#FF9A3B"
icone: OAK_SAPLING
jouable: true
ressource: MANA
armure: CUIR
pv: 1.0
arme: STAFF
description:
  - "Gardien de la nature qui prend"
  - "la forme des bêtes sauvages."

specialisations:
  gardien:
    nom: Gardien
    role: TANK
    icone: BONE
    couleur: "#C8A27A"
    ressource: RAGE
    arme: MACE
    description:
      - "Forme d'ours : encaisse, provoque"
      - "et protège le groupe. Ressource : rage."
    passifs: { pv: 25, armure: 8, esquive: 3 }
    talents:
      fourrure_epaisse: { nom: "Fourrure épaisse", icone: BROWN_WOOL, palier: 0, colonne: 0, rangs: 5, effets: { pv: 2 }, description: "+{pv} % de points de vie." }
      instinct_ursin: { nom: "Instinct ursin", icone: FEATHER, palier: 0, colonne: 1, rangs: 5, effets: { esquive: 1 }, description: "+{esquive} % de chances d'esquiver un coup de mêlée." }
      colere_de_l_ours: { nom: "Colère de l'ours", icone: BLAZE_POWDER, palier: 0, colonne: 2, rangs: 3, effets: { rage-par-coup: 1 }, description: "Chaque attaque de base rend {rage-par-coup} rage de plus." }
      mutilation_rapide: { nom: "Mutilation rapide", icone: CLOCK, palier: 1, colonne: 0, rangs: 3, effets: { recharge.mutilation: 0.5 }, description: "Recharge de Mutilation réduite de {recharge.mutilation} s." }
      taillade_profonde: { nom: "Taillade profonde", icone: REDSTONE, palier: 1, colonne: 1, rangs: 3, effets: { degats.taillade: 10 }, description: "Taillade et son saignement infligent {degats.taillade} % de dégâts en plus." }
