      regain_frenetique: { nom: "Regain frénétique", icone: GOLDEN_APPLE, palier: 2, colonne: 0, rangs: 1, sort: regain_frenetique, description: "Apprend Regain frénétique : rend 25 % de vos PV d'un coup." }
      rugissement_puissant: { nom: "Rugissement puissant", icone: GOAT_HORN, palier: 2, colonne: 1, rangs: 2, effets: { recharge.rugissement: 1.5 }, description: "Recharge de Rugissement réduite de {recharge.rugissement} s." }
