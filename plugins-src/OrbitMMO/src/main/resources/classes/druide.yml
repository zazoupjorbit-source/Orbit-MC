sorts:
  # ---------------- Toute la classe ----------------
  ronce:
    nom: Ronce
    type: PROJECTILE
    icone: SWEET_BERRIES
    couleur: "#6E9E3A"
    niveau: 1
    gain: 5
    portee: 25
    puissance: 0.9
    description: "Projette une ronce épineuse sur la cible visée."
  toucher_regenerant:
    nom: Toucher régénérant
    type: SOIN
    icone: GLOW_BERRIES
    couleur: "#5EE89A"
    niveau: 2
    recharge: 10
    portee: 25
    puissance: 1.5
    duree: 6
    effets: { soin-par-sec: 1 }
    description: "Soigne l'allié visé (ou vous) et le soigne encore pendant 6 s."
  bond_sauvage:
    nom: Bond sauvage
    type: BOND
    icone: RABBIT_FOOT
    couleur: "#FFB347"
    niveau: 4
    recharge: 20
    portee: 12
    zone: 3
    puissance: 0.5
    description: "Bondit vers le point visé et frappe à l'atterrissage."
  ecorce_partagee:
    nom: Écorce partagée
    type: CRI
    icone: OAK_LEAVES
    couleur: "#8BC34A"
    niveau: 6
    recharge: 60
    gcd: false
    zone: 20
    duree: 30
    effets: { reduction: 5 }
    description: "Vous et votre groupe subissez 5 % de dégâts en moins pendant 30 s."
  racines:
    nom: Racines
    type: ZONE
    icone: HANGING_ROOTS
    couleur: "#8B5A2B"
    niveau: 8
    recharge: 25
    portee: 20
    zone: 3
    duree: 3
    puissance: 0.1
    effets: { etourdir: 1 }
    description: "Des racines jaillissent au point visé et immobilisent les ennemis pendant 3 s."
  regeneration_sauvage:
    nom: Régénération sauvage
    type: BUFF
    icone: GOLDEN_CARROT
    couleur: "#5EE89A"
    niveau: 12
    recharge: 120
    gcd: false
    effets: { soin: 20 }
    description: "Rend 20 % de vos PV d'un coup."
  course_du_cerf:
    nom: Course du cerf
    type: BUFF
    icone: LEATHER_BOOTS
    couleur: "#FFE066"
    niveau: 16
