      ecorce_durcie: { nom: "Écorce durcie", icone: OAK_LOG, palier: 3, colonne: 0, rangs: 3, effets: { recharge.peau_d_ecorce: 2 }, description: "Recharge de Peau d'écorce réduite de {recharge.peau_d_ecorce} s." }
