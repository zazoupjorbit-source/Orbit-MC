      pelage_fuyant: { nom: "Pelage fuyant", icone: RABBIT_HIDE, palier: 6, colonne: 2, rangs: 3, effets: { esquive: 1 }, description: "+{esquive} % de chances d'esquiver un coup de mêlée." }
      instincts_prolonges: { nom: "Instincts prolongés", icone: TOTEM_OF_UNDYING, palier: 7, colonne: 0, rangs: 2, effets: { duree.instincts_de_survie: 2 }, description: "Instincts de survie dure {duree.instincts_de_survie} s de plus." }
      ecorce_ancienne: { nom: "Écorce ancienne", icone: DARK_OAK_LOG, palier: 7, colonne: 1, rangs: 3, requiert: ecorce_durcie, effets: { duree.peau_d_ecorce: 1 }, description: "Peau d'écorce dure {duree.peau_d_ecorce} s de plus." }
      montagne_vivante: { nom: "Montagne vivante", icone: MOSSY_COBBLESTONE, palier: 7, colonne: 2, rangs: 3, effets: { armure: 1 }, description: "Dégâts subis réduits de {armure} % de plus." }
