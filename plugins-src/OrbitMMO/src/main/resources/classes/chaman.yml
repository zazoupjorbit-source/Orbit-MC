      voix_des_marees: { nom: "Voix des marées", icone: HEART_OF_THE_SEA, palier: 11, colonne: 1, rangs: 1, effets: { soins: 8, ressource: 5 }, description: "Talent de maître : +{soins} % de soins prodigués et +{ressource} % de mana régénéré." }
      flots_cuirasses: { nom: "Flots cuirassés", icone: CHAINMAIL_CHESTPLATE, palier: 11, colonne: 2, rangs: 3, effets: { armure: 1 }, description: "Dégâts subis réduits de {armure} % de plus." }

sorts:
  # ---------------- Toute la classe ----------------
  trait_de_foudre:
    nom: Trait de foudre
    type: PROJECTILE
    icone: LIGHTNING_ROD
    couleur: "#BFE9FF"
    niveau: 1
    gain: 5
    portee: 28
    puissance: 0.9
    description: "Un trait de foudre sur la cible visée qui rend un peu de mana."
  flots_apaisants:
    nom: Flots apaisants
    type: SOIN
    icone: WATER_BUCKET
    couleur: "#5ED6C4"
    niveau: 2
    recharge: 10
    portee: 25
    puissance: 1.5
    duree: 6
    effets: { soin-par-sec: 1 }
    description: "Soigne l'allié visé (ou vous) et le soigne encore pendant 6 s."
  pas_du_vent:
    nom: Pas du vent
    type: BOND
    icone: WIND_CHARGE
    couleur: "#D7F3FF"
    niveau: 4
    recharge: 20
    portee: 10
    zone: 3
    puissance: 0.3
    effets: { ralentir: 2 }
    description: "Le vent vous porte vers le point visé ; les ennemis à l'arrivée sont ralentis."
  totem_de_pierre:
    nom: Totem de pierre
    type: CRI
    icone: MOSSY_COBBLESTONE_WALL
    couleur: "#B8A27A"
    niveau: 6
    recharge: 60
    gcd: false
    zone: 20
    duree: 30
    effets: { reduction: 5 }
    description: "Plante un totem de pierre : vous et votre groupe subissez 5 % de dégâts en moins pendant 30 s."
  totem_de_seisme:
    nom: Totem de séisme
    type: ZONE
    icone: COBBLED_DEEPSLATE_WALL
    couleur: "#9C8463"
    niveau: 8
    cout: 10
    recharge: 25
    portee: 20
    zone: 4
    duree: 6
    puissance: 0.3
    effets: { ralentir: 2 }
    description: "Plante un totem au point visé : la terre tremble 6 s et ralentit les ennemis."
  source_interieure:
    nom: Source intérieure
    type: BUFF
    icone: PRISMARINE_CRYSTALS
    couleur: "#4FA3FF"
    niveau: 12
    gain: 40
    recharge: 90
    gcd: false
    description: "Puise dans la source : rend 40 points de mana."
  loup_fantome:
    nom: Loup fantôme
    type: BUFF
    icone: WOLF_ARMOR
    couleur: "#C9D6E2"
    niveau: 16
    recharge: 45
    gcd: false
    duree: 10
    effets: { vitesse: 2 }
    description: "Prend l'allure d'un loup fantôme : vitesse de déplacement fortement augmentée pendant 10 s."
  bourrasque:
    nom: Bourrasque
    type: CRI
    icone: FEATHER
    couleur: "#D7F3FF"
    niveau: 20
    recharge: 30
    zone: 6
    puissance: 0.4
    effets: { repousser: 1.5 }
    description: "Une rafale repousse les ennemis autour de vous."

  # ---------------- Foudre ----------------
  foudre:
    nom: Foudre
    type: PROJECTILE
    icone: LIGHTNING_ROD
    couleur: "#7FD4FF"
    spe: [foudre]
    niveau: 2
    cout: 5
    incantation: 1.3
    portee: 30
    puissance: 2.0
    description: "Un éclair puissant sur la cible visée (immobile)."
  horion_de_flammes:
    nom: Horion de flammes
    type: PROJECTILE
    icone: BLAZE_POWDER
    couleur: "#FF8A3B"
    spe: [foudre]
    niveau: 5
    cout: 8
    recharge: 8
    portee: 30
    puissance: 1.0
    effets: { saignement: 10, dot: 0.25 }
    description: "Un choc de feu : la cible brûle pendant 10 s."
  chaine_d_eclairs:
    nom: Chaîne d'éclairs
    type: FRAPPE
    icone: IRON_CHAIN
    couleur: "#BFE9FF"
    spe: [foudre]
    niveau: 9
    cout: 12
    recharge: 6
    portee: 12
    arc: 90
    puissance: 1.4
    description: "La foudre saute entre tous les ennemis devant vous."
  totem_incendiaire:
    nom: Totem incendiaire
    type: ZONE
    icone: MAGMA_BLOCK
    couleur: "#FF6A33"
    spe: [foudre]
    niveau: 14
    cout: 20
    recharge: 20
    portee: 20
    zone: 4
    duree: 6
    puissance: 0.6
    description: "Plante un totem de feu : la zone visée brûle chaque seconde pendant 6 s."
  ascendance:
