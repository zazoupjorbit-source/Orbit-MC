# ------------------------------------------------------------------
#  Paladin (Lumière) / Chevalier noir (Ombre). Ressource : Ferveur.
#  La ferveur monte à chaque attaque de base (+5) et avec les sorts « générateurs »,
#  puis se dépense dans les gros sorts ; elle retombe hors combat.
#  Format des sorts et des talents : voir guerrier.yml.
# ------------------------------------------------------------------

nom: Paladin
couleur: "#FFD66E"
icone: GOLDEN_SWORD
jouable: true
ressource: FERVEUR
armure: PLAQUES
pv: 1.15
arme: ONE_HANDED
bouclier: true
formes:
