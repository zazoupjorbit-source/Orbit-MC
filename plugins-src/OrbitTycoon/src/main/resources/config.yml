# Hôtel des ventes (/hdv, PNJ Marchand) : ventes entre joueurs en Crédits orbitaux.
hdv:
  taxe: 5               # % retenu sur chaque vente
  max-offres: 10        # par joueur, expirées comprises
  duree-heures: 48      # après, l'objet revient dans « Mes ventes »
  prix-min: 1
  prix-max: 1000000000000

# Générateurs de ressources (/gen) : un bloc posé sur son île /is qui fait apparaître sa ressource dessus.
# Production : 1 objet par générateur toutes les « intervalle-secondes », seulement si le chunk est chargé et
# qu'un membre de l'île est connecté. Jusqu'à « pile-max » générateurs du même type empilés sur un bloc (clic droit).
# Débloqués dans l'ordre de la liste : poser un générateur débloque le suivant pour toute l'île.
# Objets produits vendus avec /vendre (main) ou /vendre tout : « vente » Crédits orbitaux par objet.
# Barème : vente × 1,12 par niveau ; prix = rentabilisé en 2 h (blé) à 4 h (netherite). /tycoon reload après un changement.
generateurs:
  intervalle-secondes: 30
  pile-max: 64
  emplacements: [8, 10, 12, 15, 18, 22, 25]   # blocs générateurs par île, selon le palier de /is upgrade
  max-au-sol: 512          # au-delà, le générateur attend qu'on ramasse (anti-lag)
  liste:
    - {id: ble, nom: "Blé", bloc: HAY_BLOCK, objet: WHEAT, prix: 240, vente: 1}
    - {id: carotte, nom: "Carotte", bloc: ORANGE_TERRACOTTA, objet: CARROT, prix: 280, vente: 1.12}
