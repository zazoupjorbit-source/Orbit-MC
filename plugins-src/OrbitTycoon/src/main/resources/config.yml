    CREEPER: 12
    ENDERMAN: 18
    WITCH: 18
    BLAZE: 18
    WITHER_SKELETON: 24
    RAVAGER: 45
    EVOKER: 36
    MELON: 6
    PUMPKIN: 6
    STONE: 3
    COBBLESTONE: 3
    COAL_ORE: 6
    COPPER_ORE: 9
    IRON_ORE: 12
    DEEPSLATE_IRON_ORE: 12
    GOLD_ORE: 18
    DEEPSLATE_GOLD_ORE: 18
    REDSTONE_ORE: 18
    DEEPSLATE_REDSTONE_ORE: 18
    LAPIS_ORE: 21
    DEEPSLATE_LAPIS_ORE: 21
    DEEPSLATE_DIAMOND_ORE: 36
    DEEPSLATE_EMERALD_ORE: 45
    AMETHYST_BLOCK: 30
    NETHER_QUARTZ_ORE: 24
    ANCIENT_DEBRIS: 75

credit-orbital:
