# Orbit Tycoon — réglages.
# Après une modification : /tycoon reload (jamais /reload du serveur).

# Navigateur orbital : l'item lié qui ouvre le menu des zones.
navigateur:
  slot: 8

# Outil orbital : pioche, hache, houe, canne et épée en un seul objet lié (Shift + clic droit pour changer).
outil:
  slot: 0

# Repousse des blocs farmés (en secondes).
repousse:
  bucheron: 30
  agriculture: 20
  mine: 15

# Récompenses : toute ressource récoltée (bloc cassé, poisson pêché, mob tué) disparaît
# et rapporte directement du Flux stellaire ET des Crédits orbitaux. Rien ne tombe au sol, pas d'XP.
# Clé = nom Minecraft du bloc (OAK_LOG), du poisson (COD) ou du mob (ZOMBIE).
# « defaut » s'applique à toute ressource absente de la liste (0 = ne rapporte rien).
flux-stellaire:
  defaut: 1
  ressources:
    OAK_LEAVES: 0
    COD: 2
    SALMON: 3
    PUFFERFISH: 5
    TROPICAL_FISH: 12
    ZOMBIE: 3
    SKELETON: 3
    SPIDER: 3
    CREEPER: 4
    ENDERMAN: 6
    WITCH: 6
    BLAZE: 6
    WITHER_SKELETON: 8
    RAVAGER: 15
    EVOKER: 12
    MELON: 2
    PUMPKIN: 2
    STONE: 1
    COBBLESTONE: 1
    COAL_ORE: 2
    COPPER_ORE: 3
    IRON_ORE: 4
    DEEPSLATE_IRON_ORE: 4
    GOLD_ORE: 6
    DEEPSLATE_GOLD_ORE: 6
    REDSTONE_ORE: 6
    DEEPSLATE_REDSTONE_ORE: 6
    LAPIS_ORE: 7
    DEEPSLATE_LAPIS_ORE: 7
    DEEPSLATE_DIAMOND_ORE: 12
    DEEPSLATE_EMERALD_ORE: 15
    AMETHYST_BLOCK: 10
    NETHER_QUARTZ_ORE: 8
    ANCIENT_DEBRIS: 25

credit-orbital:
  defaut: 1
  ressources:
    OAK_LEAVES: 0
    STONE: 0
    COBBLESTONE: 0
    COAL_ORE: 1
    COPPER_ORE: 2
    IRON_ORE: 3
    DEEPSLATE_IRON_ORE: 3
    GOLD_ORE: 5
    DEEPSLATE_GOLD_ORE: 5
    REDSTONE_ORE: 4
    DEEPSLATE_REDSTONE_ORE: 4
    LAPIS_ORE: 5
    DEEPSLATE_LAPIS_ORE: 5
    DEEPSLATE_DIAMOND_ORE: 10
    DEEPSLATE_EMERALD_ORE: 12
    AMETHYST_BLOCK: 8
    NETHER_QUARTZ_ORE: 6
    ANCIENT_DEBRIS: 20
    MELON: 2
    PUMPKIN: 2
    COD: 2
    SALMON: 3
    PUFFERFISH: 4
    TROPICAL_FISH: 10
    ZOMBIE: 2
    SKELETON: 2
    SPIDER: 2
    CREEPER: 3
    ENDERMAN: 5
    WITCH: 5
    BLAZE: 5
    WITHER_SKELETON: 7
    RAVAGER: 12
    EVOKER: 10

# Mobzone : les monstres viennent des spawners posés dans le sol (tous les monstres, de jour comme de nuit).
# Apparition automatique en plus, autour des joueurs : max > 0 pour l'activer (0 = coupée).
mobzone:
  max: 0
  intervalle: 4
  par-vague: 5
  types: [ZOMBIE, SKELETON, SPIDER, HUSK]
  # Empilement : nombre max de mobs dans une pile, et distance de fusion (blocs).
  pile-max: 50
  pile-rayon: 8

# Hauteur sous laquelle un joueur qui tombe dans le vide est ramené à l'arrivée de sa zone.
vide-y: 0

# HUD permanent à droite de l'écran (pseudo, grade, monnaies, prestige, classement, île).
hud:
  # Le classement global (aux Crédits orbitaux) est recalculé toutes les X secondes.
  classement-secondes: 60
  # Grades LuckPerms, du plus haut au plus bas (clé = nom du groupe). Le premier que le joueur a est affiché.
  grades:
    fondateur: "<b><gradient:#FF3B3B:#FF8A3B>ꜰᴏɴᴅᴀᴛᴇᴜʀ</gradient></b>"
    cofondateur: "<b><gradient:#FF8A3B:#FFC83B>ᴄᴏ-ꜰᴏɴᴅᴀᴛᴇᴜʀ</gradient></b>"
    admin: "<b><gradient:#E0245E:#FF5C8A>ᴀᴅᴍɪɴ</gradient></b>"
    dev: "<b><gradient:#3A7FFF:#7FB2FF>ᴅᴇᴠ</gradient></b>"
    modo: "<b><gradient:#1FBF6A:#5EE89A>ᴍᴏᴅᴏ</gradient></b>"
    helpeur: "<b><gradient:#22C1D6:#7FE7F2>ʜᴇʟᴘᴇᴜʀ</gradient></b>"
    builder: "<b><gradient:#F5B400:#FFE066>ʙᴜɪʟᴅᴇʀ</gradient></b>"
    orbit: "<b><gradient:#62CFF4:#E0B864>ᴏʀʙɪᴛ</gradient></b>"
    vipplus: "<b><#E0B864>ᴠɪᴘ+</b>"
    vip: "<b><#62CFF4>ᴠɪᴘ</b>"
  grade-defaut: "<b><gradient:#8C96A3:#B8C0CA>ᴊᴏᴜᴇᴜʀ</gradient></b>"

# Pack de ressources du Tycoon (disque animé des anneaux-portails).
pack:
  actif: true
  # Port du petit serveur HTTP local qui sert le pack.
  port: 8794
  # Si les joueurs passent par un tunnel : URL publique du pack (vide = serveur local ci-dessus).
  url-publique: ""
