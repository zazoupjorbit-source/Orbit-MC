# Enchantements de l'Outil orbital (achetés au Noyau Orbital, par joueur, en Crédits).
# effet = valeur par niveau en % ; prix du niveau n → n+1 = prix × multiplicateur^n jusqu'au seuil,
# puis × multiplicateur-apres par niveau au-delà (plus doux, pour que les hauts niveaux restent atteignables).
enchants:
  fortune: {effet: 5, prix: 50000, multiplicateur: 1.27, seuil: 50, multiplicateur-apres: 1.06}   # +% Crédits orbitaux par récolte
  echo: {effet: 5, prix: 40000, multiplicateur: 1.27, seuil: 50, multiplicateur-apres: 1.06}      # +% Flux stellaire
  savoir: {effet: 5, prix: 40000, multiplicateur: 1.27, seuil: 50, multiplicateur-apres: 1.06}    # +% XP de l'outil
  rafale: {effet: 2, prix: 150000, multiplicateur: 1.54, seuil: 25, multiplicateur-apres: 1.08}   # % de chance de récolte ×2
  meteore: {effet: 0.5, prix: 500000, multiplicateur: 1.685, seuil: 20, multiplicateur-apres: 1.08, multiplicateur-credits: 10}   # % de chance de Crédits ×10

# Classement prestige au spawn : un panneau Top 10 à côté de chaque anneau-portail + podium des 3 meilleurs (skins).
# Les socles et le podium se posent une fois avec « /tycoon classement poser ».
classement:
  periode-secondes: 60
  panneau-echelle: 1.8   # taille des panneaux « Top 10 » à côté des anneaux-portails (ancienne valeur : 1.15)
  podium:
    angle: 108   # direction depuis le centre du spawn (degrés), entre deux avenues
    rayon: 97    # distance au centre (97 = dans le pavillon « Classement »)

# Baie des coffres au spawn : 6 coffres au décor différent (dans l'ordre : Cryo, Solaire, Nébuleuse, Astéroïde, Réacteur,
# puis Ménagerie = coffre des pets, au centre devant les 5 autres).
# Changer un nom : le modifier ici, puis /tycoon reload. Les blocs se posent une fois avec « /tycoon coffres poser ».
coffres:
  noms: ["Vote", "Farm", "Event", "Saturne", "Neptune", "Pets"]   # la clé s'appelle « Clé » + nom
  angle: 36    # direction depuis le centre du spawn (degrés), entre deux avenues
  rayon: 36
  # Clé Farm : chance (en %) à chaque récolte faite avec l'Outil orbital en main, donnée dans l'inventaire.
  cle-farm:
    chance: 2.0
    coffre: 2      # coffre (1 à 6) dont la clé tombe : 2 = « Farm »
  # Clic gauche sur un coffre = aperçu du contenu ; clic droit avec la bonne clé en main = ouverture.
  # Contenu de chaque coffre (1 à 6). Vide = « contenu bientôt dévoilé » (Saturne et Neptune : plus tard).
  # Une ligne = un lot ; chance = poids relatif (ici chaque coffre fait 100 → chance = %).
  # rarete : commun, rare, epique, legendaire, mythique (légendaire et mythique sont annoncés à tout le serveur).
  # Types :
  #   objet      : {objet: DIAMOND, nombre: 3}                         objet vanilla
  #   capsule    : {monnaie: credits|flux, minutes: 5, taille: 1-3}    clic droit = N min de farm de la meilleure ressource
  #   booster    : {booster: credits|flux|xp, mult: 2, minutes: 30}    clic droit = activé (temps connecté seulement)
  #   cle        : {coffre: 1-6, nombre: 2}                            clé d'un autre coffre
  #   generateur : {ecart: 0, nombre: 2}                               0 = meilleur générateur débloqué de l'île, -1 = un cran dessous
  #   titre      : {titre: id}                                         plaque de titre cosmétique (titres.liste)
  #   equipement : {}                                                  pièce d'équipement de farm au hasard (20 pièces)
  # nom: "..." (optionnel) remplace le nom affiché.
  loots:
    # Coffre Vote : petit mais régulier (une clé par vote), pousse vers les clés Farm et Event.
    1:
      - {type: capsule, monnaie: credits, minutes: 5, taille: 1, chance: 25, rarete: commun}
      - {type: capsule, monnaie: flux, minutes: 5, taille: 1, chance: 20, rarete: commun}
      - {type: cle, coffre: 2, nombre: 2, chance: 15, rarete: commun}
      - {type: booster, booster: credits, mult: 1.5, minutes: 15, chance: 12, rarete: rare}
      - {type: booster, booster: flux, mult: 1.5, minutes: 15, chance: 8, rarete: rare}
      - {type: generateur, ecart: 0, nombre: 2, chance: 8, rarete: rare}
      - {type: capsule, monnaie: credits, minutes: 20, taille: 2, chance: 5, rarete: epique}
      - {type: booster, booster: xp, mult: 2, minutes: 30, chance: 4, rarete: epique}
      - {type: cle, coffre: 3, nombre: 1, chance: 2, rarete: epique}
      - {type: titre, titre: electeur, chance: 0.8, rarete: legendaire}
      - {type: capsule, monnaie: credits, minutes: 60, taille: 3, chance: 0.2, rarete: mythique}
    # Coffre Farm : clé trouvée en farmant (2 % par récolte), donc beaucoup de clés → lots modestes.
    # Équipements de farm : 10 % du coffre (0,5 % par pièce), choix de Wane le 24/11/2026.
    2:
      - {type: capsule, monnaie: credits, minutes: 2, taille: 1, chance: 27, rarete: commun}
      - {type: equipement, chance: 10, rarete: rare}
      - {type: capsule, monnaie: flux, minutes: 2, taille: 1, chance: 23, rarete: commun}
      - {type: booster, booster: xp, mult: 1.5, minutes: 10, chance: 12, rarete: rare}
      - {type: booster, booster: credits, mult: 1.5, minutes: 10, chance: 10, rarete: rare}
      - {type: capsule, monnaie: credits, minutes: 10, taille: 2, chance: 8, rarete: rare}
      - {type: generateur, ecart: -1, nombre: 2, chance: 4, rarete: epique}
      - {type: booster, booster: xp, mult: 2, minutes: 20, chance: 3, rarete: epique}
      - {type: cle, coffre: 3, nombre: 1, chance: 1.5, rarete: legendaire}
      - {type: capsule, monnaie: flux, minutes: 10, taille: 2, chance: 1, rarete: epique}
      - {type: titre, titre: moissonneur, chance: 0.5, rarete: legendaire}
    # Coffre Event : clés données pendant les événements (staff) → les plus gros lots du moment.
    3:
      - {type: capsule, monnaie: credits, minutes: 15, taille: 2, chance: 20, rarete: commun}
      - {type: capsule, monnaie: flux, minutes: 15, taille: 2, chance: 16, rarete: commun}
      - {type: booster, booster: credits, mult: 2, minutes: 30, chance: 14, rarete: rare}
      - {type: booster, booster: xp, mult: 2, minutes: 30, chance: 12, rarete: rare}
      - {type: generateur, ecart: 0, nombre: 8, chance: 10, rarete: rare}
      - {type: booster, booster: flux, mult: 2, minutes: 30, chance: 8, rarete: rare}
      - {type: cle, coffre: 2, nombre: 5, chance: 8, rarete: rare}
      - {type: capsule, monnaie: credits, minutes: 45, taille: 3, chance: 5, rarete: epique}
      - {type: generateur, ecart: 1, nombre: 2, chance: 3, rarete: epique}
      - {type: booster, booster: credits, mult: 3, minutes: 60, chance: 1.5, rarete: legendaire}
      - {type: titre, titre: comete, chance: 1.5, rarete: legendaire}
      - {type: titre, titre: legende, chance: 0.5, rarete: mythique}
      - {type: capsule, monnaie: flux, minutes: 120, taille: 3, chance: 0.5, rarete: mythique}

# Titres cosmétiques (Butin.java) : gagnés en plaques dans les coffres, choisis avec /titre, affichés devant
# le pseudo dans le chat. id → texte MiniMessage. Purement cosmétique (règles Mojang).
titres:
  liste:
    electeur: "<#62CFF4>Électeur fidèle"
    moissonneur: "<#7CFC9A>Moissonneur cosmique"
    comete: "<#C77DFF>Chasseur de comètes"
    legende: "<gradient:#62CFF4:#E0B864>Légende orbitale</gradient>"
    grade_pilote: "<gradient:#9FB8D0:#D8F6FF>Pilote</gradient>"
    grade_commandant: "<gradient:#3FA9F5:#62CFF4>Commandant</gradient>"
    grade_amiral: "<gradient:#E0B864:#FFF1A0>Amiral</gradient>"
    grade_astral: "<gradient:#C77DFF:#62CFF4>✦ Astral ✦</gradient>"
    pionnier: "<#62CFF4>Pionnier stellaire"
    voyageur: "<#9FB8D0>Voyageur du vide"
    capitaine: "<#3FA9F5>Capitaine cosmique"
    dompteur: "<#C77DFF>Dompteur de nébuleuses"
    seigneur: "<gradient:#E0B864:#FFF1A0>Seigneur des étoiles</gradient>"
    devoreur: "<gradient:#C77DFF:#FF9F43>Dévoreur de mondes</gradient>"
  # Titres vendus au rayon Titres de la boutique (id: prix en Plasma). Les autres : coffres ou grades.
  boutique:
    pionnier: 300
    voyageur: 500
    capitaine: 800
    dompteur: 1200
    seigneur: 2000
    devoreur: 3500
  # Image spatiale de chaque titre dans la boutique (titre_fusee, titre_satellite, titre_comete, titre_galaxie, titre_etoile, titre_trou_noir).
  icones:
    electeur: titre_satellite
    moissonneur: titre_etoile
    comete: titre_comete
    legende: titre_galaxie
    pionnier: titre_fusee
    voyageur: titre_satellite
    capitaine: titre_fusee
    dompteur: titre_galaxie
    seigneur: titre_etoile
    devoreur: titre_trou_noir

# Équipements de farm (Equipements.java) : 1 set de 4 pièces par outil (Cratère = pioche, Sylvanova = hache,
# Moisson Solaire = houe, Marée Lunaire = canne, Supernova = épée). Pièce PORTÉE + outil du set en main :
# bonus en % sur l'XP d'outil, les ressources récoltées et la monnaie (Crédits + Flux). Obtenus dans le coffre Farm.
equipements:
  bonus-piece: 2.5     # par pièce portée
  bonus-set: 15.0      # set complet (4/4), remplace 4 × bonus-piece
  coffre-farm: true    # le coffre Farm (coffres.cle-farm.coffre) donne une pièce au hasard
  # Armures premium (boutique, Plasma) : bonus en % de Crédits, Flux et XP avec TOUS les outils (0 = désactivé).
  premium:
    nebuleuse: {bonus-piece: 5.0, bonus-set: 25.0, prix-piece: 1200, prix-set: 4200}
    zenith: {bonus-piece: 10.0, bonus-set: 50.0, prix-piece: 3000, prix-set: 10500}

# Pets (Pets.java) : 20 espèces (4 par outil : Fortune, XP, Money, Proc) × 4 raretés = 80 pets.
# Obtenus dans le coffre Ménagerie (6e coffre) ; collection et équipement (3 max) : Navigateur → Pets.
# bonus = % donné par un pet de cette rareté (seulement avec son outil) ;
# chances = poids relatifs de la rareté à l'ouverture du coffre (puis espèce au hasard parmi les 20).
pets:
  bonus: {commun: 5, rare: 10, epique: 15, legendaire: 25}
  chances: {commun: 70, rare: 22, epique: 7.5, legendaire: 0.5}
  # Niveaux : un pet arrive niveau 0 ; bonus = bonus max × niveau / niveau-max.
  # Chaque récolte donne par-recolte XP à chaque pet équipé ; passer du niveau n à n+1 coûte base + par-niveau × n XP
  # (10 + 2n par défaut : niveau 10 en 190 récoltes, 50 en ≈ 3 000, 100 en ≈ 10 900).
  niveau-max: 100
  xp: {base: 10, par-niveau: 2, par-recolte: 1}

# Boutique du spawn : avenues (identifiants de zone) qui ont un PNJ astronaute sous une arche.
# Après un changement : /tycoon reload, puis /tycoon boutique poser (nouvelles arches) ou retirer (arches en trop).
boutique:
  avenues: [mobzone]   # une seule arche : face aux coffres
  # Prix des clés en Plasma, dans l'ordre de coffres.noms (Vote, Farm, Event, Saturne, Neptune, Pets).
  prix-cles: [50, 80, 150, 500, 1000, 300]
  # Seconde ligne du rayon Clés : lot de 16 clés, réduction en % sur le prix ×16.
  reduction-pack-cles: 20
  # Rayon Items : baguettes de vente (prix en Plasma, utilisations) et boosters (Plasma, ×mult pendant minutes).
  baguettes:
    orbitale: {prix: 400, utilisations: 100}
    nebulaire: {prix: 900, utilisations: 100}
    stellaire: {prix: 1500, utilisations: 50}
  boosters: {credits: 250, flux: 250, xp: 250, mult: 2.0, minutes: 30}

# Tuto guidé (1re connexion) : /solde, Navigateur, Outil orbital, récolte, découverte des îles, coffres, /vote.
# Avancement des joueurs dans tuto.yml. /tuto (consigne), /tuto passer, /tuto recommencer ; admin : /tycoon tuto reset <joueur>.
tuto:
  actif: true
  recoltes: 10             # ressources à récolter à l'étape 5
  zones: 5                 # îles de farm à visiter à l'étape 6 (1 à 5)
  cle-coffre: 1            # coffre (1 à 6) dont la clé est offerte à l'étape 7
  recompense-credits: 1500  # Crédits orbitaux donnés une seule fois à la fin du tuto

# Niveaux, XP et prestige des outils (fiche d'outil : Shift + clic droit, puis clic droit sur un outil).
progression:
  niveau-max: 100
  prestige-max: 100
  # XP pour passer du niveau N au suivant = (xp-base + xp-par-niveau × (N - 1)) × (1 + xp-bonus-prestige × prestige)
  xp-base: 250
  xp-par-niveau: 40
  xp-bonus-prestige: 0.04
  # XP gagnée par ressource récoltée (clé = nom du bloc, du poisson ou du mob, comme pour les monnaies).
  xp:
    defaut: 30
    ressources: {}
  # Coût du prestige (Crédits) = crédits de la meilleure ressource débloquée × (récoltes pour monter 1 → 100
  # + prestige-minutes-manquantes × 60 × recoltes-par-seconde). Au niveau 100, il manque ces minutes de farm.
  prestige-minutes-manquantes: 15
  recoltes-par-seconde: 1
  # Cases d'amélioration (9 par outil), noms et prérequis à définir. Une liste par outil possible :
  # ameliorations.pioche, .hache, .houe, .peche, .epee ; sinon .defaut. Champs : nom, objet, description, prerequis.
  ameliorations:
    defaut:
      - {nom: "Amélioration 1", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 2", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 3", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 4", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 5", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 6", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 7", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 8", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}
      - {nom: "Amélioration 9", objet: GRAY_DYE, description: "À définir", prerequis: "À définir"}

# Quêtes de prestige (PNJ Aventurier) : une quête par outil tous les « pas » prestiges, jusqu'à progression.prestige-max.
quetes:
  pas: 10
  # Récompense PROVISOIRE si rien n'est réglé ci-dessous : palier × credit-par-palier Crédits orbitaux.
  credit-par-palier: 1500
  # Vraies récompenses (à définir) : recompenses.<outil>.<palier> ou recompenses.tous.<palier>.
  # Champs : credit, flux, texte (affiché), commandes (console, %joueur% = pseudo). Exemple :
  #   tous:
  #     50: {credit: 50000, texte: "1 clé de coffre n°3", commandes: ["tycoon cle 3 %joueur% 1"]}
  recompenses: {}

