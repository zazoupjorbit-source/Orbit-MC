  ressources:
    PUFFERFISH: 48
    COD: 24
    SALMON: 36
    WHEAT: 24
    TROPICAL_FISH: 120
    OAK_LOG: 24
    OAK_LEAVES: 0
    STONE: 0
    COBBLESTONE: 0
