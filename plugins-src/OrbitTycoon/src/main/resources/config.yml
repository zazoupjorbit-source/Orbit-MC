    - {chene: 6000, bouleau: 4000, epicea: 2500}
    - {epicea: 7000, acajou: 5000, acacia: 3000}
    - {acacia: 8000, chene_noir: 6000, mangrove: 4000}
    - {mangrove: 9000, cerisier: 7000, os: 5000}
    - {os: 10000, ficelle: 8000, poudre: 6000}
    - {poudre: 12000, miel: 9000, slime: 7000}
    - {slime: 14000, perle: 10000, blaze: 8000}
    - {blaze: 16000, charbon: 12000, cuivre: 9000}
    - {cuivre: 18000, fer: 14000, lapis: 10000, redstone: 6000}
    - {redstone: 20000, quartz: 16000, or: 12000, amethyste: 8000}
    - {amethyste: 24000, glowstone: 18000, prismarine: 14000, obsidienne: 10000}
    - {obsidienne: 30000, diamant: 22000, emeraude: 16000, netherite: 12000}
  # Niveau max des enchantements de l'Outil orbital autorisé par le Noyau : enchants[0] = Noyau niveau 1, etc.
  enchants:
    - {fortune: 4, savoir: 4, echo: 4}
    - {fortune: 10, savoir: 10, echo: 10, rafale: 2}
    - {fortune: 14, savoir: 14, echo: 14, rafale: 4}
    - {fortune: 20, savoir: 20, echo: 20, rafale: 8, meteore: 2}
    - {fortune: 24, savoir: 24, echo: 24, rafale: 10, meteore: 4}
    - {fortune: 30, savoir: 30, echo: 30, rafale: 12, meteore: 6}
    - {fortune: 34, savoir: 34, echo: 34, rafale: 14, meteore: 8}
    - {fortune: 40, savoir: 40, echo: 40, rafale: 18, meteore: 10}
    - {fortune: 44, savoir: 44, echo: 44, rafale: 20, meteore: 12}
