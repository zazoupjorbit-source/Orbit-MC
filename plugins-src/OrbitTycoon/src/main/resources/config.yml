# Mobzone : les monstres viennent des spawners posés dans le sol (tous les monstres, de jour comme de nuit).
# Apparition automatique en plus, autour des joueurs : max > 0 pour l'activer (0 = coupée).
mobzone:
  max: 0
  intervalle: 4
  par-vague: 5
  types: [ZOMBIE, SKELETON, SPIDER, HUSK]
  # Empilement : nombre max de mobs dans une pile, et distance de fusion (blocs).
  pile-max: 50
  pile-rayon: 8

# Hauteur sous laquelle un joueur qui tombe dans le vide est ramené à l'arrivée de sa zone.
vide-y: 0

# HUD permanent à droite de l'écran (pseudo, grade, monnaies, outil, prestige, classement, île, générateurs).
hud:
  # Le classement global (aux Crédits orbitaux) est recalculé toutes les X secondes.
  classement-secondes: 60
  # Grades LuckPerms, du plus haut au plus bas (clé = nom du groupe). Le premier que le joueur a est affiché.
  grades:
    fondateur: "<b><gradient:#FF3B3B:#FF8A3B>ꜰᴏɴᴅᴀᴛᴇᴜʀ</gradient></b>"
    cofondateur: "<b><gradient:#FF8A3B:#FFC83B>ᴄᴏ-ꜰᴏɴᴅᴀᴛᴇᴜʀ</gradient></b>"
    admin: "<b><gradient:#E0245E:#FF5C8A>ᴀᴅᴍɪɴ</gradient></b>"
    dev: "<b><gradient:#3A7FFF:#7FB2FF>ᴅᴇᴠ</gradient></b>"
    modo: "<b><gradient:#1FBF6A:#5EE89A>ᴍᴏᴅᴏ</gradient></b>"
    helpeur: "<b><gradient:#22C1D6:#7FE7F2>ʜᴇʟᴘᴇᴜʀ</gradient></b>"
    builder: "<b><gradient:#F5B400:#FFE066>ʙᴜɪʟᴅᴇʀ</gradient></b>"
    orbit: "<b><gradient:#62CFF4:#E0B864>ᴏʀʙɪᴛ</gradient></b>"
    astral: "<b><gradient:#C77DFF:#62CFF4>ᴀꜱᴛʀᴀʟ</gradient></b>"
    amiral: "<b><gradient:#E0B864:#FFF1A0>ᴀᴍɪʀᴀʟ</gradient></b>"
    commandant: "<b><gradient:#3FA9F5:#62CFF4>ᴄᴏᴍᴍᴀɴᴅᴀɴᴛ</gradient></b>"
    pilote: "<b><gradient:#9FB8D0:#D8F6FF>ᴘɪʟᴏᴛᴇ</gradient></b>"
    vipplus: "<b><#E0B864>ᴠɪᴘ+</b>"
    vip: "<b><#62CFF4>ᴠɪᴘ</b>"
  grade-defaut: "<b><gradient:#8C96A3:#B8C0CA>ᴊᴏᴜᴇᴜʀ</gradient></b>"

# Liste des joueurs (Tab) : cadre HD du grade (hud.grades), pseudo, prestige. Glyphes : tools/gen-tab.ps1.
# Optionnel : tab.entete / tab.pied (MiniMessage) avec <en_ligne> <pluriel> <prestige> <rang>. Absents = texte par défaut.
tab:
  actif: true

# Pack de ressources du Tycoon (disque animé des anneaux-portails).
pack:
  actif: true
  # Port du petit serveur HTTP local qui sert le pack.
  port: 8794
  # Si les joueurs passent par un tunnel : URL publique du pack (vide = serveur local ci-dessus).
  url-publique: ""

# Îles des joueurs (/is) : monde vide « iles_joueurs », une île par équipe.
# tailles = côté de la zone (en blocs) à chaque niveau ; couts = prix en Crédits orbitaux pour atteindre ce niveau
# (le premier coût, 0, est celui de l'île de départ). Mur invisible au bord de la zone.
iles:
  # 20 niveaux : taille de la zone (côté en blocs, 900 max) et prix en Crédits pour atteindre ce niveau.
  tailles: [100, 115, 130, 145, 160, 180, 200, 220, 245, 270, 300, 330, 360, 400, 440, 490, 540, 600, 660, 750]
  couts: [0, 500000, 1200000, 2500000, 5000000, 9000000, 16000000, 28000000, 48000000, 80000000, 135000000, 225000000, 375000000, 620000000, 1000000000, 1700000000, 2800000000, 4600000000, 7500000000, 12000000000]
# Noyau Orbital : balise posée au nord du pad de chaque île (clic droit = menu). Son niveau = niveau de l'île (20 niveaux).
# Pour monter d'un niveau : déposer les objets des générateurs ci-dessous + payer iles.couts (Crédits orbitaux).
# Les dépôts sont partagés entre les membres ; seul un Officier ou le Chef lance l'amélioration.
noyau:
  # objets[0] = pour passer du niveau 1 au 2, objets[1] = du 2 au 3… jusqu'à objets[18] = du 19 au 20 (id de générateur: nombre).
  objets:
    - {ble: 1500, carotte: 800, pomme_de_terre: 400}
    - {carotte: 2000, pomme_de_terre: 1200, betterave: 600}
    - {betterave: 2500, canne_a_sucre: 1500, bambou: 800}
    - {bambou: 3000, citrouille: 2000, pasteque: 1000}
