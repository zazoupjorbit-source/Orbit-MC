# Hôtel des ventes (/hdv, PNJ Marchand) : ventes entre joueurs en Crédits orbitaux.
hdv:
  taxe: 5               # % retenu sur chaque vente
  max-offres: 10        # par joueur, expirées comprises
  duree-heures: 48      # après, l'objet revient dans « Mes ventes »
  prix-min: 1
  prix-max: 1000000000000

# Générateurs de ressources (/gen) : un bloc posé sur son île /is qui fait apparaître sa ressource dessus.
# Production : 1 objet par générateur toutes les « intervalle-secondes », seulement si le chunk est chargé et
# qu'un membre de l'île est connecté. Jusqu'à « pile-max » générateurs du même type empilés sur un bloc (clic droit).
# Débloqués dans l'ordre de la liste : poser un générateur débloque le suivant pour toute l'île.
# Objets produits vendus avec /vendre (main) ou /vendre tout : « vente » Crédits orbitaux par objet.
# Barème : vente × 1,12 par niveau ; prix = rentabilisé en 30 min (blé) à 1 h (netherite), progression linéaire. /tycoon reload après un changement.
generateurs:
  # Nombre qu'un joueur peut poser en arrivant sur le Tycoon (affiché « posés / max » dans le HUD).
  depart: 10
  # Cadeau de bienvenue : générateurs donnés gratuitement à la toute première connexion (0 = aucun).
  # type = id d'un générateur de la liste ci-dessous ; vide = le premier (blé).
  offerts:
    nombre: 5
    type: ""
  intervalle-secondes: 5
  par-cycle: 3            # objets produits par générateur à chaque intervalle
  # Coffre collecteur (menu /gen) : comme le Collecteur, mais il RANGE les ressources dans le coffre (ne vend pas).
  coffre-collecteur:
    prix-credits: 600000
  pile-max: 64
  emplacements: [8, 10, 12, 14, 16, 18, 20, 22, 25, 28, 31, 34, 37, 40, 44, 48, 52, 56, 60, 65]   # blocs générateurs par île, selon le niveau du Noyau
  max-au-sol: 512          # au-delà, le générateur attend qu'on ramasse (anti-lag)
  liste:
    - {id: ble, nom: "Blé", bloc: HAY_BLOCK, objet: WHEAT, prix: 680, vente: 0.63}
