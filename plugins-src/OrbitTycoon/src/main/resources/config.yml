  # Collecteur orbital (menu /gen) : coffre qui ramasse et vend tout seul les ressources de générateur de son chunk.
  # ATTENTION : payé en Plasma (monnaie payante) = avantage de jeu → à valider avec Zazou avant toute mise en ligne (EULA Mojang).
  collecteur:
    prix-plasma: 500
    balayage-secondes: 10    # ramassage des ressources déjà au sol dans le chunk

# Clear lag : retire régulièrement les objets au sol, flèches plantées et orbes d'XP (tous les mondes).
# Les ressources des générateurs sont gardées (revenu des joueurs, déjà plafonné par generateurs.max-au-sol).
# /tycoon nettoyage (temps restant) ou /tycoon nettoyage maintenant ; /tycoon reload après un changement.
nettoyage:
  actif: true
  intervalle-minutes: 15
  avertissements-secondes: [60, 10]
  barre-secondes: 60          # barre en haut de l'écran (compte à rebours) avant le passage ; 0 = pas de barre
  garder-ressources-generateurs: true

# Vote Party : barre permanente en haut de l'écran « Vote Party 0/100 ».
# Les votes s'ajoutent avec « tycoon voteparty ajouter <n> » (console) : un futur plugin de votes (Votifier)
# lancera cette commande à chaque vote. À l'objectif, chaque joueur connecté reçoit les récompenses
# ({joueur} = son pseudo, commandes lancées par la console) et le compteur repart à 0.
voteparty:
  actif: true
  objectif: 100
  recompenses:
    - "tycoon cle 1 {joueur} 1"     # une Clé Vote

# Réception des votes (protocole Votifier v1 + v2, codé dans OrbitTycoon) : les sites de vote envoient
# « tel joueur a voté » sur ce port. À chaque vote : +1 Vote Party et la clé n° « cle » (1 = Clé Vote).
# Joueur absent du Tycoon ou inventaire plein : la clé attend dans votes-attente.yml (donnée à la connexion).
# Clé publique (v1) et jeton (v2) à donner aux sites : plugins/OrbitTycoon/votes/ (secrets, jamais dans git).
# Test : /tycoon vote <joueur> [site]
votes:
  actif: true
  hote: "0.0.0.0"
  port: 8192
  cle: 1
  nombre: 1
  annonce: true


# Magasin de blocs (PNJ Bâtisseur au Marché orbital, ou /blocs) : tous les blocs posables pour décorer son île,
# payés en Crédits orbitaux. Jamais les blocs des générateurs ni les blocs techniques/dangereux. /tycoon reload après un changement.
magasin-blocs:
  multiplicateur: 1.0   # tous les prix du barème × ce nombre
  prix: {}              # prix fixés bloc par bloc, ex. {BEACON: 50000, GLASS: 2}
  exclus: []            # blocs retirés en plus, ex. [ENDER_CHEST]

# Grades du Tycoon (Grades.java), achetés en Plasma à la boutique. bonus = % de Crédits, Flux, XP d'outil et production des générateurs.
# Groupe LuckPerms du même nom, donné avec le contexte server=tycoon. Monter de grade = payer la différence.
# offres-hdv = offres en plus à l'hôtel des ventes (s'ajoute à hdv.max-offres).
grades:
  pilote: {prix: 1500, bonus: 5.0, offres-hdv: 5}
  commandant: {prix: 3500, bonus: 10.0, offres-hdv: 10}
  amiral: {prix: 7500, bonus: 15.0, offres-hdv: 20}
  astral: {prix: 15000, bonus: 25.0, offres-hdv: 30}
