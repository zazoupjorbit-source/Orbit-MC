    - {nom: "Améthyste", bloc: AMETHYST_BLOCK, credit: 80, flux: 100, xp: 7}
    - {nom: "Diamant", bloc: DIAMOND_ORE, credit: 108, flux: 135, xp: 8}
    - {nom: "Émeraude", bloc: EMERALD_ORE, credit: 140, flux: 175, xp: 10}
    - {nom: "Débris antiques", bloc: ANCIENT_DEBRIS, credit: 180, flux: 225, xp: 12}
  hache:
    - {nom: "Chêne", origine: true, icone: OAK_LOG}
    - {nom: "Bouleau", bloc: BIRCH_LOG, feuilles: BIRCH_LEAVES, credit: 2, flux: 2, xp: 2}
    - {nom: "Épicéa", bloc: SPRUCE_LOG, feuilles: SPRUCE_LEAVES, credit: 3, flux: 3, xp: 2}
    - {nom: "Acajou", bloc: JUNGLE_LOG, feuilles: JUNGLE_LEAVES, credit: 4, flux: 4, xp: 3}
    - {nom: "Acacia", bloc: ACACIA_LOG, feuilles: ACACIA_LEAVES, credit: 6, flux: 6, xp: 3}
    - {nom: "Chêne noir", bloc: DARK_OAK_LOG, feuilles: DARK_OAK_LEAVES, credit: 8, flux: 8, xp: 4}
    - {nom: "Palétuvier", bloc: MANGROVE_LOG, feuilles: MANGROVE_LEAVES, credit: 11, flux: 11, xp: 5}
    - {nom: "Cerisier", bloc: CHERRY_LOG, feuilles: CHERRY_LEAVES, credit: 15, flux: 15, xp: 6}
    - {nom: "Chêne pâle", bloc: PALE_OAK_LOG, feuilles: PALE_OAK_LEAVES, credit: 20, flux: 20, xp: 7}
    - {nom: "Carmin", bloc: CRIMSON_STEM, feuilles: NETHER_WART_BLOCK, credit: 27, flux: 27, xp: 8}
    - {nom: "Biscornu", bloc: WARPED_STEM, feuilles: WARPED_WART_BLOCK, credit: 35, flux: 35, xp: 10}
  houe:
    - {nom: "Blé", origine: true, icone: WHEAT}
    - {nom: "Carotte", bloc: CARROTS, icone: CARROT, credit: 2, flux: 2, xp: 2}
    - {nom: "Pomme de terre", bloc: POTATOES, icone: POTATO, credit: 3, flux: 3, xp: 2}
