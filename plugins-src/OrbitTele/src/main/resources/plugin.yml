name: OrbitTele
version: '1.0.0'
main: fr.orbit.tele.OrbitTele
api-version: '1.21'
description: "ORBIT TV : écrans en cartes sans mod ni pack côté joueur. Partage d'écran depuis une page web, et console de jeux d'arcade jouable devant l'écran."
authors: [ORBIT]
softdepend: [OrbitCasino, OrbitDevCore]

commands:
  tele:
    description: "ORBIT TV : poser un écran, sa console, obtenir sa page de diffusion ou sa page d'écoute."
    usage: "/tele [poser|console|retirer|lien|son|stop|liste|quitter]"
    aliases: [tv, orbittv]

permissions:
  orbittele.admin:
    description: Poser et retirer les écrans, diffuser son écran.
    default: op
