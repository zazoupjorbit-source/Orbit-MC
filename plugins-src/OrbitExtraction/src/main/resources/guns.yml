# ------------------------------------------------------------------
#  Armes, munitions et grenades — /extraction reload pour recharger.
#  Arsenal repris d'OrbitGuns (Desktop\mods\OrbitGuns.zip), rééquilibré pour le PvPvE.
#  Contrôles : clic droit = tirer (maintenu pour les armes auto), clic gauche = viser (zoom),
#              F = recharger, accroupi = un peu plus précis.
#
#  degats   : demi-cœurs par balle (par plomb pour un fusil à pompe), avant armure. Un joueur a 20.
#  tete     : multiplicateur sur un tir à la tête.
#  cadence  : coups par minute.   rechargement : secondes.
#  dispersion : degrés au repos (x1,8 en sprint, x2,5 en l'air, x0,7 accroupi).
#  recul / recul-max : dispersion ajoutée par tir, et plafond (retombe tout seul entre les tirs).
#  bruit    : rayon (blocs) dans lequel les infestés entendent le tir ; fixe aussi la portée du son.
#  visee-zoom : vitesse de marche pendant la visée (plus bas = plus de zoom ; négatif = lunette).
#  visee-dispersion : multiplicateur de dispersion pendant la visée.
#  explosion : { rayon, degats } — le projectile explose à l'impact (lance-grenades, BFG).
#  materiau : objet de base. Le modèle 3D vient du pack de ressources (tools/gen-pack.ps1), qui
#             remplace cet objet quand il porte la donnée « orbitguns:<id> » : si tu changes le
#             materiau d'une arme, change-le aussi dans la table $base de gen-pack.ps1.
# ------------------------------------------------------------------

