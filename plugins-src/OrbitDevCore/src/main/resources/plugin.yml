name: OrbitDevCore
version: '1.0.0'
main: fr.orbit.devcore.OrbitDevCore
api-version: '1.21'
description: Plugin core du serveur de dev ORBIT (spawn, warps, boussole, PNJ de serveurs, cosmétiques).
authors: [ORBIT]
# LuckPerms (optionnel) : préfixes de rôle dans le chat.
softdepend: [LuckPerms]

commands:
  spawn:
    description: Téléporte au spawn.
    usage: /spawn [joueur]
  setspawn:
    description: Définit le spawn à ta position.
    usage: /setspawn
  warp:
    description: Ouvre le menu des warps ou téléporte à un warp.
    usage: /warp [nom]
    aliases: [warps]
  setwarp:
    description: Crée ou déplace un warp à ta position.
    usage: /setwarp <nom> [icône]
  delwarp:
    description: Supprime un warp.
    usage: /delwarp <nom>
  boussole:
    description: Donne la boussole de téléportation.
    usage: /boussole
    aliases: [compass]
  lobby:
    description: Retour au lobby.
    usage: /lobby
    aliases: [hub]
  servernpc:
    description: Gère les PNJ qui envoient vers les autres serveurs.
    usage: /servernpc <create|remove|list|tphere|tp|server|world|name|profession>
    aliases: [snpc]
  devworld:
    description: Crée et gère les mondes de test (superflat...).
    usage: /devworld <create|list|tp> [nom] [flat|normal|void]
  cosmetiques:
    description: Ouvre le menu des cosmétiques (traînées, auras, chapeaux, dos, ballons, familiers, montures).
    usage: /cosmetiques [trainees|auras|chapeaux|dos|ballons|familiers|montures|retirer]
    aliases: [cosmetics, cosmetique, cosmetic]
  monture:
    description: Invoque ta monture (ou ouvre le choix des montures).
    usage: /monture [choisir|renvoyer]
    aliases: [mount]
  station:
    description: Génère et règle le lobby « La Station ».
    usage: /station <generer|ecarts|etancheite|apercu|effacer|regle|tp|points|recharger>
  boutique:
    description: Ouvre le menu de la boutique.
    usage: /boutique
    aliases: [shop, store]
  orbitdev:
    description: Administration d'OrbitDevCore.
    usage: /orbitdev <reload|info|pack|feu>

permissions:
  orbitdev.spawn:
    description: Utiliser /spawn.
    default: true
  orbitdev.spawn.others:
    description: Téléporter un autre joueur au spawn.
    default: op
  orbitdev.warp:
    description: Utiliser /warp et le menu des warps.
    default: true
  orbitdev.compass:
    description: Recevoir la boussole avec /boussole.
    default: true
  orbitdev.cosmetics:
    description: Ouvrir le menu des cosmétiques (/cosmetiques et bouton de la boussole).
    default: true
  orbitdev.shop:
    description: Ouvrir le menu de la boutique (/boutique et bouton de la boussole).
    default: true
  orbitdev.admin:
    description: Gérer le spawn, les warps, les PNJ et recharger le plugin.
    default: op
