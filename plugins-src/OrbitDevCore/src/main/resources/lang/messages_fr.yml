# Mini-jeu feu d'artifice. <dot> = pastille à la couleur du joueur, <killer> = pseudo coloré du tireur.
firework:
  item:
    name: "<gradient:#FF4FD8:#3A7FFF><bold>Feu d'artifice</bold></gradient>"
    lore:
      - "<gray>Mini-jeu : élimine les joueurs"
      - "<gray>en mode feu d'artifice. Un tir suffit."
      - "<gray>Enchaîne les éliminations pour débloquer"
      - "<gray>des bonus : vitesse, grappin, bouclier..."
      - ""
      - "<#3A7FFF>Clic gauche</#3A7FFF> <gray>· entrer dans le mode"
    name-armed: "<gradient:#FF4FD8:#3A7FFF><bold>Feu d'artifice</bold></gradient> <dark_gray>·</dark_gray> <#FF4D4D><bold>ARMÉ</bold>"
    lore-armed:
      - "<gray>Tu peux être éliminé par les autres"
      - "<gray>joueurs en mode feu d'artifice."
      - ""
      - "<#3A7FFF>Clic droit</#3A7FFF> <gray>· tirer"
      - "<#3A7FFF>Clic gauche</#3A7FFF> <gray>· quitter le mode"
  enter-title: "<gradient:#FF4FD8:#3A7FFF><bold>MODE FEU D'ARTIFICE</bold></gradient>"
  enter-subtitle: "<gray>Clic droit pour tirer · un tir = une élimination"
  left: "<gray>Tu as quitté le mode feu d'artifice."
  leave-locked: "<#FF4D4D>Tu viens de tirer : encore <white><seconds> s</white> avant de pouvoir quitter le mode."
  not-armed: "<gray>Clic gauche avec le feu d'artifice pour entrer en mode feu d'artifice."
  hud: "<dot> <white><bold>FEU D'ARTIFICE</bold></white> <dark_gray>|</dark_gray> <gray>Éliminations <white><kills></white> <dark_gray>|</dark_gray> <gray>Série <white><streak></white> <dark_gray>|</dark_gray> <gray>En jeu <white><players></white><bonuses>"
  # Ajouté à la fin du HUD quand le joueur a des bonus. <list> = noms des bonus.
  hud-bonuses: " <dark_gray>|</dark_gray> <#F5C542><list>"
  eliminated-title: "<#FF4D4D><bold>ÉLIMINÉ</bold>"
  eliminated-subtitle: "<gray>par <killer>"
  kill: "<#7CFC9A><bold>+1</bold> <gray>· tu as éliminé <white><victim></white>"
  feed: "<prefix><killer> <gray>a éliminé</gray> <white><victim></white><gray>.</gray>"
  streak: "<prefix><killer> <#F5C542>enchaîne <white><streak></white> éliminations sans tomber !"
  lobby-only: "<prefix><yellow>Le mini-jeu feu d'artifice n'existe qu'au lobby."
  # Outils de test (/orbitdev feu, admins).
  not-in-mode: "<prefix><red>Entre d'abord en mode feu d'artifice (clic gauche avec le feu d'artifice)."
  streak-set: "<prefix><green>Série fixée à <white><streak></white> : bonus débloqués jusqu'à ce palier."
  admin-help:
    - "<gradient:#FF4FD8:#3A7FFF><bold>Mini-jeu feu d'artifice — test</bold></gradient>"
    - "<white>/orbitdev feu cible</white> <gray>— cible d'entraînement à ta position"
    - "<white>/orbitdev feu riposte</white> <gray>— cible qui tire sur le joueur en mode le plus proche"
    - "<white>/orbitdev feu retirer</white> <gray>— retire toutes les cibles"
    - "<white>/orbitdev feu serie <n></white> <gray>— fixe ta série (débloque les bonus jusqu'à n)"
    - "<dark_gray>Les cibles comptent comme des joueurs en mode : éliminations, série et bonus."
  dummy:
    name: "<#FF4D4D><bold>Cible d'entraînement</bold>"
    short-name: "<#FF4D4D>Cible d'entraînement</#FF4D4D>"
    description: "<gray>Tire dessus en mode feu d'artifice"
    description-fires: "<#FF4D4D>Riposte !"
    placed: "<prefix><green>Cible d'entraînement posée.</green> <gray>Elle compte comme un joueur en mode et réapparaît 3 s après chaque élimination."
    placed-fires: "<prefix><green>Cible qui riposte posée.</green> <gray>Elle tire toutes les 3 s sur le joueur en mode le plus proche (en vue, 48 blocs)."
    removed: "<prefix><green><white><count></white> cible(s) d'entraînement retirée(s)."
  shield-broken: "<#00C6FF>Ton bouclier a encaissé le tir de <killer> !"
  shield-hit: "<gray><white><victim></white> avait un bouclier : il vient de sauter."
  grapple:
    name: "<#F5C542><bold>Grappin</bold>"
    lore:
      - "<gray>Bonus de série."
      - ""
      - "<#3A7FFF>Clic droit</#3A7FFF> <gray>· propulsion vers le bloc visé"
      - "<gray>Rien à portée : saut boosté vers l'avant."
      - ""
      - "<dark_gray>Perdu si tu es éliminé."
  # Bonus de série : <bonus> = nom, <hint> = effet, <streak> = éliminations d'affilée.
  bonus:
    unlocked: "<prefix><#F5C542><bold>BONUS</bold></#F5C542> <gray>(série de <white><streak></white>)</gray> <white><bonus></white> <dark_gray>·</dark_gray> <hint>"
    speed:
      name: "Vitesse"
      hint: "<gray>Tu cours plus vite jusqu'à ton élimination."
    grapple:
      name: "Grappin"
      hint: "<gray>Clic droit avec le grappin : propulsion ou saut boosté."
    rapid-fire:
      name: "Tir rapide"
      hint: "<gray>Ton feu d'artifice recharge deux fois plus vite."
    shield:
      name: "Bouclier"
      hint: "<gray>Le prochain tir reçu ne t'élimine pas."
    volley:
      name: "Salve"
      hint: "<gray>Chaque tir part en salve de 3 fusées."

