# OrbitDevCore messages — MiniMessage format (https://docs.advntr.dev/minimessage/format.html)
# <prefix> is replaced by the value of "prefix".
prefix: "<dark_gray>[</dark_gray><gradient:#00c6ff:#7b2ff7>ORBIT</gradient><dark_gray>]</dark_gray> "

general:
  no-permission: "<prefix><red>You don't have permission."
  players-only: "<prefix><red>This command can only be used by players."
  player-not-found: "<prefix><red>Player not found: <white><player></white>."
  usage: "<prefix><gray>Usage: <white><usage></white>"
  reloaded: "<prefix><green>Config, messages, warps and NPCs reloaded."
  info: "<prefix><gray>OrbitDevCore <white>v<version></white> — <white><warps></white> warp(s), <white><npcs></white> NPC(s), proxy: <white><proxy></white>."

spawn:
  teleported: "<prefix><green>Teleported to spawn."
  teleported-other: "<prefix><green><white><player></white> was teleported to spawn."
  set: "<prefix><green>Spawn set to your position."
  missing: "<prefix><red>No usable spawn (world not found)."

warp:
  teleported: "<prefix><green>Teleported to warp <white><name></white>."
  not-found: "<prefix><red>Warp <white><name></white> does not exist."
  set: "<prefix><green>Warp <white><name></white> saved at your position."
  deleted: "<prefix><green>Warp <white><name></white> deleted."
  invalid-name: "<prefix><red>Invalid name: letters, digits, - and _ only (32 characters max)."
  unknown-icon: "<prefix><red>Unknown icon: <white><icon></white>."
  world-missing: "<prefix><red>The world of warp <white><name></white> is not loaded."

world:
  invalid-name: "<prefix><red>Invalid world name: lowercase letters, digits, - and _ only (32 characters max)."
  invalid-type: "<prefix><red>Unknown world type: <white><type></white> (flat or normal)."
  creating: "<prefix><gray>Creating / loading world <white><world></white>..."
  created: "<prefix><green>World <white><world></white> ready (<type>). It will be loaded on every startup."
  failed: "<prefix><red>Could not create world <white><world></white> (see console)."
  list-header: "<prefix><gray>Loaded worlds (<white><count></white>):"
  list-entry: " <dark_gray>•</dark_gray> <white><world></white> <dark_gray>(<type>, <players> player(s))</dark_gray>"

