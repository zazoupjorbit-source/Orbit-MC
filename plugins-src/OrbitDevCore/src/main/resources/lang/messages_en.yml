    - "<dark_gray>From the console, add <white>@player</white> to create/tphere/tp to use that player's position."

# Firework mini-game. <dot> = dot in the player's color, <killer> = shooter's colored name.
firework:
  item:
    name: "<gradient:#FF4FD8:#3A7FFF><bold>Firework</bold></gradient>"
    lore:
      - "<gray>Mini-game: take out players"
      - "<gray>in firework mode. One shot is enough."
      - "<gray>Chain kills to unlock bonuses:"
      - "<gray>speed, grappling hook, shield..."
      - ""
      - "<#3A7FFF>Left click</#3A7FFF> <gray>· enter the mode"
    name-armed: "<gradient:#FF4FD8:#3A7FFF><bold>Firework</bold></gradient> <dark_gray>·</dark_gray> <#FF4D4D><bold>ARMED</bold>"
    lore-armed:
      - "<gray>Other players in firework mode"
      - "<gray>can take you out."
      - ""
      - "<#3A7FFF>Right click</#3A7FFF> <gray>· shoot"
      - "<#3A7FFF>Left click</#3A7FFF> <gray>· leave the mode"
  enter-title: "<gradient:#FF4FD8:#3A7FFF><bold>FIREWORK MODE</bold></gradient>"
  enter-subtitle: "<gray>Right click to shoot · one shot = one kill"
  left: "<gray>You left firework mode."
  leave-locked: "<#FF4D4D>You just fired: <white><seconds> s</white> left before you can leave the mode."
  not-armed: "<gray>Left click with the firework to enter firework mode."
  hud: "<dot> <white><bold>FIREWORK</bold></white> <dark_gray>|</dark_gray> <gray>Kills <white><kills></white> <dark_gray>|</dark_gray> <gray>Streak <white><streak></white> <dark_gray>|</dark_gray> <gray>Playing <white><players></white><bonuses>"
  # Appended to the HUD when the player has bonuses. <list> = bonus names.
  hud-bonuses: " <dark_gray>|</dark_gray> <#F5C542><list>"
  eliminated-title: "<#FF4D4D><bold>ELIMINATED</bold>"
  eliminated-subtitle: "<gray>by <killer>"
  kill: "<#7CFC9A><bold>+1</bold> <gray>· you took out <white><victim></white>"
  feed: "<prefix><killer> <gray>took out</gray> <white><victim></white><gray>.</gray>"
  streak: "<prefix><killer> <#F5C542>is on a <white><streak></white> kill streak!"
  lobby-only: "<prefix><yellow>The firework mini-game only exists in the lobby."
  # Test tools (/orbitdev feu, admins).
  not-in-mode: "<prefix><red>Enter firework mode first (left click with the firework)."
  streak-set: "<prefix><green>Streak set to <white><streak></white>: bonuses unlocked up to that tier."
  admin-help:
    - "<gradient:#FF4FD8:#3A7FFF><bold>Firework mini-game — testing</bold></gradient>"
    - "<white>/orbitdev feu cible</white> <gray>— training target at your position"
    - "<white>/orbitdev feu riposte</white> <gray>— target that shoots the nearest player in firework mode"
    - "<white>/orbitdev feu retirer</white> <gray>— remove all targets"
    - "<white>/orbitdev feu serie <n></white> <gray>— set your streak (unlocks bonuses up to n)"
    - "<dark_gray>Targets count as players in firework mode: kills, streak and bonuses."
  dummy:
    name: "<#FF4D4D><bold>Training target</bold>"
    short-name: "<#FF4D4D>Training target</#FF4D4D>"
    description: "<gray>Shoot it in firework mode"
    description-fires: "<#FF4D4D>Shoots back!"
    placed: "<prefix><green>Training target placed.</green> <gray>It counts as a player in firework mode and comes back 3 s after each kill."
    placed-fires: "<prefix><green>Shooting target placed.</green> <gray>It fires every 3 s at the nearest player in firework mode (in sight, 48 blocks)."
    removed: "<prefix><green><white><count></white> training target(s) removed."
  shield-broken: "<#00C6FF>Your shield absorbed <killer>'s shot!"
  shield-hit: "<gray><white><victim></white> had a shield: it just broke."
  grapple:
    name: "<#F5C542><bold>Grappling hook</bold>"
    lore:
      - "<gray>Streak bonus."
      - ""
      - "<#3A7FFF>Right click</#3A7FFF> <gray>· pull yourself to the block you aim at"
      - "<gray>Nothing in range: boosted jump forward."
      - ""
      - "<dark_gray>Lost if you get taken out."
  # Streak bonuses: <bonus> = name, <hint> = effect, <streak> = kills in a row.
  bonus:
    unlocked: "<prefix><#F5C542><bold>BONUS</bold></#F5C542> <gray>(<white><streak></white> streak)</gray> <white><bonus></white> <dark_gray>·</dark_gray> <hint>"
    speed:
      name: "Speed"
      hint: "<gray>You run faster until you get taken out."
    grapple:
      name: "Grappling hook"
      hint: "<gray>Right click with the hook: pull or boosted jump."
    rapid-fire:
      name: "Rapid fire"
      hint: "<gray>Your firework reloads twice as fast."
    shield:
      name: "Shield"
      hint: "<gray>The next shot you take won't eliminate you."
    volley:
      name: "Volley"
      hint: "<gray>Every shot fires 3 rockets."

