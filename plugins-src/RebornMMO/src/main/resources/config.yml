# ------------------------------------------------------------------
#  RebornMMO — MMO de l'instance Reborn
#  Rechargement des monstres / boss / étages : /mmoadmin reload
# ------------------------------------------------------------------

start:
  # Col donnés à la création du personnage.
  col: 100

progression:
  max-level: 150
  points-per-level: 3

skills:
  # Pré-mouvement : durée pendant laquelle l'arme s'illumine avant la compétence (ticks, 20 = 1 s).
  pre-motion-ticks: 4

unique-skill:
  # Double lame : compétence unique de l'Épéiste.
  dual-blade:
    level: 25
    proficiency: 600

death:
  # soft     : aucune pénalité
  # penalty  : perte d'une partie de l'XP du niveau en cours et des Col
  # hardcore : mort = avatar effacé (comme dans l'anime). À manier avec précaution !
  mode: penalty
  xp-loss: 0.5
  col-loss: 0.1

pvp:
  enabled: true
  # Attaquer un joueur au curseur vert rend orange ; le tuer rend rouge.
  orange-minutes: 10
  red-minutes: 30

party:
  max-size: 6

resource-pack:
  # Pack RebornMMO (modèles d'armes, cristaux, potion, barre de vie dessinée).
  # Proposé pendant l'écran de connexion ; sans le pack, le jeu reste jouable (apparence normale).
  enabled: true
  # Port du mini serveur HTTP intégré qui distribue le pack. Les joueurs le téléchargent
  # à l'adresse qu'ils ont utilisée pour se connecter : ouvre ce port (TCP) comme le port du jeu.
  port: 8790
  # Pour héberger le pack ailleurs (CDN, site), mets son URL ici : le serveur intégré n'est alors pas lancé.
  public-url: ""
  # true : refuser le pack déconnecte le joueur.
  required: false

hud:
  # Décalage horizontal de la barre de vie dessinée, en pixels d'interface (négatif = vers la gauche).
  offset-x: 0

spawning:
  interval-ticks: 80
  per-player: 6
  per-floor: 60

# Délai avant qu'un boss d'étage vaincu puisse réapparaître (pour s'entraîner).
bosses-respawn-minutes: 10

floors:
  # Nombre total d'étages. Ceux qui ne sont pas listés sont générés automatiquement
  # (thèmes en boucle, niveaux croissants, monstres et boss repris des étages listés).
  max: 100
  # Rayon d'un étage en blocs (disque flottant).
  radius: 160
  list:
    1:
      name: "Plaines de l'Éveil"
      town: "Cité des Débuts"
      theme: PLAINS
      levels: [1, 5]
      mobs: [sanglier, loup, kobold]
      boss: roi_kobold
    2:
      name: "Prairies du Taureau"
      town: "Bourg des Pâtres"
      theme: FOREST
      levels: [5, 10]
      mobs: [taureau, araignee, loup]
      boss: taureau_titan
    3:
      name: "Forêt des Brumes"
      town: "Village Sylvestre"
      theme: DARK_FOREST
      levels: [10, 16]
      mobs: [elfe_sombre, araignee_geante, loup_ombre]
      boss: treant
    4:
      name: "Désert des Mirages"
      town: "Oasis d'Ambre"
      theme: DESERT
      levels: [16, 22]
      mobs: [momie, scorpion, squelette]
      boss: pharaon
    5:
      name: "Toundra de Givre"
      town: "Fort Blanc"
      theme: SNOW
      levels: [22, 28]
      mobs: [ours, errant, loup_givre]
      boss: colosse

