name: OrbitContrebande
version: '0.5.0'
main: fr.orbit.contrebande.OrbitContrebande
api-version: '1.21'
description: "CONTREBANDE : bâtis un empire de contrebande aux Docks d'Orbite, seul ou jusqu'à 4 amis. Ville de 3 quartiers, culture, mélanges, clients, douane, améliorations persistantes. Borne de l'arcade cachée (lobby seulement), Orbit Coins de jeu seulement."
authors: [ORBIT]
softdepend: [OrbitCasino]

commands:
  contrebande:
    description: "CONTREBANDE : jouer, classement, règles, organisation, rentrer."
    usage: "/contrebande [jouer|top|regles|orga|quitter]"
    aliases: [docks]

permissions:
  orbitcontrebande.admin:
    description: Reposer le PNJ, reconstruire les villes, voir les nuits en cours.
    default: op
