# ------------------------------------------------------------------
#  Marché Orbit (/shop) — tous les objets de Minecraft
#
#  Prix de chaque objet :
#   1. « valeurs » ci-dessous : prix d'achat de référence des matières premières (ce qu'on ne fabrique pas).
#      Une clé peut contenir * (ex. "*_LOG") : la première qui correspond gagne, les noms exacts d'abord.
#   2. Tout le reste est calculé à partir des recettes du jeu (établi, four, tailleur de pierre, forge) :
#      somme des ingrédients × « artisanat », divisée par le nombre d'objets obtenus.
#   3. Marché vivant : chaque vente fait baisser le prix de l'objet, chaque achat le fait monter ;
#      les prix reviennent doucement à la référence avec le temps.
#  Prix de vente au marché = prix d'achat × « vente-ratio » (pas d'achat-revente gagnant possible).
#  /shop admin recharger relit ce fichier ; /shop admin sansprix liste les objets sans prix.
# ------------------------------------------------------------------

vente-ratio: 0.30
artisanat: 1.05
# Coût du combustible ajouté à chaque cuisson (four, fumoir, haut fourneau).
cuisson: 0.4

dynamique:
  # Valeur (en crédits, au prix de référence) qu'il faut vendre d'un objet pour que son prix soit divisé par ~2,7.
  # Plus c'est grand, plus les prix sont stables.
  volume: 6000
  # Bornes du prix par rapport à la référence. Garder max / min × vente-ratio × artisanat < 1
  # (sinon acheter un objet bradé, le fabriquer et revendre le résultat cher devient rentable).
  min: 0.5
  max: 1.5
  # Retour vers la référence : toutes les X minutes, l'écart est multiplié par « retour ».
  minutes: 5
  retour: 0.93

# Objets que le marché reprend mais ne vend pas (trop rares pour être achetés).
