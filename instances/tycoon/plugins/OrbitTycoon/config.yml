  agriculture: 15
  mine: 15

# Mobzone : les monstres apparaissent autour des joueurs présents dans l'arène.
mobzone:
  max: 0
  intervalle: 4
  par-vague: 5
  types:
  - ZOMBIE
  - SKELETON
  - SPIDER
  - HUSK
  # Empilement : nombre max de mobs dans une pile, et distance de fusion (blocs).
  pile-max: 50
  pile-rayon: 8

# Hauteur sous laquelle un joueur qui tombe dans le vide est ramené à l'arrivée de sa zone.
vide-y: 0

# Pack de ressources du Tycoon (disque animé des anneaux-portails).
pack:
  actif: true
  # Port du petit serveur HTTP local qui sert le pack.
  port: 8794
  # Si les joueurs passent par un tunnel : URL publique du pack (vide = serveur local ci-dessus).
  url-publique: ''

# Boutique du spawn : avenues (identifiants de zone) qui ont un PNJ astronaute sous une arche.
# Après un changement : /tycoon reload, puis /tycoon boutique poser (nouvelles arches) ou retirer (arches en trop).
boutique:
  avenues:
  - mobzone
