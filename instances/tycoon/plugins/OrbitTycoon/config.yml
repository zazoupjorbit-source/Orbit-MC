      prerequis: À définir
    - nom: Amélioration 5
      objet: GRAY_DYE
      description: À définir
      prerequis: À définir
    - nom: Amélioration 6
      objet: GRAY_DYE
      description: À définir
      prerequis: À définir
    - nom: Amélioration 7
      objet: GRAY_DYE
      description: À définir
      prerequis: À définir
    - nom: Amélioration 8
      objet: GRAY_DYE
      description: À définir
      prerequis: À définir
    - nom: Amélioration 9
