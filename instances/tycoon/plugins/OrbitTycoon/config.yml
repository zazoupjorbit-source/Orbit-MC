      description: À définir
      prerequis: À définir
quetes:
  pas: 10
  # Récompense PROVISOIRE si rien n'est réglé ci-dessous : palier × credit-par-palier Crédits orbitaux.
  credit-par-palier: 500
  # Vraies récompenses (à définir) : recompenses.<outil>.<palier> ou recompenses.tous.<palier>.
  # Champs : credit, flux, texte (affiché), commandes (console, %joueur% = pseudo). Exemple :
  #   tous:
  #     50: {credit: 50000, texte: "1 clé de coffre n°3", commandes: ["tycoon cle 3 %joueur% 1"]}
  recompenses: {}
# Ressources des outils (panneau « Ressources » : bouton dans l'interface de l'outil, ou /ressources [outil]).
# La 1re de chaque liste (origine: true) = la zone telle qu'elle est construite, avec ses gains habituels.
# Chaque quête de prestige récupérée (quetes.pas : 10, 20… 100) débloque la ressource suivante, dans l'ordre.
# Mine, Bûcheron, Agriculture : vue perso, le joueur voit les blocs de farm changés en sa ressource (lui seul).
# Pêche et Mobzone : gains seulement (chaque prise compte comme la ressource choisie).
# Champs : nom, bloc (bloc affiché ; pour pêche/mobzone, juste l'icône), icone (si le bloc n'est pas un objet),
# feuilles (bûcheron), mur (agriculture : bloc affiché quand la culture est mûre), credit, flux, xp (gains par récolte).
# Mine : les minerais « deepslate » prennent la version deepslate du bloc si elle existe. /tycoon reload après un changement.
