# ------------------------------------------------------------------
#  Catalogue des cosmétiques d'OrbitDevCore (rechargé par /orbitdev reload)
#
#  Identifiant : minuscules, chiffres, - et _ (il est enregistré dans les fichiers joueurs,
#  ne le renomme pas après coup). name / description : MiniMessage. icon : matériau Bukkit.
#  rarity : common | rare | epic | legendary (affichée dans le menu, servira aux prix de la boutique).
#  Une catégorie peut contenir autant de cosmétiques que voulu : le menu ajoute des pages.
#
#  trails / auras : particle = particule Minecraft (flame, heart, note, end_rod, dust...).
#    dust : color "#RRGGBB" + size ; dust_color_transition : color, to-color, size ;
#    entity_effect / tinted_leaves / flash : color ; effect / instant_effect : color + power ;
#    falling_dust / block / dust_pillar : block = bloc ; item : item = objet.
#    trails : count (particules par pas, 1 à 20) et speed (vitesse des particules qui bougent).
#    auras : style = ring | halo | spiral | wings | atom | pulse | tornado | crown | cloud.
#  hats / balloons : item = objet (le chapeau occupe la case du casque ; le ballon flotte au bout
#    d'une ficelle). texture = tête personnalisée : valeur « Value » de minecraft-heads.com
#    (onglet For Developers) ou identifiant de texture textures.minecraft.net.
#  backs : accessoires de dos. style = item (un objet au milieu du dos : sac, bouclier...)
#    | diagonal (un objet en travers du dos, poignée au-dessus de l'épaule : épée, arc...)
#    | wings (ailes qui battent : éventail de l'objet « item », ou plaques du bloc « block »)
#    | cape (bloc « block », se soulève quand tu cours) | jetpack (réservoirs en bloc « block »).
#    accent = bloc secondaire (une plaque d'aile sur deux, bande de la cape, tuyères du jetpack).
#    particle (facultatif, mêmes réglages que les traînées) : bouts des ailes, tuyères, bas de la cape...
#    Réglages fins si l'objet est mal placé : offset [gauche, haut, avant] en blocs,
#    rotation [x, y, z] en degrés, scale (taille), flap (amplitude du battement en degrés).
#  pets : entity = créature (fox, cat, wolf...), baby = version bébé si elle existe,
#    variant = variante (voir plus bas), collar = couleur du collier (chats et loups).
#    Préférer les créatures à IA « classique » : allay, sniffer, frog, axolotl, goat, camel...
#    ont leur propre cerveau et se promènent au lieu de suivre le joueur. Le serveur est en
#    difficulté paisible : les monstres (zombie, creeper...) y disparaissent tout seuls.
#    Variantes : mouton = couleur de laine ; renard = red, snow ; lapin = brown, white, black,
#    black_and_white, gold, salt_and_pepper, the_killer_bunny ; perroquet = red, blue, green, cyan, gray ;
#    lama = creamy, white, brown, gray ; panda = normal, lazy, worried, playful, brown, weak, aggressive ;
#    champimeuh = red, brown ; chat = tabby, black, red, siamese, british_shorthair, calico, persian,
#    ragdoll, white, jellie, all_black ; loup = pale, ashen, black, chestnut, rusty, snowy, spotted,
#    striped, woods ; cochon / vache / poule = temperate, warm, cold.
#  mounts : entity = monture (horse, skeleton_horse, zombie_horse, donkey, mule, camel, camel_husk,
#    happy_ghast, nautilus, zombie_nautilus...). speed (au sol, max vanilla 0,3375), jump (0,4 à 1,0),
#    flying-speed (ghast joyeux), color / style (chevaux), armor (armure de cheval / de nautile,
#    harnais du ghast). Les montures sont toujours sellées et disparaissent quand on descend.
# ------------------------------------------------------------------

