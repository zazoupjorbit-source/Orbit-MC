        - { objet: "armure:police:jambieres", poids: 6 }
        - { objet: "armure:police:bottes", poids: 7 }
        - { objet: "grenade:frag:1-2", poids: 8 }
        - { objet: "vehicule:jerrican:1-2", poids: 10 }
        - { objet: "vehicule:reparation:1", poids: 6 }
        - { objet: "arme:pdw", poids: 6 }
