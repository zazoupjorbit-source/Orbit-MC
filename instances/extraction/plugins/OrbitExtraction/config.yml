    - { objet: "vehicule:jerrican:1", prix: 90 }
    - { objet: "vehicule:reparation:1", prix: 160 }
  # Rachat (Maj + clic sur un objet de son inventaire, boutique ouverte) : prix fixes à l'unité pour le butin
  # que la boutique ne vend pas. Clé = MATERIAU vanilla, ou « arme:id », « munition:id », « grenade:id », « armure:tenue:pièce ».
  rachat:
    # Ressources trouvées dans les caisses et sur les infectés : elles ne servent qu'à être revendues.
    COPPER_INGOT: 8
    IRON_INGOT: 15
    GOLD_INGOT: 40
    EMERALD: 90
    DIAMOND: 140
    "armure:lourde:casque": 450
    "armure:lourde:plastron": 750
    "armure:lourde:jambieres": 650
    "armure:lourde:bottes": 400

# ------------------------------------------------------------------ tenues
# Cinq niveaux de protection, de la tenue bricolée à l'armure lourde : plus le niveau monte, plus la tenue protège
# (et plus elle a l'air solide). Dans un kit, une caisse ou la boutique : « armure:<tenue>:<pièce> » avec
# pièce = casque, plastron, jambieres ou bottes ; « armure:<tenue> » donne les quatre pièces.
#   materiau    armure vanilla qui sert de base (LEATHER, CHAINMAIL, IRON, DIAMOND, NETHERITE) : elle fixe l'usure
#               et l'apparence sans le pack ; le pack fournit la texture portée et l'icône de la tenue du même nom.
#   armure      points d'armure (un plastron en fer vanilla = 6) ; robustesse : encaisse mieux les gros dégâts ;
#   recul       résistance au recul (0.1 = 10 %) ; vitesse : % de vitesse de marche (-3 = 3 % plus lent) ;
#   durabilite  usure maximale (absent = celle du matériau).
armures:
  # Les armures vanilla d'avant les tenues trouvées dans l'inventaire d'un joueur sont remplacées par la pièce de
  # tenue du même matériau (usure conservée).
  convertir-vanilla: true
  tenues:
    fortune:
      nom: "Tenue de fortune"
      niveau: 1
      couleur: "#C9A26B"
      materiau: LEATHER
      description: "Tôle, pneu et ruban adhésif."
      pieces:
        casque:    { nom: "Casque de chantier", armure: 1 }
        plastron:  { nom: "Plastron de fortune", armure: 3 }
        jambieres: { nom: "Jambières rafistolées", armure: 2 }
        bottes:    { nom: "Bottes usées", armure: 1 }
    police:
      nom: "Tenue de patrouille"
      niveau: 2
      couleur: "#6FA0E0"
      materiau: CHAINMAIL
      description: "Gilet pare-balles léger des patrouilles."
      pieces:
        casque:    { nom: "Casque de patrouille", armure: 2 }
        plastron:  { nom: "Gilet pare-balles", armure: 5 }
        jambieres: { nom: "Pantalon de patrouille", armure: 4 }
        bottes:    { nom: "Rangers", armure: 1 }
    emeute:
      nom: "Tenue anti-émeute"
      niveau: 3
      couleur: "#AEB6C2"
      materiau: IRON
      description: "Coques rigides des unités anti-émeute."
      pieces:
        casque:    { nom: "Casque à visière", armure: 2 }
        plastron:  { nom: "Plastron anti-émeute", armure: 6 }
        jambieres: { nom: "Protège-jambes", armure: 5 }
        bottes:    { nom: "Bottes coquées", armure: 2 }
    tactique:
      nom: "Tenue tactique"
      niveau: 4
      couleur: "#9DB36A"
      materiau: DIAMOND
      description: "Porte-plaques et casque balistique."
      pieces:
        casque:    { nom: "Casque balistique", armure: 3, robustesse: 2 }
        plastron:  { nom: "Porte-plaques", armure: 8, robustesse: 2 }
        jambieres: { nom: "Treillis renforcé", armure: 6, robustesse: 2 }
        bottes:    { nom: "Rangers tactiques", armure: 3, robustesse: 2 }
    lourde:
      nom: "Armure lourde"
      niveau: 5
      couleur: "#E8695C"
      materiau: NETHERITE
      description: "Blindage intégral. Lourd : on court moins vite."
      pieces:
        casque:    { nom: "Casque intégral", armure: 3, robustesse: 3, recul: 0.1, vitesse: -3 }
        plastron:  { nom: "Cuirasse", armure: 8, robustesse: 3, recul: 0.1, vitesse: -3 }
        jambieres: { nom: "Grèves blindées", armure: 6, robustesse: 3, recul: 0.1, vitesse: -3 }
        bottes:    { nom: "Solerets", armure: 3, robustesse: 3, recul: 0.1, vitesse: -3 }

# ------------------------------------------------------------------ soins
# Clic droit : il faut rester quelques secondes sans changer d'objet ni prendre de coup.
#   vie = points de vie rendus (2 = un cœur) ; secondes = durée d'utilisation.
soins:
  bandage:
    nom: "Bandage"
    materiau: PAPER
    vie: 6
    secondes: 2.5
  medkit:
    nom: "Trousse de soins"
    materiau: PAPER
    vie: 14
    secondes: 5

# ------------------------------------------------------------------ rangs
# Le rang d'un joueur est le plus haut de la liste dont il a la permission. « group.<rôle> » est donnée par
# LuckPerms aux membres du rôle (et à ceux qui en héritent) : donner un rang = /lp user <joueur> parent add vip
# (ou « parent addtemp vip 30d » pour 30 jours). LuckPerms est partagé par tout le réseau.
# Dans le tab et le chat, le préfixe et la couleur viennent du rôle LuckPerms (meta prefix + meta namecolor) ;
# « prefixe » ci-dessous (MiniMessage) ne sert que si LuckPerms est absent.
# Avantages, en pourcentage :
#   bonus-credits    crédits gagnés en plus (primes, extractions)
#   remise-boutique  remise sur les achats à la boutique
#   recharge-colis   attente en moins entre deux colis
rangs:
  # Affiché dans le kit du téléphone si renseigné (adresse de la boutique des rangs).
  lien-boutique: ""
  tab:
    # {joueurs} connectés, {en-raid}, {planque}, {rang} du joueur qui regarde. Vide = pas d'en-tête / de pied.
    entete: "<newline><#C0392B><b>☣ ORBIT EXTRACTION ☣</b></#C0392B><newline><#8A919B>Survis. Pille. Extrais-toi.<newline>"
    pied: "<newline><#8A919B>En raid : <#E67E22>{en-raid}</#E67E22>  <#5A6270>•</#5A6270>  À la planque : <#2ECC71>{planque}</#2ECC71><newline><#8A919B>Ton rang : {rang}<newline>"
  liste:
    joueur:
      nom: "Joueur"
      couleur: "#D7DCE2"
      prefixe: "<#8A919B>ᴊᴏᴜᴇᴜʀ <#D7DCE2>"
    vip:
      nom: "VIP"
      couleur: "#F5C542"
      prefixe: "<#F5C542>ᴠɪᴘ "
      permission: group.vip
      bonus-credits: 10
      remise-boutique: 5
      recharge-colis: 15
    vipplus:
      nom: "VIP+"
      couleur: "#5CE0A0"
      prefixe: "<#5CE0A0>ᴠɪᴘ+ "
      permission: group.vipplus
      bonus-credits: 20
      remise-boutique: 10
      recharge-colis: 30
    orbit:
      nom: "ORBIT"
      couleur: "#B57BFF"
      prefixe: "<#B57BFF>ᴏʀʙɪᴛ "
      permission: group.orbit
      bonus-credits: 30
      remise-boutique: 15
      recharge-colis: 50

# ------------------------------------------------------------------ kits
# À prendre à la planque (téléphone > Kits, ou /kit <nom>). Un rang ouvre son kit et ceux des rangs en dessous,
# chacun avec son propre délai. L'armure s'équipe toute seule si l'emplacement est libre.
# En raid on peut tout perdre : les délais sont longs pour les gros kits, court pour le kit de base
# (un joueur à sec peut toujours repartir).
kits:
  survivant:
    nom: "Kit Survivant"
    rang: joueur
    icone: LEATHER_CHESTPLATE
    recharge-minutes: 30
    contenu:
      - "arme:c96"
      - "munition:9mm:30"
      - "armure:fortune:casque"
      - "armure:fortune:plastron"
      - "soin:bandage:1"
      - "objet:BREAD:4"
  eclaireur:
    nom: "Kit Éclaireur"
    rang: vip
    icone: CHAINMAIL_CHESTPLATE
    recharge-minutes: 120
    contenu:
      - "arme:tec9"
      - "munition:9mm:80"
      - "armure:fortune:casque"
      - "armure:police:plastron"
      - "armure:fortune:jambieres"
      - "armure:fortune:bottes"
      - "soin:bandage:2"
      - "objet:COOKED_BEEF:4"
  commando:
    nom: "Kit Commando"
    rang: vipplus
    icone: IRON_CHESTPLATE
    recharge-minutes: 240
    contenu:
      - "arme:pdw"
      - "munition:9mm:120"
      - "armure:police:casque"
      - "armure:emeute:plastron"
      - "armure:police:jambieres"
      - "armure:police:bottes"
      - "grenade:frag:1"
      - "soin:bandage:2"
      - "soin:medkit:1"
      - "objet:COOKED_BEEF:6"
  orbit:
    nom: "Kit ORBIT"
    rang: orbit
    icone: DIAMOND_CHESTPLATE
    recharge-minutes: 360
    contenu:
      - "arme:m4"
      - "munition:5-56:120"
      - "armure:emeute"
      - "grenade:frag:2"
      - "soin:medkit:2"
      - "objet:GOLDEN_APPLE:1"
      - "objet:COOKED_BEEF:8"

# ------------------------------------------------------------------ caisses de butin
# Des caisses sont réparties au hasard sur l'île (points de apparitions-auto.csv). Une colonne de lumière de la
# couleur du niveau les signale de loin, et elles sont marquées sur la carte tactique (bannière de la couleur).
# Ouvrir une caisse fait du bruit (attire les infectés) ; vidée ou trop vieille, elle est remplacée ailleurs.
caisses:
  actives-en-jeu: true
  # Nombre de caisses présentes en même temps sur l'île (hors caisses d'événement).
  nombre: 32
  # Une caisse non vidée est déplacée après ce temps.
  duree-minutes: 12
  # Délai avant qu'une caisse retirée soit remplacée.
  reapparition-secondes: 20
  # Distance minimale entre deux caisses.
  distance-min: 55
  # La caisse et son faisceau n'existent que lorsqu'un joueur est à moins de cette distance.
  distance-affichage: 150
  bruit: 30
  # Un niveau de poids 0 n'apparaît jamais au hasard : il sert aux événements (épave d'hélicoptère, largage).
  # Par niveau : poids = fréquence ; tirages = nombre d'objets tirés (a-b) ; butin = objets et leur poids ;
  # bloc = apparence de la caisse ; faisceau = verre de la colonne ; banniere = couleur sur la carte
  # (WHITE, LIME, LIGHT_BLUE, PURPLE, YELLOW, ORANGE, RED) ; annonce = message aux joueurs en raid.
  niveaux:
    blanche:
      nom: "Caisse blanche"
      couleur: "#E6EDF3"
      bloc: WHITE_SHULKER_BOX
      faisceau: WHITE_STAINED_GLASS
      banniere: WHITE
      poids: 40
      tirages: 4-5
      butin:
        - { objet: "munition:9mm:10-24", poids: 30 }
        - { objet: "munition:12g:4-8", poids: 14 }
        - { objet: "objet:BREAD:2-4", poids: 22 }
        - { objet: "soin:bandage:1", poids: 20 }
        - { objet: "objet:COPPER_INGOT:2-5", poids: 16 }
        - { objet: "objet:IRON_INGOT:1-3", poids: 14 }
        - { objet: "armure:fortune:casque", poids: 6 }
        - { objet: "armure:fortune:bottes", poids: 6 }
        - { objet: "arme:c96", poids: 5 }
    verte:
      nom: "Caisse verte"
      couleur: "#3FC46A"
      bloc: LIME_SHULKER_BOX
      faisceau: LIME_STAINED_GLASS
      banniere: LIME
      poids: 28
      tirages: 5-6
      butin:
        - { objet: "munition:9mm:20-40", poids: 26 }
        - { objet: "munition:5-56:10-25", poids: 16 }
        - { objet: "munition:12g:6-12", poids: 14 }
        - { objet: "munition:carreau:3-6", poids: 8 }
        - { objet: "soin:bandage:1-2", poids: 20 }
        - { objet: "objet:COOKED_BEEF:2-4", poids: 16 }
        - { objet: "objet:IRON_INGOT:2-5", poids: 16 }
        - { objet: "armure:fortune:plastron", poids: 8 }
        - { objet: "armure:fortune:jambieres", poids: 8 }
        - { objet: "grenade:frag:1", poids: 6 }
        - { objet: "vehicule:jerrican:1", poids: 10 }
        - { objet: "arme:g18", poids: 6 }
        - { objet: "arme:tec9", poids: 5 }
        - { objet: "arme:crossbow", poids: 3 }
    bleue:
      nom: "Caisse bleue"
      couleur: "#5CC8FF"
      bloc: LIGHT_BLUE_SHULKER_BOX
      faisceau: LIGHT_BLUE_STAINED_GLASS
      banniere: LIGHT_BLUE
      poids: 18
      tirages: 5-7
      butin:
        - { objet: "munition:5-56:20-40", poids: 22 }
        - { objet: "munition:7-62:10-20", poids: 14 }
        - { objet: "munition:9mm:30-50", poids: 16 }
        - { objet: "soin:bandage:2", poids: 16 }
        - { objet: "soin:medkit:1", poids: 12 }
        - { objet: "objet:GOLD_INGOT:1-3", poids: 14 }
        - { objet: "armure:police:casque", poids: 7 }
