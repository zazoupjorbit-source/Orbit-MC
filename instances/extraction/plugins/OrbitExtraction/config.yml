# ------------------------------------------------------------------ événements de raid
# Tirés au hasard dès qu'il y a assez de joueurs en raid. Test : /extraction evenement <crash|horde|largage>.
evenements:
  actifs: true
  # Délai entre deux événements, en minutes (tiré au hasard entre les deux bornes).
  intervalle-minutes: 4-7
  # Nombre de joueurs en raid à partir duquel les événements se déclenchent.
  joueurs-min: 1
  # poids = fréquence relative (0 = jamais).
  crash:
    # Un hélicoptère s'écrase sur l'île : épave fumante visible de loin, gardée par des infectés, avec une caisse
    # de matériel militaire (niveau « caisse » de la section caisses). Annoncé à tous les joueurs en raid.
    poids: 3
    # Distance du joueur tiré au sort (blocs).
    distance: 120-400
    duree-minutes: 10
    gardes: 8-12
    caisse: epave
  horde:
    # Une vague d'infectés converge vers un joueur après une courte alerte (cor + message aux joueurs proches).
    poids: 4
    taille: 12-18
    # Distance d'apparition autour du joueur visé.
    distance: 28-42
    alerte-secondes: 8
  largage:
    # Une caisse de ravitaillement tombe sur l'île, annoncée à tous.
    poids: 3
    distance: 80-300
    duree-minutes: 8
    caisse: largage

# ------------------------------------------------------------------ hôtel des ventes
# Vente entre joueurs depuis le téléphone (bouton Marché) : Maj + clic sur un objet de son inventaire, puis le
# prix dans le chat. Achat et mise en vente à la planque uniquement. Les annonces sont dans marche.yml.
hdv:
  actif: true
  # Part du prix retenue à la vente, en % (les crédits sortent du jeu).
  taxe: 5
  # Une annonce invendue revient à son vendeur après ce délai.
  duree-heures: 48
  # Annonces simultanées par joueur, plus « annonces-par-rang » par niveau de rang (VIP +2, VIP+ +4, ORBIT +6).
  annonces-max: 5
  annonces-par-rang: 2
  prix-min: 1
  prix-max: 1000000

colis:
  # Commandés en raid depuis le téléphone : la caisse tombe près du joueur après ce délai, fume (visible de loin),
  # son impact attire les infectés (rayon « bruit ») et n'importe quel joueur peut la piller.
  delai-secondes: 20
  # Attente entre deux commandes d'un même joueur, après le largage.
  recharge-secondes: 90
  # Une caisse non vidée disparaît après ce temps.
  duree-secondes: 180
  bruit: 40
  offres:
    - nom: "Vivres"
      icone: COOKED_BEEF
      prix: 80
      contenu: ["objet:COOKED_BEEF:4", "objet:BREAD:4", "objet:GOLDEN_APPLE:1"]
    - nom: "Munitions légères"
      icone: IRON_NUGGET
      prix: 120
      contenu: ["munition:9mm:60", "munition:12g:12"]
    - nom: "Munitions lourdes"
      icone: GOLD_NUGGET
      prix: 200
      contenu: ["munition:5-56:60", "munition:7-62:40"]
    - nom: "Explosifs"
      icone: TNT
      prix: 280
      contenu: ["grenade:frag:3"]
    - nom: "Arme de secours"
      icone: BARREL
      prix: 450
      contenu: ["arme:tec9", "munition:9mm:60"]
    - nom: "Kit d'assaut"
      icone: ENDER_CHEST
      prix: 1500
      contenu: ["arme:m4", "munition:5-56:90", "grenade:frag:2", "objet:GOLDEN_APPLE:1"]
    - nom: "Carburant"
      icone: LAVA_BUCKET
      prix: 150
      contenu: ["vehicule:jerrican:2"]
    # Véhicules : « vehicule » = type de la section vehicules. Posé près du joueur, réservoir plein, s'il y a la place
    # (sinon la commande est remboursée). Il reste sur l'île à la fin du raid.
    - nom: "Moto"
      icone: MINECART
      prix: 350
      vehicule: moto
    - nom: "Voiture"
      icone: CHEST_MINECART
      prix: 600
      vehicule: voiture
    - nom: "Humvee"
      icone: TNT_MINECART
      prix: 1200
      vehicule: humvee
    - nom: "Hélicoptère"
      icone: ELYTRA
      prix: 2200
      vehicule: helico

# ------------------------------------------------------------------ véhicules
# Clic droit sur un véhicule : monter (première place libre ; la première est celle du conducteur). Maj : descendre.
#   Au sol : Z/S accélérer, freiner et reculer • Q/D tourner • Espace frein à main.
#   Hélicoptère : Espace monter • Maj descendre (au sol : sortir) • Z/S avancer, reculer • Q/D pivoter.
# Les passagers peuvent tirer. Une barre en haut de l'écran donne la vitesse, le carburant et l'état.
# Carburant : « vehicule:jerrican » (clic droit sur le véhicule ou depuis son siège). Réparation : « vehicule:reparation ».
# Un véhicule encaisse les balles, les explosions et les chocs ; à zéro il explose. Le moteur attire les infectés.
vehicules:
  actifs: true
  # Les entités d'un véhicule n'existent que lorsqu'un joueur est à moins de cette distance.
  distance-affichage: 110
  # Un véhicule utilisé (ou livré) puis laissé vide disparaît après ce temps ; ceux de l'île sont regarés ailleurs.
  abandon-minutes: 10
  reapparition-secondes: 60
  # Distance minimale entre deux véhicules garés par le serveur.
  distance-min: 70
  # Plafond de vol (altitude Y) et marge autour de l'île au-delà de laquelle on ne peut plus avancer.
  altitude-max: 220
  marge-zone: 150
  jerrican-litres: 15
  reparation-pv: 60
  # Multiplicateurs des dégâts subis par les véhicules.
  degats-balles: 1.0
  degats-explosions: 2.5
  # Par type : nombre = véhicules garés sur l'île (réservoir entre 10 et 35 %) ; vitesse, marche-arriere, montee en
  # blocs/s (x3,6 = km/h) ; acceleration, freinage en blocs/s² ; braquage en degrés/s ; pv = points de structure ;
  # blindage = part des dégâts de balle épargnée aux occupants ; reservoir en litres ; consommation en litres par
  # minute à fond ; bruit = rayon d'alerte des infectés ; largeur/longueur/hauteur = gabarit (collisions, balles) ;
  # franchissement = marche maximale ; belier = dégâts à pleine vitesse sur ce qu'on écrase ;
  # places = [droite, hauteur, avant] en blocs depuis le centre au sol (elles suivent le modèle 3D du pack) ;
  # echelle = taille du modèle ; son / son-intervalle (ticks) / son-ton = bruit du moteur.
  types:
    moto:
      nom: "Moto"
      icone: MINECART
      nombre: 5
      echelle: 1.25
      places: [[0, 0.78, -0.31], [0, 0.8, -0.74]]
      vitesse: 19
      marche-arriere: 3
      acceleration: 10
      freinage: 18
      braquage: 140
      pv: 60
      blindage: 0
      reservoir: 12
      consommation: 1.6
      bruit: 26
      largeur: 0.9
      longueur: 2.4
      hauteur: 1.4
      franchissement: 1.1
      belier: 10
      son: entity.bee.loop
      son-intervalle: 12
      son-ton: 0.7
    voiture:
      nom: "Voiture"
      icone: CHEST_MINECART
      nombre: 4
      echelle: 1.75
      places: [[-0.38, 0.6, 0.27], [0.38, 0.6, 0.27], [-0.38, 0.6, -0.82], [0.38, 0.6, -0.82]]
      vitesse: 16
      marche-arriere: 5
      acceleration: 6
      freinage: 14
      braquage: 95
      pv: 120
      blindage: 0.3
      reservoir: 40
      consommation: 5
      bruit: 30
      largeur: 1.9
      longueur: 4.3
      hauteur: 1.95
      franchissement: 1.1
      belier: 18
      son: entity.minecart.inside
      son-intervalle: 20
      son-ton: 0.8
    humvee:
      nom: "Humvee"
      icone: TNT_MINECART
      nombre: 2
      echelle: 2.0
      places: [[-0.5, 0.875, 0.44], [0.5, 0.875, 0.44], [-0.5, 0.875, -0.41], [0.5, 0.875, -0.41]]
      vitesse: 12.5
      marche-arriere: 4
      acceleration: 4.5
      freinage: 12
      braquage: 80
      pv: 260
      blindage: 0.6
      reservoir: 70
      consommation: 10
      bruit: 36
      largeur: 2.3
      longueur: 4.9
      hauteur: 2.3
      franchissement: 1.6
      belier: 28
      son: entity.minecart.inside
      son-intervalle: 20
      son-ton: 0.55
    helico:
      nom: "Hélicoptère"
      icone: ELYTRA
      volant: true
      nombre: 1
      echelle: 2.5
      # Le mât du rotor est en avant du centre du modèle : on recule le modèle pour pivoter autour du mât.
      decalage: -1.72
      rotor-hauteur: 3.1
      places: [[-0.55, 0.86, 0.94], [0.55, 0.86, 0.94], [-0.55, 0.86, -0.47], [0.55, 0.86, -0.47]]
      vitesse: 20
      marche-arriere: 6
      montee: 7
      acceleration: 5
      braquage: 75
      pv: 160
      blindage: 0.2
      reservoir: 90
      consommation: 18
      bruit: 70
      largeur: 2.4
      longueur: 4.0
      hauteur: 2.7
      son: entity.ender_dragon.flap
      son-intervalle: 4
      son-ton: 1.5

infectes:
  max-par-joueur: 12
  max-total: 80
  # Toutes les N ticks, une tentative d'apparition autour de chaque joueur en raid.
  intervalle-apparition: 40
  distance-apparition-min: 22
  distance-apparition-max: 44
  # Un infesté plus loin que ça de tout joueur en raid disparaît.
  distance-disparition: 90
  # Combien de temps un infesté va enquêter sur un bruit (tir) entendu.
  memoire-bruit-secondes: 12
  # Bloque les monstres vanilla (apparition naturelle) : seuls les infestés peuplent la map.
  bloquer-monstres-naturels: true
  # Tirages de butin par infesté tué (chaque entrée est tentée à chaque tirage).
  butin-tirages: 1
  butin:
    - { objet: "munition:9mm:4-10", chance: 0.22 }
    - { objet: "munition:5-56:5-15", chance: 0.10 }
    - { objet: "munition:7-62:2-6", chance: 0.05 }
    - { objet: "munition:12g:2-5", chance: 0.06 }
    - { objet: "munition:carreau:1-3", chance: 0.04 }
    - { objet: "munition:40mm:1", chance: 0.008 }
    - { objet: "munition:cellule:1", chance: 0.004 }
    - { objet: "grenade:frag:1", chance: 0.03 }
    - { objet: "objet:BREAD:1-2", chance: 0.12 }
    - { objet: "objet:IRON_INGOT:1-2", chance: 0.06 }
    - { objet: "arme:c96", chance: 0.010 }
    - { objet: "arme:tec9", chance: 0.006 }
    - { objet: "arme:pdw", chance: 0.004 }
    - { objet: "arme:crossbow", chance: 0.004 }
  # Runner, rampant et cracheur ont un corps « mannequin » (entité à modèle de joueur) qui porte une texture du
  # pack ; l'entité vanilla qui porte l'IA est alors invisible. false = tout le monde garde l'apparence vanilla.
  corps-mannequin: true
  # Par type :
  #   entite        entité vanilla qui porte l'IA et la boîte de collision (ZOMBIE et HUSK ont leur texture dans le pack ;
  #                 évite DROWNED : il n'attaque pas en plein jour hors de l'eau)
  #   vie, degats, vitesse, taille, resistance-recul, poids (fréquence d'apparition), butin-tirages
  #   prime         crédits versés au joueur qui le tue
  #   skins         textures du pack (assets/orbitguns/textures/entity/infecte/<nom>.png, voir tools/InfectedSkins.java),
  #                 une au hasard par infecté -> corps mannequin
  #   pose          debout | accroupi | ramper (corps mannequin seulement)
  #   taille-corps  taille du corps mannequin (« taille » règle alors seulement la boîte de collision)
  #   crachat       attaque à distance (portee, recharge-ticks, degats, poison-ticks)
  types:
    marcheur:
      entite: ZOMBIE
      nom: "Marcheur"
      vie: 24
      degats: 3
      vitesse: 0.21
      poids: 45
      prime: 8
    traineur:
      entite: HUSK
      nom: "Traîneur"
      vie: 20
      degats: 3.5
      vitesse: 0.29
      taille: 0.94
      poids: 22
      prime: 12
    runner:
      entite: ZOMBIE
      nom: "Runner"
      vie: 14
      degats: 2.5
      vitesse: 0.37
      poids: 16
      prime: 15
      skins: [runner_1, runner_2, runner_3]
    rampant:
      entite: ZOMBIE
      nom: "Rampant"
      vie: 12
      degats: 3
      vitesse: 0.26
      taille: 0.45
      poids: 12
      prime: 12
      skins: [rampant_1, rampant_2]
      pose: ramper
    cracheur:
      entite: ZOMBIE
      nom: "Cracheur"
      vie: 18
      degats: 2
      vitesse: 0.24
      poids: 7
      prime: 20
      skins: [cracheur_1]
      pose: accroupi
      crachat:
        portee: 14
        recharge-ticks: 50
        degats: 4
        poison-ticks: 60
    mastodonte:
      entite: ZOMBIE
      nom: "Mastodonte"
      vie: 80
      degats: 7
      vitesse: 0.19
      taille: 1.4
      resistance-recul: 0.8
      poids: 4
      butin-tirages: 3
      prime: 60
