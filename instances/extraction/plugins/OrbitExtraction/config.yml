# ------------------------------------------------------------------
#  OrbitExtraction — extraction shooter PvPvE
#  Rechargement : /extraction reload
#  Format des objets (kit, butin) :
#    arme:<id>                 arme de guns.yml (chargeur plein dans le kit, vide en butin)
#    munition:<id>:<n|a-b>     munitions de guns.yml
#    grenade:<id>:<n|a-b>      grenades de guns.yml
#    soin:<id>:<n|a-b>         objets de soin de la section « soins » (bandage, medkit)
#    objet:<MATERIAU>:<n|a-b>  objet vanilla (BREAD, COOKED_BEEF, GOLDEN_APPLE...)
# ------------------------------------------------------------------

resource-pack:
  # Pack Orbit Extraction (généré par tools/gen-pack.ps1) : modèles 3D des armes et du téléphone, textures des
  # infectés, écrans du téléphone. Proposé pendant l'écran de connexion. Sans le pack : les armes ressemblent à
  # leur objet de base, le téléphone s'affiche en vitres, et runners / rampants / cracheurs n'ont pas de texture
  # (damier noir et violet) : sur un serveur public, passe « required » à true.
  enabled: true
  # Port du mini serveur HTTP intégré qui distribue le pack. Les joueurs le téléchargent à l'adresse
  # qu'ils ont utilisée pour se connecter : ouvre ce port (TCP) comme le port du jeu. (8790 = OrbitMMO.)
  port: 8791
  # Si le pack est hébergé ailleurs (CDN, site web), mets son URL ici : le serveur intégré ne démarre pas.
  public-url: ""
  # true = refuser le pack expulse le joueur.
  required: false

# HUD : avec le pack, la console du bas de l'écran remplace coeurs, faim et armure (toujours active).
hud:
  # Panneau latéral façon lobby (opérateur, raid ou planque, bilan, crédits), avec ou sans le pack.
  panneau: true

raid:
  # Durée d'un raid. À zéro : « porté disparu », tout l'inventaire est perdu.
  duree-minutes: 25
  # Nombre de points d'extraction tirés au sort pour chaque joueur à son déploiement.
  extractions-par-raid: 3
  # Compte à rebours avant le déploiement (secondes).
  compte-a-rebours: 5
  # Un joueur hors raid qui s'éloigne plus que ça de la planque y est ramené (hors créatif/spectateur).
  # La planque est la salle en hauteur de Lost Paradise City (84 x 56 blocs), à 500 blocs de l'île.
  rayon-planque: 110
  # Monde du raid. Si plugins/OrbitExtraction/apparitions-auto.csv existe (points au sol de la grande île,
  # calculés par tools/MapScan.java), le déploiement tire une zone de 64 blocs au hasard puis un point dedans ;
  # sinon il utilise les points posés à la main (/extraction spawn add).
  monde: world
  # Le déploiement privilégie les points d'apparition à au moins cette distance des autres joueurs en raid.
  distance-min-spawn: 60
  # Crédits versés au tueur d'un joueur en raid, et à chaque extraction réussie.
  prime-joueur: 150
  prime-extraction: 200
  # Commandes autorisées pendant un raid (les admins ne sont pas bloqués).
  commandes-autorisees: [raid, telephone, tel, phone, kit, kits, carte, minimap, map, msg, tell, r, w, me]
  # Donné une seule fois, à la première arrivée dans la planque.
  kit-de-depart:
    - "arme:c96"
    - "munition:9mm:40"
    - "grenade:frag:1"
    - "objet:BREAD:6"

# ------------------------------------------------------------------ téléphone
# Chaque joueur garde un téléphone (clic droit, ou /telephone) : raid, boutique, colis, messages, coffre, stats.
# Les crédits ne s'achètent pas : ils se gagnent en jeu (primes des infectés, joueurs abattus, extractions, revente).
economie:
  # Crédits d'un nouveau joueur.
  depart: 300
  # La boutique rachète ce qu'elle vend à ce taux du prix d'achat (0.25 = 25 %), à l'unité.
  taux-rachat: 0.25

boutique:
  # Achat et revente à la planque uniquement. « objet » : même format que le kit. 36 articles par page.
  articles:
    - { objet: "munition:9mm:40", prix: 40 }
    - { objet: "munition:5-56:40", prix: 70 }
    - { objet: "munition:7-62:30", prix: 80 }
    - { objet: "munition:12g:16", prix: 60 }
    - { objet: "munition:carreau:12", prix: 50 }
    - { objet: "munition:40mm:2", prix: 160 }
    - { objet: "munition:cellule:2", prix: 300 }
    - { objet: "grenade:frag:1", prix: 90 }
    - { objet: "objet:BREAD:6", prix: 20 }
    - { objet: "objet:COOKED_BEEF:6", prix: 45 }
    - { objet: "objet:GOLDEN_APPLE:1", prix: 150 }
    - { objet: "arme:c96", prix: 150 }
    - { objet: "arme:g18", prix: 220 }
    - { objet: "arme:tec9", prix: 260 }
    - { objet: "arme:elcovert", prix: 300 }
    - { objet: "arme:crossbow", prix: 400 }
    - { objet: "arme:pdw", prix: 520 }
    - { objet: "arme:combatsmg", prix: 560 }
    - { objet: "arme:pompe", prix: 650 }
    - { objet: "arme:vector", prix: 700 }
    - { objet: "arme:p90", prix: 760 }
    - { objet: "arme:m4", prix: 900 }
    - { objet: "arme:ak12", prix: 950 }
    - { objet: "arme:famas", prix: 950 }
    - { objet: "arme:tavor", prix: 1000 }
    - { objet: "arme:aug", prix: 1050 }
    - { objet: "arme:fal", prix: 1100 }
    - { objet: "arme:scar", prix: 1150 }
    - { objet: "arme:impact", prix: 1200 }
    - { objet: "arme:tactm4", prix: 1300 }
    - { objet: "arme:tactscar", prix: 1450 }
    - { objet: "arme:vssvintorez", prix: 1500 }
    - { objet: "arme:m24", prix: 1700 }
    - { objet: "arme:lmg", prix: 1900 }
    - { objet: "arme:grenadelauncher", prix: 2600 }
    - { objet: "arme:bfg", prix: 4000 }
    # Page 2 : soins et tenues (voir « armures » plus bas ; l'armure lourde ne se vend pas, elle se trouve en caisse rouge).
    - { objet: "soin:bandage:2", prix: 60 }
    - { objet: "soin:medkit:1", prix: 140 }
    - { objet: "armure:fortune:casque", prix: 40 }
    - { objet: "armure:fortune:plastron", prix: 70 }
    - { objet: "armure:fortune:jambieres", prix: 60 }
    - { objet: "armure:fortune:bottes", prix: 40 }
    - { objet: "armure:police:casque", prix: 130 }
    - { objet: "armure:police:plastron", prix: 220 }
    - { objet: "armure:police:jambieres", prix: 190 }
    - { objet: "armure:police:bottes", prix: 120 }
    - { objet: "armure:emeute:casque", prix: 320 }
    - { objet: "armure:emeute:plastron", prix: 540 }
    - { objet: "armure:emeute:jambieres", prix: 460 }
