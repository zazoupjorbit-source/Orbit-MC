          - "a7_lio: Elle a dit « seul » ? Moi aussi je trouve. On ne devrait pas mettre quelqu'un de seul en cage."
        dialogue-en:
          - "a7_lio: She said « alone »? I think so too. You should not put someone alone in a cage."
