# ------------------------------------------------------------------

pnj:
  a7_odalric:
    nom: "Capitaine Odalric"
    nom-en: "Captain Odalric"
    titre: "Guet de la Fournaise"
    titre-en: "Furnace Watch"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: garde_neutre_1
    point: a7_odalric
    main: IRON_SWORD
    repliques:
      - "Le Guet ne sert personne. Il regarde le volcan, et il prévient."
    repliques-en:
      - "The Watch serves no one. It watches the volcano, and it warns."
  a7_ysme:
    nom: "Ysmé"
    titre: "Tableau des contrats"
    titre-en: "Contract board"
    couleur: "#9FD8FF"
    type: MANNEQUIN
    visage: villageois_neutre_5
    point: a7_ysme
    repliques:
      - "Le volcan ne dort jamais. Les contrats non plus."
    repliques-en:
      - "The volcano never sleeps. Neither do the contracts."
  a7_lio:
    nom: "Lio"
    titre: "Jeune vigie"
    titre-en: "Young lookout"
    couleur: "#A8E6A1"
    type: MANNEQUIN
    visage: voyageur_3
    point: a7_lio
    main: SPYGLASS
    repliques:
      - "D'en haut de la tour, on voit la fente du ciel. Elle bouge, la nuit."
    repliques-en:
      - "From the top of the tower, you can see the crack in the sky. It moves, at night."
  a7_morvain:
    nom: "Morvain"
    titre: "Le premier Marqué"
    titre-en: "The first Marked"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: morvain
    point: a7_morvain
    main: NETHERITE_SWORD
    repliques:
      - "C'est ici qu'il s'est brisé. Je l'ai vu tomber. J'avais encore le marteau à la main."
    repliques-en:
      - "This is where it shattered. I saw it fall. I still had the hammer in my hand."
  a7_helis:
    nom: "Capitaine Hélis"
    nom-en: "Captain Hélis"
    titre: "Expédition de l'Aube"
    titre-en: "Dawn Expedition"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: garde_lumiere_1
    point: a7_helis
    main: GOLDEN_SWORD
    repliques:
      - "Le Reliquaire monte au cratère. L'Aube va finir ce qu'Aurélien a commencé."
    repliques-en:
      - "The Reliquary climbs to the crater. The Dawn will finish what Aurélien began."
  a7_sarn:
    nom: "Sarn"
    titre: "Lame de la Citadelle"
    titre-en: "Blade of the Citadel"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: garde_ombre_1
    point: a7_sarn
    main: NETHERITE_SWORD
    repliques:
      - "La cage noire est prête. Vharos arrive."
    repliques-en:
      - "The black cage is ready. Vharos is coming."
  a7_kael:
    nom: "Kael"
    titre: "Forgeron des Sans-Bannière"
    titre-en: "Smith of the Bannerless"
    couleur: "#8C96A3"
    type: MANNEQUIN
    visage: efe
    point: a7_kael
    main: IRON_AXE
    repliques:
      - "Le Défaiseur n'est pas une arme. C'est une main qui rend."
    repliques-en:
      - "The Unmaker is not a weapon. It is a hand that gives back."
  a7_prisca:
    nom: "Sœur Prisca"
    titre: "Sans-Bannière"
    titre-en: "Bannerless"
    couleur: "#D7DCE2"
    type: MANNEQUIN
    visage: zuri
    point: a7_prisca
    repliques:
      - "Joran se souvient de mon visage, maintenant. Ça valait le voyage."
    repliques-en:
      - "Joran remembers my face, now. It was worth the journey."
  a7_seraphine:
    nom: "Haute-Prélate Séraphine"
    nom-en: "High Prelate Séraphine"
    titre: "Bastion de l'Aube"
    titre-en: "Bastion of the Dawn"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: seraphine
    point: a7_seraphine
    repliques:
      - "Mille ans de patience. Encore une nuit."
    repliques-en:
      - "A thousand years of patience. One more night."
  a7_vharos:
    nom: "Vharos"
    titre: "Nécromancien"
    titre-en: "Necromancer"
    couleur: "#9B7BFF"
    type: MANNEQUIN
    visage: steve
    point: a7_vharos
    repliques:
      - "La cage est à moitié à moi. C'est déjà beaucoup."
    repliques-en:
      - "The cage is half mine. That is already a lot."
  a7_porteurs_aube:
    nom: "Porteuse du Reliquaire"
    titre: "Expédition de l'Aube"
    titre-en: "Dawn Expedition"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: garde_lumiere_3
    point: a7_porteurs_aube
    repliques:
      - "Le Reliquaire chante quand on le porte. On fait semblant de ne pas entendre."
    repliques-en:
      - "The Reliquary sings when carried. We pretend not to hear."
  a7_porteurs_ombre:
    nom: "Creux porteur"
    titre: "La cage noire"
    titre-en: "The black cage"
    couleur: "#8C96A3"
    type: MANNEQUIN
    visage: villageois_ombre_5
    point: a7_porteurs_ombre
    repliques:
      - "…"
    repliques-en:
      - "…"
  a7_captif:
    nom: "Wenn"
    titre: "Marquée captive"
    titre-en: "Captive Marked"
    couleur: "#D7DCE2"
    type: MANNEQUIN
    visage: villageois_neutre_3
    point: a7_captif
    repliques:
      - "Ils nous comptent comme du bois pour le feu."
    repliques-en:
      - "They count us like wood for the fire."
  a7_pelerine:
    nom: "Pèlerine de l'Astre"
    titre: "En route vers le cratère"
    titre-en: "On her way to the crater"
    couleur: "#F7E7A1"
    type: MANNEQUIN
    visage: voyageur_4
    point: a7_pelerine
    repliques:
      - "Je veux le voir. Une fois. Avant qu'ils le mettent en cage."
    repliques-en:
      - "I want to see it. Once. Before they put it in a cage."

