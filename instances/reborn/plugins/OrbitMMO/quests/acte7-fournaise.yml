  a7_s_le_registre:
    nom: "Le registre"
    nom-en: "The Register"
    niveau: 74
    requiert: ["choix:a7-ordres"]
    donneur: a7_kael
    resume:
      - "Le registre des Marqués est tenu"
      - "au poste des chasseurs, au sud-ouest du Guet."
    resume-en:
      - "The register of the Marked is kept"
      - "at the hunters' post, south-west of the Watch."
    offre:
      - "a7_kael: Le poste des chasseurs, au sud-ouest. Il me faut ce registre : les noms de ceux qu'ils ont pris."
