    resume:
      - "Morvain veut graver le nom d'Ilmar"
      - "dans les ruines de l'est."
    resume-en:
      - "Morvain wants to carve Ilmar's name"
      - "in the ruins to the east."
    offre:
      - "a7_morvain: À l'est du cratère, il y a les ruines du village où Ilmar et moi sommes nés. Personne n'a gravé son nom nulle part. Prends le marteau d'Ardric, et fais-le pour moi."
    offre-en:
      - "a7_morvain: East of the crater lie the ruins of the village where Ilmar and I were born. No one has carved his name anywhere. Take Ardric's hammer, and do it for me."
