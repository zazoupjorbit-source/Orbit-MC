      - "a7_kael: The hunters' post, to the south-west. I need that register: the names of those they have taken."
    etapes:
      - type: INTERAGIR
        texte: "Présenter tes ordres à l'entrée du poste"
        texte-en: "Present your orders at the post entrance"
        point: a7_poste_vigie_entree
        rayon: 5
        apres:
          - "Le chasseur de faction regarde ta bannière, puis ton visage. Il te fait signe d'entrer. Tu es attendu."
        apres-en:
          - "The hunter on watch looks at your banner, then your face. He waves you in. You are expected."
        si: "a7-ordres=accepter"
      - type: INFILTRER
        texte: "Entrer dans le poste sans être vu"
        texte-en: "Enter the post unseen"
        point: a7_poste_vigie
        depart: a7_poste_vigie_entree
        monstres: [a7_chasseur_aube, a7_chasseur_ombre]
        vue: 10
        rayon: 4
        apres:
          - "Tu te glisses derrière les tentes. Aube et Citadelle dorment sous la même toile."
        apres-en:
          - "You slip behind the tents. Dawn and Citadel sleep under the same canvas."
        si: "a7-ordres=refuser"
      - type: INTERAGIR
        texte: "Copier le registre"
        texte-en: "Copy the register"
        point: a7_poste_vigie
        rayon: 4
        apres:
          - "Deux cent douze noms. À côté de chacun, une colonne : « lumière restante ». Et en bas : « Pour allumer les deux cages, il en faut trois cents. »"
        apres-en:
          - "Two hundred and twelve names. Beside each, a column: « light remaining ». And at the bottom: « To light both cages, three hundred are needed. »"
      - type: PARLER
        texte: "Rapporter la copie à Kael"
        texte-en: "Bring the copy to Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: Joran est sur la liste. Et Anseau. Et toi."
          - "a7_kael: Les cages ne brûlent pas au charbon. Elles brûlent aux Marqués."
        dialogue-en:
          - "a7_kael: Joran is on the list. And Anseau. And you."
          - "a7_kael: The cages do not burn on coal. They burn on Marked."
    recompenses:
      xp: 24500
      or: 2450

  a7_s_l_enclos:
    nom: "L'enclos"
    nom-en: "The Pen"
    niveau: 74
    requiert: [a7_s_le_registre]
    donneur: a7_prisca
    resume:
      - "Les chasseurs gardent les Marqués pris"
      - "dans un enclos, plus à l'ouest."
    resume-en:
      - "The hunters keep the captured Marked"
      - "in a pen, further west."
    offre:
      - "a7_prisca: Ceux du registre sont parqués à l'ouest, dans un enclos de piquets. Suis les traces depuis le Guet. Ramène-en au moins une, vivante."
    offre-en:
      - "a7_prisca: Those on the register are penned to the west, behind stakes. Follow the tracks from the Watch. Bring at least one back, alive."
    etapes:
      - type: PISTER
        texte: "Suivre les traces des chasseurs"
        texte-en: "Follow the hunters' tracks"
        traces: [a7_trace_1, a7_trace_2, a7_trace_3, a7_trace_fin]
        apres:
          - "L'enclos. Des Marqués enchaînés, des deux camps, et des chasseurs des deux camps qui jouent aux dés devant."
        apres-en:
          - "The pen. Marked in chains, from both camps, and hunters from both camps playing dice in front of it."
      - type: TUER
        texte: "Abattre les chasseurs de l'enclos"
        texte-en: "Kill the hunters of the pen"
        monstres: [a7_chasseur_aube, a7_chasseur_ombre]
        nombre: 6
        point: a7_trace_fin
      - type: ESCORTE
        texte: "Escorter Wenn jusqu'au camp"
        texte-en: "Escort Wenn to the camp"
        pnj: a7_captif
        chemin: [a7_camp_sb]
        monstres: [a7_chasseur_aube, a7_chasseur_ombre]
        nombre: 2
        vagues: 2
        pv: 140
        degats: 6
        apres:
          - "a7_captif: Un camp sans bannière. Je croyais que ça n'existait que dans les chansons de Prisca."
        apres-en:
          - "a7_captif: A camp without a banner. I thought that only existed in Prisca's songs."
      - type: PARLER
        texte: "Revenir voir Prisca"
        texte-en: "Return to Prisca"
        pnj: a7_prisca
        dialogue:
          - "a7_prisca: Une de sauvée. Il en reste deux cent onze. On ne fera pas ça une par une : il faut casser les cages."
        dialogue-en:
          - "a7_prisca: One saved. Two hundred and eleven remain. We will not do this one by one: we must break the cages."
    recompenses:
      xp: 24500
      or: 2450

  a7_s_le_feu_du_defaiseur:
    nom: "Le feu du Défaiseur"
    nom-en: "The Unmaker's Fire"
    niveau: 75
    requiert: [a7_s_l_enclos]
    donneur: a7_kael
    resume:
      - "Kael doit tremper le Défaiseur"
      - "dans la veine d'or du volcan."
    resume-en:
      - "Kael must temper the Unmaker"
      - "in the volcano's golden vein."
    offre:
      - "a7_kael: Au nord-ouest du cratère, la lave coule dorée. C'est le sang de l'Astre. Le Défaiseur doit y être trempé. Tiens bon le temps que le métal boive."
    offre-en:
      - "a7_kael: North-west of the crater, the lava runs golden. It is the Star's blood. The Unmaker must be tempered in it. Hold on while the metal drinks."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre la veine d'or"
        texte-en: "Reach the golden vein"
        point: a7_veine
        rayon: 8
      - type: SURVIE
        texte: "Tenir pendant que le Défaiseur boit la veine"
        texte-en: "Hold on while the Unmaker drinks from the vein"
        point: a7_veine
        rayon: 10
        duree: 60
        mode: brule
        degats: 6
        monstres: [a7_feu_follet]
        nombre: 2
        intervalle: 15
        apres:
          - "Le marteau siffle dans la lave dorée. Quand tu le retires, il ne brille pas : il respire."
        apres-en:
          - "The hammer hisses in the golden lava. When you draw it out, it does not shine: it breathes."
      - type: PARLER
        texte: "Rapporter le Défaiseur à Kael"
        texte-en: "Bring the Unmaker back to Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: Ilmar a chanté, dans la lave. Je l'ai entendu d'ici."
        dialogue-en:
          - "a7_kael: Ilmar sang, in the lava. I heard him from here."
        si: "a6-coeur-chaine=rendre"
      - type: PARLER
        texte: "Rapporter le Défaiseur à Kael"
        texte-en: "Bring the Unmaker back to Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: Il respire. Le sang de l'Astre ne sait pas faire de chaînes. Il sait seulement rendre."
        dialogue-en:
          - "a7_kael: It breathes. The Star's blood does not know how to make chains. It only knows how to give back."
        si: "!a6-coeur-chaine=rendre"
    recompenses:
      xp: 25000
      or: 2500

  a7_s_les_eclats_tombes:
    nom: "Les Éclats tombés"
    nom-en: "The Fallen Shards"
    niveau: 75
    requiert: [a7_s_le_feu_du_defaiseur]
    donneur: a7_prisca
    resume:
      - "Quatre grands Éclats sont tombés"
      - "autour du cratère."
    resume-en:
      - "Four great Shards have fallen"
      - "around the crater."
    offre:
      - "a7_prisca: Quatre grands Éclats sont tombés autour du cratère. Personne ne les ramasse : ils brûlent les mains. Va les écouter. Je crois qu'ils parlent."
    offre-en:
      - "a7_prisca: Four great Shards have fallen around the crater. No one picks them up: they burn the hands. Go and listen to them. I think they speak."
    etapes:
      - type: ENQUETE
        texte: "Écouter les quatre Éclats"
        texte-en: "Listen to the four Shards"
        pnj: a7_prisca
        indices:
          - point: a7_eclat_1
            texte: "L'Éclat de l'ouest"
            texte-en: "The western Shard"
            apres:
              - "Une voix d'enfant, très loin : « Où sont les autres ? »"
            apres-en:
              - "A child's voice, very far away: « Where are the others? »"
          - point: a7_eclat_2
            texte: "L'Éclat de l'est"
            texte-en: "The eastern Shard"
            apres:
              - "« Ils m'ont mis dans des fioles. Dans des épées. Dans des gens. Je suis partout et nulle part. »"
            apres-en:
              - "« They put me in vials. In swords. In people. I am everywhere and nowhere. »"
          - point: a7_eclat_3
            texte: "L'Éclat du nord-ouest"
            texte-en: "The north-western Shard"
            apres:
              - "« Je ne veux pas qu'on me rassemble de force. Je veux revenir de moi-même. »"
            apres-en:
              - "« I do not want to be gathered by force. I want to come back of my own accord. »"
          - point: a7_eclat_4
            texte: "L'Éclat du nord-est"
            texte-en: "The north-eastern Shard"
            apres:
              - "« Les Marqués ne sont pas mes prisons. Ce sont mes amis. Ne les brûlez pas. »"
            apres-en:
              - "« The Marked are not my prisons. They are my friends. Do not burn them. »"
        dialogue:
          - "a7_prisca: « Revenir de moi-même. » Alors il ne faut pas le rassembler. Il faut ouvrir la porte, et le laisser choisir."
        dialogue-en:
          - "a7_prisca: « Come back of my own accord. » Then it must not be gathered. The door must be opened, and it must be left to choose."
    recompenses:
      xp: 25000
      or: 2500

  a7_s_la_cape_du_pacte:
    nom: "La cape du Pacte"
    nom-en: "The Cloak of the Pact"
    niveau: 76
    requiert: [a7_s_les_eclats_tombes]
    donneur: a7_kael
    resume:
      - "Les deux chefs se retrouvent en secret"
      - "à l'autel des chaînes, au bord nord."
    resume-en:
      - "The two leaders are meeting in secret"
      - "at the altar of chains, on the northern rim."
    offre:
      - "a7_kael: Séraphine et Vharos sont arrivés la même nuit. Ils ne sont allés ni au Reliquaire, ni à la cage. Ils sont à l'autel, au bord nord. Prends cette cape : leurs gardes la portent."
    offre-en:
      - "a7_kael: Séraphine and Vharos arrived the same night. They went neither to the Reliquary nor to the cage. They are at the altar, on the northern rim. Take this cloak: their guards wear it."
    etapes:
      - type: DEGUISEMENT
        texte: "Approcher de l'autel, déguisé en garde du Pacte"
        texte-en: "Approach the altar, disguised as a guard of the Pact"
        point: a7_autel_chaines
        monstres: [a7_garde_pacte]
        materiau: LEATHER_CHESTPLATE
        couleur: "#3A2A12"
        objet: "Cape du Pacte"
        objet-en: "Cloak of the Pact"
        apres:
          - "Sous les capes, des soleils et des griffes, mêlés. Personne ne te regarde."
        apres-en:
          - "Under the cloaks, suns and claws, mingled. No one looks at you."
      - type: INTERAGIR
        texte: "Écouter"
        texte-en: "Listen"
        point: a7_autel_chaines
        rayon: 6
        apres:
          - "a7_seraphine: Deux cent douze. Il en faut trois cents. Tes chasseurs sont lents."
          - "a7_vharos: Les tiens aussi. Et quelqu'un a vidé un enclos à l'ouest."
          - "a7_seraphine: Des Sans-Bannière. Qu'importe. Demain, l'Éclat-Cœur entre dans le Reliquaire, ta cage se referme sur le reste, et nous tenons l'Astre à deux. Pour mille ans."
          - "a7_vharos: Le Pacte des Deux Ciels. On aurait dû le refaire plus tôt. Toute cette guerre…"
          - "a7_seraphine: La guerre était utile. Elle a amené les Marqués jusqu'ici."
        apres-en:
          - "a7_seraphine: Two hundred and twelve. Three hundred are needed. Your hunters are slow."
          - "a7_vharos: So are yours. And someone emptied a pen to the west."
          - "a7_seraphine: Bannerless. No matter. Tomorrow, the Heart-Shard enters the Reliquary, your cage closes on the rest, and we hold the Star between us. For a thousand years."
          - "a7_vharos: The Pact of the Two Skies. We should have remade it sooner. All this war…"
          - "a7_seraphine: The war was useful. It brought the Marked all the way here."
      - type: PARLER
        texte: "Revenir voir Kael"
        texte-en: "Return to Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: L'Éclat-Cœur. Ils l'ont pris à deux, et chaque camp a accusé l'autre. Tout le monde est mort pour un mensonge à deux voix."
        dialogue-en:
          - "a7_kael: The Heart-Shard. They took it together, and each camp blamed the other. Everyone died for a lie told by two voices."
    recompenses:
      xp: 25600
      or: 2560

  a7_s_morvain_choisit:
    nom: "Morvain choisit"
    nom-en: "Morvain Chooses"
    niveau: 77
    requiert: [a7_s_la_cape_du_pacte]
    donneur: a7_morvain
    resume:
      - "Morvain a tout entendu."
      - "Il veut savoir s'il peut venir."
    resume-en:
      - "Morvain heard everything."
      - "He wants to know if he may come."
    offre:
      - "a7_morvain: J'ai forgé la dernière chaîne. Demain, vous allez la briser. J'ai une question à te poser, et je n'ose pas la poser à Kael."
    offre-en:
      - "a7_morvain: I forged the last chain. Tomorrow, you are going to break it. I have a question to ask you, and I do not dare ask Kael."
    etapes:
      - type: ENQUETE
        texte: "Toucher les souvenirs de Morvain"
        texte-en: "Touch Morvain's memories"
        pnj: a7_morvain
        indices:
          - point: a7_souvenir_1
            texte: "Une pierre fondue en forme de main"
            texte-en: "A molten stone shaped like a hand"
            apres:
              - "Un écuyer de quatorze ans tend une chaîne finie à un roi. Le roi ne le regarde pas."
            apres-en:
              - "A squire of fourteen holds out a finished chain to a king. The king does not look at him."
          - point: a7_souvenir_2
            texte: "Un Éclat planté comme une lame"
            texte-en: "A Shard stuck in like a blade"
            apres:
              - "La chaîne monte vers le ciel. Le garçon reste en bas et se bouche les oreilles. Il entend quand même."
            apres-en:
              - "The chain rises to the sky. The boy stays below and covers his ears. He hears it anyway."
          - point: a7_souvenir_3
            texte: "Une flaque de verre noir"
            texte-en: "A pool of black glass"
            apres:
              - "Un morceau d'Astre tombe sur le garçon. Il ne brûle pas. Il se pose sur son bras, comme un oiseau. La première Marque."
            apres-en:
              - "A piece of the Star falls on the boy. It does not burn. It settles on his arm, like a bird. The first Mark."
        dialogue:
          - "a7_morvain: Tu as vu. Il ne m'a pas puni. Il s'est posé sur moi. Mille ans que je ne comprends pas pourquoi."
        dialogue-en:
          - "a7_morvain: You saw. It did not punish me. It settled on me. A thousand years I have not understood why."
      - type: CHOIX
        texte: "Répondre à Morvain"
        texte-en: "Answer Morvain"
        pnj: a7_morvain
        choix: a7-morvain
        question: "Que répondez-vous à Morvain ?"
        question-en: "What do you answer Morvain?"
        reponses:
          - id: avec_nous
            texte: "Viens. Le premier maillon est à toi."
            texte-en: "Come. The first link is yours."
            reponse:
              - "a7_morvain: … Merci. Je tiendrai le marteau droit, cette fois."
            reponse-en:
              - "a7_morvain: … Thank you. I will hold the hammer straight, this time."
            xp: 3000
          - id: seul
            texte: "Reste. Tu as assez porté. On le fera pour toi."
            texte-en: "Stay. You have carried enough. We will do it for you."
            reponse:
              - "a7_morvain: Pour moi. Personne n'a jamais rien fait pour moi. … Va."
            reponse-en:
              - "a7_morvain: For me. No one has ever done anything for me. … Go."
            or: 600
        dialogue:
          - "a7_morvain: Demain, au Cœur. Est-ce que je peux venir ? Frapper le premier maillon. Ou est-ce que c'est à vous, et plus à moi ?"
        dialogue-en:
          - "a7_morvain: Tomorrow, at the Heart. May I come? Strike the first link. Or is it yours, and no longer mine?"
    recompenses:
      xp: 26100
      or: 2610

  a7_s_la_nuit_des_chasseurs:
    nom: "La nuit des chasseurs"
    nom-en: "The Night of the Hunters"
    niveau: 78
    requiert: [a7_s_morvain_choisit]
    donneur: a7_prisca
    resume:
      - "Les chasseurs ont trouvé le camp."
    resume-en:
      - "The hunters have found the camp."
    offre:
      - "a7_prisca: Ils ont suivi Wenn. Les chasseurs des deux camps montent vers nous. Si le camp tombe, le Défaiseur tombe avec. Tiens-le !"
    offre-en:
      - "a7_prisca: They followed Wenn. Hunters of both camps are climbing towards us. If the camp falls, the Unmaker falls with it. Hold it!"
    etapes:
      - type: DEFENSE
        texte: "Défendre le camp des Sans-Bannière"
        texte-en: "Defend the Bannerless camp"
        point: a7_camp_sb
        monstres: [a7_chasseur_aube, a7_chasseur_ombre]
        nombre: 3
        vagues: 4
        apparition: a7_trace_3
        pv: 400
        degats: 7
        cible: "Le Défaiseur"
        cible-en: "The Unmaker"
        apres:
          - "Les derniers chasseurs fuient. L'un d'eux a laissé tomber un ordre signé de deux initiales : « S. — V. : ramenez-les tous, vivants. »"
        apres-en:
          - "The last hunters flee. One of them dropped an order signed with two initials: « S. — V.: bring them all back, alive. »"
      - type: PARLER
        texte: "Revenir voir Prisca"
        texte-en: "Return to Prisca"
        pnj: a7_prisca
        dialogue:
          - "a7_prisca: Vivants. Pour le feu. Demain soir, c'est nous ou les cages."
        dialogue-en:
          - "a7_prisca: Alive. For the fire. Tomorrow night, it is us or the cages."
    recompenses:
      xp: 26700
      or: 2670

  a7_s_le_serment:
    nom: "Le serment"
    nom-en: "The Oath"
    niveau: 78
    requiert: [a7_s_la_nuit_des_chasseurs]
    donneur: a7_kael
    resume:
      - "Kael veut savoir ce que vous ferez"
      - "quand les chaînes tomberont."
    resume-en:
      - "Kael wants to know what you will do"
      - "when the chains fall."
    offre:
      - "a7_kael: Avant demain, je dois te dire une chose. Prisca ne voulait pas."
    offre-en:
      - "a7_kael: Before tomorrow, I must tell you something. Prisca did not want me to."
    etapes:
      - type: CHOIX
        texte: "Répondre à Kael"
        texte-en: "Answer Kael"
        pnj: a7_kael
        choix: a7-serment
        question: "Que répondez-vous à Kael ?"
        question-en: "What do you answer Kael?"
        reponses:
          - id: briser
            texte: "On brise. Même si ça nous coûte nos Marques."
            texte-en: "We break them. Even if it costs us our Marks."
            reponse:
              - "a7_kael: Alors demain soir, au Cœur. Toi, moi, Prisca, et le Défaiseur."
            reponse-en:
              - "a7_kael: Then tomorrow night, at the Heart. You, me, Prisca, and the Unmaker."
            xp: 4000
          - id: suivre
            texte: "Je te suis, Kael. Tu as forgé le marteau, tu décides."
            texte-en: "I follow you, Kael. You forged the hammer, you decide."
            reponse:
              - "a7_kael: Alors on brise. Mais je voulais que ce soit ton choix aussi. … Il l'est, maintenant."
            reponse-en:
              - "a7_kael: Then we break them. But I wanted it to be your choice too. … It is, now."
            or: 800
        dialogue:
          - "a7_kael: Quand les chaînes tomberont, l'Astre sera libre. Libre de reprendre ses morceaux. Ceux des fioles, ceux des épées. Et peut-être ceux de nos Marques."
          - "a7_kael: Je ne sais pas ce qu'on devient sans Marque. Je casse quand même ?"
        dialogue-en:
          - "a7_kael: When the chains fall, the Star will be free. Free to take back its pieces. Those in the vials, those in the swords. And perhaps those in our Marks."
          - "a7_kael: I do not know what we become without a Mark. Do I break them anyway?"
      - type: PARLER
        texte: "Prévenir Prisca"
        texte-en: "Tell Prisca"
        pnj: a7_prisca
        dialogue:
          - "a7_prisca: Demain soir. Je chanterai, pour une fois. Pas pour sortir la lumière des gens : pour l'appeler dehors."
        dialogue-en:
          - "a7_prisca: Tomorrow night. I will sing, for once. Not to draw the light out of people: to call it outside."
    recompenses:
      xp: 26700
      or: 2670

  # ================================================================ PRINCIPALES — FINALE COMMUNE : LE CŒUR DE LA FOURNAISE

  a7_f_le_seuil_du_coeur:
    nom: "Le seuil du Cœur"
    nom-en: "The Threshold of the Heart"
    niveau: 79
    requiert: ["choix:a7-serment"]
    donneur: a7_morvain
    resume:
      - "La nuit de la cage est venue."
      - "Il faut tenir le seuil du Cœur."
    resume-en:
      - "The night of the cage has come."
      - "The threshold of the Heart must be held."
    offre:
      - "a7_morvain: Ils allument les cages ce soir. Kael monte avec le Défaiseur. Il lui faut du temps au seuil, et les gardes du Pacte arrivent déjà. Monte, et tiens."
    offre-en:
      - "a7_morvain: They light the cages tonight. Kael is climbing with the Unmaker. He needs time at the threshold, and the guards of the Pact are already coming. Climb, and hold."
    etapes:
      - type: ATTEINDRE
        texte: "Monter au parvis du Cœur"
        texte-en: "Climb to the forecourt of the Heart"
        point: a7_coeur_parvis
        rayon: 10
      - type: DEFENSE
        texte: "Tenir le seuil pendant que Kael prépare le Défaiseur"
        texte-en: "Hold the threshold while Kael readies the Unmaker"
        point: a7_coeur_parvis
        monstres: [a7_garde_pacte, a7_affame]
        nombre: 4
        vagues: 5
        apparition: a7_sentier_2
        pv: 500
        degats: 8
        cible: "Kael et le Défaiseur"
        cible-en: "Kael and the Unmaker"
        apres:
          - "Le dernier garde du Pacte roule sur la pente. Derrière la porte du Cœur, quelque chose cogne contre les chaînes. Comme un cœur."
        apres-en:
          - "The last guard of the Pact rolls down the slope. Behind the door of the Heart, something knocks against the chains. Like a heart."
      - type: PARLER
        texte: "Retrouver Morvain au Guet"
        texte-en: "Find Morvain at the Watch"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Je monte avec vous. Le premier maillon est à moi. Tu me l'as donné."
        dialogue-en:
          - "a7_morvain: I am coming with you. The first link is mine. You gave it to me."
        si: "a7-morvain=avec_nous"
      - type: PARLER
        texte: "Retrouver Morvain au Guet"
        texte-en: "Find Morvain at the Watch"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Le seuil tient. Va. Frappe pour moi. Je regarderai d'ici, comme il y a mille ans. Mais cette fois, je ne me boucherai pas les oreilles."
        dialogue-en:
          - "a7_morvain: The threshold holds. Go. Strike for me. I will watch from here, as a thousand years ago. But this time, I will not cover my ears."
        si: "!a7-morvain=avec_nous"
    recompenses:
      xp: 27200
      or: 2720

  a7_f_l_astre_enchaine:
    nom: "L'Astre enchaîné"
    nom-en: "The Chained Star"
    niveau: 80
    requiert: [a7_f_le_seuil_du_coeur]
    donneur: a7_morvain
    resume:
      - "Raid du Cœur de la Fournaise."
      - "Brisez les chaînes de l'Astre."
    resume-en:
      - "Raid of the Heart of the Furnace."
      - "Break the chains of the Star."
    offre:
      - "a7_morvain: Les deux cages sont allumées. L'Éclat-Cœur est dans le Reliquaire, le reste dans la cage noire. Deux geôliers tiennent les clefs. Et l'Astre se débat, fou de douleur : il frappera tout ce qui approche. Venez nombreux."
    offre-en:
      - "a7_morvain: Both cages are lit. The Heart-Shard is in the Reliquary, the rest in the black cage. Two jailers hold the keys. And the Star thrashes, mad with pain: it will strike anything that comes near. Come in numbers."
    etapes:
      - type: ATTEINDRE
        texte: "Entrer dans le Cœur de la Fournaise"
        texte-en: "Enter the Heart of the Furnace"
        point: a7_coeur_entree
        rayon: 6
      - type: TUER
        texte: "Abattre le Geôlier d'or"
        texte-en: "Kill the Jailer of gold"
        monstres: [a7_geolier_aube]
        point: a7_coeur_parvis
      - type: TUER
        texte: "Abattre le Geôlier d'ombre"
        texte-en: "Kill the Jailer of shadow"
        monstres: [a7_geolier_ombre]
        point: a7_coeur_parvis
      - type: TUER
        texte: "Calmer l'Astre enchaîné"
        texte-en: "Calm the Chained Star"
        monstres: [a7_astre_enchaine]
        point: a7_coeur_portail
        apres:
          - "L'Astre s'effondre au milieu des chaînes. Ce n'est pas un monstre. C'est une lumière trop grande pour la pièce, qui a peur."
        apres-en:
          - "The Star collapses amid the chains. It is not a monster. It is a light too big for the room, and it is afraid."
      - type: INTERAGIR
        texte: "Frapper les chaînes avec le Défaiseur"
        texte-en: "Strike the chains with the Unmaker"
        point: a7_coeur_portail
        rayon: 5
        apres:
          - "Morvain frappe le premier maillon. Le marteau ne casse pas la chaîne : il la rend. Les maillons redeviennent lumière, un par un."
        apres-en:
          - "Morvain strikes the first link. The hammer does not break the chain: it gives it back. The links turn back into light, one by one."
        si: "a7-morvain=avec_nous"
      - type: INTERAGIR
        texte: "Frapper les chaînes avec le Défaiseur"
        texte-en: "Strike the chains with the Unmaker"
        point: a7_coeur_portail
        rayon: 5
        apres:
          - "Tu frappes le premier maillon. Le marteau ne casse pas la chaîne : il la rend. Les maillons redeviennent lumière, un par un."
        apres-en:
          - "You strike the first link. The hammer does not break the chain: it gives it back. The links turn back into light, one by one."
        si: "!a7-morvain=avec_nous"
      - type: INTERAGIR
        texte: "Regarder l'Astre"
        texte-en: "Look at the Star"
        point: a7_coeur_portail
        rayon: 5
        apres:
          - "Le Reliquaire s'ouvre. La cage noire s'ouvre. Les fioles éclatent toutes ensemble, dans tout le cratère. L'Astre se lève, entier pour la première fois depuis mille ans."
          - "Il ne monte pas. Il regarde les Marqués, un par un. Puis il se pose, et attend."
        apres-en:
          - "The Reliquary opens. The black cage opens. The vials burst all together, across the whole crater. The Star rises, whole for the first time in a thousand years."
          - "It does not rise. It looks at the Marked, one by one. Then it settles, and waits."
      - type: PARLER
        texte: "Retrouver Morvain"
        texte-en: "Find Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Il ne s'en va pas. Mille ans enchaîné, et quand on ouvre, il reste."
        dialogue-en:
          - "a7_morvain: It is not leaving. A thousand years in chains, and when we open, it stays."
    recompenses:
      xp: 44400
      or: 4440
      objets:
        - materiau: IRON_CHAIN
          nom: "Maillon rendu"
          nom-en: "Returned link"
          description:
            - "Un maillon de la dernière chaîne, redevenu tiède."
          description-en:
            - "A link of the last chain, turned warm again."

  a7_f_ce_qui_reste:
    nom: "Ce qui reste"
    nom-en: "What Remains"
    niveau: 80
    requiert: [a7_f_l_astre_enchaine]
    donneur: a7_odalric
    resume:
      - "L'Astre est libre."
      - "Les chefs ont fui. Le Guet compte ce qui reste."
    resume-en:
      - "The Star is free."
      - "The leaders have fled. The Watch counts what remains."
    offre:
      - "a7_odalric: Séraphine et Vharos ont fui par le même sentier, au petit jour. Vivants. Les deux armées redescendent sans chefs. Et là-haut, il y a… quelque chose. Venez voir."
    offre-en:
      - "a7_odalric: Séraphine and Vharos fled by the same path, at daybreak. Alive. Both armies are going back down without leaders. And up there, there is… something. Come and see."
    etapes:
      - type: PARLER
        texte: "Écouter Odalric"
        texte-en: "Listen to Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: Cent ans que le Guet regarde ce volcan. Cette nuit, pour la première fois, il nous a regardés en retour."
        dialogue-en:
          - "a7_odalric: A hundred years the Watch has looked at this volcano. Tonight, for the first time, it looked back at us."
      - type: PARLER
        texte: "Parler à Hélis"
        texte-en: "Talk to Hélis"
        pnj: a7_helis
        dialogue:
          - "a7_helis: J'ai dormi à mon poste. Je crois que c'est la meilleure chose que j'aie faite pour l'Aube."
        dialogue-en:
          - "a7_helis: I slept at my post. I think it is the best thing I have done for the Dawn."
        si: "a7-serment=briser"
      - type: PARLER
        texte: "Parler à Hélis"
        texte-en: "Talk to Hélis"
        pnj: a7_helis
        dialogue:
          - "a7_helis: La Haute-Prélate est partie. Je ne sais plus à qui obéir. C'est terrifiant. C'est… léger."
        dialogue-en:
          - "a7_helis: The High Prelate is gone. I no longer know whom to obey. It is terrifying. It is… light."
        si: "!a7-serment=briser"
      - type: PARLER
        texte: "Parler à Sarn"
        texte-en: "Talk to Sarn"
        pnj: a7_sarn
        dialogue:
          - "a7_sarn: Vharos m'a appelé en fuyant. Je n'ai pas suivi. La première fois de ma vie qu'une lame reste au fourreau."
        dialogue-en:
          - "a7_sarn: Vharos called to me as he fled. I did not follow. The first time in my life a blade has stayed in its sheath."
      - type: PARLER
        texte: "Retrouver Kael"
        texte-en: "Find Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: Ma Marque est toujours là. Plus pâle. Elle ne brûle plus. Elle chauffe, comme une main sur l'épaule."
          - "a7_kael: Il ne nous a rien repris. Il a demandé."
        dialogue-en:
          - "a7_kael: My Mark is still there. Paler. It no longer burns. It is warm, like a hand on the shoulder."
          - "a7_kael: It took nothing back from us. It asked."
      - type: ATTEINDRE
        texte: "Monter au bord nord du cratère"
        texte-en: "Climb to the northern rim of the crater"
        point: a7_bord_nord
        rayon: 8
      - type: INTERAGIR
        texte: "Regarder le ciel"
        texte-en: "Look at the sky"
        point: a7_bord_nord
        rayon: 6
        apres:
          - "L'Astre flotte au-dessus du cratère, entier et pâle. Au-dessus de lui, la fente du ciel ne s'est pas refermée. Elle s'est ouverte un peu plus."
          - "Quelque chose de froid souffle par la fente. Ce qui reste de l'Astre, là-haut, a senti le reste revenir. Et il a faim. À suivre."
        apres-en:
          - "The Star floats above the crater, whole and pale. Above it, the crack in the sky has not closed. It has opened a little more."
          - "Something cold blows through the crack. What remains of the Star, up there, has felt the rest come back. And it is hungry. To be continued."
    recompenses:
      xp: 27800
      or: 2780

  # ================================================================ ANNEXES NEUTRES — LE GUET DE LA FOURNAISE (toutes factions)

  a7_n_les_vivres_de_tobbe:
    nom: "Les vivres de Tobbe"
    nom-en: "Tobbe's Supplies"
    niveau: 72
    donneur: a6_tobbe
    resume:
      - "Tobbe envoie des galettes"
      - "au capitaine du Guet."
    resume-en:
      - "Tobbe is sending flatbreads"
      - "to the captain of the Watch."
    offre:
      - "a6_tobbe: Tu montes au Guet ? Odalric est un vieux camarade. Là-haut, ils mangent de la pierre. Porte-lui ce sac de galettes de cendre."
    offre-en:
      - "a6_tobbe: You are going up to the Watch? Odalric is an old comrade. Up there, they eat stone. Take him this bag of ash flatbreads."
    etapes:
      - type: LIVRER
        texte: "Porter les galettes à Odalric"
        texte-en: "Carry the flatbreads to Odalric"
        pnj: a7_odalric
        materiau: BREAD
        objet: "Sac de galettes de cendre"
        objet-en: "Bag of ash flatbreads"
        dialogue:
          - "a7_odalric: Des galettes de Tobbe ! Il les brûle toujours un peu. Exprès, il dit. Dis-lui que le Guet le remercie."
        dialogue-en:
          - "a7_odalric: Tobbe's flatbreads! He always burns them a little. On purpose, he says. Tell him the Watch thanks him."
    recompenses:
      xp: 18800
      or: 1880

  a7_n_les_salamandres:
    nom: "Les salamandres"
    nom-en: "The Salamanders"
    niveau: 73
    donneur: a7_odalric
    resume:
      - "Des salamandres de lave"
      - "remontent vers la route de l'est."
    resume-en:
      - "Lava salamanders"
      - "are climbing towards the eastern road."
    offre:
      - "a7_odalric: Les salamandres sortent de leur nid, à l'est, et mordent les mules. Va les calmer. Définitivement."
    offre-en:
      - "a7_odalric: The salamanders are leaving their nest, to the east, and biting the mules. Go and calm them. Permanently."
    etapes:
      - type: TUER
        texte: "Abattre des salamandres de lave"
        texte-en: "Kill lava salamanders"
        monstres: [a7_salamandre]
        nombre: 10
        point: a7_nid_salamandres
      - type: PARLER
        texte: "Revenir voir Odalric"
        texte-en: "Return to Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: Les mules te remercient. Moi aussi, mais je le dis moins fort."
        dialogue-en:
          - "a7_odalric: The mules thank you. So do I, but I say it less loudly."
    recompenses:
      xp: 19200
      or: 1920

  a7_n_les_feux_errants:
    nom: "Les feux errants"
    nom-en: "The Wandering Fires"
    niveau: 74
    requiert: [a7_n_les_salamandres]
    donneur: a7_odalric
    resume:
      - "Des feux errants dansent"
      - "sur les cendres vives de l'ouest."
    resume-en:
      - "Wandering fires are dancing"
      - "on the live ash to the west."
    offre:
      - "a7_odalric: À l'ouest, sur les cendres vives, des feux dansent la nuit. Les nouveaux croient que ce sont des esprits. Moi, je crois que ça brûle. Éteins-les."
    offre-en:
      - "a7_odalric: To the west, on the live ash, fires dance at night. The newcomers think they are spirits. I think they burn. Put them out."
    etapes:
      - type: TUER
        texte: "Éteindre des feux errants"
        texte-en: "Put out wandering fires"
        monstres: [a7_feu_follet]
        nombre: 8
        point: a7_cendres_vives
      - type: RAMASSER
        texte: "Récupérer leurs cœurs de braise"
        texte-en: "Take their ember hearts"
        monstres: [a7_feu_follet]
        nombre: 4
        chance: 0.5
        point: a7_cendres_vives
        objet: "Cœur de braise"
        objet-en: "Ember heart"
      - type: PARLER
        texte: "Revenir voir Odalric"
        texte-en: "Return to Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: Des cœurs de braise. Ils chauffent encore. Ces feux-là venaient de quelque part, et ce quelque part est plus gros qu'eux."
        dialogue-en:
          - "a7_odalric: Ember hearts. Still warm. Those fires came from somewhere, and that somewhere is bigger than them."
    recompenses:
      xp: 19600
      or: 1960

  a7_n_le_seigneur_des_braises:
    nom: "Le Seigneur des Braises"
    nom-en: "The Lord of Embers"
    niveau: 76
    requiert: [a7_n_les_feux_errants]
    donneur: a7_odalric
    resume:
      - "Le Seigneur des Braises s'est levé"
      - "sur les cendres vives."
    resume-en:
      - "The Lord of Embers has risen"
      - "on the live ash."
    offre:
      - "a7_odalric: Ce que je craignais. Les feux errants avaient un maître. Le Seigneur des Braises est sorti des cendres vives. Prends du monde avec toi."
    offre-en:
      - "a7_odalric: What I feared. The wandering fires had a master. The Lord of Embers has come out of the live ash. Take people with you."
    etapes:
      - type: TUER
        texte: "Abattre le Seigneur des Braises"
        texte-en: "Kill the Lord of Embers"
        monstres: [a7_seigneur_braise]
        point: a7_cendres_vives
        apres:
          - "Le Seigneur s'éteint. Au cœur des cendres, une braise dorée reste allumée : un Éclat, tombé là il y a mille ans."
        apres-en:
          - "The Lord goes out. At the heart of the ash, a golden ember stays lit: a Shard, fallen there a thousand years ago."
      - type: PARLER
        texte: "Revenir voir Odalric"
        texte-en: "Return to Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: Un Éclat qui faisait danser les feux. Ce volcan est plein de morceaux d'étoile qui ne savent pas quoi faire d'eux-mêmes."
        dialogue-en:
          - "a7_odalric: A Shard that made the fires dance. This volcano is full of pieces of star that do not know what to do with themselves."
    recompenses:
      xp: 25600
      or: 2560

  a7_n_la_veine_d_or:
    nom: "La veine d'or"
    nom-en: "The Golden Vein"
    niveau: 75
    donneur: a7_odalric
    resume:
      - "La veine d'or du nord-ouest"
      - "intéresse les savants du Guet."
    resume-en:
      - "The golden vein of the north-west"
      - "interests the Watch's scholars."
    offre:
      - "a7_odalric: Nos savants veulent un bloc de la veine d'or, au nord-ouest du cratère. Il pèse trop pour un homme : prends une monture, et ne tombe pas dans la lave."
    offre-en:
      - "a7_odalric: Our scholars want a block from the golden vein, north-west of the crater. It is too heavy for one man: take a mount, and do not fall into the lava."
    etapes:
      - type: TRANSPORT
        texte: "Ramener le bloc doré au Guet, à dos de monture"
        texte-en: "Bring the golden block back to the Watch, on a mount"
        point: a7_auberge_guet
        depart: a7_veine
        materiau: RAW_GOLD_BLOCK
        rayon: 5
        objet: "Bloc de roche dorée"
        objet-en: "Block of golden rock"
        apres:
          - "Le bloc est posé devant l'auberge. Il est tiède. Quand on pose la main dessus, on entend un battement."
        apres-en:
          - "The block is set down before the inn. It is warm. When you lay a hand on it, you hear a beat."
      - type: PARLER
        texte: "Revenir voir Odalric"
        texte-en: "Return to Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: Un battement ? Je n'ai rien entendu. … Ne le dis pas aux savants. Ils voudront le couper."
        dialogue-en:
          - "a7_odalric: A beat? I heard nothing. … Do not tell the scholars. They will want to cut it."
    recompenses:
      xp: 20000
      or: 2000

  a7_n_le_camp_brule:
    nom: "Le camp brûlé"
    nom-en: "The Burnt Camp"
    niveau: 76
    donneur: a7_odalric
    resume:
      - "Un camp de chercheurs d'Éclats"
      - "ne répond plus, au nord."
    resume-en:
      - "A camp of Shard-seekers"
      - "no longer answers, to the north."
    offre:
      - "a7_odalric: Des chercheurs d'Éclats campaient loin au nord, derrière le cratère. Plus de nouvelles depuis trois jours. Va voir."
    offre-en:
      - "a7_odalric: Shard-seekers were camped far to the north, beyond the crater. No news for three days. Go and see."
    etapes:
      - type: TUER
        texte: "Nettoyer le camp"
        texte-en: "Clear the camp"
        monstres: [cendreux, brute_calcinee]
        nombre: 10
        point: a7_camp_l1
      - type: INTERAGIR
        texte: "Fouiller le camp"
        texte-en: "Search the camp"
        point: a7_camp_l1
        rayon: 6
        apres:
          - "Les chercheurs sont devenus cendre, debout autour d'un Éclat trop gros. Ils avaient voulu le soulever ensemble."
        apres-en:
          - "The seekers have become ash, standing around a Shard too big. They had tried to lift it together."
      - type: PARLER
        texte: "Revenir voir Odalric"
        texte-en: "Return to Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: Ensemble. Comme les chefs avec leurs cages. Ça ne réussit jamais, de prendre une étoile à plusieurs."
        dialogue-en:
          - "a7_odalric: Together. Like the leaders with their cages. It never works, taking a star between several."
    recompenses:
      xp: 20500
      or: 2050

  a7_n_la_fente_du_ciel:
    nom: "La fente du ciel"
    nom-en: "The Crack in the Sky"
    niveau: 72
    donneur: a7_lio
    resume:
      - "Lio veut que quelqu'un d'autre"
      - "voie la fente du ciel."
    resume-en:
      - "Lio wants someone else"
      - "to see the crack in the sky."
    offre:
      - "a7_lio: Personne ne me croit. Monte au bord sud du cratère, et regarde en haut. Dis-moi si elle bouge."
    offre-en:
      - "a7_lio: No one believes me. Climb to the southern rim of the crater, and look up. Tell me if it moves."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre le bord sud du cratère"
        texte-en: "Reach the southern rim of the crater"
        point: a7_bord_sud
        rayon: 6
      - type: INTERAGIR
        texte: "Regarder la fente du ciel"
        texte-en: "Look at the crack in the sky"
        point: a7_bord_sud
        rayon: 6
        apres:
          - "Une ligne noire au milieu des étoiles. Elle respire, très lentement. Quand le volcan gronde, elle s'élargit d'un cheveu."
        apres-en:
          - "A black line in the middle of the stars. It breathes, very slowly. When the volcano rumbles, it widens by a hair."
      - type: PARLER
        texte: "Revenir voir Lio"
        texte-en: "Return to Lio"
        pnj: a7_lio
        dialogue:
          - "a7_lio: Tu vois ! Elle bouge avec le volcan. Comme si les deux se parlaient."
        dialogue-en:
          - "a7_lio: You see! It moves with the volcano. As if the two were talking."
    recompenses:
      xp: 18800
      or: 1880

  a7_n_les_quatre_bords:
    nom: "Les quatre bords"
    nom-en: "The Four Rims"
    niveau: 73
    requiert: [a7_n_la_fente_du_ciel]
    donneur: a7_lio
    resume:
      - "Lio veut mesurer la fente"
      - "depuis chaque bord du cratère."
    resume-en:
      - "Lio wants to measure the crack"
      - "from every rim of the crater."
    offre:
      - "a7_lio: Il faut la regarder depuis l'ouest, le nord et l'est, vite, avant qu'elle change. Trois minutes entre chaque bord. Je compte !"
    offre-en:
      - "a7_lio: It must be watched from the west, the north and the east, quickly, before it changes. Three minutes between each rim. I am counting!"
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre le bord ouest"
        texte-en: "Reach the western rim"
        point: a7_bord_ouest
        rayon: 6
        chrono: 180
        echec:
          - "a7_lio: Trop tard, elle a bougé. On recommence !"
        echec-en:
          - "a7_lio: Too late, it moved. Again!"
      - type: ATTEINDRE
        texte: "Atteindre le bord nord"
        texte-en: "Reach the northern rim"
        point: a7_bord_nord
        rayon: 6
        chrono: 180
        reprise: 1
        echec:
          - "a7_lio: Trop tard, elle a bougé. On recommence !"
        echec-en:
          - "a7_lio: Too late, it moved. Again!"
      - type: ATTEINDRE
        texte: "Atteindre le bord est"
        texte-en: "Reach the eastern rim"
        point: a7_bord_est
        rayon: 6
        chrono: 180
        reprise: 1
        echec:
          - "a7_lio: Trop tard, elle a bougé. On recommence !"
        echec-en:
          - "a7_lio: Too late, it moved. Again!"
      - type: PARLER
        texte: "Revenir voir Lio"
        texte-en: "Return to Lio"
        pnj: a7_lio
        dialogue:
          - "a7_lio: Elle n'est pas au-dessus du volcan. Elle est au-dessus du Cœur. Exactement."
        dialogue-en:
          - "a7_lio: It is not above the volcano. It is above the Heart. Exactly."
    recompenses:
      xp: 19200
      or: 1920

  a7_n_le_frere_de_lio:
    nom: "Le frère de Lio"
    nom-en: "Lio's Brother"
    niveau: 76
    requiert: [a7_n_les_quatre_bords]
    donneur: a7_lio
    resume:
      - "Le frère de Lio, un Marqué,"
      - "est parti vers le nord et n'est pas revenu."
    resume-en:
      - "Lio's brother, a Marked,"
      - "went north and did not come back."
    offre:
      - "a7_lio: Mon frère Bastien est Marqué. Il est parti chercher des Éclats au nord, il y a un mois. Il avait une écharpe rouge. Trouve-la, au moins."
    offre-en:
      - "a7_lio: My brother Bastien is Marked. He went looking for Shards in the north, a month ago. He had a red scarf. Find it, at least."
    etapes:
      - type: ENQUETE
        texte: "Chercher les traces de Bastien"
        texte-en: "Look for Bastien's traces"
        pnj: a7_lio
        indices:
          - point: a7_camp_l1
            texte: "Le camp des chercheurs"
            texte-en: "The seekers' camp"
            apres:
              - "Son nom sur une liste de paie : « Bastien, Marqué, porteur. » Rayé."
            apres-en:
              - "His name on a pay list: « Bastien, Marked, bearer. » Struck out."
          - point: a7_eclat_3
            texte: "L'Éclat du nord-ouest"
            texte-en: "The north-western Shard"
            apres:
              - "Des traces de pas autour de l'Éclat, puis des traces de quatre pattes. Les pas deviennent griffes."
            apres-en:
              - "Footprints around the Shard, then four-legged tracks. The steps become claws."
          - point: a7_pente_nord
            texte: "La pente nord"
            texte-en: "The northern slope"
            apres:
              - "Une écharpe rouge, prise dans les rochers, au bord d'une faille où grouillent les Affamés."
            apres-en:
              - "A red scarf, caught in the rocks, at the edge of a rift swarming with the Starved."
        dialogue:
          - "a7_lio: Son écharpe. … Les Affamés. Les fioles laissent fuir la lumière, et le Néant la mange. Avec ceux qui la portent."
        dialogue-en:
          - "a7_lio: His scarf. … The Starved. The vials leak light, and the Void eats it. Along with those who carry it."
    recompenses:
      xp: 20500
      or: 2050

  a7_n_ce_que_mange_le_neant:
    nom: "Ce que mange le Néant"
    nom-en: "What the Void Eats"
    niveau: 78
    requiert: [a7_n_le_frere_de_lio]
    donneur: a7_lio
    resume:
      - "Lio veut savoir si son frère"
      - "est encore quelque part."
    resume-en:
      - "Lio wants to know if his brother"
      - "is still somewhere."
    offre:
      - "a7_lio: Ottilie dit qu'un sort fait sortir la lumière d'un Affamé. Si Bastien est dedans… je veux qu'il sorte. Même juste une fois."
    offre-en:
      - "a7_lio: Ottilie says a spell draws the light out of a Starved. If Bastien is inside… I want him to come out. Even just once."
    etapes:
      - type: ATTEINDRE
