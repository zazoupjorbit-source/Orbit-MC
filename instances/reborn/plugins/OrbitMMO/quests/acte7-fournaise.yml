quetes:

  # ================================================================ PRINCIPALES — LUMIÈRE : LA FOURNAISE

  a7_l_le_guet:
    nom: "Le Guet de la Fournaise"
    nom-en: "The Furnace Watch"
    faction: lumiere
    niveau: 72
    requiert: [a6_l_vers_la_fournaise]
    donneur: a7_helis
    resume:
      - "L'expédition de l'Aube s'installe"
      - "au Guet de la Fournaise."
    resume-en:
      - "The Dawn expedition settles"
      - "at the Furnace Watch."
    offre:
      - "a7_helis: Vous voilà. Le Reliquaire arrive demain, plein. La Haute-Prélate le suit. Présentez-vous au capitaine du Guet, puis à Morvain : il est monté avant nous."
    offre-en:
      - "a7_helis: There you are. The Reliquary arrives tomorrow, full. The High Prelate follows it. Present yourself to the Watch captain, then to Morvain: he came up before us."
    etapes:
      - type: PARLER
        texte: "Se présenter au Capitaine Odalric"
        texte-en: "Present yourself to Captain Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: L'Aube, l'Ombre, des Marqués par centaines. Le Guet n'a jamais eu autant de monde. Ici, on ne se bat pas. Dehors, le volcan s'en charge."
        dialogue-en:
          - "a7_odalric: The Dawn, the Shadow, Marked by the hundred. The Watch has never been so crowded. Here, no one fights. Outside, the volcano sees to that."
      - type: PARLER
        texte: "Retrouver Morvain"
        texte-en: "Find Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Tu as gardé le cœur de la chaîne. Ilmar bat encore sous ta cape. Garde-le près de toi, là-haut."
        dialogue-en:
          - "a7_morvain: You kept the heart of the chain. Ilmar still beats under your cloak. Keep him close, up there."
        si: "a6-coeur-chaine=garder"
      - type: PARLER
        texte: "Retrouver Morvain"
        texte-en: "Find Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Le cœur de la chaîne est dans le Reliquaire, maintenant. Ilmar va servir à tenir l'Astre. Encore."
        dialogue-en:
          - "a7_morvain: The heart of the chain is in the Reliquary now. Ilmar will serve to hold the Star. Again."
        si: "a6-coeur-chaine=remettre"
    recompenses:
      xp: 23400
      or: 2340

  a7_l_la_pente_de_lave:
    nom: "La pente de lave"
    nom-en: "The Lava Slope"
    faction: lumiere
    niveau: 73
    requiert: [a7_l_le_guet]
    donneur: a7_helis
    resume:
      - "Une coulée barre la route du Reliquaire."
    resume-en:
      - "A lava flow blocks the Reliquary's road."
    offre:
      - "a7_helis: La coulée de l'est menace la route du Reliquaire. Il faut savoir si on peut passer par le bord. Allez-y, et revenez vivant."
    offre-en:
      - "a7_helis: The eastern flow threatens the Reliquary road. We need to know if we can pass along its edge. Go, and come back alive."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre le bord de la coulée"
        texte-en: "Reach the edge of the flow"
        point: a7_coulee_bord
        rayon: 8
      - type: SURVIE
        texte: "Tenir sur la pente pendant que la lave crache"
        texte-en: "Hold on the slope while the lava spits"
        point: a7_coulee_bord
        rayon: 13
        duree: 50
        mode: brule
        degats: 6
        monstres: [a7_salamandre]
        nombre: 2
        intervalle: 15
        apres:
          - "La coulée se calme. Sous la croûte noire, la lave est couleur d'or. Le volcan saigne la lumière de l'Astre."
        apres-en:
          - "The flow calms. Under the black crust, the lava is the colour of gold. The volcano bleeds the light of the Star."
      - type: PARLER
        texte: "Rendre compte à Hélis"
        texte-en: "Report to Hélis"
        pnj: a7_helis
        dialogue:
          - "a7_helis: On passera par le bord. Le Reliquaire ne craint pas le feu : il est fait pour ça."
        dialogue-en:
          - "a7_helis: We will pass along the edge. The Reliquary does not fear fire: it was made for it."
    recompenses:
      xp: 24000
      or: 2400

  a7_l_le_reliquaire:
    nom: "Le Reliquaire"
    nom-en: "The Reliquary"
    faction: lumiere
    niveau: 74
    requiert: [a7_l_la_pente_de_lave]
    donneur: a7_helis
    resume:
      - "Le Reliquaire de l'Aube doit monter"
      - "jusqu'au Cœur de la Fournaise."
    resume-en:
      - "The Dawn's Reliquary must climb"
      - "to the Heart of the Furnace."
    offre:
      - "a7_helis: La porteuse attend au camp de l'Aube, à l'ouest du Guet. Le Reliquaire monte au Cœur de la Fournaise. Les Affamés vont le sentir de loin. Escortez-la."
    offre-en:
      - "a7_helis: The bearer waits at the Dawn camp, west of the Watch. The Reliquary is climbing to the Heart of the Furnace. The Starved will smell it from afar. Escort her."
    etapes:
      - type: ESCORTE
        texte: "Escorter le Reliquaire jusqu'au Cœur"
        texte-en: "Escort the Reliquary to the Heart"
        pnj: a7_porteurs_aube
        chemin: [a7_sentier_l1, a7_sentier_l2, a7_coeur_parvis]
        monstres: [a7_affame]
        nombre: 3
        vagues: 3
        pv: 160
        degats: 7
        apres:
          - "a7_porteurs_aube: Posé. Écoutez-le. Il bat comme un cœur. Il est plein de nous, je crois."
        apres-en:
          - "a7_porteurs_aube: Set down. Listen to it. It beats like a heart. It is full of us, I think."
      - type: PARLER
        texte: "Revenir voir Hélis"
        texte-en: "Return to Hélis"
        pnj: a7_helis
        dialogue:
          - "a7_helis: Le Reliquaire est au Cœur. Il ne reste qu'à attendre la Haute-Prélate."
        dialogue-en:
          - "a7_helis: The Reliquary is at the Heart. All that remains is to wait for the High Prelate."
    recompenses:
      xp: 24500
      or: 2450

  a7_l_la_garde_du_reliquaire:
    nom: "La garde du Reliquaire"
    nom-en: "Guarding the Reliquary"
    faction: lumiere
    niveau: 74
    requiert: [a7_l_le_reliquaire]
    donneur: a7_helis
    resume:
      - "Le Reliquaire attire le Néant."
    resume-en:
      - "The Reliquary draws the Void."
    offre:
      - "a7_helis: Le Reliquaire appelle les Affamés comme une cloche. Montez au Cœur et tenez-le jusqu'à l'aube."
    offre-en:
      - "a7_helis: The Reliquary calls the Starved like a bell. Climb to the Heart and hold it until dawn."
    etapes:
      - type: DEFENSE
        texte: "Défendre le Reliquaire"
        texte-en: "Defend the Reliquary"
        point: a7_coeur_parvis
        monstres: [a7_affame]
        nombre: 4
        vagues: 4
        apparition: a7_sentier_2
        pv: 350
        degats: 7
        cible: "Le Reliquaire"
        cible-en: "The Reliquary"
        apres:
          - "Les Affamés reculent. L'un d'eux, avant de fuir, pose sa tête contre le Reliquaire et gémit : « Rendez-moi. »"
        apres-en:
          - "The Starved fall back. One of them, before fleeing, lays its head against the Reliquary and moans: « Give me back. »"
      - type: PARLER
        texte: "Revenir voir Hélis"
        texte-en: "Return to Hélis"
        pnj: a7_helis
        dialogue:
          - "a7_helis: « Rendez-moi » ? Les Affamés ne parlent pas."
          - "joueur: Celui-là parlait."
        dialogue-en:
          - "a7_helis: « Give me back »? The Starved do not speak."
          - "joueur: That one did."
    recompenses:
      xp: 24500
      or: 2450

  a7_l_les_eclats_noirs:
    nom: "Les Éclats noirs"
    nom-en: "The Black Shards"
    faction: lumiere
    niveau: 75
    requiert: [a7_l_la_garde_du_reliquaire]
    donneur: a7_helis
    resume:
      - "Des Éclats noirs jonchent la pente ouest."
    resume-en:
      - "Black Shards litter the western slope."
    offre:
      - "a7_helis: Des Calcinés anciens rôdent sur la pente ouest avec des Éclats noirs à la ceinture. Des Éclats de la Citadelle. Rapportez-en."
    offre-en:
      - "a7_helis: Ancient Charred roam the western slope with black Shards at their belts. Citadel Shards. Bring some back."
    etapes:
      - type: RAMASSER
        texte: "Récupérer des Éclats noirs sur les Calcinés anciens"
        texte-en: "Take black Shards from the ancient Charred"
        monstres: [a7_calcine_ancien]
        nombre: 6
        chance: 0.5
        point: a7_eclat_1
        objet: "Éclat noir"
        objet-en: "Black Shard"
      - type: PARLER
        texte: "Montrer les Éclats noirs à Hélis"
        texte-en: "Show the black Shards to Hélis"
        pnj: a7_helis
        dialogue:
          - "a7_helis: Ils portent tous le même poinçon : « Payé à S. » La Citadelle paie l'Aube en Éclats noirs. Encore."
          - "a7_helis: Je vais vous confier une lettre. Ne me regardez pas comme ça."
        dialogue-en:
          - "a7_helis: They all bear the same hallmark: « Paid to S. » The Citadel pays the Dawn in black Shards. Still."
          - "a7_helis: I am going to give you a letter. Do not look at me like that."
    recompenses:
      xp: 25000
      or: 2500

  a7_l_la_lettre_pour_v:
    nom: "La lettre pour V."
    nom-en: "The Letter for V."
    faction: lumiere
    niveau: 75
    requiert: [a7_l_les_eclats_noirs]
    donneur: a7_helis
    resume:
      - "Hélis vous confie une lettre"
      - "pour la Lame de la Citadelle."
    resume-en:
      - "Hélis entrusts you with a letter"
      - "for the Blade of the Citadel."
    offre:
      - "a7_helis: Portez ceci à Sarn. Oui, Sarn. La Lame de la Citadelle. Ne posez pas de questions : j'ai cessé d'en poser."
    offre-en:
      - "a7_helis: Take this to Sarn. Yes, Sarn. The Blade of the Citadel. Ask no questions: I stopped asking them."
    etapes:
      - type: LIVRER
        texte: "Porter la lettre à Sarn"
        texte-en: "Carry the letter to Sarn"
        pnj: a7_sarn
        materiau: PAPER
        objet: "Lettre scellée « Pour V. »"
        objet-en: "Sealed letter « For V. »"
        dialogue:
          - "a7_sarn: Enfin. « Le Reliquaire est plein. La cage d'or attend la cage d'ombre. Troisième nuit. — S. »"
          - "a7_sarn: Dis à ta capitaine que la cage noire sera prête. Et ne fais pas cette tête. Nous sommes tous des messagers, ici."
        dialogue-en:
          - "a7_sarn: At last. « The Reliquary is full. The cage of gold awaits the cage of shadow. Third night. — S. »"
          - "a7_sarn: Tell your captain the black cage will be ready. And do not make that face. We are all messengers, here."
    recompenses:
      xp: 25000
      or: 2500

  a7_l_les_porteurs_de_chaines:
    nom: "Les porteurs de chaînes"
    nom-en: "The Chain-Bearers"
    faction: lumiere
    niveau: 76
    requiert: [a7_l_la_lettre_pour_v]
    donneur: a7_morvain
    resume:
      - "La nuit, des chasseurs traînent des Marqués"
      - "vers l'ouest du volcan."
    resume-en:
      - "At night, hunters drag Marked"
      - "towards the west of the volcano."
    offre:
      - "a7_morvain: Cette nuit, des chasseurs de l'Aube sont passés derrière le Guet. Ils traînaient quelqu'un. Suis leurs traces. Regarde ce que ton Ordre fait de ses Marqués."
    offre-en:
      - "a7_morvain: Tonight, Dawn hunters passed behind the Watch. They were dragging someone. Follow their tracks. See what your Order does with its Marked."
    etapes:
      - type: PISTER
        texte: "Suivre les traces des chasseurs"
        texte-en: "Follow the hunters' tracks"
        traces: [a7_trace_1, a7_trace_2, a7_trace_3, a7_trace_fin]
        apres:
          - "Un enclos de piquets. Des Marqués enchaînés, des deux camps. Des chasseurs de l'Aube montent la garde, avec des chasseurs de la Citadelle."
        apres-en:
          - "A pen of stakes. Marked in chains, from both camps. Dawn hunters stand guard, alongside Citadel hunters."
      - type: TUER
        texte: "Abattre les chasseurs de l'enclos"
        texte-en: "Kill the hunters of the pen"
        monstres: [a7_chasseur_aube, a7_chasseur_ombre]
        nombre: 6
        point: a7_trace_fin
      - type: PARLER
        texte: "Libérer les captifs"
        texte-en: "Free the captives"
        pnj: a7_captif
        dialogue:
          - "a7_captif: Ils nous comptaient comme du bois pour le feu. « Les Marqués allumeront la cage. » C'est ce qu'ils disaient."
        dialogue-en:
          - "a7_captif: They counted us like wood for the fire. « The Marked will light the cage. » That is what they said."
      - type: PARLER
        texte: "Revenir voir Morvain"
        texte-en: "Return to Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: La cage ne brûle pas au charbon. Elle brûle comme ma forge brûlait. Toi aussi, tu es du bois pour elle."
        dialogue-en:
          - "a7_morvain: The cage does not burn on coal. It burns the way my forge burned. You too are wood for it."
    recompenses:
      xp: 25600
      or: 2560

  a7_l_l_autel_des_chaines:
    nom: "L'autel des chaînes"
    faction: lumiere
    niveau: 76
    requiert: [a7_l_les_porteurs_de_chaines]
    donneur: a7_morvain
    resume:
      - "La Haute-Prélate est arrivée."
      - "Elle rejoint quelqu'un au bord nord du cratère."
    resume-en:
      - "The High Prelate has arrived."
      - "She is meeting someone on the northern rim of the crater."
    offre:
      - "a7_morvain: Séraphine est arrivée cette nuit. Elle n'est pas allée au Reliquaire. Elle a pris le sentier du bord nord, vers l'autel. Va écouter. Sans te faire voir."
    offre-en:
      - "a7_morvain: Séraphine arrived tonight. She did not go to the Reliquary. She took the path to the northern rim, towards the altar. Go and listen. Without being seen."
    etapes:
      - type: ATTEINDRE
        texte: "Rejoindre les rochers sous l'autel"
        texte-en: "Reach the rocks below the altar"
        point: a7_autel_lisiere
        rayon: 5
      - type: INFILTRER
        texte: "Approcher de l'autel sans être vu"
        texte-en: "Approach the altar unseen"
        point: a7_autel_chaines
        depart: a7_autel_lisiere
        monstres: [a7_garde_pacte]
        vue: 11
        rayon: 4
        apres:
          - "Tu te glisses derrière une colonne. Deux voix."
        apres-en:
          - "You slip behind a column. Two voices."
      - type: INTERAGIR
        texte: "Écouter"
        texte-en: "Listen"
        point: a7_autel_chaines
        rayon: 6
        apres:
          - "a7_seraphine: Le Reliquaire est plein. L'Éclat-Cœur aussi est là. Mes Astréens n'étaient pas si bien cachés."
          - "a7_vharos: Tes Astréens ? Mes Creux l'ont sorti du Tombeau. Et tes soldats ont accusé les miens. La guerre a bien servi."
          - "a7_seraphine: Elle a fait marcher les Marqués jusqu'ici. Tous. Demain, la cage d'or et la cage d'ombre se fermeront ensemble. L'Astre rassemblé, et gardé à deux."
          - "a7_vharos: Comme convenu. Le Pacte des Deux Ciels n'est jamais mort, ma chère. Il a seulement changé de prix."
        apres-en:
          - "a7_seraphine: The Reliquary is full. The Heart-Shard is here too. My Astreans were not so well hidden."
          - "a7_vharos: Your Astreans? My Hollow took it out of the Tomb. And your soldiers blamed mine. The war served us well."
          - "a7_seraphine: It made the Marked march all the way here. All of them. Tomorrow, the cage of gold and the cage of shadow will close together. The Star gathered, and kept by two."
          - "a7_vharos: As agreed. The Pact of the Two Skies never died, my dear. It only changed its price."
      - type: PARLER
        texte: "Revenir voir Morvain"
        texte-en: "Return to Morvain"
        pnj: a7_morvain
        dialogue:
          - "joueur: L'Éclat-Cœur. Ils l'ont pris ensemble. Toute la guerre des Cimes, c'était pour nous amener ici."
          - "a7_morvain: Aurélien a voulu garder l'Astre pour lui. Eux veulent le garder à deux. C'est la même peur."
        dialogue-en:
          - "joueur: The Heart-Shard. They took it together. The whole war of the Peaks was to bring us here."
          - "a7_morvain: Aurélien wanted to keep the Star for himself. They want to keep it between two. It is the same fear."
    recompenses:
      xp: 25600
      or: 2560

  a7_l_ce_que_l_astre_a_vu:
    nom: "Ce que l'Astre a vu"
    nom-en: "What the Star Saw"
    faction: lumiere
    niveau: 77
    requiert: [a7_l_l_autel_des_chaines]
    donneur: a7_morvain
    resume:
      - "Sur les pentes, des souvenirs de la Chute"
      - "attendent qu'on les touche."
    resume-en:
      - "On the slopes, memories of the Fall"
      - "wait to be touched."
    offre:
      - "a7_morvain: Avant de choisir, regarde. L'Astre a laissé trois souvenirs sur les pentes, là où ses morceaux ont roulé. Touche-les. Puis viens me dire ce que tu as vu."
    offre-en:
      - "a7_morvain: Before you choose, look. The Star left three memories on the slopes, where its pieces rolled. Touch them. Then come and tell me what you saw."
    etapes:
      - type: ENQUETE
        texte: "Toucher les souvenirs de la Chute"
        texte-en: "Touch the memories of the Fall"
        pnj: a7_morvain
        indices:
          - point: a7_souvenir_1
            texte: "Une pierre fondue en forme de main"
            texte-en: "A molten stone shaped like a hand"
            apres:
              - "Tu es haut, très haut. Des chaînes d'or montent vers toi. Tu ne fuis pas : tu attends de voir s'ils vont oser."
            apres-en:
              - "You are high, very high. Chains of gold rise towards you. You do not flee: you wait to see if they will dare."
          - point: a7_souvenir_2
            texte: "Un Éclat planté comme une lame"
            texte-en: "A Shard stuck in like a blade"
            apres:
              - "Les chaînes se referment. Ça ne fait pas mal. Ça fait peur. Alors tu te brises, en mille morceaux, pour passer entre les maillons."
            apres-en:
              - "The chains close. It does not hurt. It frightens. So you shatter, into a thousand pieces, to slip between the links."
          - point: a7_souvenir_3
            texte: "Une flaque de verre noir"
            texte-en: "A pool of black glass"
            apres:
              - "Tes morceaux tombent. Ce qui reste en haut a froid. Ce qui tombe en bas cherche des mains pour se poser. Il en trouve. Des Marqués."
            apres-en:
              - "Your pieces fall. What remains above is cold. What falls below looks for hands to land in. It finds them. Marked."
        dialogue:
          - "a7_morvain: Il ne s'est pas brisé pour mourir. Il s'est brisé pour rester libre. Et ils veulent le refaire entier pour l'enchaîner mieux."
        dialogue-en:
          - "a7_morvain: It did not shatter to die. It shattered to stay free. And they want to make it whole again to chain it better."
    recompenses:
      xp: 26100
      or: 2610

  a7_l_le_serment_brise:
    nom: "Le serment brisé"
    nom-en: "The Broken Oath"
    faction: lumiere
    niveau: 78
    requiert: [a7_l_ce_que_l_astre_a_vu]
    donneur: a7_helis
    resume:
      - "Hélis vous donne votre poste"
      - "pour la nuit de la cage."
    resume-en:
      - "Hélis gives you your post"
      - "for the night of the cage."
    offre:
      - "a7_helis: Demain soir, la Haute-Prélate allume la cage. Votre poste est au Cœur, près du Reliquaire. J'ai besoin de savoir que vous y serez."
    offre-en:
      - "a7_helis: Tomorrow night, the High Prelate lights the cage. Your post is at the Heart, by the Reliquary. I need to know that you will be there."
    etapes:
      - type: CHOIX
        texte: "Répondre à Hélis"
        texte-en: "Answer Hélis"
        pnj: a7_helis
        choix: a7-serment
        question: "Que répondez-vous à Hélis ?"
        question-en: "What do you answer Hélis?"
        reponses:
          - id: briser
            texte: "Je serai au Cœur. Pour briser les chaînes."
            texte-en: "I will be at the Heart. To break the chains."
            reponse:
              - "a7_helis: … Alors je ne vous ai rien entendu dire. Et je ne serai pas à mon poste. Allez."
            reponse-en:
              - "a7_helis: … Then I heard you say nothing. And I will not be at my post. Go."
            xp: 4000
          - id: feindre
            texte: "J'y serai, capitaine."
            texte-en: "I will be there, captain."
            reponse:
              - "a7_helis: Bien. … Vous mentez mal. C'est une qualité."
            reponse-en:
              - "a7_helis: Good. … You lie badly. It is a virtue."
            or: 800
        dialogue:
          - "a7_helis: Je sais pour la lettre. Je sais pour la cage d'ombre. Je l'ai portée, moi aussi, cette lettre."
          - "a7_helis: Je suis soldat. J'obéis. Et vous ?"
        dialogue-en:
          - "a7_helis: I know about the letter. I know about the cage of shadow. I carried that letter too."
          - "a7_helis: I am a soldier. I obey. And you?"
      - type: PARLER
        texte: "Prévenir Morvain"
        texte-en: "Tell Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Les Sans-Bannière montent au Cœur demain soir. Kael porte un marteau qui défait. Tu ne seras pas seul."
        dialogue-en:
          - "a7_morvain: The Bannerless climb to the Heart tomorrow night. Kael carries a hammer that unmakes. You will not be alone."
    recompenses:
      xp: 26700
      or: 2670

  # ================================================================ PRINCIPALES — OMBRE : LA FOURNAISE

  a7_o_le_guet:
    nom: "Le Guet de la Fournaise"
    nom-en: "The Furnace Watch"
    faction: ombre
    niveau: 72
    requiert: [a6_o_vers_la_fournaise]
    donneur: a7_sarn
    resume:
      - "L'expédition de la Citadelle s'installe"
      - "au Guet de la Fournaise."
    resume-en:
      - "The Citadel expedition settles"
      - "at the Furnace Watch."
    offre:
      - "a7_sarn: Te voilà. La cage noire arrive demain, et Vharos derrière elle. Présente-toi au capitaine du Guet, puis à Morvain. Il est monté avant nous."
    offre-en:
      - "a7_sarn: There you are. The black cage arrives tomorrow, and Vharos behind it. Present yourself to the Watch captain, then to Morvain. He came up before us."
    etapes:
      - type: PARLER
        texte: "Se présenter au Capitaine Odalric"
        texte-en: "Present yourself to Captain Odalric"
        pnj: a7_odalric
        dialogue:
          - "a7_odalric: La Citadelle, l'Aube, des Marqués par centaines. Ici, on ne se bat pas. Dehors, le volcan s'en charge."
        dialogue-en:
          - "a7_odalric: The Citadel, the Dawn, Marked by the hundred. Here, no one fights. Outside, the volcano sees to that."
      - type: PARLER
        texte: "Retrouver Morvain"
        texte-en: "Find Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Tu as gardé le cœur de la chaîne. Ilmar bat encore sous ta cape. Garde-le près de toi, là-haut."
        dialogue-en:
          - "a7_morvain: You kept the heart of the chain. Ilmar still beats under your cloak. Keep him close, up there."
        si: "a6-coeur-chaine=garder"
      - type: PARLER
        texte: "Retrouver Morvain"
        texte-en: "Find Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Le cœur de la chaîne est dans la cage noire, maintenant. Ilmar va servir à tenir le Néant. Encore une chaîne."
        dialogue-en:
          - "a7_morvain: The heart of the chain is in the black cage now. Ilmar will serve to hold the Void. One more chain."
        si: "a6-coeur-chaine=remettre"
    recompenses:
      xp: 23400
      or: 2340

  a7_o_la_cage_noire:
    nom: "La cage noire"
    nom-en: "The Black Cage"
    faction: ombre
    niveau: 73
    requiert: [a7_o_le_guet]
    donneur: a7_sarn
    resume:
      - "La cage noire doit monter"
      - "jusqu'au Cœur de la Fournaise."
    resume-en:
      - "The black cage must climb"
      - "to the Heart of the Furnace."
    offre:
      - "a7_sarn: Le Creux porteur attend au camp de la Citadelle, à l'est. La cage noire monte au Cœur. Les Affamés la suivront comme des chiens. Escorte-le."
    offre-en:
      - "a7_sarn: The Hollow bearer waits at the Citadel camp, to the east. The black cage climbs to the Heart. The Starved will follow it like dogs. Escort him."
    etapes:
      - type: ESCORTE
        texte: "Escorter la cage noire jusqu'au Cœur"
        texte-en: "Escort the black cage to the Heart"
        pnj: a7_porteurs_ombre
        chemin: [a7_sentier_o1, a7_sentier_o2, a7_sentier_o3, a7_coeur_parvis]
        monstres: [a7_affame]
        nombre: 3
        vagues: 3
        pv: 160
        degats: 7
        apres:
          - "Le Creux pose la cage. Il reste là, les bras ballants. Puis il dit, très bas : « Froid. »"
        apres-en:
          - "The Hollow sets the cage down. He stays there, arms hanging. Then he says, very low: « Cold. »"
      - type: PARLER
        texte: "Revenir voir Sarn"
        texte-en: "Return to Sarn"
        pnj: a7_sarn
        dialogue:
          - "a7_sarn: La cage est au Cœur. L'Aube y a posé son Reliquaire, juste à côté. On ne s'est pas battu. Personne n'a demandé pourquoi."
        dialogue-en:
          - "a7_sarn: The cage is at the Heart. The Dawn has set its Reliquary right beside it. No one fought. No one asked why."
    recompenses:
      xp: 24000
      or: 2400

  a7_o_le_nid_des_salamandres:
    nom: "Le nid des salamandres"
    nom-en: "The Salamander Nest"
    faction: ombre
    niveau: 74
    requiert: [a7_o_la_cage_noire]
    donneur: a7_sarn
    resume:
      - "Des salamandres de lave infestent la pente est."
    resume-en:
      - "Lava salamanders infest the eastern slope."
    offre:
      - "a7_sarn: Les salamandres de la pente est mangent les Éclats tombés. Vharos veut ce qu'elles ont dans le ventre. Va."
    offre-en:
      - "a7_sarn: The salamanders of the eastern slope eat fallen Shards. Vharos wants what is in their bellies. Go."
    etapes:
      - type: TUER
        texte: "Abattre les salamandres du nid"
        texte-en: "Kill the salamanders of the nest"
        monstres: [a7_salamandre]
        nombre: 10
        point: a7_nid_salamandres
      - type: INTERAGIR
        texte: "Fouiller le nid"
        texte-en: "Search the nest"
        point: a7_nid_salamandres
        rayon: 6
        apres:
          - "Des Éclats à moitié fondus, dorés et violets mêlés. Les salamandres ne les mangent pas : elles les couvent, comme des œufs."
        apres-en:
          - "Half-melted Shards, gold and violet mingled. The salamanders do not eat them: they brood over them, like eggs."
      - type: PARLER
        texte: "Revenir voir Sarn"
        texte-en: "Return to Sarn"
        pnj: a7_sarn
        dialogue:
          - "a7_sarn: Elles couvent des Éclats ? Les bêtes en savent plus long que nous. Garde ça pour toi."
        dialogue-en:
          - "a7_sarn: They brood over Shards? The beasts know more than we do. Keep that to yourself."
    recompenses:
      xp: 24500
      or: 2450

  a7_o_la_garde_de_la_cage:
    nom: "La garde de la cage"
    nom-en: "Guarding the Cage"
    faction: ombre
    niveau: 74
    requiert: [a7_o_le_nid_des_salamandres]
    donneur: a7_sarn
    resume:
      - "La cage noire attire le Néant."
    resume-en:
      - "The black cage draws the Void."
    offre:
      - "a7_sarn: La cage appelle les Affamés. Monte au Cœur et tiens-la jusqu'à l'aube. Si elle tombe, Vharos me tue. Puis toi."
    offre-en:
      - "a7_sarn: The cage calls the Starved. Climb to the Heart and hold it until dawn. If it falls, Vharos kills me. Then you."
    etapes:
      - type: DEFENSE
        texte: "Défendre la cage noire"
        texte-en: "Defend the black cage"
        point: a7_coeur_parvis
        monstres: [a7_affame]
        nombre: 4
        duree: 100
        intervalle: 20
        apparition: a7_sentier_2
        pv: 350
        degats: 7
        cible: "La cage noire"
        cible-en: "The black cage"
        apres:
          - "Les Affamés reculent. L'un d'eux, avant de fuir, se colle aux barreaux et gémit : « Rendez-moi. »"
        apres-en:
          - "The Starved fall back. One of them, before fleeing, presses against the bars and moans: « Give me back. »"
      - type: PARLER
        texte: "Revenir voir Sarn"
        texte-en: "Return to Sarn"
        pnj: a7_sarn
        dialogue:
          - "a7_sarn: « Rendez-moi » ? Tu as entendu ça aussi ? … Je n'ai rien entendu."
        dialogue-en:
          - "a7_sarn: « Give me back »? You heard that too? … I heard nothing."
    recompenses:
      xp: 24500
      or: 2450

  a7_o_les_fioles_de_l_est:
    nom: "Les fioles de l'est"
    nom-en: "The Eastern Vials"
    faction: ombre
    niveau: 75
    requiert: [a7_o_la_garde_de_la_cage]
    donneur: a7_sarn
    resume:
      - "Des chasseurs de l'Aube cachent des fioles"
      - "à l'est du volcan."
    resume-en:
      - "Dawn hunters are hiding vials"
      - "east of the volcano."
    offre:
      - "a7_sarn: Des chasseurs de l'Aube ont traversé nos lignes à l'est, chargés de caisses. Suis leurs traces et dis-moi ce qu'ils portent."
    offre-en:
      - "a7_sarn: Dawn hunters crossed our lines to the east, loaded with crates. Follow their tracks and tell me what they carry."
    etapes:
      - type: PISTER
        texte: "Suivre les traces des chasseurs"
        texte-en: "Follow the hunters' tracks"
        traces: [a7_trace_o1, a7_trace_o2, a7_trace_o3, a7_trace_ofin]
        apres:
          - "Une cache sous un rocher. Trois chasseurs de l'Aube, et des caisses de fioles."
        apres-en:
          - "A cache under a rock. Three Dawn hunters, and crates of vials."
      - type: TUER
        texte: "Abattre les chasseurs de l'Aube"
        texte-en: "Kill the Dawn hunters"
        monstres: [a7_chasseur_aube]
        nombre: 3
        point: a7_trace_ofin
      - type: INTERAGIR
        texte: "Ouvrir les caisses"
        texte-en: "Open the crates"
        point: a7_trace_ofin
        rayon: 5
        apres:
          - "Des fioles de lumière, par centaines. Sur chaque caisse : « Pour V. — de quoi garder ses Creux debout pendant le rituel. »"
        apres-en:
          - "Vials of light, by the hundred. On every crate: « For V. — enough to keep his Hollow standing during the ritual. »"
      - type: PARLER
        texte: "Rendre compte à Sarn"
        texte-en: "Report to Sarn"
        pnj: a7_sarn
        dialogue:
          - "a7_sarn: « Pour V. ». Ce ne sont pas des voleurs. Ce sont des livreurs. Et toi, tu viens de tuer les livreurs de Vharos."
          - "a7_sarn: Porte une lettre pour moi. Vite."
        dialogue-en:
          - "a7_sarn: « For V. ». They are not thieves. They are couriers. And you have just killed Vharos's couriers."
          - "a7_sarn: Carry a letter for me. Quickly."
    recompenses:
      xp: 25000
      or: 2500

  a7_o_la_lettre_pour_s:
    nom: "La lettre pour S."
    nom-en: "The Letter for S."
    faction: ombre
    niveau: 75
    requiert: [a7_o_les_fioles_de_l_est]
    donneur: a7_sarn
    resume:
      - "Sarn vous confie une lettre"
      - "pour la capitaine de l'Aube."
    resume-en:
      - "Sarn entrusts you with a letter"
      - "for the Dawn captain."
    offre:
      - "a7_sarn: Porte ceci à Hélis. Oui, l'Aube. Dis-lui que les livreurs sont morts et que ce n'est pas nous. Enfin, c'est toi. Mais elle n'a pas besoin de le savoir."
    offre-en:
      - "a7_sarn: Take this to Hélis. Yes, the Dawn. Tell her the couriers are dead and it was not us. Well, it was you. But she does not need to know."
    etapes:
      - type: LIVRER
        texte: "Porter la lettre à Hélis"
        texte-en: "Carry the letter to Hélis"
        pnj: a7_helis
        materiau: PAPER
        objet: "Lettre scellée « Pour S. »"
        objet-en: "Sealed letter « For S. »"
        dialogue:
          - "a7_helis: « La cage noire est prête. Il manque des fioles. Envoyez-en d'autres. Troisième nuit. — V. »"
          - "a7_helis: D'autres fioles. D'autres Marqués. Dites à votre Lame qu'elle les aura. Et ne me regardez pas comme ça."
        dialogue-en:
          - "a7_helis: « The black cage is ready. Vials are missing. Send more. Third night. — V. »"
          - "a7_helis: More vials. More Marked. Tell your Blade she will have them. And do not look at me like that."
    recompenses:
      xp: 25000
      or: 2500

  a7_o_la_cape_du_pacte:
    nom: "La cape du Pacte"
    nom-en: "The Cloak of the Pact"
    faction: ombre
    niveau: 76
    requiert: [a7_o_la_lettre_pour_s]
    donneur: a7_morvain
    resume:
      - "Vharos est arrivé."
      - "Il rejoint quelqu'un au bord nord du cratère."
    resume-en:
      - "Vharos has arrived."
      - "He is meeting someone on the northern rim of the crater."
    offre:
      - "a7_morvain: Vharos est arrivé cette nuit. Il n'est pas allé à sa cage. Il a pris le sentier du bord nord, vers l'autel. Ses gardes portent une cape noire et or. En voici une. Va écouter."
    offre-en:
      - "a7_morvain: Vharos arrived tonight. He did not go to his cage. He took the path to the northern rim, towards the altar. His guards wear a black and gold cloak. Here is one. Go and listen."
    etapes:
      - type: DEGUISEMENT
        texte: "Approcher de l'autel, déguisé en garde du Pacte"
        texte-en: "Approach the altar, disguised as a guard of the Pact"
        point: a7_autel_chaines
        monstres: [a7_garde_pacte]
        materiau: LEATHER_CHESTPLATE
        couleur: "#3A2A12"
        objet: "Cape du Pacte"
        objet-en: "Cloak of the Pact"
        apres:
          - "Les gardes du Pacte te saluent. Il y a des soleils et des griffes sous les capes, mêlés."
        apres-en:
          - "The guards of the Pact salute you. There are suns and claws under the cloaks, mingled."
      - type: INTERAGIR
        texte: "Écouter"
        texte-en: "Listen"
        point: a7_autel_chaines
        rayon: 6
        apres:
          - "a7_vharos: Le Reliquaire est plein, et ma cage aussi. Tes Astréens ont bien caché l'Éclat-Cœur. Mes Creux l'ont mieux trouvé."
          - "a7_seraphine: Et mes soldats ont accusé les tiens. La guerre a fait marcher tous les Marqués jusqu'ici. Demain, les deux cages se ferment ensemble."
          - "a7_vharos: L'Astre dans l'or, le Néant dans l'ombre, et nous deux pour tenir les clefs. Le Pacte des Deux Ciels n'est jamais mort."
        apres-en:
          - "a7_vharos: The Reliquary is full, and so is my cage. Your Astreans hid the Heart-Shard well. My Hollow found it better."
          - "a7_seraphine: And my soldiers blamed yours. The war made all the Marked march here. Tomorrow, the two cages close together."
          - "a7_vharos: The Star in gold, the Void in shadow, and the two of us to hold the keys. The Pact of the Two Skies never died."
      - type: PARLER
        texte: "Revenir voir Morvain"
        texte-en: "Return to Morvain"
        pnj: a7_morvain
        dialogue:
          - "joueur: Vharos ne veut pas libérer le Néant. Il veut le garder. Avec elle."
          - "a7_morvain: Le Néant, c'est le dernier souffle de l'Astre. Le garder en cage d'un côté et l'Astre de l'autre, c'est le couper en deux pour toujours."
        dialogue-en:
          - "joueur: Vharos does not want to free the Void. He wants to keep it. With her."
          - "a7_morvain: The Void is the last breath of the Star. Caging it on one side and the Star on the other is cutting it in two forever."
    recompenses:
      xp: 25600
      or: 2560

  a7_o_ce_que_l_astre_a_vu:
    nom: "Ce que l'Astre a vu"
    nom-en: "What the Star Saw"
    faction: ombre
    niveau: 77
    requiert: [a7_o_la_cape_du_pacte]
    donneur: a7_morvain
    resume:
      - "Sur les pentes, des souvenirs de la Chute"
      - "attendent qu'on les touche."
    resume-en:
      - "On the slopes, memories of the Fall"
      - "wait to be touched."
    offre:
      - "a7_morvain: Avant de choisir, regarde. L'Astre a laissé trois souvenirs sur les pentes. Touche-les, puis viens me dire ce que tu as vu."
    offre-en:
      - "a7_morvain: Before you choose, look. The Star left three memories on the slopes. Touch them, then come and tell me what you saw."
    etapes:
      - type: ENQUETE
        texte: "Toucher les souvenirs de la Chute"
        texte-en: "Touch the memories of the Fall"
        pnj: a7_morvain
        indices:
          - point: a7_souvenir_1
            texte: "Une pierre fondue en forme de main"
            texte-en: "A molten stone shaped like a hand"
            apres:
              - "Tu es haut, très haut. Des chaînes d'or montent vers toi. Tu ne fuis pas : tu attends de voir s'ils vont oser."
            apres-en:
              - "You are high, very high. Chains of gold rise towards you. You do not flee: you wait to see if they will dare."
          - point: a7_souvenir_2
            texte: "Un Éclat planté comme une lame"
            texte-en: "A Shard stuck in like a blade"
            apres:
              - "Les chaînes se referment. Alors tu te brises, en mille morceaux, pour passer entre les maillons."
            apres-en:
              - "The chains close. So you shatter, into a thousand pieces, to slip between the links."
          - point: a7_souvenir_3
            texte: "Une flaque de verre noir"
            texte-en: "A pool of black glass"
            apres:
              - "Ce qui reste en haut a froid. Ce n'est pas un ennemi. C'est toi, ce qui reste de toi, qui attend que les morceaux reviennent."
            apres-en:
              - "What remains above is cold. It is not an enemy. It is you, what is left of you, waiting for the pieces to come back."
        dialogue:
          - "a7_morvain: Le Néant n'est pas l'avenir, ni la libération. C'est un souffle qui attend son corps. Vharos veut le tenir en laisse loin de lui."
        dialogue-en:
          - "a7_morvain: The Void is neither the future nor liberation. It is a breath waiting for its body. Vharos wants to keep it on a leash, far from it."
    recompenses:
      xp: 26100
      or: 2610

  a7_o_le_bord_qui_s_effondre:
    nom: "Le bord qui s'effondre"
    nom-en: "The Crumbling Rim"
    faction: ombre
    niveau: 77
    requiert: [a7_o_ce_que_l_astre_a_vu]
    donneur: a7_sarn
    resume:
      - "Sarn veut la clef de la cage noire,"
      - "oubliée au bord est du cratère."
    resume-en:
      - "Sarn wants the key to the black cage,"
      - "forgotten on the eastern rim of the crater."
    offre:
      - "a7_sarn: Un Creux a laissé tomber la clef de la cage au bord est du cratère. Le bord s'effondre. Va la chercher avant qu'elle tombe dans la lave."
    offre-en:
      - "a7_sarn: A Hollow dropped the key to the cage on the eastern rim of the crater. The rim is crumbling. Fetch it before it falls into the lava."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre le bord est du cratère"
        texte-en: "Reach the eastern rim of the crater"
        point: a7_bord_est
        rayon: 8
      - type: SURVIE
        texte: "Tenir pendant que le bord s'effondre"
        texte-en: "Hold on while the rim crumbles"
        point: a7_bord_est
        rayon: 15
        duree: 50
        mode: resserre
        rayon-fin: 5
        degats: 6
        monstres: [a7_calcine_ancien]
        nombre: 2
        intervalle: 15
        apres:
          - "Le sol se stabilise. La clef est là, à tes pieds : un anneau de basalte, froid malgré la lave."
        apres-en:
          - "The ground settles. The key is there, at your feet: a ring of basalt, cold despite the lava."
      - type: PARLER
        texte: "Rapporter la clef à Sarn"
        texte-en: "Bring the key to Sarn"
        pnj: a7_sarn
        dialogue:
          - "a7_sarn: La clef. Bien. Demain soir, tu montes la garde au Cœur."
        dialogue-en:
          - "a7_sarn: The key. Good. Tomorrow night, you stand guard at the Heart."
    recompenses:
      xp: 26100
      or: 2610

  a7_o_le_serment_brise:
    nom: "Le serment brisé"
    nom-en: "The Broken Oath"
    faction: ombre
    niveau: 78
    requiert: [a7_o_le_bord_qui_s_effondre]
    donneur: a7_sarn
    resume:
      - "Sarn vous donne votre poste"
      - "pour la nuit de la cage."
    resume-en:
      - "Sarn gives you your post"
      - "for the night of the cage."
    offre:
      - "a7_sarn: Demain soir, Vharos ferme la cage. Ton poste est au Cœur, près de la cage noire. J'ai besoin de savoir que tu y seras."
    offre-en:
      - "a7_sarn: Tomorrow night, Vharos closes the cage. Your post is at the Heart, by the black cage. I need to know you will be there."
    etapes:
      - type: CHOIX
        texte: "Répondre à Sarn"
        texte-en: "Answer Sarn"
        pnj: a7_sarn
        choix: a7-serment
        question: "Que répondez-vous à Sarn ?"
        question-en: "What do you answer Sarn?"
        reponses:
          - id: briser
            texte: "Je serai au Cœur. Pour briser les chaînes."
            texte-en: "I will be at the Heart. To break the chains."
            reponse:
              - "a7_sarn: … Alors je ne t'ai rien entendu dire. Et cette nuit, je dormirai."
            reponse-en:
              - "a7_sarn: … Then I heard you say nothing. And tonight, I will be asleep."
            xp: 4000
          - id: feindre
            texte: "J'y serai."
            texte-en: "I will be there."
            reponse:
              - "a7_sarn: Bien. … Tu mens mal. Garde ça."
            reponse-en:
              - "a7_sarn: Good. … You lie badly. Keep it that way."
            or: 800
        dialogue:
          - "a7_sarn: Je sais pour la lettre. Je sais pour la cage d'or. Je sais que tu as écouté à l'autel. Moi aussi."
          - "a7_sarn: Je suis une Lame. On ne demande pas à une lame ce qu'elle pense. Toi, je te le demande."
        dialogue-en:
          - "a7_sarn: I know about the letter. I know about the cage of gold. I know you listened at the altar. So did I."
          - "a7_sarn: I am a Blade. No one asks a blade what it thinks. You, I am asking."
      - type: PARLER
        texte: "Prévenir Morvain"
        texte-en: "Tell Morvain"
        pnj: a7_morvain
        dialogue:
          - "a7_morvain: Les Sans-Bannière montent au Cœur demain soir. Kael porte un marteau qui défait. Tu ne seras pas seul."
        dialogue-en:
          - "a7_morvain: The Bannerless climb to the Heart tomorrow night. Kael carries a hammer that unmakes. You will not be alone."
    recompenses:
      xp: 26700
      or: 2670

  # ================================================================ PRINCIPALES — SANS-BANNIÈRE (allégeance secrète, les deux camps)

  a7_s_le_camp_sans_banniere:
    nom: "Le camp sans bannière"
    nom-en: "The Bannerless Camp"
    niveau: 72
    requiert: [a6_s_vers_la_fournaise]
    donneur: a7_kael
    resume:
      - "Kael et Prisca ont monté un camp"
      - "à l'ouest du Guet, dans les rochers."
    resume-en:
      - "Kael and Prisca have set up a camp"
      - "west of the Watch, among the rocks."
    offre:
      - "a7_kael: Tu as trouvé le camp. Pas de feu la nuit, pas de bannière le jour. Assieds-toi."
    offre-en:
      - "a7_kael: You found the camp. No fire at night, no banner by day. Sit down."
    etapes:
      - type: PARLER
        texte: "Écouter Kael"
        texte-en: "Listen to Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: Le Défaiseur est presque fini. Ilmar est dedans. Il chauffe quand on approche du volcan."
        dialogue-en:
          - "a7_kael: The Unmaker is almost finished. Ilmar is inside it. It grows warm as we near the volcano."
        si: "a6-coeur-chaine=rendre"
      - type: PARLER
        texte: "Écouter Kael"
        texte-en: "Listen to Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: Le Défaiseur est presque fini. Sans le cœur d'Ilmar, il me faudra un autre feu pour le tremper. On en trouvera un, ici."
        dialogue-en:
          - "a7_kael: The Unmaker is almost finished. Without Ilmar's heart, I will need another fire to temper it. We will find one, here."
        si: "!a6-coeur-chaine=rendre"
      - type: PARLER
        texte: "Saluer Sœur Prisca"
        texte-en: "Greet Sister Prisca"
        pnj: a7_prisca
        dialogue:
          - "a7_prisca: Les chiens de tes chefs comptent les Marqués à l'entrée du Guet. Garde ta bannière bien droite. Tu en as encore besoin."
        dialogue-en:
          - "a7_prisca: Your chiefs' dogs count the Marked at the gate of the Watch. Keep your banner straight. You still need it."
      - type: INTERAGIR
        texte: "Graver ton nom sur la pierre du camp"
        texte-en: "Carve your name on the camp stone"
        point: a7_camp_sb
        rayon: 5
        apres:
          - "Une pierre plate, couverte de noms. Pas de soleil, pas de griffe. Tu ajoutes le tien, en bas."
        apres-en:
          - "A flat stone, covered in names. No sun, no claw. You add yours, at the bottom."
    recompenses:
      xp: 23400
      or: 2340

  a7_s_l_derniers_ordres:
    nom: "Les derniers ordres"
    nom-en: "The Last Orders"
    faction: lumiere
    niveau: 73
    requiert: [a7_s_le_camp_sans_banniere]
    donneur: a7_helis
    resume:
      - "Hélis distribue les postes"
      - "pour la montée du Reliquaire."
    resume-en:
      - "Hélis is handing out posts"
      - "for the Reliquary's climb."
    offre:
      - "a7_helis: Vous. Approchez. J'ai un poste pour vous, et je veux une réponse nette."
    offre-en:
      - "a7_helis: You. Come closer. I have a post for you, and I want a clear answer."
    etapes:
      - type: CHOIX
        texte: "Recevoir les ordres d'Hélis"
        texte-en: "Receive Hélis's orders"
        pnj: a7_helis
        choix: a7-ordres
        question: "Que répondez-vous à Hélis ?"
        question-en: "What do you answer Hélis?"
        reponses:
          - id: accepter
            texte: "Je tiendrai le registre, capitaine."
            texte-en: "I will keep the register, captain."
            reponse:
              - "a7_helis: Bien. Le poste des chasseurs est au sud-ouest du Guet. Ils vous attendront."
            reponse-en:
              - "a7_helis: Good. The hunters' post is south-west of the Watch. They will be expecting you."
            or: 600
          - id: refuser
            texte: "Je suis soldat, pas greffier."
            texte-en: "I am a soldier, not a clerk."
            reponse:
              - "a7_helis: … Soit. Vous garderez le Reliquaire avec les autres. Et je vous garderai à l'œil."
            reponse-en:
              - "a7_helis: … So be it. You will guard the Reliquary with the others. And I will keep an eye on you."
            xp: 3000
        dialogue:
          - "a7_helis: Les chasseurs de l'Aube ramènent des Marqués au volcan. Il faut quelqu'un pour tenir leur registre. Quelqu'un qu'on ne soupçonne pas."
        dialogue-en:
          - "a7_helis: The Dawn hunters are bringing Marked to the volcano. Someone must keep their register. Someone no one suspects."
      - type: PARLER
        texte: "Prévenir Kael"
        texte-en: "Warn Kael"
        pnj: a7_kael
        dialogue:
          - "a7_kael: Un registre des Marqués. Accepté ou pas, on sait maintenant qu'il existe. Et où."
        dialogue-en:
          - "a7_kael: A register of the Marked. Accepted or not, we now know it exists. And where."
    recompenses:
      xp: 24000
      or: 2400

