  a5_l_le_colosse_de_givre:
    nom: "Le Colosse de Givre"
    nom-en: "The Frost Colossus"
    faction: lumiere
    niveau: 59
    requiert: [a5_l_le_couloir_des_avalanches]
    donneur: a5_morvain
    resume:
      - "Le Colosse de Givre garde le souvenir de la Chute."
    resume-en:
      - "The Frost Colossus keeps the memory of the Fall."
    offre:
      - "a5_morvain: Il ne vous donnera rien. Il faut le briser, comme l'Astre s'est brisé : pour que ce qu'il garde puisse enfin sortir."
    offre-en:
      - "a5_morvain: It will give you nothing. It must be broken, as the Star broke: so that what it keeps can finally come out."
    etapes:
      - type: TUER
        texte: "Abattre les gardiens de givre des Hôtes"
        texte-en: "Bring down the Hosts' frost guardians"
        monstres: [a5_gardien_givre]
        nombre: 6
        point: a5_antre_parvis
      - type: TUER
        texte: "Vaincre le Colosse de Givre"
        texte-en: "Defeat the Frost Colossus"
        monstres: [a5_colosse]
        point: a5_antre_parvis
        apres:
          - "Le Colosse tombe en avant, lentement, comme une montagne qui s'incline. Sa poitrine se fend. À l'intérieur, une lueur bleue, immobile, qui attend."
        apres-en:
          - "The Colossus falls forward, slowly, like a mountain bowing. Its chest splits open. Inside, a blue glow, motionless, waiting."
      - type: PARLER
        texte: "Revenir voir Morvain"
        texte-en: "Return to Morvain"
        pnj: a5_morvain
        dialogue:
          - "a5_morvain: Le souvenir est là, dans ce qui reste de lui. Je ne peux pas le toucher. Je sais déjà ce qu'il contient."
        dialogue-en:
          - "a5_morvain: The memory is there, in what remains of it. I cannot touch it. I already know what it holds."
    recompenses:
      xp: 27500
      or: 2750
      objets:
        - materiau: BLUE_ICE
          nom: "Cœur de givre du Colosse"
          nom-en: "The Colossus' frost heart"
          description:
            - "Il ne fond pas. Il se souvient."
          description-en:
            - "It does not melt. It remembers."

