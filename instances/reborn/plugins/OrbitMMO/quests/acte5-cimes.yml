  a5_l_le_chevalier_noir:
    nom: "Le chevalier noir"
    nom-en: "The Black Knight"
    faction: lumiere
    niveau: 56
    requiert: [a5_l_le_convoi_des_geles]
    donneur: a5_ysarn
    resume:
      - "Un chevalier sans bannière demande après le Marqué, devant l'Antre du Colosse."
    resume-en:
      - "A knight without a banner is asking for the Marked, before the Lair of the Colossus."
    offre:
      - "a5_ysarn: Un chevalier en armure noire est passé cette nuit. Sans bannière. Il a laissé des cairns sur le chemin de l'est, jusqu'à l'Antre du Colosse. Il a dit ton nom, ou plutôt : il a dit que tu n'en avais pas."
    offre-en:
      - "a5_ysarn: A knight in black armour passed by last night. Without a banner. He left cairns along the eastern path, all the way to the Lair of the Colossus. He said your name, or rather: he said you had none."
    etapes:
      - type: PISTER
        texte: "Suivre les cairns vers l'Antre du Colosse"
        texte-en: "Follow the cairns toward the Lair of the Colossus"
        traces: [a5_cairn_2, a5_cairn_3, a5_morvain]
        apres:
          - "Devant l'Antre, assis sur une pierre comme au premier jour, Morvain t'attend."
        apres-en:
          - "Before the Lair, sitting on a stone as on the first day, Morvain is waiting for you."
      - type: PARLER
        texte: "Parler à Morvain"
        texte-en: "Talk to Morvain"
        pnj: a5_morvain
        dialogue:
          - "a5_morvain: Vous avez réveillé des gelés. Vous avez entendu l'Astre se souvenir. Alors vous êtes prêt pour la suite."
          - "a5_morvain: Derrière cette porte dort le Colosse. Les Hôtes l'ont fait de pierre et de glace pour garder un seul souvenir : celui de la Chute. Il l'a vue. Il la garde."
          - "a5_morvain: Vos deux armées montent vers lui. Elles veulent ce souvenir, en fiole. Il faut l'avoir avant elles."
        dialogue-en:
          - "a5_morvain: You woke frozen ones. You heard the Star remember. So you are ready for what comes next."
          - "a5_morvain: Behind this door sleeps the Colossus. The Hosts made it of stone and ice to keep a single memory: that of the Fall. It saw it. It keeps it."
          - "a5_morvain: Your two armies are climbing toward it. They want that memory, in a vial. We must have it before them."
    recompenses:
      xp: 24770
      or: 2475

