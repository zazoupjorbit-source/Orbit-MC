  a5_l_la_derniere_chaine:
    nom: "La dernière chaîne"
    nom-en: "The Last Chain"
    faction: lumiere
    niveau: 60
    requiert: [a5_l_le_colosse_de_givre]
    donneur: a5_morvain
    resume:
      - "Le souvenir de la Chute attend dans le cœur du Colosse."
    resume-en:
      - "The memory of the Fall waits in the heart of the Colossus."
    offre:
      - "a5_morvain: Allez-y. Touchez-le. Et quand vous reviendrez, vous saurez qui je suis."
    offre-en:
      - "a5_morvain: Go on. Touch it. And when you come back, you will know who I am."
    etapes:
      - type: INTERAGIR
        texte: "Toucher le souvenir du Colosse"
        texte-en: "Touch the Colossus' memory"
        point: a5_coeur_colosse
        rayon: 5
        apres:
          - "Tu n'es plus toi. Tu es un garçon de quinze ans, les mains noires de suie, dans une forge immense taillée dans la roche. Au-dessus du feu, une chaîne de lumière, presque finie."
          - "Un homme est derrière toi, en habit d'Hôte, ocre et or. Tu connais son visage : la fresque du Tombeau. Aurélien. « Encore un maillon, Morvain. Le dernier. »"
          - "Tu frappes. La chaîne se ferme. Au même instant, très haut, l'Astre se brise. Pas sous la chaîne : pour lui échapper."
          - "Un Éclat traverse le toit de la forge et te frappe en pleine poitrine. Tu as froid, puis chaud, puis tu ne sais plus ton nom. Mais tu sais ce que tu as fait."
        apres-en:
          - "You are no longer yourself. You are a boy of fifteen, hands black with soot, in an immense forge carved into the rock. Above the fire, a chain of light, almost finished."
          - "A man stands behind you, in Host's garb, ochre and gold. You know his face: the fresco in the Tomb. Aurélien. « One more link, Morvain. The last. »"
          - "You strike. The chain closes. At the same moment, far above, the Star breaks. Not under the chain: to escape it."
          - "A Shard pierces the forge roof and strikes you full in the chest. You are cold, then hot, then you no longer know your name. But you know what you have done."
      - type: PARLER
        texte: "Revenir vers Morvain"
        texte-en: "Go back to Morvain"
        pnj: a5_morvain
        dialogue:
          - "a5_morvain: Vous avez vu. J'avais quinze ans. J'étais son écuyer. J'ai forgé la dernière chaîne, et l'Éclat m'a touché le premier."
          - "a5_morvain: Je suis le premier Marqué. Mille ans. Je ne vieillis pas. J'ai oublié mon nom, mais pas ça. Jamais ça."
          - "a5_morvain: Depuis, j'attends quelqu'un qui pourrait défaire ce que j'ai fait. Je crois que c'est vous. Ou l'un des vôtres."
        dialogue-en:
          - "a5_morvain: You saw. I was fifteen. I was his squire. I forged the last chain, and the Shard touched me first."
          - "a5_morvain: I am the first Marked. A thousand years. I do not age. I forgot my name, but not that. Never that."
          - "a5_morvain: Since then, I have been waiting for someone who could undo what I did. I think it is you. Or one of your kind."
      - type: CHOIX
        texte: "Répondre à Morvain"
        texte-en: "Answer Morvain"
        pnj: a5_morvain
        choix: a5-morvain
        question: "Que dites-vous à Morvain ?"
        question-en: "What do you say to Morvain?"
        reponses:
          - id: pardonner
            texte: "Tu étais un enfant. Je te pardonne."
            texte-en: "You were a child. I forgive you."
            reponse:
              - "a5_morvain: Personne ne me l'avait dit en mille ans. Je ne sais pas quoi en faire. Je vais apprendre."
            reponse-en:
              - "a5_morvain: No one has said that to me in a thousand years. I do not know what to do with it. I will learn."
            xp: 5690
          - id: juger
            texte: "Mille ans ne suffisent pas à réparer ça."
            texte-en: "A thousand years are not enough to mend that."
            reponse:
              - "a5_morvain: Non. Ils ne suffisent pas. C'est pour ça que je suis encore là."
            reponse-en:
              - "a5_morvain: No. They are not enough. That is why I am still here."
            or: 570
        dialogue:
          - "a5_morvain: Vous pouvez me haïr. Beaucoup l'ont fait, sans même savoir pourquoi."
        dialogue-en:
          - "a5_morvain: You may hate me. Many have, without even knowing why."
      - type: PARLER
        texte: "Écouter Morvain"
        texte-en: "Listen to Morvain"
        pnj: a5_morvain
        dialogue:
          - "a5_morvain: Les chaînes existent encore. La forge aussi : la Forge éteinte, dans les Terres de Cendre. Et vos deux chefs la veulent rallumée."
          - "a5_morvain: Séraphine pour remettre l'Astre en cage. Vharos pour enchaîner le Néant à lui seul. Il faut y être avant eux."
          - "Au loin, sur le col, les deux armées arrivent à l'Antre au lever du jour. Elles ne trouvent qu'un colosse brisé et de la neige. À suivre."
        dialogue-en:
          - "a5_morvain: The chains still exist. So does the forge: the Extinguished Forge, in the Ash Lands. And both your leaders want it relit."
          - "a5_morvain: Séraphine to put the Star back in a cage. Vharos to chain the Void to himself alone. We must get there before them."
          - "In the distance, on the pass, the two armies reach the Lair at daybreak. They find only a broken colossus and snow. To be continued."
    recompenses:
      xp: 28440
      or: 2845
      objets:
        - materiau: CHAIN
          nom: "Maillon de lumière"
          nom-en: "Link of light"
          description:
            - "Un seul maillon, tiède. Il vient de la dernière chaîne."
          description-en:
            - "A single link, warm. It comes from the last chain."

