  a5_l_l_avant_poste:
    nom: "L'avant-poste de la Citadelle"
    nom-en: "The Citadel's Outpost"
    faction: lumiere
    niveau: 57
    requiert: [a5_l_le_chevalier_noir]
    donneur: a5_morvain
    resume:
      - "La Citadelle prépare l'assaut de l'Antre depuis un avant-poste au sud-est."
    resume-en:
      - "The Citadel is preparing the assault on the Lair from an outpost to the south-east."
    offre:
      - "a5_morvain: La Citadelle a un avant-poste au sud-est, au-dessus des cimetières. Leur plan d'assaut y est. Prenez cette cape : leurs sentinelles ne regardent que les couleurs."
      - "a5_morvain: Ne frappez personne. Une seule lame tirée, et la cape ne vous cachera plus."
    offre-en:
      - "a5_morvain: The Citadel has an outpost to the south-east, above the graveyards. Their assault plan is there. Take this cloak: their sentries only look at colours."
      - "a5_morvain: Strike no one. A single drawn blade, and the cloak will no longer hide you."
    etapes:
      - type: DEGUISEMENT
        texte: "Entrer dans l'avant-poste de la Citadelle, déguisé"
        texte-en: "Enter the Citadel outpost in disguise"
        point: a5_poste_nuit_coeur
        monstres: [a5_garde_ombre]
        materiau: LEATHER_CHESTPLATE
        couleur: "#3B2357"
        objet: "Cape de la Citadelle"
        objet-en: "Citadel cloak"
        apres:
          - "Les sentinelles te saluent d'un signe de tête. Pour elles, tu es un des leurs qui a froid."
        apres-en:
          - "The sentries greet you with a nod. To them, you are one of their own, feeling the cold."
      - type: INTERAGIR
        texte: "Fouiller la table du commandant"
        texte-en: "Search the commander's table"
        point: a5_poste_nuit_coeur
        rayon: 4
        apres:
          - "Le plan d'assaut. Ils attaquent l'Antre à l'aube, par la terrasse. Et dans la marge, une note : « Si l'Aube arrive avant nous, attendre qu'elle réveille le Colosse, puis prendre le souvenir aux survivants. »"
        apres-en:
          - "The assault plan. They attack the Lair at dawn, by the terrace. And in the margin, a note: « If the Dawn arrives first, wait for it to wake the Colossus, then take the memory from the survivors. »"
      - type: PARLER
