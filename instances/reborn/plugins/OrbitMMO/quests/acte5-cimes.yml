  a5_l_le_convoi_des_geles:
    nom: "Le convoi des gelés"
    nom-en: "The Convoy of the Frozen"
    faction: lumiere
    niveau: 55
    requiert: [a5_l_les_ordres_de_guerre]
    donneur: a5_liesse
    resume:
      - "Les Marqués dégelés attendent au pied du glacier."
    resume-en:
      - "The thawed Marked are waiting at the foot of the glacier."
    offre:
      - "a5_liesse: Ils attendent au pied du glacier, emmitouflés. Ils marchent lentement. Ne les laisse pas seuls."
    offre-en:
      - "a5_liesse: They are waiting at the foot of the glacier, wrapped up. They walk slowly. Do not leave them alone."
    etapes:
      - type: ESCORTE
        texte: "Conduire les dégelés au camp du Soleil"
        texte-en: "Lead the thawed to the Sun camp"
        pnj: a5_gele
        chemin: [a5_convoi_ouest, a5_convoi_soleil]
        monstres: [a5_lame_ombre]
        nombre: 3
        vagues: 3
        pv: 160
        vitesse: 2
        degats: 6
        apres:
          - "a5_gele: C'est ici, la chaleur ? On nous avait promis la chaleur."
        apres-en:
          - "a5_gele: Is this the warmth? We were promised warmth."
        si: "a5-geles=livrer"
      - type: PARLER
        texte: "Remettre les dégelés à la capitaine Hélis"
        texte-en: "Hand the thawed over to Captain Hélis"
        pnj: a5_helis
        dialogue:
          - "a5_helis: Trois Marqués de la Chute. La Haute-Prélate sera contente. Vous serez cité au Bastion."
          - "Derrière elle, Aldren regarde les dégelés monter dans un chariot fermé. Il ne dit rien. Il ne te regarde pas."
        dialogue-en:
          - "a5_helis: Three Marked of the Fall. The High Prelate will be pleased. You will be mentioned at the Bastion."
          - "Behind her, Aldren watches the thawed climb into a closed wagon. He says nothing. He does not look at you."
        si: "a5-geles=livrer"
      - type: INFILTRER
        texte: "Faire passer les dégelés derrière les patrouilles de votre camp"
        texte-en: "Get the thawed past your own side's patrols"
        point: a5_convoi_1
        depart: a5_convoi_depart
        monstres: [a5_garde_aube]
        vue: 10
        rayon: 4
        apres:
          - "Les patrouilles regardent le glacier. Personne ne regarde le petit groupe qui se glisse derrière elles, vers les murs blancs du fort."
        apres-en:
          - "The patrols watch the glacier. Nobody watches the small group slipping behind them, toward the fort's white walls."
        si: "a5-geles=cacher"
      - type: PARLER
        texte: "Revenir voir Liesse"
        texte-en: "Return to Liesse"
        pnj: a5_liesse
        dialogue:
          - "a5_liesse: Ils sont à l'abri, dans la cave de l'observatoire. Ysarn dit qu'il n'a rien vu. Hild dit qu'elle n'a rien vu non plus."
          - "a5_liesse: Fort Blanc ne porte pas de bannière. Il paraît que ça veut dire quelque chose, finalement."
        dialogue-en:
          - "a5_liesse: They are safe, in the observatory cellar. Ysarn says he saw nothing. Hild says she saw nothing either."
          - "a5_liesse: Fort Blanc carries no banner. It seems that means something, after all."
        si: "a5-geles=cacher"
    recompenses:
      xp: 23900
      or: 2390

