  # ================================================================ ANNEXES NEUTRES — FORT BLANC (toutes factions)

  a5_n_les_loups_du_col:
    nom: "Les loups du col"
    nom-en: "The Wolves of the Pass"
    niveau: 49
    donneur: a5_hild
    resume:
      - "Les loups de givre attaquent les sentinelles du fort."
    resume-en:
      - "The frost wolves are attacking the fort's sentries."
    offre:
      - "a5_hild: Les loups de givre descendent avec la guerre : il y a des morts partout, ça les attire. Ils commencent à goûter mes sentinelles."
    offre-en:
      - "a5_hild: The frost wolves come down with the war: there are dead everywhere, it draws them. They are starting to taste my sentries."
    etapes:
      - type: TUER
        texte: "Chasser les loups de givre"
        texte-en: "Hunt the frost wolves"
        monstres: [loup_givre]
        nombre: 10
      - type: PARLER
        texte: "Revenir voir Hild"
        texte-en: "Return to Hild"
        pnj: a5_hild
        dialogue:
          - "a5_hild: Mes sentinelles dormiront avec leurs deux jambes. Merci."
        dialogue-en:
          - "a5_hild: My sentries will sleep with both legs. Thank you."
    recompenses:
      xp: 16120
      or: 1610

  a5_n_la_tour_du_col_blanc:
    nom: "La tour du Col Blanc"
    nom-en: "The White Pass Tower"
    niveau: 51
    requiert: [a5_n_les_loups_du_col]
    donneur: a5_hild
    resume:
      - "Des soldats des deux armées veulent prendre la tour du Col Blanc."
    resume-en:
      - "Soldiers from both armies want to take the White Pass tower."
    offre:
      - "a5_hild: La tour du Col Blanc est à nous, à la Garde. Les deux armées la veulent, et cette fois, elles montent en même temps. Tiens-la avec mes hommes."
    offre-en:
      - "a5_hild: The White Pass tower is ours, the Guard's. Both armies want it, and this time they are coming up at the same time. Hold it with my men."
    etapes:
      - type: DEFENSE
        texte: "Tenir la tour du Col Blanc"
        texte-en: "Hold the White Pass tower"
        point: a5_col_blanc
        monstres: [a5_lame_aube, a5_lame_ombre]
        nombre: 3
        duree: 75
        intervalle: 15
        pv: 220
        degats: 6
        cible: "La tour du Col Blanc"
        cible-en: "The White Pass tower"
        apres:
          - "Les deux compagnies se retrouvent nez à nez sous la tour, et finissent par se battre entre elles. La tour tient."
        apres-en:
          - "The two companies find themselves face to face under the tower, and end up fighting each other. The tower holds."
      - type: PARLER
        texte: "Revenir voir Hild"
        texte-en: "Return to Hild"
        pnj: a5_hild
        dialogue:
          - "a5_hild: Ils se sont battus entre eux sous nos murs. Une fois de plus, le blanc a gagné sans tirer l'épée. Enfin, presque."
        dialogue-en:
          - "a5_hild: They fought each other under our walls. Once again, white won without drawing a sword. Well, almost."
    recompenses:
      xp: 17470
      or: 1745

  a5_n_les_deserteurs:
    nom: "Les déserteurs"
    nom-en: "The Deserters"
    niveau: 54
    requiert: [a5_n_la_tour_du_col_blanc]
    donneur: a5_hild
    resume:
      - "Des déserteurs des deux armées se cachent dans la vieille tour du sud."
    resume-en:
      - "Deserters from both armies are hiding in the old southern tower."
    offre:
      - "a5_hild: Des déserteurs se cachent dans la vieille tour du sud. Des deux camps, mélangés. Leur chef s'appelle Bram. Va voir ce qu'ils veulent, et dis-moi si je dois les chasser."
    offre-en:
      - "a5_hild: Deserters are hiding in the old southern tower. From both sides, mixed. Their leader is called Bram. Go and see what they want, and tell me whether I should drive them out."
    etapes:
      - type: ATTEINDRE
        texte: "Rejoindre la vieille tour du sud"
        texte-en: "Reach the old southern tower"
        point: a5_ruine_j1
        rayon: 10
      - type: CHOIX
        texte: "Écouter Bram"
        texte-en: "Listen to Bram"
        pnj: a5_deserteur
        choix: a5-deserteurs
        question: "Que conseillerez-vous à Hild ?"
        question-en: "What will you advise Hild?"
        reponses:
          - id: accueillir
            texte: "Je lui dirai de vous accueillir en blanc."
            texte-en: "I will tell her to take you in, in white."
            reponse:
              - "a5_deserteur: En blanc. Ça doit faire drôle. Merci."
            reponse-en:
              - "a5_deserteur: In white. That must feel strange. Thank you."
            xp: 4610
          - id: chasser
            texte: "Partez. Fort Blanc ne peut pas vous protéger."
            texte-en: "Leave. Fort Blanc cannot protect you."
            reponse:
              - "a5_deserteur: Je comprends. On descendra vers le désert. On dit que les nomades ne posent pas de questions."
            reponse-en:
              - "a5_deserteur: I understand. We will go down toward the desert. They say the nomads ask no questions."
            or: 460
        dialogue:
          - "a5_deserteur: Je portais l'or. Lui, là, portait le violet. On s'est tiré dessus pendant trois semaines. Puis on a eu froid ensemble, une nuit, et on n'a plus su pourquoi."
          - "a5_deserteur: On ne veut rien. Juste ne plus tuer personne. Ta sergente nous laissera vivre ici ?"
        dialogue-en:
          - "a5_deserteur: I wore gold. Him, there, wore violet. We shot at each other for three weeks. Then we were cold together one night, and we no longer knew why."
          - "a5_deserteur: We want nothing. Just to stop killing anyone. Will your sergeant let us live here?"
      - type: PARLER
        texte: "Revenir voir Hild"
        texte-en: "Return to Hild"
        pnj: a5_hild
        dialogue:
          - "a5_hild: Des déserteurs dans la Garde blanche. Les deux armées vont hurler. Tant mieux : ça nous fera de l'exercice."
        dialogue-en:
          - "a5_hild: Deserters in the White Guard. Both armies will howl. All the better: it will give us exercise."
        si: "a5-deserteurs=accueillir"
      - type: PARLER
        texte: "Revenir voir Hild"
        texte-en: "Return to Hild"
        pnj: a5_hild
        dialogue:
          - "a5_hild: Partis vers le désert. C'était peut-être plus sage. Ce n'était pas plus juste."
        dialogue-en:
          - "a5_hild: Gone toward the desert. Perhaps that was wiser. It was not fairer."
        si: "a5-deserteurs=chasser"
    recompenses:
      xp: 19580
      or: 1960

  a5_n_la_garde_blanche:
    nom: "La Garde blanche"
    nom-en: "The White Guard"
    niveau: 57
    requiert: [a5_n_les_deserteurs]
    donneur: a5_hild
    resume:
      - "Hild veut nettoyer le bivouac des Errants, au nord-ouest."
    resume-en:
      - "Hild wants to clear the Wanderers' bivouac, to the north-west."
    offre:
      - "a5_hild: Il reste un bivouac d'Errants au nord-ouest, sous le glacier. Après ça, je te ferai une proposition."
    offre-en:
      - "a5_hild: There is one Wanderers' bivouac left to the north-west, below the glacier. After that, I will make you an offer."
    etapes:
      - type: TUER
        texte: "Nettoyer le bivouac des Errants"
        texte-en: "Clear the Wanderers' bivouac"
        monstres: [errant, loup_givre]
        nombre: 12
        point: a5_camp_j3
      - type: PARLER
        texte: "Revenir voir Hild"
        texte-en: "Return to Hild"
        pnj: a5_hild
        dialogue:
          - "a5_hild: Voilà ma proposition : cet insigne. Il ne t'engage à rien. Il dit seulement que Fort Blanc te connaît."
        dialogue-en:
          - "a5_hild: Here is my offer: this badge. It binds you to nothing. It only says that Fort Blanc knows you."
    recompenses:
      xp: 21820
      or: 2180
      objets:
        - materiau: WHITE_BANNER
          nom: "Insigne de la Garde blanche"
          nom-en: "Badge of the White Guard"
          description:
            - "Fort Blanc te connaît."
          description-en:
            - "Fort Blanc knows you."

  a5_n_le_cimetiere_des_cimes:
    nom: "Le cimetière des cimes"
    nom-en: "The Peak Graveyard"
    niveau: 53
    donneur: a5_hild
    resume:
      - "Un cimetière s'est réveillé à l'est du col."
    resume-en:
      - "A graveyard has woken east of the pass."
    offre:
      - "a5_hild: À l'est, sur la crête, un vieux cimetière de veilleurs s'est réveillé. Mes hommes refusent d'y monter. Je ne leur en veux pas."
    offre-en:
      - "a5_hild: To the east, on the ridge, an old watchers' graveyard has woken. My men refuse to go up. I do not blame them."
    etapes:
      - type: TUER
        texte: "Rendre au repos les veilleurs"
        texte-en: "Lay the watchers to rest"
        monstres: [squelette, revenant]
        nombre: 12
        point: a5_camp_j4
      - type: INTERAGIR
        texte: "Lire les tombes des veilleurs"
        texte-en: "Read the watchers' graves"
        point: a5_camp_j4
        rayon: 6
        apres:
          - "Sur chaque tombe, une date : la nuit de la Chute. Et la même phrase : « Il a vu tomber le ciel, et il n'a pas détourné les yeux. »"
        apres-en:
          - "On each grave, a date: the night of the Fall. And the same sentence: « He saw the sky fall, and did not look away. »"
      - type: PARLER
        texte: "Revenir voir Hild"
        texte-en: "Return to Hild"
        pnj: a5_hild
        dialogue:
          - "a5_hild: Les premiers veilleurs du fort. Ils sont morts de froid à leur poste, en regardant. On fait toujours ça, à Fort Blanc : on regarde."
        dialogue-en:
          - "a5_hild: The fort's first watchers. They froze to death at their posts, watching. We still do that at Fort Blanc: we watch."
    recompenses:
      xp: 18860
      or: 1885

  a5_n_le_cimetiere_de_l_est:
    nom: "Le cimetière de l'est"
    nom-en: "The Eastern Graveyard"
    niveau: 58
    requiert: [a5_n_le_cimetiere_des_cimes]
    donneur: a5_hild
    resume:
      - "Un cimetière se vide tout à l'est des Cimes."
    resume-en:
      - "A graveyard is emptying at the far east of the Peaks."
    offre:
      - "a5_hild: Tout à l'est, au pied des cimes, un autre cimetière se vide. Ceux-là descendent vers les camps. Si les morts entrent dans la guerre, plus personne ne saura qui gagne."
    offre-en:
      - "a5_hild: Far to the east, at the foot of the peaks, another graveyard is emptying. These are going down toward the camps. If the dead join the war, nobody will know who is winning."
    etapes:
      - type: TUER
        texte: "Rendre au repos les morts de l'est"
        texte-en: "Lay the eastern dead to rest"
        monstres: [squelette, revenant]
        nombre: 14
        point: a5_camp_j2
      - type: PARLER
        texte: "Revenir voir Hild"
        texte-en: "Return to Hild"
        pnj: a5_hild
        dialogue:
          - "a5_hild: Les morts restent hors de la guerre. C'est déjà ça."
        dialogue-en:
          - "a5_hild: The dead stay out of the war. That is something."
    recompenses:
      xp: 22590
      or: 2260

  a5_n_les_pelerins:
    nom: "Les pèlerins de la Chute"
    nom-en: "The Pilgrims of the Fall"
    niveau: 50
    donneur: a5_tobias
    resume:
      - "Des pèlerins veulent monter à la tour des Veilleurs."
    resume-en:
      - "Pilgrims want to climb to the Watchers' tower."
    offre:
      - "a5_tobias: Ansel et ses pèlerins veulent monter à la vieille tour du sud, là où l'on a vu l'Astre tomber. Les loups des neiges les suivent depuis deux jours. Accompagne-les."
    offre-en:
      - "a5_tobias: Ansel and his pilgrims want to climb to the old southern tower, where the Star was seen to fall. The snow wolves have been following them for two days. Go with them."
    etapes:
      - type: ESCORTE
        texte: "Escorter les pèlerins jusqu'à la tour des Veilleurs"
        texte-en: "Escort the pilgrims to the Watchers' tower"
        pnj: a5_pelerin
        chemin: [a5_pel_1, a5_pel_2, a5_ruine_j1]
        monstres: [a5_loup_blanc]
        nombre: 3
        vagues: 2
        pv: 140
        degats: 5
        apres:
          - "a5_pelerin: La tour. Ils ont vu le ciel se déchirer d'ici. Nous allons prier pour qu'il se referme."
        apres-en:
          - "a5_pelerin: The tower. They saw the sky tear from here. We will pray for it to close again."
      - type: PARLER
        texte: "Revenir voir Tobias"
        texte-en: "Return to Tobias"
        pnj: a5_tobias
        dialogue:
          - "a5_tobias: Prier pour que le ciel se referme. Ils ne savent pas comment, mais ils y croient. C'est déjà plus que les armées."
        dialogue-en:
          - "a5_tobias: Praying for the sky to close. They do not know how, but they believe it. That is already more than the armies."
    recompenses:
      xp: 16790
      or: 1680

  a5_n_le_bois_de_chauffe:
    nom: "Le bois de chauffe"
    nom-en: "Firewood"
    niveau: 52
    requiert: [a5_n_les_pelerins]
    donneur: a5_tobias
    resume:
      - "Fort Blanc manque de bois pour les feux de Liesse."
    resume-en:
      - "Fort Blanc is short of wood for Liesse's fires."
    offre:
      - "a5_tobias: Liesse brûle trois fagots par dégel. Il ne reste du pin noir qu'au sud-ouest, sur les hauts. Charge-les sur ta monture et ramène-les à la porte du fort."
    offre-en:
      - "a5_tobias: Liesse burns three bundles per thaw. Black pine only remains to the south-west, on the heights. Load them on your mount and bring them back to the fort gate."
    etapes:
      - type: TRANSPORT
        texte: "Ramener les fagots au fort, à dos de monture"
        texte-en: "Bring the bundles back to the fort, on a mount"
        point: a5_porte_fort
        depart: a5_bois
        materiau: SPRUCE_LOG
        rayon: 6
        objet: "Fagots de pin noir"
        objet-en: "Black pine bundles"
        apres:
          - "Les fagots arrivent secs. Liesse les compte, deux fois, et sourit."
        apres-en:
          - "The bundles arrive dry. Liesse counts them, twice, and smiles."
      - type: PARLER
        texte: "Revenir voir Tobias"
        texte-en: "Return to Tobias"
        pnj: a5_tobias
        dialogue:
          - "a5_tobias: De quoi dégeler encore une dizaine de pauvres âmes. Ou de quoi faire la soupe. On verra ce qui presse le plus."
        dialogue-en:
          - "a5_tobias: Enough to thaw a dozen more poor souls. Or to make soup. We will see which is more urgent."
    recompenses:
      xp: 18160
      or: 1815

  a5_n_vieux_croc:
    nom: "Vieux-Croc"
    nom-en: "Old Fang"
    niveau: 55
    requiert: [a5_n_le_bois_de_chauffe]
    donneur: a5_tobias
    resume:
      - "Un vieil ours des glaces terrorise les pentes de l'est."
    resume-en:
      - "An old ice bear terrorises the eastern slopes."
    offre:
      - "a5_tobias: Vieux-Croc. Un ours des glaces plus vieux que moi, et plus méchant que mon père. Il a pris deux guides cet hiver. Ses traces partent des pentes de l'est."
    offre-en:
      - "a5_tobias: Old Fang. An ice bear older than me, and meaner than my father. He took two guides this winter. His tracks start on the eastern slopes."
    etapes:
      - type: PISTER
        texte: "Suivre les traces de Vieux-Croc"
        texte-en: "Follow Old Fang's tracks"
        traces: [a5_ours_trace_1, a5_ours_trace_2, a5_ours_fin]
        apres:
          - "Les traces s'arrêtent devant une masse blanche qui se lève lentement. Très lentement. Et très haut."
        apres-en:
          - "The tracks stop before a white mass rising slowly. Very slowly. And very high."
      - type: TUER
        texte: "Abattre Vieux-Croc"
        texte-en: "Bring down Old Fang"
        monstres: [a5_ours_vieux]
        point: a5_ours_fin
      - type: PARLER
        texte: "Rapporter la nouvelle à Tobias"
        texte-en: "Bring the news to Tobias"
        pnj: a5_tobias
        dialogue:
          - "a5_tobias: Vieux-Croc est tombé. Je vais boire à la santé des deux guides. Et à la tienne."
        dialogue-en:
          - "a5_tobias: Old Fang has fallen. I will drink to the two guides. And to you."
    recompenses:
      xp: 20310
      or: 2030
      objets:
        - materiau: BONE
          nom: "Croc de Vieux-Croc"
          nom-en: "Old Fang's fang"
          description:
            - "Long comme une main."
          description-en:
            - "As long as a hand."

  a5_n_le_fanal_du_sommet:
    nom: "Le fanal du sommet"
    nom-en: "The Summit Beacon"
    niveau: 58
    requiert: [a5_n_vieux_croc]
    donneur: a5_tobias
    resume:
      - "Le vieux fanal du plus haut sommet est éteint depuis la Chute."
    resume-en:
      - "The old beacon on the highest summit has been out since the Fall."
    offre:
      - "a5_tobias: Au plus haut sommet des Cimes, il y a un vieux fanal. Les veilleurs l'allumaient pour dire à l'Astre : on te voit. Personne ne l'a rallumé depuis mille ans. Ysarn voudrait qu'on essaie."
    offre-en:
      - "a5_tobias: On the highest summit of the Peaks, there is an old beacon. The watchers lit it to tell the Star: we see you. Nobody has relit it in a thousand years. Ysarn would like us to try."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre le plus haut sommet des Cimes"
        texte-en: "Reach the highest summit of the Peaks"
        point: a5_sommet
        rayon: 8
        apres:
          - "Le monde entier, d'un seul regard. Le désert ocre au sud, les cendres au nord, et au-dessus, la déchirure du Néant, toute proche."
        apres-en:
          - "The whole world, at a single glance. The ochre desert to the south, the ashes to the north, and above, the tear of the Void, very close."
      - type: INTERAGIR
        texte: "Rallumer le fanal"
        texte-en: "Relight the beacon"
        point: a5_sommet
        rayon: 5
        apres:
          - "La flamme prend. Elle ne vacille pas, malgré le vent. Très haut, dans la déchirure, quelque chose bouge, comme quelqu'un qui tourne la tête."
        apres-en:
          - "The flame catches. It does not flicker, despite the wind. Far above, in the tear, something moves, like someone turning their head."
      - type: PARLER
        texte: "Raconter à Ysarn"
        texte-en: "Tell Ysarn"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Il a tourné la tête. Mille ans que personne ne lui disait : on te voit. Ce soir, je vais rester dehors un peu plus longtemps."
        dialogue-en:
          - "a5_ysarn: It turned its head. A thousand years since anyone told it: we see you. Tonight, I will stay outside a little longer."
    recompenses:
      xp: 22590
      or: 2260

  a5_n_le_bivouac_de_l_ouest:
    nom: "Le bivouac de l'ouest"
    nom-en: "The Western Bivouac"
    niveau: 55
    donneur: a5_tobias
    resume:
      - "Un bivouac d'Errants bloque le chemin de l'ouest."
    resume-en:
      - "A Wanderers' bivouac blocks the western path."
    offre:
      - "a5_tobias: Loin à l'ouest, au bout des Cimes, un bivouac d'Errants s'est installé sur le chemin des chasseurs. Personne ne passe plus."
    offre-en:
      - "a5_tobias: Far to the west, at the end of the Peaks, a Wanderers' bivouac has settled on the hunters' path. Nobody gets through any more."
    etapes:
      - type: TUER
        texte: "Disperser le bivouac de l'ouest"
        texte-en: "Scatter the western bivouac"
        monstres: [errant, loup_givre]
        nombre: 12
        point: a5_camp_j5
      - type: PARLER
        texte: "Revenir voir Tobias"
        texte-en: "Return to Tobias"
        pnj: a5_tobias
        dialogue:
          - "a5_tobias: Le chemin des chasseurs est rouvert. Ils te devront des peaux. Ils paient toujours en peaux."
        dialogue-en:
          - "a5_tobias: The hunters' path is open again. They will owe you hides. They always pay in hides."
    recompenses:
      xp: 20310
      or: 2030

  a5_n_l_ermite_des_cimes:
    nom: "L'ermite des cimes"
    nom-en: "The Hermit of the Peaks"
    niveau: 51
    donneur: a5_tobias
    resume:
      - "Un ermite vit seul au nord-ouest des Cimes depuis quarante ans."
    resume-en:
      - "A hermit has lived alone north-west of the Peaks for forty years."
    offre:
      - "a5_tobias: Au nord-ouest, il y a un ermite, Oswin. Il ne descend jamais. Il connaît les Cimes mieux que moi. Va le voir de ma part, et apporte-lui des nouvelles : il n'en a pas eu depuis l'hiver."
    offre-en:
      - "a5_tobias: To the north-west, there is a hermit, Oswin. He never comes down. He knows the Peaks better than I do. Go and see him for me, and bring him news: he has had none since winter."
    etapes:
      - type: ATTEINDRE
        texte: "Rejoindre le refuge de l'ermite"
        texte-en: "Reach the hermit's refuge"
        point: a5_refuge
        rayon: 8
      - type: PARLER
        texte: "Parler à Oswin"
        texte-en: "Talk to Oswin"
        pnj: a5_ermite
        dialogue:
          - "a5_ermite: La guerre ? Encore. Je l'entends d'ici, les nuits sans vent."
          - "a5_ermite: Un chevalier noir passe par ici, parfois. La première fois, j'avais vingt ans. La dernière fois, c'était cet automne. Il avait le même visage."
        dialogue-en:
          - "a5_ermite: War? Again. I can hear it from here, on windless nights."
          - "a5_ermite: A black knight passes by here, sometimes. The first time, I was twenty. The last time was this autumn. He had the same face."
    recompenses:
      xp: 17470
      or: 1745

  a5_n_la_mine_gelee:
    nom: "La mine gelée"
    nom-en: "The Frozen Mine"
    niveau: 54
    requiert: [a5_n_l_ermite_des_cimes]
    donneur: a5_ermite
    resume:
      - "Des Creux gelés sortent d'une vieille mine à l'ouest."
    resume-en:
      - "Frozen Hollow are coming out of an old mine to the west."
    offre:
      - "a5_ermite: Une vieille mine, à l'est de mon refuge. Des choses en sortent, la nuit. Des gens, avant. Vides, maintenant. Ils ont froid, et ils cherchent qui réchauffer."
    offre-en:
      - "a5_ermite: An old mine, east of my refuge. Things come out of it at night. People, once. Empty, now. They are cold, and they are looking for someone to warm them."
    etapes:
      - type: INTERAGIR
        texte: "Examiner l'entrée de la mine"
        texte-en: "Examine the mine entrance"
        point: a5_mine_entree
        rayon: 6
        apres:
          - "Des outils de mineur, abandonnés en hâte. Gravé sur une poutre : « On a trouvé un Éclat noir. Il nous parle. »"
        apres-en:
          - "Miner's tools, abandoned in haste. Carved on a beam: « We found a black Shard. It talks to us. »"
      - type: TUER
        texte: "Abattre les Creux gelés"
        texte-en: "Bring down the frozen Hollow"
        monstres: [a5_creux_gele]
        nombre: 8
        point: a5_mine
      - type: PARLER
        texte: "Revenir voir Oswin"
        texte-en: "Return to Oswin"
        pnj: a5_ermite
        dialogue:
          - "a5_ermite: Un Éclat noir qui parle. Il a bu leur lumière, et il a laissé du froid à la place. Comme le ciel."
        dialogue-en:
          - "a5_ermite: A black Shard that talks. It drank their light, and left cold in its place. Like the sky."
    recompenses:
      xp: 19580
      or: 1960

  a5_n_la_chapelle_sous_la_neige:
    nom: "La chapelle sous la neige"
    nom-en: "The Chapel under the Snow"
    niveau: 57
    requiert: [a5_n_la_mine_gelee]
    donneur: a5_ermite
    resume:
      - "Une chapelle des Hôtes dort sous la neige, loin à l'ouest."
    resume-en:
      - "A Hosts' chapel sleeps under the snow, far to the west."
    offre:
      - "a5_ermite: Loin à l'ouest, une chapelle sous la neige. Les Hôtes y montaient pour être plus près de l'Astre quand il passait. Le froid y a mis des gardiens. Va voir ce qui reste sur l'autel."
    offre-en:
      - "a5_ermite: Far to the west, a chapel under the snow. The Hosts climbed there to be closer to the Star when it passed. The cold has set guardians there. Go and see what remains on the altar."
    etapes:
      - type: ATTEINDRE
        texte: "Rejoindre la chapelle sous la neige"
        texte-en: "Reach the chapel under the snow"
        point: a5_chapelle_neige
        rayon: 10
      - type: TUER
        texte: "Abattre les gardiens gelés"
        texte-en: "Bring down the frozen guardians"
        monstres: [a5_creux_gele]
        nombre: 6
        point: a5_chapelle_neige
      - type: INTERAGIR
        texte: "Dégager l'autel"
        texte-en: "Clear the altar"
        point: a5_chapelle_neige
        rayon: 6
        apres:
          - "Sur l'autel, deux coupes. L'une pour l'Astre, l'autre pour celui qui l'accueille. Elles sont toujours pleines de neige, comme si on attendait encore quelqu'un."
        apres-en:
          - "On the altar, two cups. One for the Star, the other for whoever welcomes it. They are still full of snow, as if someone were still expected."
      - type: PARLER
        texte: "Revenir voir Oswin"
        texte-en: "Return to Oswin"
        pnj: a5_ermite
        dialogue:
          - "a5_ermite: Deux coupes. Une pour lui, une pour nous. Ils ne l'invitaient pas à rester. Ils l'invitaient à revenir."
        dialogue-en:
          - "a5_ermite: Two cups. One for it, one for us. They did not invite it to stay. They invited it to come back."
    recompenses:
      xp: 21820
      or: 2180

  a5_n_les_eclats_de_givre:
    nom: "Les éclats de givre"
    nom-en: "Frost Shards"
    niveau: 50
    donneur: a5_liesse
    resume:
      - "Liesse a besoin d'éclats de givre pour ses dégels."
    resume-en:
      - "Liesse needs frost shards for her thaws."
    offre:
      - "a5_liesse: Les Errants portent des éclats de givre sur eux. Ça brûle au contact, mais pilé dans du suif, ça fait le meilleur onguent contre le gel. Rapporte-m'en."
    offre-en:
      - "a5_liesse: The Wanderers carry frost shards on them. They burn to the touch, but crushed in tallow, they make the best ointment against frostbite. Bring me some."
    etapes:
      - type: RAMASSER
        texte: "Récupérer des éclats de givre sur les Errants"
        texte-en: "Collect frost shards from the Wanderers"
        monstres: [errant]
        nombre: 8
        chance: 0.5
        objet: "Éclat de givre"
        objet-en: "Frost shard"
      - type: PARLER
        texte: "Rapporter les éclats à Liesse"
        texte-en: "Bring the shards to Liesse"
        pnj: a5_liesse
        dialogue:
          - "a5_liesse: Parfait. Ça brûle, ça pique, ça soigne. Comme moi, disent les soldats."
        dialogue-en:
          - "a5_liesse: Perfect. It burns, it stings, it heals. Like me, the soldiers say."
    recompenses:
      xp: 16790
      or: 1680

  a5_n_le_lac_gele:
    nom: "Le lac gelé"
    nom-en: "The Frozen Lake"
    niveau: 53
    requiert: [a5_n_les_eclats_de_givre]
    donneur: a5_liesse
    resume:
      - "Liesse veut de l'eau du Lac des Cimes, gardé par des noyés."
    resume-en:
      - "Liesse wants water from the Peak Lake, guarded by drowned ones."
    offre:
      - "a5_liesse: L'eau du Lac des Cimes ne gèle jamais tout à fait. Elle réveille les gelés sans les brûler. Des noyés gardent la rive. Ils ne savent plus pourquoi."
    offre-en:
      - "a5_liesse: The water of the Peak Lake never quite freezes. It wakes the frozen without burning them. Drowned ones guard the shore. They no longer know why."
    etapes:
      - type: TUER
        texte: "Abattre les noyés du lac"
        texte-en: "Bring down the drowned of the lake"
        monstres: [a5_noye_gele]
        nombre: 6
        point: a5_lac
      - type: INTERAGIR
        texte: "Remplir la gourde au bord du lac"
        texte-en: "Fill the flask at the lake's edge"
        point: a5_lac
        rayon: 6
        apres:
          - "L'eau est tiède. Au fond du lac, une lueur dorée, immobile : un Éclat, tombé là il y a mille ans, qui chauffe encore l'eau."
        apres-en:
          - "The water is lukewarm. At the bottom of the lake, a golden glow, motionless: a Shard, fallen there a thousand years ago, still warming the water."
      - type: PARLER
        texte: "Rapporter l'eau à Liesse"
        texte-en: "Bring the water to Liesse"
        pnj: a5_liesse
        dialogue:
          - "a5_liesse: Un Éclat au fond du lac. Il a choisi de réchauffer l'eau plutôt que de garder sa lumière. Je l'aime bien, celui-là."
        dialogue-en:
          - "a5_liesse: A Shard at the bottom of the lake. It chose to warm the water rather than keep its light. I like that one."
    recompenses:
      xp: 18860
      or: 1885

  a5_n_le_dernier_gele:
    nom: "Le dernier gelé"
    nom-en: "The Last Frozen"
    niveau: 57
    requiert: [a5_n_le_lac_gele]
    donneur: a5_liesse
    resume:
      - "Un dernier gelé dort au fond d'une combe, au nord-est."
    resume-en:
      - "One last frozen one sleeps at the bottom of a combe, to the north-east."
    offre:
      - "a5_liesse: Un dernier gelé, au nord-est, dans une combe. Avec l'eau du lac, je peux le dégeler sans feu. Mais les Errants sentent la chaleur. Ils viendront. Tiens-les loin de lui."
    offre-en:
      - "a5_liesse: One last frozen one, to the north-east, in a combe. With the lake water, I can thaw him without fire. But the Wanderers sense warmth. They will come. Keep them away from him."
    etapes:
      - type: DEFENSE
        texte: "Protéger le dernier gelé pendant le dégel"
        texte-en: "Protect the last frozen during the thaw"
        point: a5_gele_4
        monstres: [a5_errant_ancien]
        nombre: 3
        vagues: 3
        pv: 180
        degats: 6
        cible: "Le Marqué gelé"
        cible-en: "The frozen Marked"
        apres:
          - "Le gelé ouvre les yeux. Il dit un seul mot, d'une voix qui n'est pas la sienne : « Libre. » Puis il dort, d'un sommeil ordinaire."
        apres-en:
          - "The frozen one opens his eyes. He says a single word, in a voice that is not his own: « Free. » Then he sleeps, an ordinary sleep."
      - type: PARLER
        texte: "Revenir voir Liesse"
        texte-en: "Return to Liesse"
        pnj: a5_liesse
        dialogue:
          - "a5_liesse: « Libre. » C'est tout ce qu'il avait gardé. Une seule page, avec un seul mot. Je crois que c'était la plus importante."
        dialogue-en:
          - "a5_liesse: « Free. » That is all he had kept. A single page, with a single word. I think it was the most important one."
    recompenses:
      xp: 21820
      or: 2180

  a5_n_les_lentilles:
    nom: "Les lentilles de l'observatoire"
    nom-en: "The Observatory Lenses"
    niveau: 49
    donneur: a5_ysarn
    resume:
      - "Des Errants ont emporté les lentilles de l'observatoire."
    resume-en:
      - "Wanderers have carried off the observatory's lenses."
    offre:
      - "a5_ysarn: Les Errants ont pillé notre réserve, cet hiver. Ils ont emporté les lentilles de la grande lunette dans leur bivouac, à l'est. Ils aiment ce qui brille. Moi aussi."
    offre-en:
      - "a5_ysarn: The Wanderers raided our store this winter. They took the great telescope's lenses to their bivouac, to the east. They like what shines. So do I."
    etapes:
      - type: TUER
        texte: "Disperser le bivouac de l'est"
        texte-en: "Scatter the eastern bivouac"
        monstres: [errant, loup_givre]
        nombre: 10
        point: a5_camp_j1
      - type: INTERAGIR
        texte: "Récupérer les lentilles"
        texte-en: "Recover the lenses"
        point: a5_camp_j1
        rayon: 6
        apres:
          - "Les lentilles sont là, posées en cercle autour d'un feu éteint, tournées vers le ciel. Les Errants s'en servaient pour regarder en haut."
        apres-en:
          - "The lenses are there, set in a circle around a dead fire, turned toward the sky. The Wanderers were using them to look up."
      - type: PARLER
        texte: "Rapporter les lentilles à Ysarn"
        texte-en: "Bring the lenses to Ysarn"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Ils regardaient le ciel avec. Même éteints, les Marqués cherchent l'Astre. Ça me serre le cœur."
        dialogue-en:
          - "a5_ysarn: They were looking at the sky with them. Even extinguished, the Marked look for the Star. It wrings my heart."
    recompenses:
      xp: 16120
      or: 1610

  a5_n_le_cercle_des_veilleurs:
    nom: "Le cercle des veilleurs"
    nom-en: "The Watchers' Circle"
    niveau: 52
    requiert: [a5_n_les_lentilles]
    donneur: a5_ysarn
    resume:
      - "Un cercle de pierres à l'ouest était le premier observatoire."
    resume-en:
      - "A stone circle to the west was the first observatory."
    offre:
      - "a5_ysarn: Avant Fort Blanc, il y avait un cercle de pierres, à l'ouest. Le premier observatoire des Hôtes. Va lire l'alignement des pierres et dis-moi ce qu'il montre."
    offre-en:
      - "a5_ysarn: Before Fort Blanc, there was a stone circle, to the west. The Hosts' first observatory. Go and read the alignment of the stones and tell me what it shows."
    etapes:
      - type: INTERAGIR
        texte: "Lire l'alignement des pierres"
        texte-en: "Read the alignment of the stones"
        point: a5_ruine_j2
        rayon: 7
        apres:
          - "Chaque pierre vise un point du ciel. Toutes ensemble, elles dessinent un chemin, du désert jusqu'aux cimes : la route que suivait l'Astre quand il descendait."
        apres-en:
          - "Each stone points at a spot in the sky. Together, they trace a path, from the desert to the peaks: the road the Star followed when it came down."
      - type: PARLER
        texte: "Revenir voir Ysarn"
        texte-en: "Return to Ysarn"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Il descendait au désert et remontait par ici. Fort Blanc était l'endroit d'où on lui disait au revoir."
        dialogue-en:
          - "a5_ysarn: It came down in the desert and went back up through here. Fort Blanc was the place where it was bid farewell."
    recompenses:
      xp: 18160
      or: 1815

  a5_n_le_ciel_d_avant:
    nom: "Le ciel d'avant"
    nom-en: "The Sky Before"
    niveau: 56
    requiert: [a5_n_le_cercle_des_veilleurs]
    donneur: a5_ysarn
    resume:
      - "Trois cairns anciens gardent des mesures du ciel d'avant la Chute."
    resume-en:
      - "Three ancient cairns hold readings of the sky before the Fall."
    offre:
      - "a5_ysarn: Les veilleurs laissaient leurs mesures sous des cairns, le long du col. Il en reste trois. Avec les trois, je pourrai redessiner le ciel d'avant la Chute."
    offre-en:
      - "a5_ysarn: The watchers left their readings under cairns, along the pass. Three remain. With all three, I can redraw the sky before the Fall."
    etapes:
      - type: ENQUETE
        texte: "Relever les mesures des trois cairns"
        texte-en: "Take the readings from the three cairns"
        pnj: a5_ysarn
        indices:
          - point: a5_cairn_1
            texte: "Le cairn de l'ouest"
            texte-en: "The western cairn"
            apres:
              - "Une plaque de cuivre : l'Astre, très haut, et une date. La dernière nuit d'avant la Chute."
            apres-en:
              - "A copper plate: the Star, very high, and a date. The last night before the Fall."
          - point: a5_cairn_2
            texte: "Le cairn du col"
            texte-en: "The pass cairn"
            apres:
              - "Une plaque : l'Astre, plus bas, entouré d'anneaux de lumière qui n'étaient pas là avant."
            apres-en:
              - "A plate: the Star, lower, surrounded by rings of light that were not there before."
          - point: a5_cairn_3
            texte: "Le cairn de l'est"
            texte-en: "The eastern cairn"
            apres:
              - "Une plaque, gravée à la hâte : mille points de lumière qui tombent. Et au centre, un vide en forme d'étoile."
            apres-en:
              - "A plate, hastily carved: a thousand points of light falling. And in the centre, a star-shaped void."
        dialogue:
          - "joueur: L'Astre haut, puis entouré d'anneaux, puis mille lumières qui tombent autour d'un vide."
          - "a5_ysarn: Les anneaux. Les chaînes. Ils ont vu les chaînes se refermer, d'ici. Et ils ont tout noté, sans rien pouvoir faire."
        dialogue-en:
          - "joueur: The Star high, then surrounded by rings, then a thousand lights falling around a void."
          - "a5_ysarn: The rings. The chains. They saw the chains close, from here. And they noted everything, without being able to do anything."
    recompenses:
      xp: 21060
      or: 2105

  a5_n_la_lentille_d_oswin:
    nom: "La lentille d'Oswin"
    nom-en: "Oswin's Lens"
    niveau: 59
    requiert: [a5_n_le_ciel_d_avant, a5_n_l_ermite_des_cimes]
    donneur: a5_ysarn
    resume:
      - "Ysarn veut prêter sa meilleure lentille à l'ermite."
    resume-en:
      - "Ysarn wants to lend his best lens to the hermit."
    offre:
      - "a5_ysarn: Oswin a vu passer le chevalier noir pendant quarante ans. Il regarde plus longtemps que moi. Porte-lui cette lentille : qu'il note ce qu'il voit dans la déchirure, les nuits claires."
    offre-en:
      - "a5_ysarn: Oswin has watched the black knight pass for forty years. He looks longer than I do. Take him this lens: let him note what he sees in the tear, on clear nights."
    etapes:
      - type: LIVRER
        texte: "Porter la lentille à Oswin"
        texte-en: "Take the lens to Oswin"
        pnj: a5_ermite
        materiau: GLASS_PANE
        objet: "Lentille de l'observatoire"
        objet-en: "Observatory lens"
        dialogue:
          - "a5_ermite: Une lentille d'Ysarn. Il me fait confiance, le vieux fou. Je regarderai. Je n'ai que ça à faire, de toute façon."
        dialogue-en:
          - "a5_ermite: A lens from Ysarn. He trusts me, the old fool. I will watch. It is all I have to do, anyway."
      - type: PARLER
        texte: "Revenir voir Ysarn"
        texte-en: "Return to Ysarn"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Deux vieux qui regardent le ciel, chacun sur sa montagne. Il y a des guerres moins utiles."
        dialogue-en:
          - "a5_ysarn: Two old men watching the sky, each on his own mountain. There are less useful wars."
    recompenses:
      xp: 23370
      or: 2335

