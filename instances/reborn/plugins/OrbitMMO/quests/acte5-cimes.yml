  a5_l_les_errants:
    nom: "Les Errants"
    nom-en: "The Wanderers"
    faction: lumiere
    niveau: 52
    requiert: [a5_l_le_premier_gele]
    donneur: a5_liesse
    resume:
      - "Des Errants rôdent autour du glacier."
    resume-en:
      - "Wanderers prowl around the glacier."
    offre:
      - "a5_liesse: Les Errants ont suivi Eira jusqu'au fort. Ce sont des gelés eux aussi, mais ils se sont réveillés seuls. Suis leurs traces. Je veux savoir ce qu'ils sont devenus."
    offre-en:
      - "a5_liesse: The Wanderers followed Eira to the fort. They are frozen ones too, but they woke alone. Follow their tracks. I want to know what they have become."
    etapes:
      - type: PISTER
        texte: "Suivre les traces des Errants"
        texte-en: "Follow the Wanderers' tracks"
        traces: [a5_errant_1, a5_errant_2, a5_errant_3, a5_errant_fin]
        apres:
          - "Les traces mènent à un creux sous un surplomb. Ils sont là, debout, tournés vers le ciel, à attendre."
        apres-en:
          - "The tracks lead to a hollow under an overhang. They are there, standing, turned toward the sky, waiting."
      - type: TUER
        texte: "Libérer les Errants de la Chute"
        texte-en: "Free the Wanderers of the Fall"
        monstres: [a5_errant_ancien]
        nombre: 6
        point: a5_errant_fin
      - type: INTERAGIR
        texte: "Examiner un Errant tombé"
        texte-en: "Examine a fallen Wanderer"
        point: a5_errant_fin
        rayon: 6
        apres:
          - "Sa Marque est éteinte. Pas pâle : éteinte. Autour de lui, la neige est plus froide qu'ailleurs, comme si quelque chose avait bu sa lumière."
        apres-en:
          - "His Mark is out. Not pale: out. Around him, the snow is colder than elsewhere, as if something had drunk his light."
      - type: PARLER
        texte: "Revenir voir Liesse"
        texte-en: "Return to Liesse"
        pnj: a5_liesse
        dialogue:
          - "a5_liesse: Éteinte. Ils ont dégelé trop vite, sans feu, sans personne. Leur lumière s'est échappée en route."
          - "a5_liesse: Et quelque chose l'a bue. Ce froid-là, je le connais. C'est celui qui descend du ciel déchiré."
        dialogue-en:
          - "a5_liesse: Out. They thawed too fast, without fire, without anyone. Their light escaped on the way."
          - "a5_liesse: And something drank it. That cold, I know it. It is the one that comes down from the torn sky."
    recompenses:
      xp: 21360
      or: 2135

