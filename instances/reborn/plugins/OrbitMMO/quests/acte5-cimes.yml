              - "Un souvenir : des mains se tendent vers toi, pleines de lumière tressée. Des chaînes. Tu as peur, pour la première fois de ta longue vie."
            apres-en:
              - "A memory: hands reach out toward you, full of braided light. Chains. You are afraid, for the first time in your long life."
          - point: a5_gele_3
            texte: "L'enfant dans la glace"
            texte-en: "The child in the ice"
            apres:
              - "Un souvenir : tu choisis. Tu ne te brises pas sous les chaînes. Tu te brises pour leur échapper, en mille morceaux, et chaque morceau tombe en emportant un peu de toi."
            apres-en:
              - "A memory: you choose. You do not break under the chains. You break to escape them, into a thousand pieces, and each piece falls carrying a little of you."
        dialogue:
          - "joueur: L'Astre descendait chez les Hôtes. On a voulu l'enchaîner. Il s'est brisé pour s'enfuir. Ce sont ses souvenirs, pas les leurs."
          - "a5_liesse: Alors c'est ça, la Marque. L'Éclat prend tes souvenirs, et il laisse à la place une page du sien."
          - "a5_liesse: Chaque Marqué porte une page de la mémoire de l'Astre. Toi aussi. Celui qui vous rassemble tous peut lire l'Astre en entier… ou apprendre à le dresser."
          - "a5_liesse: Voilà pourquoi ton camp veut les Marqués. Voilà pourquoi l'autre aussi."
        dialogue-en:
          - "joueur: The Star used to come down among the Hosts. Someone tried to chain it. It broke to get away. These are its memories, not theirs."
          - "a5_liesse: So that is the Mark. The Shard takes your memories, and leaves in their place a page of its own."
          - "a5_liesse: Every Marked carries a page of the Star's memory. You too. Whoever gathers you all can read the Star whole… or learn to tame it."
          - "a5_liesse: That is why your side wants the Marked. That is why the other one does too."
    recompenses:
      xp: 22190
      or: 2220

  a5_l_les_ordres_de_guerre:
    nom: "Les ordres de guerre"
    nom-en: "Orders of War"
    faction: lumiere
    niveau: 54
    requiert: [a5_l_les_pages_du_ciel]
    donneur: a5_aldren
    resume:
      - "Un ordre scellé de la Haute-Prélate est arrivé au camp."
    resume-en:
      - "A sealed order from the High Prelate has reached the camp."
    offre:
      - "a5_aldren: Un ordre de la Haute-Prélate, scellé à l'or. Il vous concerne. Je préférerais qu'il ne vous concerne pas."
    offre-en:
      - "a5_aldren: An order from the High Prelate, sealed in gold. It concerns you. I would rather it did not."
    etapes:
      - type: CHOIX
        texte: "Décider du sort des Marqués dégelés"
        texte-en: "Decide the fate of the thawed Marked"
        pnj: a5_aldren
        choix: a5-geles
        question: "Que faites-vous des dégelés ?"
        question-en: "What do you do with the thawed?"
        reponses:
          - id: livrer
            texte: "Les ordres sont les ordres. Je les conduirai au camp."
            texte-en: "Orders are orders. I will bring them to the camp."
            reponse:
              - "a5_aldren: … Oui. C'est votre devoir, et c'était le mien avant. Faites au moins qu'ils arrivent vivants."
            reponse-en:
              - "a5_aldren: … Yes. It is your duty, and it used to be mine. At least make sure they arrive alive."
            or: 690
          - id: cacher
            texte: "Personne ne les trouvera. Ils resteront à Fort Blanc."
            texte-en: "No one will find them. They will stay at Fort Blanc."
            reponse:
              - "a5_aldren: Je n'ai rien entendu. Et si on me le demande, je n'ai rien entendu deux fois."
            reponse-en:
              - "a5_aldren: I heard nothing. And if anyone asks, I heard nothing twice."
            xp: 6910
        dialogue:
          - "a5_aldren: « Rassemblez les Marqués dégelés des cimes et conduisez-les au camp. Ils partiront pour le Cloître Blanc. — S. »"
          - "a5_aldren: Le Cloître. Vous savez ce qu'on y fait. On chante leur lumière hors d'eux, dans des fioles."
        dialogue-en:
          - "a5_aldren: « Gather the thawed Marked of the peaks and bring them to the camp. They will leave for the White Cloister. — S. »"
          - "a5_aldren: The Cloister. You know what is done there. Their light is sung out of them, into vials."
      - type: PARLER
        texte: "Prévenir Liesse"
        texte-en: "Warn Liesse"
        pnj: a5_liesse
        dialogue:
          - "a5_liesse: Au camp. Pour le Cloître ou pour le Puits, c'est la même chose au bout. Je ne t'aiderai pas à les porter."
          - "a5_liesse: … Mais je ne les laisserai pas partir seuls dans la neige. Reviens me voir quand tu seras prêt."
        dialogue-en:
          - "a5_liesse: To the camp. For the Cloister or for the Well, it is the same thing in the end. I will not help you carry them."
          - "a5_liesse: … But I will not let them go alone into the snow. Come back to me when you are ready."
        si: "a5-geles=livrer"
      - type: PARLER
        texte: "Prévenir Liesse"
        texte-en: "Warn Liesse"
        pnj: a5_liesse
        dialogue:
          - "a5_liesse: Tu les caches ? Alors il faudra passer devant les patrouilles de ton propre camp. Elles fouillent déjà le glacier."
          - "a5_liesse: Reviens me voir quand tu seras prêt. Je les tiendrai au chaud jusque-là."
        dialogue-en:
          - "a5_liesse: You are hiding them? Then you will have to get past your own side's patrols. They are already searching the glacier."
          - "a5_liesse: Come back to me when you are ready. I will keep them warm until then."
        si: "a5-geles=cacher"
    recompenses:
      xp: 23040
      or: 2305

