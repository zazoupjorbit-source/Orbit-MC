quetes:

  # ================================================================ PRINCIPALES — LUMIÈRE (a5_l_*) ET OMBRE (a5_o_*)

  a5_l_la_guerre_des_deux_ciels:
    nom: "La guerre des deux ciels"
    nom-en: "The War of the Two Skies"
    faction: lumiere
    niveau: 48
    requiert: [a4_l_ce_que_le_sable_a_vu]
    donneur: a4_aldren
    resume:
      - "Le Pacte des Deux Ciels est brisé. La guerre commence dans les Cimes de Givre."
    resume-en:
      - "The Pact of the Two Skies is broken. The war begins in the Frost Peaks."
    offre:
      - "a4_aldren: Le Bastion a déclaré la guerre à la Citadelle. La Citadelle l'a déclarée le même jour : ils n'ont jamais su faire les choses l'un sans l'autre."
    offre-en:
      - "a4_aldren: The Bastion has declared war on the Citadel. The Citadel declared it the same day: they never could do anything without each other."
    etapes:
      - type: PARLER
        texte: "Écouter Aldren"
        texte-en: "Listen to Aldren"
        pnj: a4_aldren
        dialogue:
          - "a4_aldren: Votre rapport a fait le tour du Bastion. Hélis a marché sur le Tombeau : elle n'y a trouvé que du sable, les Astréens étaient partis avec l'Éclat. Alors le Bastion a accusé la Citadelle."
        dialogue-en:
          - "a4_aldren: Your report went round the Bastion. Hélis marched on the Tomb: she found only sand, the Astreans had left with the Shard. So the Bastion accused the Citadel."
        si: "a4-secret=reveler"
      - type: PARLER
        texte: "Écouter Aldren"
        texte-en: "Listen to Aldren"
        pnj: a4_aldren
        dialogue:
          - "a4_aldren: Le Bastion a cru votre rapport : l'Éclat a disparu, donc quelqu'un l'a volé. Pour la Haute-Prélate, ce quelqu'un ne peut être que Vharos."
        dialogue-en:
          - "a4_aldren: The Bastion believed your report: the Shard is gone, so someone stole it. For the High Prelate, that someone can only be Vharos."
        si: "!a4-secret=reveler"
      - type: ATTEINDRE
        texte: "Rejoindre Fort Blanc, dans les Cimes de Givre"
        texte-en: "Reach Fort Blanc, in the Frost Peaks"
        point: a5_ancre
        rayon: 25
        apres:
          - "Fort Blanc. Un ancien observatoire changé en forteresse, posé sur le col comme une lanterne. Le seul endroit des Cimes où l'on ne se bat pas."
          - "En bas, de part et d'autre du col, deux camps fument dans la neige : le soleil d'or à l'ouest, la nuit violette à l'est."
        apres-en:
          - "Fort Blanc. An old observatory turned fortress, set on the pass like a lantern. The only place in the Peaks where no one fights."
          - "Below, on either side of the pass, two camps smoke in the snow: the golden sun to the west, the violet night to the east."
      - type: PARLER
        texte: "Se présenter au Gardien de Fort Blanc"
        texte-en: "Introduce yourself to the Keeper of Fort Blanc"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Un Marqué. Bienvenue à Fort Blanc. Ici, on regardait le ciel. Maintenant, on regarde les deux armées qui s'installent en bas."
          - "a5_ysarn: Votre camp vous attend sûrement. Mais d'abord, les règles de la maison."
        dialogue-en:
          - "a5_ysarn: One of the Marked. Welcome to Fort Blanc. Here, we used to watch the sky. Now, we watch the two armies settling below."
          - "a5_ysarn: Your side is surely waiting for you. But first, the house rules."
    recompenses:
      xp: 18200
      or: 1820

  a5_o_la_guerre_des_deux_ciels:
    nom: "La guerre des deux ciels"
    nom-en: "The War of the Two Skies"
    faction: ombre
    niveau: 48
    requiert: [a4_o_ce_que_le_sable_a_vu]
    donneur: a4_vesper
    resume:
      - "Le Pacte des Deux Ciels est brisé. La guerre commence dans les Cimes de Givre."
    resume-en:
      - "The Pact of the Two Skies is broken. The war begins in the Frost Peaks."
    offre:
      - "a4_vesper: La Citadelle a déclaré la guerre à l'Aube. L'Aube a fait de même, le même jour. Même dans la haine, ils se tiennent la main."
    offre-en:
      - "a4_vesper: The Citadel has declared war on the Dawn. The Dawn did the same, the same day. Even in hatred, they hold hands."
    etapes:
      - type: PARLER
        texte: "Écouter Vesper"
        texte-en: "Listen to Vesper"
        pnj: a4_vesper
        dialogue:
          - "a4_vesper: Ton rapport est arrivé jusqu'à Vharos. Sarn a marché sur le Tombeau : du sable, rien d'autre. Les nomades étaient partis avec l'Éclat. Alors la Citadelle a accusé l'Aube."
        dialogue-en:
          - "a4_vesper: Your report reached Vharos. Sarn marched on the Tomb: sand, nothing else. The nomads had left with the Shard. So the Citadel accused the Dawn."
        si: "a4-secret=reveler"
      - type: PARLER
        texte: "Écouter Vesper"
        texte-en: "Listen to Vesper"
        pnj: a4_vesper
        dialogue:
          - "a4_vesper: Vharos a cru ton rapport : l'Éclat a disparu, donc on l'a volé. Pour lui, le voleur ne peut être que Séraphine."
        dialogue-en:
          - "a4_vesper: Vharos believed your report: the Shard is gone, so it was stolen. For him, the thief can only be Séraphine."
        si: "!a4-secret=reveler"
      - type: ATTEINDRE
        texte: "Rejoindre Fort Blanc, dans les Cimes de Givre"
        texte-en: "Reach Fort Blanc, in the Frost Peaks"
        point: a5_ancre
        rayon: 25
        apres:
          - "Fort Blanc. Un ancien observatoire changé en forteresse, posé sur le col comme une lanterne. Le seul endroit des Cimes où l'on ne se bat pas."
          - "En bas, de part et d'autre du col, deux camps fument dans la neige : le soleil d'or à l'ouest, la nuit violette à l'est."
        apres-en:
          - "Fort Blanc. An old observatory turned fortress, set on the pass like a lantern. The only place in the Peaks where no one fights."
          - "Below, on either side of the pass, two camps smoke in the snow: the golden sun to the west, the violet night to the east."
      - type: PARLER
        texte: "Se présenter au Gardien de Fort Blanc"
        texte-en: "Introduce yourself to the Keeper of Fort Blanc"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Un Marqué. Bienvenue à Fort Blanc. Ici, on regardait le ciel. Maintenant, on regarde les deux armées qui s'installent en bas."
          - "a5_ysarn: Votre camp vous attend sûrement. Mais d'abord, les règles de la maison."
        dialogue-en:
          - "a5_ysarn: One of the Marked. Welcome to Fort Blanc. Here, we used to watch the sky. Now, we watch the two armies settling below."
          - "a5_ysarn: Your side is surely waiting for you. But first, the house rules."
    recompenses:
      xp: 18200
      or: 1820

  a5_l_fort_blanc:
    nom: "Fort Blanc"
    faction: lumiere
    niveau: 49
    requiert: [a5_l_la_guerre_des_deux_ciels]
    donneur: a5_ysarn
    resume:
      - "Fort Blanc a ses règles, et Hild les fait respecter."
    resume-en:
      - "Fort Blanc has its rules, and Hild enforces them."
    offre:
      - "a5_ysarn: Touche notre Éclat d'ancrage : si tu tombes dans les cimes, tu reviendras ici. Puis va voir Hild, à la porte. Elle te dira ce qu'on attend des invités."
    offre-en:
      - "a5_ysarn: Touch our anchoring Shard: if you fall in the peaks, you will come back here. Then go and see Hild, at the gate. She will tell you what we expect of guests."
    etapes:
      - type: ANCRAGE
        texte: "Toucher l'Éclat d'ancrage de Fort Blanc"
        texte-en: "Touch Fort Blanc's anchoring Shard"
        point: a5_ancre
        rayon: 4
      - type: CHOIX
        texte: "Répondre à la sergente Hild"
        texte-en: "Answer Sergeant Hild"
        pnj: a5_hild
        choix: a5-banniere
        question: "Que faites-vous de votre bannière ?"
        question-en: "What do you do with your banner?"
        reponses:
          - id: deposer
            texte: "Je la dépose à la porte."
            texte-en: "I leave it at the gate."
            reponse:
              - "a5_hild: Bien. Elle t'attendra. Tu verras : on dort mieux sans."
            reponse-en:
              - "a5_hild: Good. It will wait for you. You will see: you sleep better without it."
            xp: 3790
          - id: garder
            texte: "Je la garde. Je suis en guerre."
            texte-en: "I keep it. I am at war."
            reponse:
              - "a5_hild: Comme tu veux. Mais si une flèche la trouve, ne viens pas pleurer sous nos murs."
            reponse-en:
              - "a5_hild: As you wish. But if an arrow finds it, do not come crying under our walls."
            or: 380
        dialogue:
          - "a5_hild: Une seule règle à Fort Blanc : pas de couleurs. Les deux armées sont en bas, à portée d'arc. Une bannière, ici, c'est une cible."
          - "a5_hild: Ceux qui veulent dorment chez nous en blanc. Les autres gardent leurs couleurs, et dorment dehors."
        dialogue-en:
          - "a5_hild: One rule at Fort Blanc: no colours. Both armies are below, within bowshot. A banner, here, is a target."
          - "a5_hild: Those who wish sleep with us in white. The others keep their colours, and sleep outside."
      - type: PARLER
        texte: "Revenir voir Ysarn"
        texte-en: "Return to Ysarn"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Il y a mille ans, les premiers veilleurs de Fort Blanc ont vu l'Astre se briser. Ils ont vu aussi des gens tomber du ciel, dans la neige, autour du col."
          - "a5_ysarn: Ils y sont toujours. Debout dans la glace. Liesse, notre guérisseuse, dit qu'ils respirent encore."
        dialogue-en:
          - "a5_ysarn: A thousand years ago, the first watchers of Fort Blanc saw the Star break. They also saw people fall from the sky, into the snow, around the pass."
          - "a5_ysarn: They are still there. Standing in the ice. Liesse, our healer, says they are still breathing."
    recompenses:
      xp: 18970
      or: 1895

  a5_o_fort_blanc:
    nom: "Fort Blanc"
    faction: ombre
    niveau: 49
    requiert: [a5_o_la_guerre_des_deux_ciels]
    donneur: a5_ysarn
    resume:
      - "Fort Blanc a ses règles, et Hild les fait respecter."
    resume-en:
      - "Fort Blanc has its rules, and Hild enforces them."
    offre:
      - "a5_ysarn: Touche notre Éclat d'ancrage : si tu tombes dans les cimes, tu reviendras ici. Puis va voir Hild, à la porte. Elle te dira ce qu'on attend des invités."
    offre-en:
      - "a5_ysarn: Touch our anchoring Shard: if you fall in the peaks, you will come back here. Then go and see Hild, at the gate. She will tell you what we expect of guests."
    etapes:
      - type: ANCRAGE
        texte: "Toucher l'Éclat d'ancrage de Fort Blanc"
        texte-en: "Touch Fort Blanc's anchoring Shard"
        point: a5_ancre
        rayon: 4
      - type: CHOIX
        texte: "Répondre à la sergente Hild"
        texte-en: "Answer Sergeant Hild"
        pnj: a5_hild
        choix: a5-banniere
        question: "Que faites-vous de votre bannière ?"
        question-en: "What do you do with your banner?"
        reponses:
          - id: deposer
            texte: "Je la dépose à la porte."
            texte-en: "I leave it at the gate."
            reponse:
              - "a5_hild: Bien. Elle t'attendra. Tu verras : on dort mieux sans."
            reponse-en:
              - "a5_hild: Good. It will wait for you. You will see: you sleep better without it."
            xp: 3790
          - id: garder
            texte: "Je la garde. Je suis en guerre."
            texte-en: "I keep it. I am at war."
            reponse:
              - "a5_hild: Comme tu veux. Mais si une flèche la trouve, ne viens pas pleurer sous nos murs."
            reponse-en:
              - "a5_hild: As you wish. But if an arrow finds it, do not come crying under our walls."
            or: 380
        dialogue:
          - "a5_hild: Une seule règle à Fort Blanc : pas de couleurs. Les deux armées sont en bas, à portée d'arc. Une bannière, ici, c'est une cible."
          - "a5_hild: Ceux qui veulent dorment chez nous en blanc. Les autres gardent leurs couleurs, et dorment dehors."
        dialogue-en:
          - "a5_hild: One rule at Fort Blanc: no colours. Both armies are below, within bowshot. A banner, here, is a target."
          - "a5_hild: Those who wish sleep with us in white. The others keep their colours, and sleep outside."
      - type: PARLER
        texte: "Revenir voir Ysarn"
        texte-en: "Return to Ysarn"
        pnj: a5_ysarn
        dialogue:
          - "a5_ysarn: Il y a mille ans, les premiers veilleurs de Fort Blanc ont vu l'Astre se briser. Ils ont vu aussi des gens tomber du ciel, dans la neige, autour du col."
          - "a5_ysarn: Ils y sont toujours. Debout dans la glace. Liesse, notre guérisseuse, dit qu'ils respirent encore."
        dialogue-en:
          - "a5_ysarn: A thousand years ago, the first watchers of Fort Blanc saw the Star break. They also saw people fall from the sky, into the snow, around the pass."
          - "a5_ysarn: They are still there. Standing in the ice. Liesse, our healer, says they are still breathing."
    recompenses:
      xp: 18970
      or: 1895

  a5_l_le_camp_du_soleil:
    nom: "Le camp du Soleil"
    nom-en: "The Sun Camp"
    faction: lumiere
    niveau: 50
    requiert: [a5_l_fort_blanc]
    donneur: a5_hild
    resume:
      - "Le camp de l'Aube s'est dressé à l'ouest du col."
    resume-en:
      - "The Dawn camp stands west of the pass."
    offre:
      - "a5_hild: Tes amis du soleil campent à l'ouest. Ceux de la nuit campent à l'est. Chaque matin, ils comptent leurs morts, et chaque soir, ils recommencent."
    offre-en:
      - "a5_hild: Your sun friends are camped to the west. The night ones to the east. Every morning they count their dead, and every evening they start again."
    etapes:
      - type: PARLER
        texte: "Rejoindre Aldren au camp du Soleil"
        texte-en: "Join Aldren at the Sun camp"
        pnj: a5_aldren
        dialogue:
          - "a5_aldren: Vous voilà. Hélis commande, moi, j'obéis. Le Bastion m'a pardonné ma lettre en me mettant en première ligne."
          - "a5_aldren: Ils attaquent la bannière chaque soir. Aidez-nous à la tenir. Après, on parlera."
        dialogue-en:
          - "a5_aldren: There you are. Hélis commands, I obey. The Bastion forgave my letter by putting me in the front line."
          - "a5_aldren: They attack the banner every evening. Help us hold it. Afterwards, we will talk."
      - type: DEFENSE
        texte: "Tenir la bannière du Soleil"
        texte-en: "Hold the Sun banner"
        point: a5_banniere_soleil
        monstres: [a5_lame_ombre]
        nombre: 3
        vagues: 4
        pv: 220
        degats: 6
        cible: "La bannière du Soleil"
        cible-en: "The Sun banner"
        apres:
          - "La dernière vague redescend vers le col. La bannière tient, criblée, debout."
        apres-en:
          - "The last wave goes back down toward the pass. The banner holds, riddled, upright."
      - type: PARLER
        texte: "Faire votre rapport à la capitaine Hélis"
        texte-en: "Report to Captain Hélis"
        pnj: a5_helis
        dialogue:
          - "a5_helis: Vous savez tenir une bannière. Bien. Restez près de Fort Blanc : ce qui dort dans la glace, là-haut, intéresse beaucoup le Bastion."
        dialogue-en:
          - "a5_helis: You know how to hold a banner. Good. Stay near Fort Blanc: what sleeps in the ice up there interests the Bastion greatly."
    recompenses:
      xp: 19750
      or: 1975

  a5_o_le_camp_de_la_nuit:
    nom: "Le camp de la Nuit"
    nom-en: "The Night Camp"
    faction: ombre
    niveau: 50
    requiert: [a5_o_fort_blanc]
    donneur: a5_hild
    resume:
      - "Le camp de la Citadelle s'est dressé à l'est du col."
    resume-en:
      - "The Citadel camp stands east of the pass."
    offre:
      - "a5_hild: Tes amis de la nuit campent à l'est. Ceux du soleil, à l'ouest. Chaque matin, ils comptent leurs morts, et chaque soir, ils recommencent."
    offre-en:
      - "a5_hild: Your night friends are camped to the east. The sun ones, to the west. Every morning they count their dead, and every evening they start again."
    etapes:
      - type: PARLER
        texte: "Rejoindre Vesper au camp de la Nuit"
        texte-en: "Join Vesper at the Night camp"
        pnj: a5_vesper
        dialogue:
          - "a5_vesper: Tu es venu. Sarn commande, moi, j'obéis. La Citadelle m'a pardonné ma lettre en me donnant le poste le plus froid."
          - "a5_vesper: Ils montent sur la bannière chaque soir. Aide-nous à la tenir. On parlera après."
        dialogue-en:
          - "a5_vesper: You came. Sarn commands, I obey. The Citadel forgave my letter by giving me the coldest post."
          - "a5_vesper: They come up at the banner every evening. Help us hold it. We will talk afterwards."
      - type: DEFENSE
        texte: "Tenir la bannière de la Nuit"
        texte-en: "Hold the Night banner"
        point: a5_banniere_nuit
        monstres: [a5_lame_aube]
        nombre: 3
        vagues: 4
        pv: 220
        degats: 6
        cible: "La bannière de la Nuit"
        cible-en: "The Night banner"
        apres:
          - "La dernière vague redescend vers le col. La bannière tient, criblée, debout."
        apres-en:
          - "The last wave goes back down toward the pass. The banner holds, riddled, upright."
      - type: PARLER
        texte: "Faire ton rapport à Sarn"
        texte-en: "Report to Sarn"
        pnj: a5_sarn
        dialogue:
          - "a5_sarn: Tu tiens debout dans le froid. Bien. Reste près de Fort Blanc : ce que la glace garde là-haut, Vharos le veut."
        dialogue-en:
          - "a5_sarn: You stay standing in the cold. Good. Stay near Fort Blanc: what the ice keeps up there, Vharos wants."
    recompenses:
      xp: 19750
      or: 1975

  a5_l_le_premier_gele:
    nom: "Le premier gelé"
    nom-en: "The First Frozen"
    faction: lumiere
    niveau: 51
    requiert: [a5_l_le_camp_du_soleil]
    donneur: a5_liesse
    resume:
      - "Liesse a trouvé quelqu'un debout dans la glace."
    resume-en:
      - "Liesse has found someone standing in the ice."
    offre:
      - "a5_liesse: Au glacier, au nord du fort, une femme debout dans la glace. Sa Marque brille encore. J'ai besoin de quelqu'un pour garder le feu pendant que je la réchauffe. Le froid se défend."
    offre-en:
      - "a5_liesse: At the glacier, north of the fort, a woman standing in the ice. Her Mark still shines. I need someone to keep the fire going while I warm her. The cold fights back."
    etapes:
      - type: INTERAGIR
        texte: "Examiner la femme dans la glace"
        texte-en: "Examine the woman in the ice"
        point: a5_glacier
        rayon: 6
        apres:
          - "Elle est debout, les yeux ouverts. Ses vêtements ont mille ans. Sous la glace, sur son cou, une Marque luit, faiblement, comme la tienne."
        apres-en:
          - "She is standing, eyes open. Her clothes are a thousand years old. Under the ice, on her neck, a Mark glows faintly, like yours."
      - type: SURVIE
        texte: "Garder le feu pendant le dégel"
        texte-en: "Keep the fire going during the thaw"
        point: a5_blizzard
        rayon: 14
        duree: 50
        mode: resserre
        rayon-fin: 5
        degats: 5
        monstres: [a5_errant_ancien]
        nombre: 2
        intervalle: 15
        apres:
          - "La glace craque. La femme tombe à genoux, respire, tousse. Liesse l'enroule dans une couverture et l'emmène vers le fort."
        apres-en:
          - "The ice cracks. The woman falls to her knees, breathes, coughs. Liesse wraps her in a blanket and leads her toward the fort."
      - type: PARLER
        texte: "Parler à la dégelée, à Fort Blanc"
        texte-en: "Talk to the thawed woman, at Fort Blanc"
        pnj: a5_eira
        dialogue:
          - "a5_eira: Liesse m'a appelée Eira. Je ne sais pas si c'était mon nom. Je ne sais rien de moi."
          - "a5_eira: Mais je me souviens d'avoir été très haut. De voir tout le continent d'un seul regard. Et d'avoir froid, d'un coup, partout."
          - "a5_eira: Ce n'est pas mon souvenir. Je le sais. Il est trop grand pour moi."
        dialogue-en:
          - "a5_eira: Liesse called me Eira. I do not know if it was my name. I know nothing of myself."
          - "a5_eira: But I remember being very high. Seeing the whole continent at a single glance. And being cold, suddenly, everywhere."
          - "a5_eira: It is not my memory. I know it. It is too big for me."
    recompenses:
      xp: 20550
      or: 2055

