# ------------------------------------------------------------------

pnj:
  a5_ysarn:
    nom: "Ysarn"
    titre: "Gardien de l'Observatoire"
    titre-en: "Keeper of the Observatory"
    couleur: "#CFE6FF"
    type: MANNEQUIN
    visage: efe
    point: a5_ysarn
    main: SPYGLASS
    repliques:
      - "Avant d'être un fort, c'était un observatoire. On y regardait le ciel. Maintenant, on regarde les armées."
    repliques-en:
      - "Before it was a fort, it was an observatory. We watched the sky. Now, we watch the armies."
  a5_hild:
    nom: "Hild"
    titre: "Sergente de la Garde blanche"
    titre-en: "Sergeant of the White Guard"
    couleur: "#E6EEF5"
    type: MANNEQUIN
    visage: alex
    point: a5_hild
    main: IRON_SWORD
    repliques:
      - "Ici, on ne porte pas de bannière. On porte du blanc. Ça se salit vite."
    repliques-en:
      - "Here, we wear no banner. We wear white. It gets dirty fast."
  a5_tobias:
    nom: "Tobias"
    titre: "Guide des cimes"
    titre-en: "Mountain guide"
    couleur: "#BFD3C1"
    type: MANNEQUIN
    visage: kai
    point: a5_tobias
    repliques:
      - "La montagne ne déteste personne. Elle ne pardonne à personne non plus."
    repliques-en:
      - "The mountain hates no one. It forgives no one either."
  a5_liesse:
    nom: "Liesse"
    titre: "Guérisseuse"
    titre-en: "Healer"
    couleur: "#F4C7D0"
    type: MANNEQUIN
    visage: makena
    point: a5_liesse
    repliques:
      - "Le froid garde tout. Les corps, les souvenirs. Il suffit de savoir réchauffer."
    repliques-en:
      - "The cold keeps everything. Bodies, memories. You only need to know how to warm them."
  a5_rask:
    nom: "Rask"
    titre: "Tableau des contrats"
    titre-en: "Contract board"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: sunny
    point: a5_rask
    main: PAPER
    repliques:
      - "La guerre fait du travail pour tout le monde. Le mien, c'est de le distribuer."
    repliques-en:
      - "War makes work for everyone. Mine is handing it out."
  a5_eira:
    nom: "Eira"
    titre: "Marquée de la Chute"
    titre-en: "Marked of the Fall"
    couleur: "#B9E3FF"
    type: MANNEQUIN
    visage: noor
    point: a5_eira
    repliques:
      - "J'ai dormi mille ans debout. Je ne me souviens que de ce qui n'est pas à moi."
    repliques-en:
      - "I slept a thousand years standing. I remember only what is not mine."
  a5_morvain:
    nom: "Morvain"
    titre: "Chevalier noir"
    titre-en: "Black Knight"
    couleur: "#9A8CB8"
    type: MANNEQUIN
    visage: zuri
    point: a5_morvain
    main: NETHERITE_SWORD
    repliques:
      - "Le Colosse ne dort pas. Il attend."
    repliques-en:
      - "The Colossus does not sleep. It waits."
  a5_aldren:
    nom: "Chevalier Aldren"
    nom-en: "Sir Aldren"
    titre: "Camp du Soleil"
    titre-en: "Sun Camp"
    couleur: "#F7E7A1"
    type: MANNEQUIN
    visage: steve
    point: a5_aldren
    main: GOLDEN_SWORD
    repliques:
      - "Une guerre, pour une pierre que personne n'a volée. Je le sais. Eux aussi, peut-être."
    repliques-en:
      - "A war, over a stone nobody stole. I know it. Perhaps they do too."
  a5_vesper:
    nom: "Dame Vesper"
    nom-en: "Lady Vesper"
    titre: "Camp de la Nuit"
    titre-en: "Night Camp"
    couleur: "#B48CFF"
    type: MANNEQUIN
    visage: noor
    point: a5_vesper
    main: NETHERITE_SWORD
    repliques:
      - "On m'a rendu mon épée, pas ma confiance. C'est déjà ça."
    repliques-en:
      - "They gave me back my sword, not their trust. That is something."
  a5_helis:
    nom: "Capitaine Hélis"
    nom-en: "Captain Hélis"
    titre: "Camp du Soleil"
    titre-en: "Sun Camp"
    couleur: "#FFD66E"
    type: MANNEQUIN
    visage: makena
    point: a5_helis
    main: GOLDEN_SWORD
    repliques:
      - "Le Bastion ne perd pas de guerre. Il en gagne lentement."
    repliques-en:
      - "The Bastion does not lose wars. It wins them slowly."
  a5_sarn:
    nom: "Sarn"
    titre: "Camp de la Nuit"
    titre-en: "Night Camp"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: efe
    point: a5_sarn
    main: NETHERITE_AXE
    repliques:
      - "Le froid, c'est le Néant qui nous salue."
    repliques-en:
      - "The cold is the Void greeting us."
  a5_ermite:
    nom: "Oswin"
    titre: "Ermite des cimes"
    titre-en: "Hermit of the peaks"
    couleur: "#C8C0B0"
    type: MANNEQUIN
    visage: steve
    point: a5_refuge
    repliques:
      - "Quarante ans que je vis ici. La neige est une bonne voisine : elle ne parle jamais."
    repliques-en:
      - "Forty years I have lived here. Snow is a good neighbour: it never talks."
  a5_deserteur:
    nom: "Bram"
    titre: "Déserteur"
    titre-en: "Deserter"
    couleur: "#9C9C9C"
    type: MANNEQUIN
    visage: kai
    point: a5_deserteur
    repliques:
      - "Je ne sais plus de quel camp j'étais. C'est peut-être pour ça que je suis parti."
    repliques-en:
      - "I no longer know which side I was on. Perhaps that is why I left."
  a5_pelerin:
    nom: "Ansel"
    titre: "Pèlerin de la Chute"
    titre-en: "Pilgrim of the Fall"
    couleur: "#D8D2C0"
    type: MANNEQUIN
    visage: ari
    point: a5_pel_depart
    repliques:
      - "Nous montons à la tour des Veilleurs, là où l'on a vu l'Astre tomber. Pas seuls, si possible."
    repliques-en:
      - "We are climbing to the Watchers' tower, where the Star was seen to fall. Not alone, if possible."
  a5_gele:
    nom: "Marqués dégelés"
    nom-en: "Thawed Marked"
    titre: "De la nuit de la Chute"
    titre-en: "From the night of the Fall"
    couleur: "#B9E3FF"
    type: MANNEQUIN
    visage: efe
    point: a5_convoi_depart
    repliques:
      - "Il fait froid. Il a toujours fait froid."
    repliques-en:
      - "It is cold. It has always been cold."

