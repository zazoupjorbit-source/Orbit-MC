# ------------------------------------------------------------------
#  Acte V — Les Cimes de Givre : « Ce que la neige a gardé » (niv. 48 à 60). Hub neutre : Fort Blanc.
#  Principales Lumière (a5_l_*) et Ombre (a5_o_*), annexes neutres (a5_n_*), contrats répétables du tableau (a5_c_*).
