  a5_l_le_couloir_des_avalanches:
    nom: "Le couloir des avalanches"
    nom-en: "The Avalanche Corridor"
    faction: lumiere
    niveau: 58
    requiert: [a5_l_l_avant_poste]
    donneur: a5_morvain
    resume:
      - "Le couloir des avalanches est le seul chemin vers l'Antre que personne ne garde."
    resume-en:
      - "The avalanche corridor is the only path to the Lair that nobody guards."
    offre:
      - "a5_morvain: Les Hôtes venaient voir le Colosse par le couloir des avalanches, à l'ouest de l'Antre. Seuls, sans armée. Il ne se réveille que pour ceux qui viennent comme eux."
      - "a5_morvain: Une fois engagé, ne vous arrêtez pas. La neige tombe toute seule, là-bas."
    offre-en:
      - "a5_morvain: The Hosts came to see the Colossus through the avalanche corridor, west of the Lair. Alone, without an army. It only wakes for those who come as they did."
      - "a5_morvain: Once you are in, do not stop. The snow falls by itself there."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre l'entrée du couloir des avalanches"
        texte-en: "Reach the entrance of the avalanche corridor"
        point: a5_couloir_depart
        rayon: 6
      - type: ATTEINDRE
        texte: "Traverser le couloir avant que la neige ne tombe"
        texte-en: "Cross the corridor before the snow falls"
        point: a5_couloir_fin
        rayon: 6
        apres:
          - "Derrière toi, un grondement sourd. Toute la pente se met en marche."
        apres-en:
          - "Behind you, a dull rumble. The whole slope starts to move."
        chrono: 75
        reprise: 1
        echec:
          - "La neige s'effondre devant toi et ferme le passage. Il faut repartir de l'entrée."
        echec-en:
          - "The snow collapses in front of you and closes the way. You must start again from the entrance."
      - type: SURVIE
        texte: "Survivre à l'avalanche"
        texte-en: "Survive the avalanche"
        point: a5_avalanche
        rayon: 12
        duree: 40
        mode: brule
        degats: 6
        apres:
          - "Le grondement s'éteint. Devant toi, la neige fume encore. Le chemin de l'Antre est libre."
        apres-en:
          - "The rumble dies away. Before you, the snow still smokes. The way to the Lair is clear."
      - type: PARLER
        texte: "Rejoindre Morvain devant l'Antre"
        texte-en: "Join Morvain before the Lair"
        pnj: a5_morvain
        dialogue:
          - "a5_morvain: Vous êtes passé. Comme eux. Le Colosse vous a entendu venir, j'en suis sûr."
        dialogue-en:
          - "a5_morvain: You got through. Like them. The Colossus heard you coming, I am sure of it."
    recompenses:
      xp: 26580
      or: 2660

