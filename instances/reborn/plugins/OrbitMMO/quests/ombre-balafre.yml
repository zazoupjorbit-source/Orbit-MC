# ------------------------------------------------------------------
#  Ombre, acte I — la Balafre et les Landes de Morneval (niv. 1 à 10)
#  Cratère des Murmures, Nidnoir, Gris-Hameau, Morneval. Quêtes principales 1 à 11 et annexes.
#  FICHIER GÉNÉRÉ par tools\quetes\gen-quetes.js depuis tools\quetes\zones\ombre-balafre.js : modifier la source, pas ce fichier.
# ------------------------------------------------------------------

pnj:
  nyra:
    nom: "Nyra"
    titre: "Murmureuse"
    titre-en: "Whisperer"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: zuri
    point: nyra
    repliques:
      - "Écoute. Le Néant ne crie jamais. Il murmure."
    repliques-en:
      - "Listen. The Void never screams. It whispers."
  ilian:
    nom: "Ilian"
    titre: "Marqué"
    titre-en: "Marked"
    couleur: "#C9B6E8"
    type: MANNEQUIN
    visage: ari
    point: ilian
    repliques:
      - "Il y a une voix dans ma tête. Elle connaît mon nom. Pas moi."
    repliques-en:
      - "There's a voice in my head. It knows my name. I don't."
  sorcha:
    nom: "Sorcha"
    titre: "Marquée"
    titre-en: "Marked"
    couleur: "#C9B6E8"
    type: MANNEQUIN
    visage: noor
    point: sorcha
    repliques:
      - "Le noir est doux, tu trouves pas ?"
    repliques-en:
      - "The dark is soft, don't you think?"
  vide:
    nom: "Marqué hagard"
    nom-en: "Dazed Marked"
    couleur: "#8C96A3"
    visage: efe
    point: vide_sans_corps
  grisolde:
    nom: "Grisolde"
    titre: "Cheffe de Nidnoir"
    titre-en: "Chief of Nidnoir"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: makena
    point: grisolde
    main: IRON_SWORD
    repliques:
      - "Les dogmes, je m'en fiche. Mes gens, eux, je les compte."
    repliques-en:
      - "I don't care about dogma. My people, I count."
  vharos:
    nom: "Vharos"
    titre: "Nécromancien"
    titre-en: "Necromancer"
    couleur: "#9B7BFF"
    type: MANNEQUIN
    visage: steve
    point: vharos
    repliques:
      - "Votre Marque n'éclaire pas. Elle aspire. Fascinant."
    repliques-en:
      - "Your Mark does not shine. It draws in. Fascinating."
  maugre:
    nom: "Maugre"
    titre: "Aubergiste"
    titre-en: "Innkeeper"
    couleur: "#E8C9A0"
    type: MANNEQUIN
    visage: sunny
    point: maugre
    repliques:
      - "Ici, la soupe est noire et la bière aussi. Mais elles sont chaudes."
    repliques-en:
      - "Here the soup is black and so is the beer. But they're hot."
  kesh:
    nom: "Kesh"
    titre: "Sentinelle de Nidnoir"
    titre-en: "Nidnoir Sentry"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: efe
    point: kesh
    main: BOW
    repliques:
      - "D'en haut, je vois tout. Même ce que je préférerais pas."
    repliques-en:
      - "From up here I see everything. Even what I'd rather not."
  morvain_mentor:
    nom: "Morvain"
    titre: "Chevalier noir"
    titre-en: "Black Knight"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: zuri
    point: morvain_gris
    main: NETHERITE_SWORD
    repliques:
      - "Les échecs m'ont appris une chose : on gagne avec les pièces qu'on vous laisse."
    repliques-en:
      - "Chess taught me one thing: you win with the pieces they leave you."
  orlane:
    nom: "Orlane"
    titre: "Passeuse de Gris-Hameau"
    titre-en: "Ferrywoman of Gris-Hameau"
    couleur: "#E8D7A0"
    type: MANNEQUIN
    visage: kai
    point: orlane
    repliques:
      - "Tout passe par Gris-Hameau. Les marchandises, les nouvelles, les morts."
    repliques-en:
      - "Everything goes through Gris-Hameau. Goods, news, the dead."
  brac:
    nom: "Vieux Brac"
    titre: "Fossoyeur"
    titre-en: "Gravedigger"
    couleur: "#B8B0A0"
    type: MANNEQUIN
    visage: alex
    point: brac
    repliques:
      - "Je creuse les tombes. Ces temps-ci, je les rebouche surtout."
    repliques-en:
      - "I dig graves. These days I mostly fill them back in."
  jaro:
    nom: "Jaro"
    titre: "Glaneur"
    titre-en: "Gleaner"
    couleur: "#A8E6A1"
    type: MANNEQUIN
    visage: ari
    point: jaro
    main: IRON_PICKAXE
    repliques:
      - "Le murmure est revenu. Doucement. Comme quelqu'un qui frappe à la porte."
    repliques-en:
      - "The whisper came back. Softly. Like someone knocking at the door."
  castel:
    nom: "Frère Castel"
    nom-en: "Brother Castel"
    titre: "Frère-Purificateur"
    titre-en: "Brother-Purifier"
    couleur: "#FFD66E"
    visage: steve
    point: castel_sans_corps
  sevrine:
    nom: "Archonte Sévrine"
    nom-en: "Archon Sévrine"
    titre: "Citadelle d'Obsidienne"
    titre-en: "Obsidian Citadel"
    couleur: "#B36BFF"
    type: MANNEQUIN
    visage: noor
    point: sevrine
    repliques:
      - "Le Néant n'est pas vide. Il est patient."
    repliques-en:
      - "The Void is not empty. It is patient."
  velia:
    nom: "Crieuse Velia"
    nom-en: "Crier Velia"
    titre: "Crieuse de Morneval"
    titre-en: "Crier of Morneval"
    couleur: "#E8C9A0"
    type: MANNEQUIN
    visage: makena
    point: velia
    repliques:
      - "Morneval ne dort jamais, elle attend la nuit !"
    repliques-en:
      - "Morneval never sleeps, it waits for the night!"
  dorn:
    nom: "Sergent Dorn"
    nom-en: "Sergeant Dorn"
    titre: "Garde de Morneval"
    titre-en: "Morneval Guard"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: alex
    point: dorn
    main: IRON_SWORD
    repliques:
      - "Les murs sont noirs. Les routes, elles, sont rouges."
    repliques-en:
      - "The walls are black. The roads are red."
  ilse:
    nom: "Ilse"
    titre: "Disciple de Vharos"
    titre-en: "Disciple of Vharos"
    couleur: "#9B7BFF"
    type: MANNEQUIN
    visage: kai
    point: ilse
    repliques:
      - "Mon maître dit que les morts mentent moins que les vivants."
    repliques-en:
      - "My master says the dead lie less than the living."

