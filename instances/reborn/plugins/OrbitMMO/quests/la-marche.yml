      - type: PARLER
        texte: "Revenir voir Calixte"
        texte-en: "Return to Calixte"
        pnj: calixte
        dialogue:
          - "calixte: Merci. Il était aubergiste, lui aussi. Il disait : on sert tout le monde, et on ne choisit personne."
        dialogue-en:
          - "calixte: Thank you. He was an innkeeper too. He used to say: you serve everyone, and you choose no one."
    recompenses:
      xp: 5300
      or: 530

