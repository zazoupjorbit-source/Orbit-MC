        apres-en:
          - "An observatory. A thousand years old at least. On the wall, the sky before the Fall: a single star, and around it, carved, the word « free »."
      - type: PARLER
        texte: "Raconter à Nell"
        texte-en: "Tell Nell"
        pnj: nell
        dialogue:
          - "nell: Un observatoire d'avant la Chute. Ni de l'Aube ni de l'Ombre. Avant eux, quelqu'un regardait le ciel sans vouloir le posséder."
        dialogue-en:
          - "nell: An observatory from before the Fall. Neither Dawn nor Shadow. Before them, someone watched the sky without wanting to own it."
    recompenses:
      xp: 5600
      or: 560

  n_le_cimetiere_de_l_est:
    nom: "Le cimetière de l'est"
    nom-en: "The Eastern Graveyard"
    niveau: 30
    donneur: calixte
    resume:
