# ------------------------------------------------------------------
#  La Marche (niv. 26 à 34) — zone disputée, hub neutre : les Quatre-Vents
#  Fin de l'acte III des deux factions (l_* et o_*) et annexes neutres (n_*), ouvertes à tous.
#  FICHIER GÉNÉRÉ par tools\quetes\gen-quetes.js depuis tools\quetes\zones\la-marche.js : modifier la source, pas ce fichier.
# ------------------------------------------------------------------

pnj:
  aldren:
    nom: "Chevalier Aldren"
    nom-en: "Sir Aldren"
    titre: "Envoyé de l'Aube"
    titre-en: "Envoy of the Dawn"
    couleur: "#F7E7A1"
    type: MANNEQUIN
    visage: steve
    point: aldren
    main: GOLDEN_SWORD
    repliques:
      - "Ici, je n'ai pas le droit de tirer l'épée. C'est reposant, presque."
    repliques-en:
      - "Here, I'm not allowed to draw my sword. It's restful, almost."
  vesper:
    nom: "Dame Vesper"
    nom-en: "Lady Vesper"
    titre: "Envoyée de la Citadelle"
    titre-en: "Envoy of the Citadel"
    couleur: "#B48CFF"
    type: MANNEQUIN
    visage: noor
    point: vesper
    main: NETHERITE_SWORD
    repliques:
      - "Les Quatre-Vents sont neutres. Moi, je ne le suis pas. Je suis polie."
    repliques-en:
      - "The Four Winds are neutral. I'm not. I'm polite."
  calixte:
    nom: "Calixte"
    titre: "Aubergiste des Quatre-Vents"
    titre-en: "Innkeeper of the Four Winds"
    couleur: "#C8A27A"
    type: MANNEQUIN
    visage: makena
    point: calixte
    repliques:
      - "Une seule règle sous mon toit : on boit, on ne se tue pas."
    repliques-en:
      - "One rule under my roof: you drink, you don't kill each other."
  nell:
    nom: "Nell"
    titre: "Cartographe"
    titre-en: "Cartographer"
    couleur: "#A8E6A1"
    type: MANNEQUIN
    visage: ari
    point: nell
    main: MAP
    repliques:
      - "La Marche change chaque nuit. Mes cartes aussi."
    repliques-en:
      - "The March changes every night. So do my maps."

monstres:
  sentinelle_eclat:
    nom: "Sentinelle d'Éclat"
    type: WITHER_SKELETON
    taille: 1.15
    pv: 1.4
    degats: 1.2
    vitesse: 0.95
    arme: AMETHYST_SHARD
  gardien_eclat_coeur:
    nom: "Gardien de l'Éclat-Cœur"
    type: WITHER_SKELETON
    taille: 2.2
    pv: 12
    degats: 1.45
    vitesse: 0.9
    xp: 15
    or: 12
    arme: DIAMOND_SWORD

apparitions:
  sentinelles_marche:
    point: marche_seuil
    monstre: sentinelle_eclat
    niveau: [29, 31]
    nombre: 5
    rayon: 10
  gardien_coeur:
    point: marche_seuil
    monstre: gardien_eclat_coeur
    niveau: 32
    nombre: 1
    rayon: 5

quetes:

  # ================================================================ LUMIÈRE — LA MARCHE

  l_les_quatre_vents:
    nom: "Les Quatre-Vents"
    nom-en: "The Four Winds"
    faction: lumiere
    niveau: 26
    requiert: [l_vers_les_quatre_vents]
    resume:
      - "L'envoyé de l'Aube aux Quatre-Vents"
      - "vous attend."
    resume-en:
      - "The Dawn's envoy at the Four Winds"
      - "is waiting for you."
    etapes:
      - type: PARLER
        texte: "Parler au Chevalier Aldren"
        texte-en: "Talk to Sir Aldren"
        pnj: aldren
        dialogue:
          - "aldren: Le Marqué du Guet. La Haute-Prélate m'a parlé de vous. En bien, figurez-vous."
          - "aldren: L'Éclat immense est tombé dans les Ruines de la Marche, au nord-est. Mes ordres : le rapporter au Bastion. Les vôtres aussi, j'imagine."
          - "aldren: L'Ombre a les mêmes ordres. Leur envoyée boit en face. Dame Vesper. Ne la provoquez pas ici : la ville vous chasserait tous les deux."
        dialogue-en:
          - "aldren: The Marked from the Watch. The High Prelate spoke to me about you. Well, believe it or not."
          - "aldren: The immense Shard fell in the Ruins of the March, to the north-east. My orders: bring it back to the Bastion. Yours too, I imagine."
          - "aldren: The Shadow has the same orders. Their envoy drinks across the street. Lady Vesper. Don't provoke her here: the city would throw you both out."
      - type: ANCRAGE
        texte: "Toucher l'Éclat d'ancrage des Quatre-Vents"
        texte-en: "Touch the Four Winds' anchoring Shard"
        point: ancre_quatre_vents
        rayon: 4
    recompenses:
      xp: 5500
      or: 550

  l_les_lames_a_louer:
    nom: "Les lames à louer"
    nom-en: "Blades for Hire"
    faction: lumiere
    niveau: 27
    requiert: [l_les_quatre_vents]
    donneur: aldren
    resume:
      - "Des mercenaires bloquent la route"
      - "des Ruines de la Marche."
    resume-en:
      - "Mercenaries are blocking the road"
      - "to the Ruins of the March."
    offre:
      - "aldren: Des mercenaires campent au nord, sur la route des Ruines. Ils laissent passer qui paie. Je n'ai pas l'intention de payer."
    offre-en:
      - "aldren: Mercenaries are camped to the north, on the road to the Ruins. They let through whoever pays. I have no intention of paying."
    etapes:
      - type: TUER
        texte: "Briser le camp des mercenaires"
        texte-en: "Break the mercenaries' camp"
        monstres: [bandit, braconnier]
        nombre: 12
        point: camp_lames_aube
      - type: INTERAGIR
        texte: "Fouiller le coffre du capitaine"
        texte-en: "Search the captain's chest"
        point: camp_lames_aube
        rayon: 6
        apres:
          - "Deux contrats. L'un au sceau du Bastion, l'autre au sceau de la Citadelle. Le même ordre, mot pour mot : « Tenir la route. Laisser passer nos hommes, et personne d'autre. »"
        apres-en:
          - "Two contracts. One with the Bastion's seal, the other with the Citadel's. The same order, word for word: « Hold the road. Let our men through, and no one else. »"
      - type: PARLER
        texte: "Montrer les contrats à Aldren"
        texte-en: "Show the contracts to Aldren"
        pnj: aldren
        dialogue:
          - "aldren: Les deux camps ont payé les mêmes lames. Pour garder la même route."
          - "aldren: Je commence à croire que nos chefs se parlent plus qu'ils ne nous le disent."
        dialogue-en:
          - "aldren: Both sides paid the same blades. To hold the same road."
          - "aldren: I'm beginning to think our leaders talk to each other more than they tell us."
    recompenses:
      xp: 5900
      or: 590

  l_la_ruine_de_l_eclat:
    nom: "La ruine de l'Éclat"
    nom-en: "The Ruin of the Shard"
    faction: lumiere
    niveau: 28
    requiert: [l_les_lames_a_louer]
    donneur: aldren
    resume:
      - "Une ruine domine les Ruines de la Marche."
      - "De là-haut, on voit l'Éclat immense."
    resume-en:
      - "A ruin overlooks the Ruins of the March."
      - "From up there, you can see the immense Shard."
    offre:
      - "aldren: Avant d'y aller, il faut voir. Une vieille ruine domine les Ruines de la Marche, au nord-est. Les morts y montent la garde."
    offre-en:
      - "aldren: Before going there, we need to see. An old ruin overlooks the Ruins of the March, to the north-east. The dead stand guard there."
    etapes:
      - type: TUER
        texte: "Abattre les morts de la ruine"
        texte-en: "Destroy the dead of the ruin"
        monstres: [squelette, revenant]
        nombre: 10
        point: ruine_eclat
      - type: INTERAGIR
        texte: "Regarder vers les Ruines de la Marche"
        texte-en: "Look toward the Ruins of the March"
        point: ruine_eclat
        rayon: 6
        apres:
          - "En contrebas, au milieu des Ruines, l'Éclat-Cœur. Haut comme une tour. Sa lumière bat, dorée d'un côté, violette de l'autre."
          - "morvain: Vous voyez ? Il n'est ni à vous, ni à nous."
          - "Morvain est là, assis sur une pierre, comme s'il t'attendait depuis la nuit des étoiles."
          - "morvain: Un Marqué de l'Ombre est passé hier. Il a vu la même chose que vous. Il a eu la même tête."
        apres-en:
          - "Below, in the middle of the Ruins, the Heart-Shard. As tall as a tower. Its light pulses, golden on one side, violet on the other."
          - "morvain: You see? It belongs neither to you nor to us."
          - "Morvain is there, sitting on a stone, as if he had been waiting for you since the night of the stars."
          - "morvain: A Marked of the Shadow came by yesterday. He saw the same thing as you. He made the same face."
      - type: PARLER
        texte: "Revenir voir Aldren"
        texte-en: "Return to Aldren"
        pnj: aldren
        dialogue:
          - "aldren: Morvain ? Le Chevalier noir ? Il ne vous a pas tué ?"
          - "aldren: … Il y a beaucoup de choses qu'on ne m'a pas dites, je crois."
        dialogue-en:
          - "aldren: Morvain? The Black Knight? He didn't kill you?"
          - "aldren: … There are many things I haven't been told, I think."
    recompenses:
      xp: 6300
      or: 630

  l_le_gardien_de_l_eclat_coeur:
    nom: "Le Gardien de l'Éclat-Cœur"
    nom-en: "The Guardian of the Heart-Shard"
    faction: lumiere
    niveau: 30
    requiert: [l_la_ruine_de_l_eclat]
    donneur: aldren
    resume:
      - "Le Gardien de l'Éclat-Cœur s'est levé"
      - "devant les Ruines de la Marche."
    resume-en:
      - "The Guardian of the Heart-Shard has risen"
      - "before the Ruins of the March."
    offre:
      - "aldren: Un gardien de cristal s'est levé devant les Ruines. Ni l'Aube ni l'Ombre n'ont pu passer."
      - "aldren: Abattez-le. Et cette fois, ne laissez personne d'autre toucher l'Éclat avant vous."
    offre-en:
      - "aldren: A crystal guardian has risen before the Ruins. Neither the Dawn nor the Shadow have got past."
      - "aldren: Bring it down. And this time, let no one else touch the Shard before you."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre les Ruines de la Marche"
        texte-en: "Reach the Ruins of the March"
        point: marche_seuil
        rayon: 10
      - type: TUER
        texte: "Abattre les Sentinelles d'Éclat"
        texte-en: "Destroy the Shard Sentinels"
        monstres: [sentinelle_eclat]
        nombre: 8
        point: marche_seuil
      - type: TUER
        texte: "Vaincre le Gardien de l'Éclat-Cœur"
        texte-en: "Defeat the Guardian of the Heart-Shard"
        monstres: [gardien_eclat_coeur]
        point: marche_seuil
      - type: INTERAGIR
        texte: "Poser la main sur l'Éclat-Cœur"
        texte-en: "Lay your hand on the Heart-Shard"
        point: marche_portail
        rayon: 5
        apres:
          - "Deux voix, en même temps. L'une brûlante : « Laissez-moi partir. » L'autre glacée : « Rendez-moi. »"
          - "Ce ne sont pas deux voix. C'est la même, coupée en deux. La lumière de l'Astre dans les fioles. Son ombre dans le Néant."
          - "L'Astre ne veut pas être rallumé. Il ne veut pas être gardé. Il veut être rassemblé, et libre."
        apres-en:
          - "Two voices, at the same time. One burning: « Let me go. » The other freezing: « Give me back. »"
          - "They are not two voices. It is the same one, cut in two. The Star's light in the vials. Its shadow in the Void."
          - "The Star does not want to be rekindled. It does not want to be kept. It wants to be made whole, and free."
      - type: PARLER
        texte: "Revenir voir Aldren"
        texte-en: "Return to Aldren"
        pnj: aldren
        dialogue:
          - "aldren: Libre ? Si l'Astre est libre, il peut repartir. Nous laisser."
          - "aldren: C'est peut-être ce que la Haute-Prélate craint le plus."
        dialogue-en:
          - "aldren: Free? If the Star is free, it can leave again. Leave us."
          - "aldren: Maybe that's what the High Prelate fears most."
    recompenses:
      xp: 7200
      or: 720
      objets:
        - materiau: AMETHYST_SHARD
          nom: "Fragment de l'Éclat-Cœur"
          nom-en: "Fragment of the Heart-Shard"
          description:
            - "Doré d'un côté, violet de l'autre. Il murmure deux choses à la fois."
          description-en:
            - "Golden on one side, violet on the other. It whispers two things at once."

  l_le_pacte_des_deux_ciels:
    nom: "Le Pacte des Deux Ciels"
    nom-en: "The Pact of the Two Skies"
    faction: lumiere
    niveau: 31
    requiert: [l_le_gardien_de_l_eclat_coeur]
    donneur: aldren
    resume:
      - "Aldren a reçu un message du Bastion."
    resume-en:
      - "Aldren has received a message from the Bastion."
    offre:
      - "aldren: Un message du Bastion. Scellé par la Haute-Prélate en personne. Venez l'entendre."
    offre-en:
      - "aldren: A message from the Bastion. Sealed by the High Prelate herself. Come and hear it."
    etapes:
      - type: INTERAGIR
        texte: "Écouter le message avec Aldren et Vesper"
        texte-en: "Hear the message with Aldren and Vesper"
        point: ancre_quatre_vents
        rayon: 6
        apres:
          - "aldren: « Ramenez l'Éclat-Cœur et le Marqué qui l'a touché. Le Marqué ira au Cloître. Le Pacte l'exige. — S. »"
          - "vesper: Le mien dit la même chose. Signé V. Sauf que chez nous, ça s'appelle la Citadelle."
          - "aldren: Alors c'est vrai. Le Pacte des Deux Ciels. Nos chefs se partagent les Marqués."
          - "vesper: Et ils veulent l'Éclat-Cœur pour la même raison : celui qui l'a tient l'Astre en laisse."
          - "Aldren range son message. Vesper aussi. Ils ne te regardent pas comme des soldats. Ils te regardent comme des gens qui attendent une réponse."
          - "morvain: Le Puits et la Crypte ont dit la même chose, chacun sa moitié. À vous de décider ce que vous rapportez. À suivre."
        apres-en:
          - "aldren: « Bring back the Heart-Shard and the Marked who touched it. The Marked will go to the Cloister. The Pact demands it. — S. »"
          - "vesper: Mine says the same thing. Signed V. Except where I come from, it's called the Citadel."
          - "aldren: So it's true. The Pact of the Two Skies. Our leaders share the Marked between them."
          - "vesper: And they want the Heart-Shard for the same reason: whoever holds it holds the Star on a leash."
          - "Aldren puts his message away. So does Vesper. They don't look at you like soldiers. They look at you like people waiting for an answer."
          - "morvain: The Well and the Crypt said the same thing, each its own half. It's up to you to decide what you bring back. To be continued."
    recompenses:
      xp: 7600
      or: 760

  # ================================================================ OMBRE — LA MARCHE

  o_les_quatre_vents:
    nom: "Les Quatre-Vents"
    nom-en: "The Four Winds"
    faction: ombre
    niveau: 26
    requiert: [o_vers_les_quatre_vents]
    resume:
      - "L'envoyée de la Citadelle aux Quatre-Vents"
      - "vous attend."
    resume-en:
      - "The Citadel's envoy at the Four Winds"
      - "is waiting for you."
    etapes:
      - type: PARLER
        texte: "Parler à Dame Vesper"
        texte-en: "Talk to Lady Vesper"
        pnj: vesper
        dialogue:
          - "vesper: Le Marqué du Puits. Morvain parle de vous comme d'un fils. Ça m'inquiète un peu."
          - "vesper: L'Éclat immense est dans les Ruines de la Marche, au nord-est. L'Archonte Sévrine le veut à la Citadelle. Vharos aussi, et ce n'est pas tout à fait pareil."
          - "vesper: L'Aube a envoyé un chevalier, Aldren. Il boit en face. Ici, on ne tire pas l'épée. Dehors, c'est autre chose."
        dialogue-en:
          - "vesper: The Marked of the Well. Morvain speaks of you like a son. That worries me a little."
          - "vesper: The immense Shard is in the Ruins of the March, to the north-east. Archon Sévrine wants it at the Citadel. So does Vharos, and that's not quite the same thing."
          - "vesper: The Dawn sent a knight, Aldren. He drinks across the street. Here, we don't draw swords. Outside is another matter."
      - type: ANCRAGE
        texte: "Toucher l'Éclat d'ancrage des Quatre-Vents"
        texte-en: "Touch the Four Winds' anchoring Shard"
        point: ancre_quatre_vents
        rayon: 4
    recompenses:
      xp: 5500
      or: 550

  o_les_lames_a_louer:
    nom: "Les lames à louer"
    nom-en: "Blades for Hire"
    faction: ombre
    niveau: 27
    requiert: [o_les_quatre_vents]
    donneur: vesper
    resume:
      - "Des mercenaires tiennent la route du nord."
    resume-en:
      - "Mercenaries hold the northern road."
    offre:
      - "vesper: Au nord, loin, des mercenaires tiennent la vieille route. Ils ont refusé mon or. Ça veut dire que quelqu'un a payé plus."
    offre-en:
      - "vesper: To the north, far away, mercenaries hold the old road. They refused my gold. That means someone paid more."
    etapes:
      - type: TUER
        texte: "Briser le camp des mercenaires"
        texte-en: "Break the mercenaries' camp"
        monstres: [bandit, braconnier]
        nombre: 12
        point: camp_lames_ombre
      - type: INTERAGIR
        texte: "Fouiller le coffre du capitaine"
        texte-en: "Search the captain's chest"
        point: camp_lames_ombre
        rayon: 6
        apres:
          - "Deux contrats. L'un au sceau de la Citadelle, l'autre au soleil du Bastion. Le même ordre : « Tenir la route. Laisser passer nos hommes, et personne d'autre. »"
        apres-en:
          - "Two contracts. One with the Citadel's seal, the other with the Bastion's sun. The same order: « Hold the road. Let our men through, and no one else. »"
      - type: PARLER
        texte: "Montrer les contrats à Vesper"
        texte-en: "Show the contracts to Vesper"
        pnj: vesper
        dialogue:
          - "vesper: Signé V. pour nous. Et S. pour eux. Ils ont loué les mêmes épées."
          - "vesper: Kael avait raison, dans son marais. Nous sommes la monnaie."
        dialogue-en:
          - "vesper: Signed V. for us. And S. for them. They hired the same swords."
          - "vesper: Kael was right, in his marsh. We are the coin."
    recompenses:
      xp: 5900
      or: 590

  o_la_ruine_de_l_eclat:
    nom: "La ruine de l'Éclat"
    nom-en: "The Ruin of the Shard"
    faction: ombre
    niveau: 28
    requiert: [o_les_lames_a_louer]
    donneur: vesper
    resume:
      - "Une ruine domine les Ruines de la Marche."
      - "De là-haut, on voit l'Éclat immense."
    resume-en:
      - "A ruin overlooks the Ruins of the March."
      - "From up there, you can see the immense Shard."
    offre:
      - "vesper: Une vieille ruine domine les Ruines de la Marche. Morvain t'y attend. Il dit que tu dois voir l'Éclat avant de le toucher."
    offre-en:
      - "vesper: An old ruin overlooks the Ruins of the March. Morvain is waiting for you there. He says you must see the Shard before you touch it."
    etapes:
      - type: TUER
        texte: "Abattre les morts de la ruine"
        texte-en: "Destroy the dead of the ruin"
        monstres: [squelette, revenant]
        nombre: 10
        point: ruine_eclat
      - type: INTERAGIR
        texte: "Regarder vers les Ruines de la Marche"
        texte-en: "Look toward the Ruins of the March"
        point: ruine_eclat
        rayon: 6
        apres:
          - "En contrebas, l'Éclat-Cœur. Haut comme une tour. Sa lumière bat, violette d'un côté, dorée de l'autre."
          - "morvain_mentor: Le murmure du Puits, la lumière de leurs fioles. Les deux viennent de là."
          - "morvain_mentor: Le Marqué de l'Aube est passé hier. Il a vu la même chose. Il a fait la même tête que vous."
        apres-en:
          - "Below, the Heart-Shard. As tall as a tower. Its light pulses, violet on one side, golden on the other."
          - "morvain_mentor: The whisper of the Well, the light of their vials. Both come from there."
          - "morvain_mentor: The Marked of the Dawn came by yesterday. He saw the same thing. He made the same face as you."
      - type: PARLER
        texte: "Revenir voir Vesper"
        texte-en: "Return to Vesper"
        pnj: vesper
        dialogue:
          - "vesper: Morvain parle encore du Marqué de l'Aube comme d'un ami. Un jour, il faudra qu'on ait une conversation, lui et moi."
        dialogue-en:
          - "vesper: Morvain still talks about the Marked of the Dawn like a friend. One day, he and I will have to have a conversation."
    recompenses:
      xp: 6300
      or: 630

  o_le_gardien_de_l_eclat_coeur:
    nom: "Le Gardien de l'Éclat-Cœur"
    nom-en: "The Guardian of the Heart-Shard"
    faction: ombre
    niveau: 30
    requiert: [o_la_ruine_de_l_eclat]
    donneur: vesper
    resume:
      - "Le Gardien de l'Éclat-Cœur s'est levé"
      - "devant les Ruines de la Marche."
    resume-en:
      - "The Guardian of the Heart-Shard has risen"
      - "before the Ruins of the March."
    offre:
      - "vesper: Un gardien de cristal garde les Ruines. Il a déjà tué six des nôtres. Et quatre des leurs, ce qui me console un peu."
    offre-en:
      - "vesper: A crystal guardian guards the Ruins. It has already killed six of ours. And four of theirs, which consoles me a little."
    etapes:
      - type: ATTEINDRE
        texte: "Atteindre les Ruines de la Marche"
        texte-en: "Reach the Ruins of the March"
        point: marche_seuil
        rayon: 10
      - type: TUER
        texte: "Abattre les Sentinelles d'Éclat"
        texte-en: "Destroy the Shard Sentinels"
        monstres: [sentinelle_eclat]
        nombre: 8
        point: marche_seuil
      - type: TUER
        texte: "Vaincre le Gardien de l'Éclat-Cœur"
        texte-en: "Defeat the Guardian of the Heart-Shard"
        monstres: [gardien_eclat_coeur]
        point: marche_seuil
      - type: INTERAGIR
        texte: "Poser la main sur l'Éclat-Cœur"
        texte-en: "Lay your hand on the Heart-Shard"
        point: marche_portail
        rayon: 5
        apres:
          - "Deux voix, en même temps. L'une glacée, que tu connais par cœur : « Rendez-moi. » L'autre brûlante : « Laissez-moi partir. »"
          - "Ce n'est pas le Néant contre l'Astre. C'est l'Astre, coupé en deux. Sa lumière enfermée dans des fioles, son ombre qui a froid."
          - "Il ne veut pas être vengé. Il ne veut pas être rallumé. Il veut être rassemblé, et libre."
        apres-en:
          - "Two voices, at the same time. One freezing, that you know by heart: « Give me back. » The other burning: « Let me go. »"
          - "It is not the Void against the Star. It is the Star, cut in two. Its light locked in vials, its shadow that is cold."
          - "It does not want to be avenged. It does not want to be rekindled. It wants to be made whole, and free."
      - type: PARLER
        texte: "Revenir voir Vesper"
        texte-en: "Return to Vesper"
        pnj: vesper
        dialogue:
          - "vesper: Libre. L'Archonte veut un Astre éteint, l'Aube veut un Astre en cage. Personne ne veut un Astre libre."
        dialogue-en:
          - "vesper: Free. The Archon wants a dead Star, the Dawn wants a caged Star. No one wants a free Star."
    recompenses:
      xp: 7200
      or: 720
      objets:
        - materiau: AMETHYST_SHARD
          nom: "Fragment de l'Éclat-Cœur"
          nom-en: "Fragment of the Heart-Shard"
          description:
            - "Violet d'un côté, doré de l'autre. Il murmure deux choses à la fois."
          description-en:
            - "Violet on one side, golden on the other. It whispers two things at once."

  o_le_pacte_des_deux_ciels:
    nom: "Le Pacte des Deux Ciels"
    nom-en: "The Pact of the Two Skies"
    faction: ombre
    niveau: 31
    requiert: [o_le_gardien_de_l_eclat_coeur]
    donneur: vesper
    resume:
      - "Vesper a reçu un message de la Citadelle."
    resume-en:
      - "Vesper has received a message from the Citadel."
    offre:
      - "vesper: Un corbeau de la Citadelle. Scellé par Vharos. Viens l'entendre. Aldren aussi en a reçu un."
    offre-en:
      - "vesper: A raven from the Citadel. Sealed by Vharos. Come and hear it. Aldren got one too."
    etapes:
      - type: INTERAGIR
        texte: "Écouter le message avec Vesper et Aldren"
        texte-en: "Hear the message with Vesper and Aldren"
        point: ancre_quatre_vents
        rayon: 6
        apres:
          - "vesper: « Ramenez l'Éclat-Cœur et le Marqué qui l'a touché. Le Marqué ira au Puits, puis à l'Aube. Le Pacte l'exige. — V. »"
          - "aldren: Le mien dit la même chose. Signé S. Le Cloître pour vous, la Citadelle pour nous, ou l'inverse : ça finit pareil."
          - "vesper: Le Pacte des Deux Ciels. Nos chefs se partagent les Marqués, et ils se partageront l'Astre."
          - "Vesper range son message. Aldren aussi. Ni l'un ni l'autre ne te regarde comme un soldat. Ils attendent une réponse."
          - "morvain_mentor: Le Puits et la Crypte ont dit la même chose, chacun sa moitié. À vous de décider ce que vous rapportez. À suivre."
        apres-en:
          - "vesper: « Bring back the Heart-Shard and the Marked who touched it. The Marked will go to the Well, then to the Dawn. The Pact demands it. — V. »"
          - "aldren: Mine says the same thing. Signed S. The Cloister for you, the Citadel for us, or the other way round: it ends the same."
          - "vesper: The Pact of the Two Skies. Our leaders share the Marked, and they'll share the Star."
          - "Vesper puts her message away. So does Aldren. Neither looks at you like a soldier. They are waiting for an answer."
          - "morvain_mentor: The Well and the Crypt said the same thing, each its own half. It's up to you to decide what you bring back. To be continued."
    recompenses:
      xp: 7600
      or: 760

  # ================================================================ ANNEXES NEUTRES — LES QUATRE-VENTS (toutes factions)

  n_les_loups_de_la_marche:
