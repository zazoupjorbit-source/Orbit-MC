      or: 560

  n_la_ruine_du_nord:
    nom: "La ruine du nord"
    nom-en: "The Northern Ruin"
    niveau: 29
    donneur: nell
    resume:
      - "Une ruine perchée au nord de la Marche"
      - "n'est sur aucune carte."
    resume-en:
      - "A ruin perched north of the March"
      - "is on no map."
    offre:
      - "nell: Tout au nord, sur un piton, une ruine qui n'est sur aucune carte. Même pas sur les anciennes. Va voir, je dessinerai."
    offre-en:
      - "nell: Far to the north, on a crag, a ruin that's on no map. Not even the old ones. Go and look, I'll draw."
    etapes:
      - type: TUER
