        apres-en:
          - "On the same slab: a Dawn name and a Shadow name. « They killed each other here. They were buried together, for lack of room. »"
      - type: PARLER
        texte: "Revenir voir Nell"
        texte-en: "Return to Nell"
        pnj: nell
        dialogue:
          - "nell: Ensemble, faute de place. La Marche résume bien la guerre."
        dialogue-en:
