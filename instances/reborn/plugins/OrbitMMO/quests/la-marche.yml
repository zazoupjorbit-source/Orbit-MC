        monstres: [squelette, revenant]
        nombre: 14
        point: camp_g6
      - type: PARLER
        texte: "Revenir voir Calixte"
        texte-en: "Return to Calixte"
        pnj: calixte
        dialogue:
          - "calixte: Les deux camps te remercient. Séparément, bien sûr."
        dialogue-en:
          - "calixte: Both sides thank you. Separately, of course."
    recompenses:
      xp: 5800
      or: 580

  n_les_pillards_de_l_ouest:
    nom: "Les pillards de l'ouest"
    nom-en: "The Western Raiders"
    niveau: 30
    donneur: nell
    resume:
      - "Des pillards campent loin à l'ouest."
    resume-en:
      - "Raiders are camped far to the west."
    offre:
      - "nell: Loin à l'ouest, d'autres pillards. Ils remontent du désert, toujours plus nombreux. Quelque chose les chasse de chez eux."
    offre-en:
