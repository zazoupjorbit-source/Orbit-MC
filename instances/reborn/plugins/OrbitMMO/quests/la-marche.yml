      - type: PARLER
        texte: "Revenir voir Nell"
        texte-en: "Return to Nell"
        pnj: nell
        dialogue:
          - "nell: Le sable noir. Le Néant est aussi dans le désert. Il est partout où il a froid."
        dialogue-en:
          - "nell: Black sand. The Void is in the desert too. It's everywhere it is cold."
    recompenses:
      xp: 5800
      or: 580

  n_la_ruine_de_l_est:
    nom: "La ruine de l'est"
    nom-en: "The Eastern Ruin"
    niveau: 31
    donneur: nell
    resume:
      - "Une ruine à l'est de la Marche"
      - "hurle la nuit."
    resume-en:
      - "A ruin east of the March"
      - "howls at night."
    offre:
      - "nell: À l'est, une ruine hurle la nuit. Pas les loups : la pierre."
    offre-en:
      - "nell: To the east, a ruin howls at night. Not the wolves: the stone."
    etapes:
      - type: TUER
        texte: "Abattre les morts de la ruine"
        texte-en: "Destroy the dead of the ruin"
        monstres: [squelette, revenant]
        nombre: 10
        point: ruine_g4
      - type: INTERAGIR
        texte: "Chercher ce qui hurle"
        texte-en: "Look for what howls"
        point: ruine_g4
        rayon: 6
        apres:
          - "Un Éclat fendu, coincé dans la pierre. Le vent passe dans la fente et chante. Une seule note, très longue, très triste."
        apres-en:
          - "A split Shard, stuck in the stone. The wind passes through the crack and sings. A single note, very long, very sad."
      - type: PARLER
        texte: "Revenir voir Nell"
        texte-en: "Return to Nell"
        pnj: nell
        dialogue:
          - "nell: Un Éclat qui pleure. Je ne mettrai pas ça sur la carte. Personne ne me croirait."
        dialogue-en:
          - "nell: A Shard that weeps. I won't put that on the map. No one would believe me."
    recompenses:
      xp: 6000
      or: 600

  n_les_pillards_du_sud:
    nom: "Les pillards du sud"
    nom-en: "The Southern Raiders"
    niveau: 32
    donneur: calixte
    resume:
      - "Le plus grand camp de pillards"
      - "se cache tout au sud de la Marche."
    resume-en:
      - "The largest raider camp"
      - "is hidden far south of the March."
    offre:
      - "calixte: Tout au sud, le plus gros camp de pillards. C'est de là que partent ceux qui volent mes clients. Ferme-le, et je ferme ma porte aux voleurs."
    offre-en:
      - "calixte: Far to the south, the biggest raider camp. That's where the ones who rob my customers come from. Shut it down, and I'll shut my door to thieves."
    etapes:
      - type: TUER
        texte: "Détruire le grand camp du sud"
        texte-en: "Destroy the great southern camp"
        monstres: [pillard, pillard_archer]
        nombre: 14
        point: camp_g5
      - type: PARLER
        texte: "Revenir voir Calixte"
        texte-en: "Return to Calixte"
        pnj: calixte
        dialogue:
          - "calixte: Il y aura une chambre pour toi aux Quatre-Vents. Toujours. Quelle que soit ta bannière."
        dialogue-en:
          - "calixte: There'll be a room for you at the Four Winds. Always. Whatever your banner."
    recompenses:
      xp: 6300
      or: 630

  n_la_ruine_du_sud:
    nom: "La ruine du sud"
    nom-en: "The Southern Ruin"
    niveau: 32
    donneur: nell
    resume:
      - "Une ruine au sud-ouest de la Marche"
      - "garde une carte d'avant la Chute."
    resume-en:
      - "A ruin south-west of the March"
      - "guards a map from before the Fall."
    offre:
      - "nell: On parle d'une carte d'avant la Chute, dans une ruine au sud-ouest. Si c'est vrai, je la veux. Si c'est faux, je veux le savoir."
    offre-en:
      - "nell: There's talk of a map from before the Fall, in a ruin to the south-west. If it's true, I want it. If it's false, I want to know."
    etapes:
      - type: TUER
        texte: "Abattre les morts de la ruine"
        texte-en: "Destroy the dead of the ruin"
        monstres: [squelette, revenant]
        nombre: 10
        point: ruine_g3
      - type: INTERAGIR
        texte: "Chercher la carte"
        texte-en: "Look for the map"
        point: ruine_g3
        rayon: 6
        apres:
          - "Une carte gravée sur une dalle. Un seul continent, sans frontière. Au centre, là où sont les Quatre-Vents, un mot : « Ici, il s'est posé. »"
        apres-en:
          - "A map carved on a slab. A single continent, with no border. In the centre, where the Four Winds are, a word: « Here, it came down. »"
      - type: PARLER
        texte: "Raconter à Nell"
        texte-en: "Tell Nell"
        pnj: nell
        dialogue:
          - "nell: « Ici, il s'est posé. » L'Astre ? Il serait déjà venu sur terre, avant la Chute ?"
        dialogue-en:
          - "nell: « Here, it came down. » The Star? It came down to earth before, before the Fall?"
    recompenses:
      xp: 6300
      or: 630

  n_la_ruine_des_hauteurs:
    nom: "La ruine des hauteurs"
    nom-en: "The Ruin on the Heights"
    niveau: 33
    requiert: [n_la_ruine_du_nord]
    donneur: nell
    resume:
      - "Une dernière ruine, sur les hauteurs du nord-ouest,"
      - "complète l'observatoire."
    resume-en:
      - "A last ruin, on the north-western heights,"
      - "completes the observatory."
    offre:
      - "nell: L'observatoire du nord avait un jumeau, sur les hauteurs du nord-ouest. Je l'ai trouvé sur ta description. Va voir ce que lui regardait."
    offre-en:
      - "nell: The northern observatory had a twin, on the north-western heights. I found it from your description. Go and see what it was looking at."
    etapes:
      - type: TUER
        texte: "Abattre les morts de la ruine"
        texte-en: "Destroy the dead of the ruin"
        monstres: [squelette, revenant]
        nombre: 10
        point: ruine_g5
      - type: INTERAGIR
        texte: "Explorer l'observatoire jumeau"
        texte-en: "Explore the twin observatory"
        point: ruine_g5
        rayon: 6
        apres:
          - "Le même ciel gravé, mais l'astre y est entouré de silhouettes, les bras levés. Pas des chaînes : des mains tendues. Dessous : « Nous l'avons accueilli. Ils l'ont voulu pour eux. »"
        apres-en:
          - "The same carved sky, but here the star is surrounded by figures, arms raised. Not chains: outstretched hands. Below: « We welcomed it. They wanted it for themselves. »"
      - type: PARLER
        texte: "Raconter à Nell"
        texte-en: "Tell Nell"
        pnj: nell
        dialogue:
          - "nell: Ceux d'avant accueillaient l'Astre. Ceux d'après ont voulu le garder. Et nous, on se bat pour savoir qui le gardera."
          - "nell: Je crois que je vais redessiner toutes mes cartes."
        dialogue-en:
          - "nell: Those before welcomed the Star. Those after wanted to keep it. And we fight over who will keep it."
          - "nell: I think I'll redraw all my maps."
    recompenses:
      xp: 6600
      or: 660

  n_le_tribut_de_la_marche:
    nom: "Le tribut de la Marche"
    nom-en: "The Tribute of the March"
    niveau: 34
    requiert: [n_les_pillards_du_sud, n_le_cimetiere_de_l_est]
    donneur: calixte
    resume:
      - "Les Quatre-Vents veulent remercier"
      - "celui qui a nettoyé la Marche."
    resume-en:
      - "The Four Winds want to thank"
      - "the one who cleared the March."
    offre:
      - "calixte: Les marchands des Quatre-Vents ont fait une collecte. Pour toi. Mais il faut d'abord prouver que la Marche est sûre : encore une meute de loups, et ce sera fini."
    offre-en:
      - "calixte: The merchants of the Four Winds took up a collection. For you. But first you must prove the March is safe: one more wolf pack, and it'll be done."
    etapes:
      - type: TUER
        texte: "Nettoyer les routes de la Marche"
        texte-en: "Clear the roads of the March"
        monstres: [loup, taureau, sanglier]
        nombre: 15
      - type: PARLER
        texte: "Revenir voir Calixte"
        texte-en: "Return to Calixte"
        pnj: calixte
        dialogue:
          - "calixte: Voilà le tribut. De l'or de l'Aube et de l'or de l'Ombre, fondus ensemble. Personne ne pourra dire d'où il vient."
        dialogue-en:
          - "calixte: Here's the tribute. Dawn gold and Shadow gold, melted together. No one can say where it came from."
    recompenses:
      xp: 7000
      or: 1000
      objets:
        - materiau: GOLD_INGOT
          nom: "Or des Quatre-Vents"
          nom-en: "Four Winds Gold"
          description:
            - "De l'or des deux camps, fondu ensemble."
          description-en:
            - "Gold from both sides, melted together."
