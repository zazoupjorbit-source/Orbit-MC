# ------------------------------------------------------------------
#  Prêtre (Lumière) / Oracle (Ombre) — le soigneur. Ressource : Mana.
#  Lumière : soins sacrés (Sacré) ou lumière qui brûle (Châtiment).
#  Ombre : soins par les âmes (Âmes) ou drains et peur (Malédictions).
#  Format des sorts et des talents : voir guerrier.yml.
#  Pas de résurrection pour l'instant : un Marqué tombé se reforme à l'Éclat d'ancrage.
# ------------------------------------------------------------------

nom: Prêtre
couleur: "#F5F0E0"
icone: GOLDEN_APPLE
jouable: true
ressource: MANA
armure: TISSU
pv: 0.9
arme: GRIMOIRE
formes:
  lumiere: "Prêtre"
  ombre: "Oracle"
description:
  - "Le soigneur du groupe : garde ses alliés"
  - "en vie et punit ceux qui les menacent."

specialisations:
  sacre:
    nom: Sacré
    role: SOIN
    faction: lumiere
    icone: GOLDEN_APPLE
    couleur: "#FFE9A8"
