      boule_de_feu_rapide: { nom: "Incantation ardente", icone: CLOCK, palier: 1, colonne: 0, rangs: 3, effets: { incantation.boule_de_feu: 0.15 }, description: "Incantation de Boule de feu réduite de {incantation.boule_de_feu} s." }
