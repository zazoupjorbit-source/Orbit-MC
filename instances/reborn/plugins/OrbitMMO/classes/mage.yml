# ------------------------------------------------------------------
#  Mage — deux formes selon la faction. Ressource : Mana.
#  Lumière : feu et foudre (Pyromancien, Foudroyeur).
#  Ombre : nécromancie et poisons (Nécromancien, Pestilence).
#  Le mana remonte lentement en combat : sorts de base peu chers, gros sorts sur recharge,
#  et « Puiser dans l'Éclat » pour se recharger.
#  Format des sorts et des talents : voir guerrier.yml.
#  Les morts-vivants du Nécromancien ne sont pas (encore) de vraies créatures : ils agissent à travers ses sorts.
# ------------------------------------------------------------------

nom: Mage
couleur: "#4FA3FF"
icone: BLAZE_ROD
jouable: true
ressource: MANA
armure: TISSU
pv: 0.85
arme: STAFF
formes:
  lumiere: "Mage de Lumière"
  ombre: "Mage de l'Ombre"
description:
  - "Lumière : feu, foudre et bonne magie."
  - "Ombre : magie noire, nécromancie et poisons."

specialisations:
  pyromancien:
    nom: Pyromancien
    role: DEGATS
    faction: lumiere
    icone: FIRE_CHARGE
    couleur: "#FF8A3B"
    arme: STAFF
