    type: FRAPPE
    icone: IRON_SWORD
    couleur: "#FFD66E"
    niveau: 1
    cout: 20
    portee: 3.5
    arc: 50
    puissance: 1.8
    description: "Un coup puissant sur la cible devant vous."
  charge:
    nom: Charge
    type: CHARGE
    icone: RABBIT_FOOT
    couleur: "#FF8A3B"
    niveau: 1
    gain: 20
    recharge: 15
    portee: 20
    portee-min: 4
    puissance: 0.5
    effets: { etourdir: 1 }
    description: "Fonce sur l'ennemi visé, l'étourdit 1 s et génère de la rage."
  fendoir:
    nom: Fendoir
    type: FRAPPE
    icone: IRON_AXE
    couleur: "#FFB347"
    niveau: 4
    cout: 20
    recharge: 6
    portee: 3.8
    arc: 160
    puissance: 1.2
    description: "Un large coup qui touche tous les ennemis devant vous."
  cri_de_guerre:
    nom: Cri de guerre
    type: CRI
    icone: GOAT_HORN
    couleur: "#FF8A3B"
    niveau: 6
    gain: 10
    recharge: 60
    gcd: false
    zone: 15
    duree: 30
    effets: { bonus-degats: 10 }
    description: "Vous et votre groupe infligez 10 % de dégâts en plus pendant 30 s."
  execution:
    nom: Exécution
    type: FRAPPE
    icone: WITHER_SKELETON_SKULL
    couleur: "#FF3B3B"
    niveau: 8
    cout: 15
    portee: 3.5
    arc: 50
    puissance: 3.5
    condition: cible-pv<20
    description: "Achève une cible à moins de 20 % de vie."
  provocation:
    nom: Provocation
    type: CRI
    icone: TARGET
    couleur: "#FF5C5C"
    niveau: 10
    recharge: 8
    gcd: false
    zone: 10
    puissance: 0
    effets: { provocation: 1 }
    description: "Force les ennemis proches à vous attaquer."
  cri_demoralisant:
    nom: Cri démoralisant
    type: CRI
    icone: SKELETON_SKULL
    couleur: "#B36BFF"
    niveau: 12
    cout: 10
    zone: 10
    puissance: 0
    effets: { affaiblir: 15 }
    description: "Les ennemis proches infligent 20 % de dégâts en moins pendant 15 s."
  bond_heroique:
    nom: Bond héroïque
    type: BOND
    icone: FEATHER
    couleur: "#FFE066"
    niveau: 20
    recharge: 30
    portee: 15
    zone: 4
    puissance: 1.0
    description: "Bondit vers le point visé et frappe tout à l'atterrissage."
  cri_de_ralliement:
    nom: Cri de ralliement
    type: CRI
    icone: RED_BANNER
    couleur: "#5EE89A"
    niveau: 30
    recharge: 150
    gcd: false
    zone: 15
    duree: 10
    effets: { soin: 15, bouclier: 10 }
    description: "Rend 15 % des PV au groupe et pose un bouclier de 10 % des PV."

  # ---------------- Rempart ----------------
  heurt_de_bouclier:
    nom: Heurt de bouclier
    type: FRAPPE
    icone: SHIELD
    couleur: "#7FB2FF"
    spe: [rempart]
    niveau: 2
    gain: 15
    recharge: 8
    portee: 3.5
    arc: 50
    puissance: 2.0
    bouclier: true
    effets: { provocation: 1 }
    description: "Frappe au bouclier qui génère de la rage et attire la cible sur vous."
  revanche:
    nom: Revanche
    type: TOURBILLON
    icone: BLAZE_POWDER
    couleur: "#FFB347"
    spe: [rempart]
    niveau: 5
    cout: 10
    recharge: 5
    portee: 3.5
    puissance: 1.3
    description: "Balaye tous les ennemis autour de vous."
  coup_de_tonnerre:
    nom: Coup de tonnerre
    type: TOURBILLON
    icone: LIGHTNING_ROD
    couleur: "#9AD8FF"
    spe: [rempart]
    niveau: 9
    cout: 10
    recharge: 6
    portee: 6
    puissance: 0.9
    effets: { ralentir: 4, provocation: 1 }
    description: "Frappe le sol : dégâts et ralentissement autour de vous, les ennemis vous ciblent."
  maitrise_du_blocage:
    nom: Maîtrise du blocage
    type: BUFF
    icone: IRON_CHESTPLATE
    couleur: "#E6C35C"
    spe: [rempart]
    niveau: 14
    cout: 20
    recharge: 15
    gcd: false
    duree: 6
    bouclier: true
    effets: { reduction: 40 }
    description: "Dégâts subis réduits de 40 % pendant 6 s."
  mur_protecteur:
