# ------------------------------------------------------------------
#  Guerrier — combattant au corps à corps, ressource : Rage
#  La rage monte en frappant (attaque de base) et en encaissant, retombe hors combat.
#
#  Sorts — clés utiles :
#    type : FRAPPE, TOURBILLON, CHARGE, BOND, CRI, BUFF, PROJECTILE, SOIN, ZONE
#    categorie : attaque | deplacement | buff (objet qui porte le sort ; absent = d'apres le type :
#               CHARGE/BOND = deplacement, CRI/BUFF/SOIN = buff, le reste = attaque)
#    spe : spécialisations qui ont le sort (absent = toute la classe) · niveau · talent: true (donné par un talent)
#    cout / gain (ressource) · recharge / incantation / duree (secondes) · gcd: false (hors recharge globale)
#    portee · portee-min · arc (degrés ; <= 60 = une seule cible) · zone (rayon) · coups · intervalle (ticks)
#    puissance (x puissance de l'arme) · arme: [ONE_HANDED, TWO_HANDED…] · bouclier: true · condition: cible-pv<20
#    effets ennemis : etourdir, peur, ralentir (s), saignement (s) + dot (coef/s), affaiblir (s), provocation,
#                     repousser, soulever
#    effets sur soi (et le groupe pour un CRI) : reduction, bonus-degats, bonus-crit (%), bouclier (% PV max),
#                     soin (% PV max), soin-par-sec (% PV max/s), vitesse (niveau), soin-soi (% PV max), vol-de-vie (%)
#
#  Talents — palier 0 à 8, colonne 0 à 2, rangs. Paliers 0 à 5 ouverts à palier x 5 points dans l'arbre,
#    paliers avancés 6, 7 et 8 à 35, 45 et 55 points (niveau max 80 = 71 points ; arbres de ~80 rangs).
#    effets PAR RANG (clés : pv, degats, degats.<sort>, soins, crit, crit.<sort>, critdeg, armure, esquive,
#    blocage, epines, vol-de-vie, soin-sur-kill, vitesse, ressource, rage-par-coup, recharge.<sort>,
#    cout.<sort>, duree.<sort>, incantation.<sort>), requiert: <talent>, sort: <sort donné>.
#    Dans la description, {clé} est remplacé par la valeur du rang.
# ------------------------------------------------------------------

nom: Guerrier
couleur: "#C8A27A"
icone: IRON_SWORD
jouable: true
ressource: RAGE
armure: PLAQUES
pv: 1.15
arme: ONE_HANDED
bouclier: true
description:
  - "Maître des armes et du corps à corps."
  - "Sa rage monte à chaque coup donné ou reçu,"
  - "puis se libère en techniques dévastatrices."

