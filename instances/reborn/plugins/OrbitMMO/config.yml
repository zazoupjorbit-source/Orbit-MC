# ------------------------------------------------------------------
#  Orbit MMO
#  Rechargement des monstres / boss / étages / classes : /mmoadmin reload
#  Classes, sorts et talents : fichiers classes/<classe>.yml (/mmoadmin classes exporter)
# ------------------------------------------------------------------

quetes:
  # Traînée de guidage (chemin de particules au sol vers l'objectif de la quête suivie) : allumée ou éteinte pour
  # un joueur qui n'a encore rien choisi. Chacun la règle ensuite dans le journal (/quetes) ou par /quetes trainee.
  trainee-par-defaut: true
guildes:
  # Guildes (/guilde, fichier plugins/OrbitMMO/guildes.yml) : une seule faction par guilde, chef · officiers · membres.
  cout-creation: 1000 # or payé par le fondateur
  max-membres: 20
  # Prime versée dans la banque de la première guilde du serveur à franchir un étage du Pilier des Astres :
  # prime-base + prime-par-etage × numéro de l'étage (étage 1 : 750 or, étage 10 : 3 000 or).
  prime-base: 500
  prime-par-etage: 250
continent:
  enabled: true
  world: orbit_continent
  # Chunks demandés en même temps pendant la pré-génération et les aperçus (/continent).
  parallele: 64
hdv:
  # Hôtel des ventes entre joueurs (PNJ Corvin, ex-marchand). Annonces dans plugins/OrbitMMO/hdv.yml.
  taxe: 5 # % retenu sur le prix à la vente
  duree-heures: 48 # après ce délai, l'objet revient au vendeur (« Mes ventes »)
  max-annonces: 10 # annonces en cours par joueur
butin:
  # Chances par monstre tué (les boss donnent toujours un objet Rare ou mieux à chaque participant).
  equipement: 0.06 # arme, armure ou bouclier Inhabituel (70 %), Rare (25 %), Épique (4,5 %), Légendaire (0,5 %)
  runes: 0.025 # rune de rang I (85 %), II (14 %) ou III (1 %)
lobby:
  # Nom du serveur lobby dans velocity.toml (bouton « Retour au lobby » et /lobby).
  server: lobby
start:
  # Pièces d'or données à la création du personnage.
  gold: 100

progression:
  max-level: 80
  # Niveau du choix de la spécialisation ; 1 point de talent par niveau à partir de celui-ci.
  spec-level: 10

sorts:
  # Recharge globale entre deux sorts, en secondes.
  recharge-globale: 1.0

pvp:
  # PvP entre les factions Lumière et Ombre, hors des zones sûres.
  enabled: true

party:
  max-size: 6

resource-pack:
  # Pack OrbitMMO (modèles d'armes, cristaux, potion, barre de vie dessinée).
  # Proposé pendant l'écran de connexion ; sans le pack, le jeu reste jouable (apparence normale).
  enabled: true
  # Port du mini serveur HTTP intégré qui distribue le pack. Les joueurs le téléchargent
  # à l'adresse qu'ils ont utilisée pour se connecter : ouvre ce port (TCP) comme le port du jeu.
  port: 8790
  # Pour héberger le pack ailleurs (CDN, site), mets son URL ici : le serveur intégré n'est alors pas lancé.
  # Tunnel Cloudflare gratuit (tools\cloudflared.exe) vers le port 8790 : l'adresse change à chaque relance.
  public-url: https://specifically-same-rows-bundle.trycloudflare.com/orbitmmo.zip
  # true : le serveur intégré reste lancé même avec public-url (nécessaire pour un tunnel).
  serve-local: true
  # true : refuser le pack déconnecte le joueur.
  required: false

hud:
  # Décalage horizontal de la barre de vie dessinée, en pixels d'interface (négatif = vers la gauche).
  offset-x: 0

spawning:
  interval-ticks: 80
  per-player: 6
  per-floor: 60

# Délai avant qu'un boss d'étage vaincu puisse réapparaître (pour s'entraîner).
bosses-respawn-minutes: 10

floors:
  # Nombre total d'étages. Ceux qui ne sont pas listés sont générés automatiquement
  # (thèmes en boucle, niveaux croissants, monstres et boss repris des étages listés).
  max: 100
  # Rayon d'un étage en blocs (disque flottant).
  radius: 160
  list:
    '1':
      name: Plaines de l'Éveil
      town: Cité des Débuts
      theme: PLAINS
      levels:
      - 1
      - 5
      mobs:
      - sanglier
      - loup
      - kobold
      boss: roi_kobold
    '2':
      name: Prairies du Taureau
      town: Bourg des Pâtres
      theme: FOREST
      levels:
      - 5
      - 10
      mobs:
      - taureau
      - araignee
      - loup
      boss: taureau_titan
    '3':
      name: Forêt des Brumes
      town: Village Sylvestre
      theme: DARK_FOREST
      levels:
      - 10
      - 16
      mobs:
      - elfe_sombre
      - araignee_geante
      - loup_ombre
      boss: treant
    '4':
      name: Désert des Mirages
      town: Oasis d'Ambre
      theme: DESERT
      levels:
      - 16
      - 22
      mobs:
      - momie
      - scorpion
      - squelette
      boss: pharaon
    '5':
      name: Toundra de Givre
      town: Fort Blanc
      theme: SNOW
      levels:
      - 22
      - 28
      mobs:
      - ours
      - errant
      - loup_givre
      boss: colosse

