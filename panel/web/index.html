<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIT MC · Dev Panel</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="icon.svg" alt="">
      <div><b>ORBIT <em>MC</em></b><span>Dev Panel · <span id="brandVer">Paper 26.3</span></span></div>
    </div>
    <nav id="nav">
      <a href="#dashboard" data-page="dashboard"><i data-i="grid"></i>Tableau de bord</a>
      <a href="#console" data-page="console"><i data-i="term"></i>Console</a>
      <a href="#instances" data-page="instances"><i data-i="net"></i>Réseau &amp; instances <em id="navInst"></em></a>
      <a href="#players" data-page="players"><i data-i="users"></i>Joueurs <em id="navPlayers"></em></a>
      <a href="#plugins" data-page="plugins"><i data-i="plug"></i>Plugins</a>
      <a href="#files" data-page="files"><i data-i="folder"></i>Fichiers</a>
      <a href="#worlds" data-page="worlds"><i data-i="globe"></i>Monde &amp; sauvegardes</a>
      <a href="#config" data-page="config"><i data-i="sliders"></i>Configuration</a>
      <a href="#dev" data-page="dev"><i data-i="code"></i>Outils de dev</a>
      <a href="#settings" data-page="settings"><i data-i="cog"></i>Réglages du panel</a>
    </nav>
    <div class="side-foot">
      <div class="addr">Adresse en jeu<b>localhost</b></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="title"><h1 id="pageTitle">Tableau de bord</h1></div>
      <div class="state" id="statePill"><span class="dot"></span><span id="stateText">Hors ligne</span></div>
      <div class="power">
        <button class="btn green" data-power="start"><i data-i="play"></i>Démarrer</button>
        <button class="btn" data-power="restart"><i data-i="restart"></i>Redémarrer</button>
        <button class="btn red" data-power="stop"><i data-i="stop"></i>Arrêter</button>
        <button class="btn ghost danger" data-power="kill" title="Tuer le processus (sans sauvegarde)"><i data-i="skull"></i></button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="toasts"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

<script src="app.js"></script>
</body>
</html>
