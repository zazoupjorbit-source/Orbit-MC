# =====================================================================
#  OrbitStaff - Presets de sanctions (miroir editable cote plugin)
#  La source de verite reste l'API (table sanction_presets). Ce fichier
#  sert de configuration locale / de secours et documente les regles.
#
#  Regle stricte : le systeme PROPOSE une sanction. Aucune sanction
#  permanente n'est appliquee automatiquement sans validation humaine.
# =====================================================================
config-version: 1

# Bornes de validation des durees (rejet strict hors de ces regles).
durations:
  units-supported: ["s", "m", "h", "d", "w", "mo", "y"]
  keywords: ["permanent", "perm"]

# Confirmation obligatoire au-dela de ce niveau de gravite.
require-confirmation-from-severity: "HIGH"

presets:
  spam:
    type: MUTE
    duration: "30m"
    reason: "Spam dans le chat"
    severity: LOW
    evidence-required: false
    min-role: MODERATOR
    discord-category: SANCTIONS
  insults:
    type: MUTE
    duration: "2h"
    reason: "Insultes / propos deplaces"
    severity: MEDIUM
    evidence-required: false
    min-role: MODERATOR
    discord-category: SANCTIONS
  advertising:
    type: MUTE
    duration: "1d"
    reason: "Publicite non autorisee"
    severity: MEDIUM
    evidence-required: false
    min-role: MODERATOR
    discord-category: SANCTIONS
  harassment:
    type: TEMPBAN
    duration: "3d"
    reason: "Harcelement"
    severity: HIGH
    evidence-required: true
    min-role: SENIOR_MODERATOR
    discord-category: SANCTIONS
  cheating:
    type: BAN
    duration: "permanent"
    reason: "Triche"
    severity: CRITICAL
    evidence-required: true
    min-role: ADMINISTRATOR
    discord-category: SANCTIONS
  bug-exploit:
    type: TEMPBAN
    duration: "7d"
    reason: "Exploitation de bug"
    severity: HIGH
    evidence-required: true
    min-role: SENIOR_MODERATOR
    discord-category: SANCTIONS
  ban-evasion:
    type: BAN
    duration: "permanent"
    reason: "Contournement de sanction"
    severity: CRITICAL
    evidence-required: true
    min-role: ADMINISTRATOR
    discord-category: SANCTIONS
  grief:
    type: TEMPBAN
    duration: "3d"
    reason: "Grief"
    severity: HIGH
    evidence-required: true
    min-role: SENIOR_MODERATOR
    discord-category: SANCTIONS
  theft:
    type: TEMPBAN
    duration: "2d"
    reason: "Vol"
    severity: MEDIUM
    evidence-required: true
    min-role: SENIOR_MODERATOR
    discord-category: SANCTIONS
  refuse-check:
    type: TEMPBAN
    duration: "1d"
    reason: "Refus de verification"
    severity: HIGH
    evidence-required: false
    min-role: SENIOR_MODERATOR
    discord-category: SANCTIONS
  forbidden-name:
    type: KICK
    reason: "Pseudo interdit"
    severity: MEDIUM
    evidence-required: false
    min-role: MODERATOR
    discord-category: SANCTIONS
  forbidden-skin:
    type: KICK
    reason: "Skin interdit"
    severity: MEDIUM
    evidence-required: false
    min-role: MODERATOR
    discord-category: SANCTIONS
