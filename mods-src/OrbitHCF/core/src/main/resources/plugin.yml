name: OrbitHCF-Core
version: '${version}'
main: fr.orbitgames.hcf.core.OrbitHCFCorePlugin
api-version: '1.21'
author: OrbitGames
description: Coeur HCF OrbitGames - factions, claims, DTR, timers, stockage.
website: https://orbit-pvp.fr
depend:
  - OrbitHCF-API
commands:
  f:
    description: Commande principale des factions.
    aliases: [faction, fac, team]
    usage: /f help
  logout:
    description: Deconnexion securisee.
    usage: /logout
  balance:
    description: Ton argent, ou celui d'un joueur.
    aliases: [bal, money, argent]
    usage: /balance [joueur]
  pay:
    description: Envoyer de l'argent a un joueur.
    usage: /pay <joueur> <montant>
  eco:
    description: Administration de l'argent.
    usage: /eco <give|take|set> <joueur> <montant>
  hcf:
    description: Administration du serveur HCF (spawn, bordure, constructions).
    usage: /hcf
permissions:
  orbithcf.admin:
    description: Acces aux commandes d'administration OrbitHCF.
    default: op
  orbithcf.bypass:
    description: Ignore les protections de claims.
    default: op
