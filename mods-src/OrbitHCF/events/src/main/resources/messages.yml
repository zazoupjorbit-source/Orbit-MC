prefix: "&7[&5Events&7] &r"

general:
  no-permission: "&cVous n'avez pas la permission."
  player-only: "&cCommande reservee aux joueurs."
  invalid-duration: "&cDuree invalide : &f{valeur}"
  unknown-zone: "&cZone introuvable : &f{zone}"
  zone-incomplete: "&cLa zone &f{zone}&c n'a pas ses deux positions definies."

